tional gilts, however pension funds and others need a inflation protected products to meet their future liabilities.<\/p>"},{"s":1,"n":76,"id":"1067709","q":"<p>Investing in a REIT will remove which risk normally associated with direct property investments?<\/p>","o":[{"l":"A","h":"Price risk"},{"l":"B","h":"Currency risk"},{"l":"C","h":"Liquidity risk"},{"l":"D","h":"Default risk"}],"a":"C","e":"<p>As a REIT is an exchange-traded instrument, it will have much better liquidity than direct property investments.<\/p>"},{"s":1,"n":77,"id":"1075554","q":"<p>When a trade settles DvP where does the seller get their confidence in the settlement of the trade from?<\/p>","o":[{"l":"A","h":"That both sides of the trade are settling concurrently"},{"l":"B","h":"That the settlement systems allow almost instantaneous settlement"},{"l":"C","h":"That the seller holds onto the assets until the cash payment is received"},{"l":"D","h":"That novation takes away all the settlement risk"}],"a":"A","e":"<p>DvP is delivery versus payment, where both sides of the trade settle concurrently.<\/p>"},{"s":1,"n":78,"id":"1072582","q":"<p>Which of the following would determine the credit rating of a company by a credit rating agency?<\/p>","o":[{"l":"A","h":"By assessing the hard facts, such as financial statements, of the company only"},{"l":"B","h":"By assessing the country's credit rating and that country's market factors such as inflation and interest rates"},{"l":"C","h":"To assess whether the issuer's cash flow will comfortably service and repay its obligations"},{"l":"D","h":"By inputting data into various models, such as SPAN and Monte Carlo to determine the company's ability to borrow"}],"a":"C","e":"<p>The three rating agencies use similar methods to rate issuers and individual bond issues, essentially by assessing whether the cash flow likely to be generated by the borrower will comfortably service, and ultimately repay, its debts.<\/p>"},{"s":1,"n":79,"id":"4004403","q":"<p>To whom do regulatory news or information services process and disseminate information?<\/p>","o":[{"l":"A","h":"Analysts and the wider financial community"},{"l":"B","h":"Regulators and other market surveillance mechanisms"},{"l":"C","h":"Secondary information providers"},{"l":"D","h":"Brokers and institutional investors"}],"a":"C","e":"<p>Regulated information services or primary information providers simply offer a service that receives regulatory information from listed companies, processes that information and disseminates it by circulating it to secondary information providers (SIPs). This is to ensure that the information is made available to the marketplace in a fair and even fashion.<\/p>"},{"s":1,"n":80,"id":"1072567","q":"<p>A company wishes to raise capital cheaply. From the company's point of view, which of the following would be seen as the BEST advantage of issuing warrants?<\/p>","o":[{"l":"A","h":"It helps raise the company's profile as it indicates future financial stability"},{"l":"B","h":"To delay the payment of dividends until some time in the future"},{"l":"C","h":"To make a floating charge over assets more attractive to investors"},{"l":"D","h":"To improve the earnings per share"}],"a":"B","e":"<p>The sale of warrants for cash will raise money for the company, and, if the warrants are exercised, further capital will be raised by the company. Holding the warrant does not entitle the investor to receive dividends or to vote at company meetings, so the capital raised, until the warrant is exercised, could be considered as free.<\/p>"},{"s":1,"n":81,"id":"1078491","q":"<p>Which ONE of the following is a criteria for entry on to a junior market of the exchange?<\/p>","o":[{"l":"A","h":"Minimum trading history"},{"l":"B","h":"All shares in public hands"},{"l":"C","h":"Shares are freely-transferable"},{"l":"D","h":"Nominated broker or adviser required, but not both"}],"a":"C","e":"<p>The entry requirements for AIM are much lighter than for the official list. The shares that are traded must be freely transferable.<\/p>"},{"s":1,"n":82,"id":"4004410","q":"<p>If an investor has diversified their risk exposure by asset class, they have:<\/p>","o":[{"l":"A","h":"entered into derivative positions"},{"l":"B","h":"increased the number and range of their holdings"},{"l":"C","h":"increased their specific risk exposure"},{"l":"D","h":"eliminated systematic risk"}],"a":"B","e":"<p>Diversification by asset class is achieved by holding a combination of different kinds of asset within a portfolio, possibly spread across cash, fixed-interest securities, equity investments, property-based investments, and other assets.<\/p>"},{"s":1,"n":83,"id":"1075561","q":"<p>An authorised unit trust is essentially a unit trust that is allowed to be marketed to the investing public, and must be constituted by a trust deed made between:<\/p>","o":[{"l":"A","h":"The sponsor company and the trustee"},{"l":"B","h":"The fund manager and the authorised corporate director"},{"l":"C","h":"The fund manager and the trustee"},{"l":"D","h":"The government and the trustee"}],"a":"C","e":"<p>An authorised unit trust (AUT) is essentially a unit trust that is allowed to be marketed to the investing<br/> public, and must be constituted by a trust deed made between the fund manager and the trustee.<\/p>"},{"s":1,"n":84,"id":"1072160","q":"<p>An investor bought shares 'cum' but there was a delay in settlement until after the record date. Upon the dividend payment date, which of the following describes the appropriate process?<\/p>","o":[{"l":"A","h":"Buying investor's firm will need to arrange for the dividend claim to be made"},{"l":"B","h":"Selling investor's firm will inform the buyer and pay the dividend"},{"l":"C","h":"Buying investor will claim directly from the previous registered owner"},{"l":"D","h":"Buying investor will claim the dividend from the LSE"}],"a":"A","e":"<p>It is the buyer's firm that will make the claim from the seller's firm.<\/p>"},{"s":1,"n":85,"id":"1052076","q":"<p>A prime broker provides a number of services for institutional investors, what would be the purpose of stock lending and borrowing?<\/p>","o":[{"l":"A","h":"Cash management"},{"l":"B","h":"Liquidity"},{"l":"C","h":"Securities purchased become property of the fund"},{"l":"D","h":"Reduction of costs"}],"a":"B","e":"<p>If an institutional investor wishes to take advantage of pricing variations but does not have the stock then they can borrow it and return it at a later date.<\/p>"},{"s":1,"n":86,"id":"1064488","q":"<p>When can an investor sell a share in an OEIC?<\/p>","o":[{"l":"A","h":"When they find a willing buyer on the open market"},{"l":"B","h":"When the fund has enough money to repurchase shares"},{"l":"C","h":"Any time outside 3 business days from purchase"},{"l":"D","h":"Any period specified by the OEIC prospectus"}],"a":"D","e":"<p>The holder of a share in an OEIC can sell back the share to the company in any period specified in the prospectus.<\/p>"},{"s":1,"n":87,"id":"1075553","q":"<p>Why would an underwriting firm performing an offer for sale decide to use a fixed price rather than a tender?<\/p>","o":[{"l":"A","h":"To ensure that the issue is fully subscribed"},{"l":"B","h":"To allow investors to set the price"},{"l":"C","h":"To provide more efficient form of pricing"},{"l":"D","h":"To ensure everyone pays the same price"}],"a":"A","e":"<p>When a fixed-price offer is made, the price is usually fixed just below that at which it is believed the issue should be fully subscribed, so as to encourage an active secondary market in the shares. A tender offer is a more efficient method of pricing, allowing investors to set the price through a bidding process. Both issues allow the investors to pay the same price.<\/p>"},{"s":1,"n":88,"id":"1075555","q":"<p>An investor is entitled to a rights offer. They ask their broker to prepare a split allocation letter. This suggest that they intend to:<\/p>","o":[{"l":"A","h":"Receive all of their shares to maintain their current shareholding level"},{"l":"B","h":"Sell some of the rights in order to be able to fund the purchase of the remaining shares at nil cost"},{"l":"C","h":"Sell some the rights to make a profit"},{"l":"D","h":"Sell all of the rights in order to make a profit"}],"a":"B","e":"<p>This is the most likely reason. Splitting your rights is to sell some of the rights and take up others.<\/p>"},{"s":1,"n":89,"id":"1075032","q":"<p>Why would an investor want to buy a share through a special-ex trade?<\/p>","o":[{"l":"A","h":"To avoid capital gains tax."},{"l":"B","h":"To reduce regulatory reporting requirements"},{"l":"C","h":"To receive a dividend that they would otherwise be not entitled to"},{"l":"D","h":"For tax planning purposes"}],"a":"D","e":"<p>By dealing special ex the investor does not receive the dividend they are entitled to this may reduce income but not capital gains tax.<\/p>"},{"s":1,"n":90,"id":"1066480","q":"<p>Which of the following would explain why a company would buy shares in another company to forge a strategic link?<\/p>","o":[{"l":"A","h":"To expand the company"},{"l":"B","h":"Shared corporate ethos"},{"l":"C","h":"Protect supplies"},{"l":"D","h":"To benefit from dividend income"}],"a":"C","e":"<p>Strategic stakes may be accumulated in order to prevent a company being taken over by a competitor and to influence the company concerned. This may be in order to protect supplies. The company may be a key supplier of raw materials to the strategic stakeholder, without which the strategic stakeholder may have difficulty obtaining the quantity and quality of raw materials it seeks.<\/p>"},{"s":1,"n":91,"id":"1079374","q":"<p>A company announces an increase in the dividend that it will pay out to shareholders in response to continued profit growth. Assuming all of the following securities are in issue, which of the following is most likely to benefit from this increase in income?<\/p>","o":[{"l":"A","h":"Depositary receipt holder"},{"l":"B","h":"Equity warrant holder"},{"l":"C","h":"Cumulative preference shareholder"},{"l":"D","h":"Floating rate bond"}],"a":"A","e":"<p>A depositary receipt is a certificate that represents ordinary shares in a company. The benefit of a higher dividend will be passed on to them. Warrants do not pay dividends and cumulative preference shares pay a fixed dividend. Floating rate bond are debt instruments and receive their payment irrespective of profits (unless default occurs).<\/p>"},{"s":1,"n":92,"id":"4002944","q":"<p>According to the continuing obligations for UK listed companies, how frequently does a STANDARD listed UK company need to produce financial reports?<\/p>","o":[{"l":"A","h":"Every 3 months"},{"l":"B","h":"Every 6 months"},{"l":"C","h":"Every 9 months"},{"l":"D","h":"Every 12 months"}],"a":"B","e":"<p>Once listed, companies are expected to fulfil certain continuing obligations: they are obliged to issue a half-yearly report in addition to annual accounts, and they have to notify the market of any new, price sensitive information.<\/p>"},{"s":1,"n":93,"id":"1066466","q":"<p>A company's free float increases from 1.44 to 1.8. Which of the following is most likely?<\/p>","o":[{"l":"A","h":"The company's market capitalisation will increase"},{"l":"B","h":"Called up share capital will increase"},{"l":"C","h":"The directors wished to substitute dividends for share repurchases"},{"l":"D","h":"A greater number of shares are now available for the investing public"}],"a":"D","e":"<p>The free-float of a public company is an estimate of the proportion of shares that are not held by large owners and that are not stock with sales restrictions (restricted stock that cannot be sold until it becomes unrestricted stock).<\/p>"},{"s":1,"n":94,"id":"1072178","q":"<p>An investor has a portfolio of UK bond holdings. What would be the main reason for adding overseas bonds?<\/p>","o":[{"l":"A","h":"Increase risk exposure"},{"l":"B","h":"Diversification"},{"l":"C","h":"Taxation benefits"},{"l":"D","h":"Receive income in a foreign currency"}],"a":"B","e":"<p>The book comments in relation to overseas bonds or equities help to reduce the risk on the portfolio as where there may be domestic issues, you are able to gain exposure to other economies where you may achieve better returns. So the best answer here would be diversification.<\/p>"},{"s":1,"n":95,"id":"1044947","q":"<p>Which of the following is a major benefit of a quote-driven market?<\/p>","o":[{"l":"A","h":"Better prices for traders"},{"l":"B","h":"No requirement for market makers"},{"l":"C","h":"Time priority matching of buy and sell orders"},{"l":"D","h":"Increased liquidity"}],"a":"D","e":"<p>A quote-driven market, through the use of market makers, always has buyers and sellers in the market. Market makers are often referred to as liquidity providers for that reason.<\/p>"},{"s":1,"n":96,"id":"4004397","q":"<p>The ratio EV/EBIT represents:<\/p>","o":[{"l":"A","h":"Total market capitalisation including cash over operating revenue"},{"l":"B","h":"Total market capitalisation excluding cash over gross revenue"},{"l":"C","h":"The cost of purchasing the company over gross revenue"},{"l":"D","h":"The cost of purchasing the company over operating revenue"}],"a":"D","e":"<p>A firm’s EV is calculated as its market capitalisation plus all of its outstanding debt, minority interests and preferred shares, minus all of the cash and cash equivalents. A simplified and intuitive way to understand EV is to consider it as the cost of purchasing an entire business. Operating revenue = Gross revenue - Cost of Goods Sold, Labour, and other day-to-day expenses. N.B. 'Operating revenue' and 'operating income' are also known as Earnings Before Interest and Tax (or EBIT for short). <\/p>"},{"s":1,"n":97,"id":"1075550","q":"<p>Which is the best description of the Enterprise Value to EBITDA ratio?<\/p>","o":[{"l":"A","h":"The securities' market capitalisation against total revenue"},{"l":"B","h":"The cost to buy a company against an adjusted operating profit"},{"l":"C","h":"The securities' market capitalisation against an adjusted operating profit"},{"l":"D","h":"The cost to buy a company against total revenue"}],"a":"B","e":"<p>EBITDA is essentially profit before interest and tax (i.e. operating profit), but with depreciation, and amortisation reversed and added back. <br/> EV is a measure of a company's value and is often used as an alternative to straightforward market capitalisation. A simplified and intuitive way to understand EV is to envisage purchasing an entire business. If you settle with all the security-holders, you have essentially purchased the company at its EV.<\/p>"},{"s":1,"n":98,"id":"1067798","q":"<p>Participants in a dark pool are MOST LIKELY to have chosen this type of execution venue because of:<\/p>","o":[{"l":"A","h":"Lack of pre-trade transparency"},{"l":"B","h":"Ability to execute trades at efficient prices"},{"l":"C","h":"Ability to hide the dealer's identity"},{"l":"D","h":"Lower costs"}],"a":"B","e":"<p>Dark pools offer institutions a facility to deal large blocks of shares anonymously, typically using algorithm driven trading. The size of these orders would make it very difficult to achieve efficient pricing on more traditional venues but the dark pool allows them to do so. Although anonymity is an advantage, this is also available on many other systems, including exchanges.<\/p>"},{"s":1,"n":99,"id":"1075557","q":"<p>Why would a lead manager be LEAST likely to go through a syndication process and, instead, take responsibility for the entire process themselves?<\/p>","o":[{"l":"A","h":"It is a bought deal"},{"l":"B","h":"It is a fixed price re-offer"},{"l":"C","h":"There is a back stop price"},{"l":"D","h":"It is a placing"}],"a":"D","e":"<p>A placing is where a company simply markets the issue directly to a broker, an issuing house or other financial institution, which in turn places the shares with selected clients. A bought deal is a fully underwritten issue and the lead manager would often enlist the help of a syndicate to do this this. The back-stop price is limit placed on the members of a syndicate limiting the price at which the shares can be sold. Whilst a Fixed Price Re-offer is NOT on the current syllabus, it is synonymous with syndication.<\/p>"},{"s":1,"n":100,"id":"1079683","q":"<p>An investor, after receiving excellent returns on her equity investments, switches to bonds. Which of the following is the most likely reason?<\/p>","o":[{"l":"A","h":"To capitalise on the gains before a downturn"},{"l":"B","h":"To benefit from an increase in interest rates"},{"l":"C","h":"To avoid exposure to inflation"},{"l":"D","h":"To achieve long term capital gain"}],"a":"A","e":"<p>If the investor expects a downturn in the markets, switching to bonds may assist in locking in most of the gain and benefitting from a more stable return on the bonds. A switch to bonds would be poor move if interest rates were expected to rise (bond prices fall). Bonds typically suffer from inflation more than equity and achieve less long-term capital gain.<\/p>"},{"s":2,"n":1,"id":"1078503","q":"<p>In an order driven platform what is the order of priority for 'on the book'?<\/p>","o":[{"l":"A","h":"Price followed by time"},{"l":"B","h":"Time followed by price"},{"l":"C","h":"Price followed by quantity followed by time"},{"l":"D","h":"Price followed by time followed by quantity"}],"a":"A","e":"<p>Price followed by time. The quantity or size of the order is not used to determine place on the book.<\/p>"},{"s":2,"n":2,"id":"1078905","q":"<p>A company has made an operating profit of £8m. If raw materials increased by £3m and both payables and receivables increased by £2m, what would be the firm's net cash flow?<\/p>","o":[{"l":"A","h":"£5m"},{"l":"B","h":"£7m"},{"l":"C","h":"£8m"},{"l":"D","h":"£9m"}],"a":"A","e":"<p>Start with operating profit of £8m then deduct the increase in any inventory, it has been bought therefore cash must have been used, £8m - £3m = £5m Then add the increase in payables and deduct the increase in receivables. Leaving cash at £5m.<\/p>"},{"s":2,"n":3,"id":"1072175","q":"<p>Company X is completing its accounts and is forced to account for company Y. What is the likely reason for this?<\/p>","o":[{"l":"A","h":"Company X has a significant holding in company Y"},{"l":"B","h":"Company X is a subsidiary of company Y"},{"l":"C","h":"Company X is receiving a substantial amount of dividends from company Y"},{"l":"D","h":"Company X is a minority interest in company Y"}],"a":"A","e":"<p>If a company invests in another company, and the investment is so significant that the investing company controls the other company, another accounting treatment is required. Company X would have to complete group accounts incorporating company Y.<\/p>"},{"s":2,"n":4,"id":"4025898","q":"<p>What should investors be aware of when investing in structured deposits as opposed to structured investments?<\/p>","o":[{"l":"A","h":"That they are unregulated"},{"l":"B","h":"That they could benefit from services such as the UK’s compensation scheme"},{"l":"C","h":"That they hold greater potential returns than conventional products"},{"l":"D","h":"That they are typically only offered by banks"}],"a":"B","e":"<p>Despite banks selling structured products where they often mention, and offer, either total or partial ‘capital protection’, this does not necessarily mean that the investor’s money is completely safe. If the product is a structured deposit, there is the potential of a deposit protection scheme for the banking industry which provides protection in the event of a particular bank collapsing. However, for structured investment products, there will be no such safety net.<\/p>"},{"s":2,"n":5,"id":"1055856","q":"<p>Two eurozone governments' bonds are sold in Europe with identical terms of coupon rate, maturity of redemption, and all other standard terms. However, both still sell into the market with different yields. Which is the most likely reason why?<\/p>","o":[{"l":"A","h":"Different currencies"},{"l":"B","h":"Different credit ratings"},{"l":"C","h":"The policies of the ECB"},{"l":"D","h":"There is a market anomaly which could be exploited by arbitrage"}],"a":"B","e":"<p>The eurozone countries all use the euro currency. Therefore, it is not different currencies. It is because different eurozone governments have different credit ratings; for example Greece vs. Germany.<\/p>"},{"s":2,"n":6,"id":"4002945","q":"<p>Where there is a sub-custody agreement, which of the following describes the correct set of relationships?<\/p>","o":[{"l":"A","h":"The client and the local custodian are the clients of the global custodian"},{"l":"B","h":"The client is the client of the local custodian, who is the agent of the global custodian"},{"l":"C","h":"The client is the client of both the local and global custodian equally"},{"l":"D","h":"The client is the client of the global custodian, whereas the local custodian is the agent of the global custodian"}],"a":"D","e":"<p>A sub-custodian is employed by a global custodian as its local agent to provide settlement and custody services for assets that it holds on behalf of investor clients in a foreign market. A sub-custodian effectively serves as the eyes and ears of the global custodian in the local market, providing a range of clearing, settlement and asset servicing duties.<\/p>"},{"s":2,"n":7,"id":"1047480","q":"<p>A company wishes to raise new capital to fund long term expansion. It does not expect to make profit in the early years of this expansion so does not want to be tied down to funding obligations. <br/> Which of the following would be the best to issue?<\/p>","o":[{"l":"A","h":"Ordinary shares"},{"l":"B","h":"Debentures"},{"l":"C","h":"Commercial paper"},{"l":"D","h":"Subordinated loan stock"}],"a":"A","e":"<p>The company is looking for long term finance which eliminates commercial paper. <br/> A funding obligation is a requirement to make regular cash payments, such as a bond coupon. Debt such as debentures and loan stock have funding obligations and therefore do not meet the company's requirements. <br/> The directors of a company are not required to pay an ordinary dividend in any given year. Ordinary shares, therefore, do not have a funding requirement.<\/p>"},{"s":2,"n":8,"id":"1075010","q":"<p>Where a cum-dividend equity trade fails to settle on contractual settlement what will happen?<\/p>","o":[{"l":"A","h":"The client buying will make a claim on the client who is selling"},{"l":"B","h":"The broker of the client buying will make a claim on the client selling"},{"l":"C","h":"The broker of the client buying will make a claim on the broker of the client selling"},{"l":"D","h":"The Client buying will make a claim on the broker of the client selling"}],"a":"C","e":"<p>A claim will arise between the brokers on behalf of their clients.<\/p>"},{"s":2,"n":9,"id":"1052113","q":"<p>The price of shares in Firm A change relative to those in Firm B. What risk would this represent?<\/p>","o":[{"l":"A","h":"Market Risk"},{"l":"B","h":"Systematic Risk"},{"l":"C","h":"Specific Risk"},{"l":"D","h":"Non-systemic Risk"}],"a":"C","e":"<p>Specific risk relates directly to the price movement of a single share.<\/p>"},{"s":2,"n":10,"id":"4062270","q":"<p>The main users of the primary investment markets are:<\/p>","o":[{"l":"A","h":"Institutional investors"},{"l":"B","h":"Private clients"},{"l":"C","h":"Traders of over-the-counter securities"},{"l":"D","h":"Overseas-based investors"}],"a":"A","e":"<p>The main purchasers of newly-issued securities are large institutional investors, such as pension funds, insurance companies and collective investment vehicles, such as exchange-traded funds (ETFs) and mutual funds, who buy the securities being offered on behalf of their clients, who are primarily members of the general public.<\/p>"},{"s":2,"n":11,"id":"1078500","q":"<p>It is possible to issue shares through private transactions; this does not require compliance with the prospectus regulation or the need for a prospectus. To which type of investors would this offer always be made available?<\/p>","o":[{"l":"A","h":"Charities"},{"l":"B","h":"Hedge funds"},{"l":"C","h":"Pension funds"},{"l":"D","h":"Qualified investors"}],"a":"D","e":"<p>Private placings are those where securities can be made only to qualified investors.<\/p>"},{"s":2,"n":12,"id":"1046714","q":"<p>Company C wishes to issue and engages the help of Company A and Company B. Company A is responsible for 75% of the issuance and placing through to large companies and institutional investors. Company B issues to the other 25% and deals with smaller companies. Which BEST describes Company B's role.<\/p>","o":[{"l":"A","h":"Lead manager"},{"l":"B","h":"Co-lead manager"},{"l":"C","h":"Broker"},{"l":"D","h":"Bookrunner"}],"a":"B","e":"<p>If the size of the issue is large enough there can be several lead managers, known as co-lead managers.<\/p>"},{"s":2,"n":13,"id":"1079679","q":"<p>In relation to equity issued by companies, which of the following is best defined as 'registered title'?<\/p>","o":[{"l":"A","h":"The legal name of the company registered at Companies house"},{"l":"B","h":"The trading code given to a security traded on an exchange"},{"l":"C","h":"The name of the legal owner of the share"},{"l":"D","h":"The broker's name holding the nominee company"}],"a":"C","e":"<p>Registered title simply means ownership that is backed by registration. In terms of share ownership, registered title makes it straightforward for the company to give shareholders the right to vote on important company matters, to pay dividends to their shareholders and to enable participation in other corporate actions, such as rights issues. Most shares issued today are issued in registered form.<\/p>"},{"s":2,"n":14,"id":"4004410","q":"<p>If an investor has diversified their risk exposure by asset class, they have:<\/p>","o":[{"l":"A","h":"entered into derivative positions"},{"l":"B","h":"increased the number and range of their holdings"},{"l":"C","h":"increased their specific risk exposure"},{"l":"D","h":"eliminated systematic risk"}],"a":"B","e":"<p>Diversification by asset class is achieved by holding a combination of different kinds of asset within a portfolio, possibly spread across cash, fixed-interest securities, equity investments, property-based investments, and other assets.<\/p>"},{"s":2,"n":15,"id":"1066478","q":"<p>Which of the following would NOT be considered an advantage of using a central counterparty?<\/p>","o":[{"l":"A","h":"Improved prices"},{"l":"B","h":"Reduced initial margin payments"},{"l":"C","h":"Operational efficiency"},{"l":"D","h":"Reduced counterparty risk"}],"a":"B","e":"<p>The use of a central counterparty provides certain benefits to market participants, particularly:<br/> - Reduced counterparty risk - the risk that the other side of the transaction will default is reduced because they are replaced by one of the CCPs, both of which are well capitalised and have insurance policies in place lessening the risk of default. This reduces the risk of systemic collapse of the financial system;<br/> - Providing total anonymity - both sides of the trade do not discover who is the original counterparty.<br/> - Reduced administration - all trades are settled with one of the two CCPs, rather than a variety of counterparties improving operational efficiency.<br/> - Facilitating netting of transactions - because all the trades are with a CCP, receipts and payments for transactions in the same share that settle on the same day can be netted against each other.<br/> - Improved prices - because more participants are willing to transact anonymously, it is argued that a CCP results in improvements in price.<\/p>"},{"s":2,"n":16,"id":"1070781","q":"<p>Which of the following corporate actions would never be made available to an American depositary receipt holder?<\/p>","o":[{"l":"A","h":"The right to vote in the annual general meeting"},{"l":"B","h":"The right to participate in the company's profit"},{"l":"C","h":"The right buy new shares in proportion to existing shares"},{"l":"D","h":"The right to receive the new shares during a scrip issue"}],"a":"C","e":"<p>An ADR holder can only receive the nil paid price as result of a rights issue. If they wish to participate in the rights issue to buy the new shares they would have to sell the ADRs and buy the new shares.<\/p>"},{"s":2,"n":17,"id":"1078913","q":"<p>A UK investor has substantial holding in European investments. There has not been a significant price change in the companies they are holding yet the investor has seen the total value of the investments change dramatically. Which of the following could be the reason for this change?<\/p>","o":[{"l":"A","h":"Economic forecasts for the Eurozone is positive"},{"l":"B","h":"The Bank of England is undergoing another stage of quantitative easing"},{"l":"C","h":"The change in the value of the Euro"},{"l":"D","h":"Imports into the UK have become cheap relative to locally produced good"}],"a":"C","e":"<p>Any investor who purchases securities which are denominated in a foreign currency may suffer (or benefit) from changes in the exchange rates between the home or base currency or the other currency. In addition, it is important to consider the risk that an investor's base or home currency may fall against other currencies, thereby diminishing the purchasing power for global assets.<\/p>"},{"s":2,"n":18,"id":"1079703","q":"<p>The analysis of risk and return is best done in which of the following way?<\/p>","o":[{"l":"A","h":"Backward-looking analysis of historic returns and forward-looking forecasts"},{"l":"B","h":"Correlations of returns and capital asset pricing model"},{"l":"C","h":"Alpha and beta"},{"l":"D","h":"Political risks and interest rate sensitivities"}],"a":"A","e":"<p>In order to assess the risk and expected returns from particular opportunities, an investor needs to conduct an analysis of the forecasts for the economy and the forecasts for particular companies and/or sectors and undertake a risk analysis of the possible outcomes, and their likelihood, which could adversely affect these forecasts. This can be summarised as both forward- and backward-looking:<br/> Forward-looking forecasts and probabilities assess the likelihood of each possible state of the world occurring and estimate the returns and values arising given that particular outcome.<br/> Backward-looking analyses tend to study historically observed returns and associated frequencies on the assumption that this past data will be representative of the future.<\/p>"},{"s":2,"n":19,"id":"1075020","q":"<p>Which of the following is TRUE of an omnibus nominee account?<\/p>","o":[{"l":"A","h":"Only one holding appears on the company register"},{"l":"B","h":"The investor's name appears on the company register"},{"l":"C","h":"A number of holding could appear on the company register but not the name of the beneficial owner"},{"l":"D","h":"It is typically more expensive to operate than designated nominee accounts"}],"a":"A","e":"<p>In an omnibus nominee account only one holding appears on a company's register as all positions are pooled. Operating a designated nominee account should give rise to few additional costs from the custodian's point of view, as the existing nominee name can easily be used, with the addition of a unique designation.<\/p>"},{"s":2,"n":20,"id":"1053362","q":"<p>The non-displayed or hidden nature of the buy and sell orders that reside in a crossing platform is best observed in which of the following?<\/p>","o":[{"l":"A","h":"MTF"},{"l":"B","h":"Systematic internaliser"},{"l":"C","h":"Retail service provider"},{"l":"D","h":"Dark pool"}],"a":"D","e":"<p>Dark pools refer to the non-displayed or hidden nature of the buy and sell orders that reside in a crossing platform. The term dark liquidity can also be applied to all forms of non-displayed liquidity such as the order blotters of buy-side dealing desks.<br/> A systematic internaliser is, in broad terms, an investment firm making markets outside a regulated market or an MTF. The firm executes orders from its clients against its own book or against orders from other clients.<br/> A multi-lateral trading facility is, in a nutshell, a system that brings together multiple parties (e.g. retail investors or other investment firms) that are interested in buying and selling financial instruments and enables them to do so.<br/> A retail service provider is a type of market maker that provides connectivity services to other LSE member firms that serve the private client; they enable the private client broker to quote firm prices to the investor for ten-day settlement in small trade sizes, and to place orders on an 'invest or raise' basis.<\/p>"},{"s":2,"n":21,"id":"1072139","q":"<p>Which of the following would most likely be considered when assessing the credit rating of a bond?<\/p>","o":[{"l":"A","h":"The company's competitive position"},{"l":"B","h":"The benchmark bond"},{"l":"C","h":"The structure of the particular issue"},{"l":"D","h":"The issuer's current credit rating"}],"a":"D","e":"<p>The company's comeptive position and the structure of the issue will both influence the rating of a bond but more importantly with be the issuer's current credit rating (which itself will reflect the issuer's specific prospects) and highlight the issuer's default risk.<\/p>"},{"s":2,"n":22,"id":"1047430","q":"<p>The best description of an inter-dealer broker would be:<\/p>","o":[{"l":"A","h":"Acts as agent between dealers"},{"l":"B","h":"Quotes prices to market makers"},{"l":"C","h":"Facilitates stock lending"},{"l":"D","h":"Provides a range of services to hedge fund clients"}],"a":"A","e":"<p>Whilst effectively they act as agent, they actually settle trades as if they were principals to preserve anonymity.<\/p>"},{"s":2,"n":23,"id":"4025892","q":"<p>You expect interest rate cuts that have not been anticipated by the market as a whole. You sell short term bonds and buy long term bonds. Which of the following strategies are you following?<\/p>","o":[{"l":"A","h":"Policy switching"},{"l":"B","h":"Inter-market spread"},{"l":"C","h":"Anomaly switching"},{"l":"D","h":"Riding the yield curve"}],"a":"A","e":"<p>When an interest rate cut is expected but not implied by the yield curve, shorter dated, low-duration bonds are sold in favour of longer-dated, high-duration bonds. By pre-empting the rate cut, the holder can subsequently benefit from the greater price volatility of the latter bonds, this is known as policy switching<\/p>"},{"s":2,"n":24,"id":"1078852","q":"<p>An investor is looking to switch a large portion of their portfolio from equity to bonds as they believe the markets are going to fall. Which of the following best explains the reason for their actions?<\/p>","o":[{"l":"A","h":"They are looking to make better use of diversification to achieve an uncorrelated portfolio"},{"l":"B","h":"They have been advised that their portfolio is too concentrated on equities"},{"l":"C","h":"They are looking to rebalance their portfolio as they are approaching retirement"},{"l":"D","h":"They wish to lock in the most possible capital growth before moving into a security that can give a more reliable income"}],"a":"D","e":"<p>Fixed-interest securities, such as government bonds, give a secure income and known redemption value at a fixed future date. Equities can be used to produce a potentially increasing dividend income and capital growth.<\/p>"},{"s":2,"n":25,"id":"1079701","q":"<p>Which of the following best indicates the returns on money market instruments?<\/p>","o":[{"l":"A","h":"Low risk, guaranteed returns"},{"l":"B","h":"High risk, predictable returns"},{"l":"C","h":"Low risk, variable returns"},{"l":"D","h":"High risk, variable returns"}],"a":"C","e":"<p>These investments are low-risk, relatively secure and deliver income, but provide little scope for capital growth. Prices of money market instruments fluctuate.<\/p>"},{"s":2,"n":26,"id":"1079686","q":"<p>Which of the following is a key feature of exchange-traded funds?<\/p>","o":[{"l":"A","h":"They must not be closed-ended"},{"l":"B","h":"They must be marketed in the UK"},{"l":"C","h":"They must not be priced on a bid/offer spread"},{"l":"D","h":"They must be marketed to retail clients"}],"a":"A","e":"<p>Exchange-traded funds are open-ended funds that trade on a secondary market. They are often traded at a spread. They can be traded globally and do not have to be marketed to retail clients.<\/p>"},{"s":2,"n":27,"id":"1065047","q":"<p>Which of the following indices is comprised mainly of the largest companies?<\/p>","o":[{"l":"A","h":"FTSE 100"},{"l":"B","h":"FTSE 250"},{"l":"C","h":"Allshare"},{"l":"D","h":"Techmark"}],"a":"A","e":"<p>The FTSE 100 consists of the UK's largest 100 UK companies.<\/p>"},{"s":2,"n":28,"id":"1070779","q":"<p>The spread of a corporate bond over the market reference interest rate is 100 basis points. If the reference rate was 4% and the risk free rate was 3.75%, what is the spread over the risk free rate?<\/p>","o":[{"l":"A","h":"1.25%"},{"l":"B","h":"0.25%"},{"l":"C","h":"1.00%"},{"l":"D","h":"0.75%"}],"a":"A","e":"<p>We have to assume the question is referring to the spread of the corporate bond over the risk free rate. If the bond is 100 bp or 1.00% over the reference rate then it would have a yield of 5%. 5% minus 3.75% will give 1.25%<\/p>"},{"s":2,"n":29,"id":"4025891","q":"<p>What are the rules for stripping UK exchequer bonds?<\/p>","o":[{"l":"A","h":"Any gilt can be stripped and only by the DMO, Bank of England and HM Treasury"},{"l":"B","h":"Only designated gilts can be stripped and only by the DMO, Bank of England and authorised participants"},{"l":"C","h":"Any gilt can be stripped and only by the GEMMs, Bank of England and HM Treasury"},{"l":"D","h":"Only designated gilts can be stripped and only by the DMO, Bank of England and GEMMs"}],"a":"D","e":"<p>In the UK, only those gilts that have been designated by the DMO as strippable are eligible for the STRIPS market, not all gilts. Those gilts that are stripped have separate registered entries for each of the individual cash flows that enable different owners to hold each individual strip, and facilitate the trading of the individual STRIPS. It is only gilt-edged market makers (GEMMs), the BoE or the HM Treasury (via the DMO) that are able to strip gilts.<\/p>"},{"s":2,"n":30,"id":"4025893","q":"<p>Which of the following is a characteristic of coupons on convertible bonds?<\/p>","o":[{"l":"A","h":"They have a lower coupon compared with coupon on an otherwise identical bond"},{"l":"B","h":"They do not carry the right for the investor to receive a coupon"},{"l":"C","h":"They typically have a floating coupon to compensate the holder for it mezzanine debt ranking"},{"l":"D","h":"The coupon rate is determined solely by the performance of the company's shares"}],"a":"A","e":"<p>Investors will generally accept a lower coupon rate on a convertible bond, compared with the coupon rate on an otherwise identical regular bond, because of its conversion feature. This enables the issuer to save on interest expenses, which can be substantial in the case of a large bond issue<\/p>"},{"s":2,"n":31,"id":"4042014","q":"<p>The application of technology to the process of providing financial advice, but without the involvement of a financial adviser is known as which of the following?<\/p>","o":[{"l":"A","h":"Robo-advice"},{"l":"B","h":"Cyberdyne"},{"l":"C","h":"Cyber-advice"},{"l":"D","h":"Robocop<br/>"}],"a":"A","e":"<p>Robo-advice is the application of technology to the process of providing financial advice, but without the involvement of a financial adviser.<\/p>"},{"s":2,"n":32,"id":"1072142","q":"<p>The conversion ratio in relation to a corporate bond describes the:<\/p>","o":[{"l":"A","h":"Percentage difference between the conversion price and the market share price"},{"l":"B","h":"Difference between the conversion price and the market share price"},{"l":"C","h":"Number of shares the bond can convert into"},{"l":"D","h":"Difference between the purchase price and market price"}],"a":"C","e":"<p>The first two answers describe the conversion premium in percentage and value. The conversion ratio allows conversion premium to be calculated.<\/p>"},{"s":2,"n":33,"id":"1078858","q":"<p>'Over the counter' (OTC) markets in recent times seem to be converging with exchange traded markets, which of the following is the most likely explanation?<\/p>","o":[{"l":"A","h":"Greater demand for OTC products"},{"l":"B","h":"Electronic trading"},{"l":"C","h":"Regulatory changes"},{"l":"D","h":"Straight through processing"}],"a":"C","e":"<p>This is not specifically mentioned in the manual, so perhaps a trial question, however regulatory requirements in the OTC market are bringing them very much in line with exchange traded markets.<\/p>"},{"s":2,"n":34,"id":"1075025","q":"<p>In a new share issue the syndicate is typically appointed by whom?<\/p>","o":[{"l":"A","h":"The underwriters"},{"l":"B","h":"Co-managers"},{"l":"C","h":"Lead manager"},{"l":"D","h":"The corporate broker"}],"a":"C","e":"<p>The sponsor is the lead manager and generally appoints the syndicate.<\/p>"},{"s":2,"n":35,"id":"1066477","q":"<p>Which of the following would be considered an advantage, for the nominee, of individual registration within designated nominee accounts?<\/p>","o":[{"l":"A","h":"There are fewer additional costs for the custodian"},{"l":"B","h":"It helps with aspects of auditing and good control mechanisms, where identical trades are executed for different clients"},{"l":"C","h":"Where a company offers extra incentives these can always be received by the beneficiary"},{"l":"D","h":"It will not give rise to additional transactional costs imposed by the custodian for pooled accounts"}],"a":"B","e":"<p>Designation or individual registration can help some aspects of auditing and it affords a good control mechanism where identical trades may have been executed for different clients (for example on the same date, for the same number of shares and for the same settlement consideration).<\/p>"},{"s":2,"n":36,"id":"1066441","q":"<p>Which of the following would be shown as a liability on the statement of financial position (balance sheet)?<\/p>","o":[{"l":"A","h":"Prepayments"},{"l":"B","h":"Debentures"},{"l":"C","h":"Share premium account"},{"l":"D","h":"Patents"}],"a":"B","e":"<p>Non-current liabilities - this comprises the company's borrowing not repayable within the next 12 months. This could include bond issues as well as longer-term bank borrowing.<\/p>"},{"s":2,"n":37,"id":"4025896","q":"<p>The UK Debt Management Office announces the results of an auction, upon which of the following will it have an immediate impact?<\/p>","o":[{"l":"A","h":"Interest rates"},{"l":"B","h":"FX rate"},{"l":"C","h":"Credit ratings"},{"l":"D","h":"The cost of borrowing for other governments"}],"a":"A","e":"<p>The government bond provides the benchmark rate for measuring interest rates or the cost of borrowing for the UK government<\/p>"},{"s":2,"n":38,"id":"1078871","q":"<p>A company is considering a follow-on offer of securities, which of the following would most likely dissuade the company?<\/p>","o":[{"l":"A","h":"Regulatory intervention"},{"l":"B","h":"The possible dilution of ownership"},{"l":"C","h":"The possibility of having to fund future dividends"},{"l":"D","h":"The prospect of a bear market"}],"a":"D","e":"<p>Issuing more shares in a follow-on offering will only be considered if the equity markets are sufficiently robust. In a bear market there is unlikely to be sufficient demand for the shares at the price the issuing company wants.<\/p>"},{"s":2,"n":39,"id":"1067798","q":"<p>Participants in a dark pool are MOST LIKELY to have chosen this type of execution venue because of:<\/p>","o":[{"l":"A","h":"Lack of pre-trade transparency"},{"l":"B","h":"Ability to execute trades at efficient prices"},{"l":"C","h":"Ability to hide the dealer's identity"},{"l":"D","h":"Lower costs"}],"a":"B","e":"<p>Dark pools offer institutions a facility to deal large blocks of shares anonymously, typically using algorithm driven trading. The size of these orders would make it very difficult to achieve efficient pricing on more traditional venues but the dark pool allows them to do so. Although anonymity is an advantage, this is also available on many other systems, including exchanges.<\/p>"},{"s":2,"n":40,"id":"1065061","q":"<p>A company's capital consists of a combination of debt and equity. If the company undergoes a stock split, what will be the effect on the debt/equity ratio?<\/p>","o":[{"l":"A","h":"Debt increases, equity decreases"},{"l":"B","h":"Equity increases, debt decreases"},{"l":"C","h":"Both will increase"},{"l":"D","h":"No change"}],"a":"D","e":"<p>A stock split will result in an increased number of shares but this will be offset by a corresponding fall in the value of the shares. Net result is no change.<\/p>"},{"s":2,"n":41,"id":"1075032","q":"<p>Why would an investor want to buy a share through a special-ex trade?<\/p>","o":[{"l":"A","h":"To avoid capital gains tax."},{"l":"B","h":"To reduce regulatory reporting requirements"},{"l":"C","h":"To receive a dividend that they would otherwise be not entitled to"},{"l":"D","h":"For tax planning purposes"}],"a":"D","e":"<p>By dealing special ex the investor does not receive the dividend they are entitled to this may reduce income but not capital gains tax.<\/p>"},{"s":2,"n":42,"id":"4014381","q":"<p>Which one of the following is not an advantage of using a distributed ledger?<\/p>","o":[{"l":"A","h":"It can reduce possibly cybercrime"},{"l":"B","h":"It can produce cost efficiencies"},{"l":"C","h":"It can increase  the use of a centralised register"},{"l":"D","h":"It can produce faster processing speeds"}],"a":"C","e":"<p>Each synchronised ledger is an exact copy of each other and be updated independently while also updating all other copies. As a result there is no central authority or register that needs to confirm and update records. Security is accomplished through cryptographic keys and signatures.<\/p>"},{"s":2,"n":43,"id":"4078923","q":"<p>Companies seeking a listing on the NYSE or NASDAQ are required to register and also file regular reports with which of the following?<\/p>","o":[{"l":"A","h":"Securities and Exchange Commission"},{"l":"B","h":"Financial Industry Regulatory Authority"},{"l":"C","h":"Office of Thrift Supervision"},{"l":"D","h":"Commodity Futures Trading Commission"}],"a":"A","e":"<p>The US Securities and Exchange Commission (SEC) requires companies seeking a listing on the US exchanges, such as the NYSE and Nasdaq, to register certain details with the SEC first. Once listed, companies are then required to file regular reports with the SEC, particularly in relation to their trading performance and financial situation.<\/p>"},{"s":2,"n":44,"id":"1067797","q":"<p>ABC plc's 3 year bond has a yield of 4.5% and its 10 year bond is yielding 6.5%. If an investor believes that the yield spread between the two bonds will increase to 250 basis points. If he is correct, which of the following strategies would be profitable?<\/p>","o":[{"l":"A","h":"Buy the 3 year and sell the 10 year"},{"l":"B","h":"Sell the 3 year and buy the 10 year"},{"l":"C","h":"Buy the 3 year and buy the 10 year"},{"l":"D","h":"Sell the 3 year and sell the 10 year"}],"a":"A","e":"<p>The spread is widening here, which means that the yield of the 10 year bond is increasing relative to the 3 year issue. The longer term bond's yield will increase, its price will be falling. The investor would therefore buy the 3 year bond and sell the 10 year bond .<\/p>"},{"s":2,"n":45,"id":"1079699","q":"<p>Which of the following is true of capital reserves and revenue reserves?<\/p>","o":[{"l":"A","h":"Capital reserves are freely distributed to shareholders"},{"l":"B","h":"Revenue reserve form the capital base of the company"},{"l":"C","h":"Capital reserves can be converted into a bonus issue of shares"},{"l":"D","h":"Revenue reserves are the surplus above nominal value raised on issue"}],"a":"C","e":"<p>Capital reserves - capital reserves include revaluation reserves and the share premium account. The revaluation reserve arises from the upward revaluation of non-current assets, and the share premium reserve arises when the company issues shares at a price above their nominal value. Capital reserves are not distributable to the company's shareholders in the form of dividends, as they form part of the company's capital base, although they can be converted into a bonus issue of ordinary shares.<br/> Revenue reserves - the major revenue reserve is the accumulated retained earnings of the company. This represents the accumulation of the company's distributable profits that have not been paid to the company's shareholders as dividends but have been retained in the business.<\/p>"},{"s":2,"n":46,"id":"1072141","q":"<p>A bond's dirty price is the same as its clean price. Which of the following would help explain this situation?<\/p>","o":[{"l":"A","h":"The credit rating of the bond"},{"l":"B","h":"The settlement date is the same as the coupon date"},{"l":"C","h":"The trade is ex-interest"},{"l":"D","h":"The yield of the bond is zero"}],"a":"B","e":"<p>If the settlement date is the same the coupon paid date, this would mean that there is no accrued interest.<\/p>"},{"s":2,"n":47,"id":"1079698","q":"<p>A company charges £7,500 as a depreciation charge on an asset using the straight-line method. Which of the following is true?<\/p>","o":[{"l":"A","h":"£7,500 negative cash flow will be recognised each year"},{"l":"B","h":"The profit will not be affected by the depreciation charge"},{"l":"C","h":"The book value of the asset will fall £7,500 each year"},{"l":"D","h":"The cash value of the asset increases by £7,500 each year"}],"a":"C","e":"<p>The straight-line method assumes the book value of the asset falls by the same amount each year. This will decrease the profit figure but is not a negative cash flow.<\/p>"},{"s":2,"n":48,"id":"1001304","q":"<p>The present value of the following gilt with a 4% annual coupon with two years to maturity and a prevailing discount rate of 2.75% is:<\/p>","o":[{"l":"A","h":"£98.51"},{"l":"B","h":"£100"},{"l":"C","h":"£102.40"},{"l":"D","h":"£104.28"}],"a":"C","e":"<p>Year one will have a cash flow of 4 and a discount factor of 1 / 1.0275. The present value at the end of year one is £3.89.<br/> Year two will have a cash flow of 104 and a discount factor of 1 / (1.0275^2). The present value at the end of year two is £98.51.<br/> The price of the bond is the sum of the present values.<\/p>"},{"s":2,"n":49,"id":"1079704","q":"<p>An investor bought a convertible preference share. She suddenly starts receiving a variable dividend on the share. Why might this be?<\/p>","o":[{"l":"A","h":"She has utilised the inherent option of the preference share"},{"l":"B","h":"The company has defaulted on the payment of a preference share dividend"},{"l":"C","h":"The share price on the market fell below the trigger level on the share"},{"l":"D","h":"Ordinary shareholders receive higher dividends than preference shareholders"}],"a":"A","e":"<p>With a convertible preference share, the preference shareholder has the right, but not the obligation, to convert the preference shares into a predetermined number of ordinary shares. If the investor uses this option, she will start to receive a variable dividend.<\/p>"},{"s":2,"n":50,"id":"1075018","q":"<p>Secondary Information Providers are used by whom as source of company information?<\/p>","o":[{"l":"A","h":"Regulators"},{"l":"B","h":"The Stock exchange"},{"l":"C","h":"Brokers and research analysts"},{"l":"D","h":"HMRC"}],"a":"C","e":"<p>Secondary Information Providers receive their information from Primary Information providers. SIPs are used by brokers and research analysts.<\/p>"},{"s":2,"n":51,"id":"1046723","q":"<p>What is the repo rate?<\/p>","o":[{"l":"A","h":"The implied interest paid for borrowing securities"},{"l":"B","h":"The implied interest paid for borrowing gilts"},{"l":"C","h":"The implied interest paid for borrowing money"},{"l":"D","h":"The implied interest paid for lending stock"}],"a":"C","e":"<p>A repo is an alternative way to borrow money. As.repos settle T+0 they are a means of raising quick cash.<\/p>"},{"s":2,"n":52,"id":"4062271","q":"<p>For what main reason would an investment manager make use of a bond swapping?<\/p>","o":[{"l":"A","h":"To reduce the impact of taxation"},{"l":"B","h":"To comply with regulatory requirements"},{"l":"C","h":"To take advantage of inefficient markets"},{"l":"D","h":"To re-balance their portfolio"}],"a":"C","e":"<p>Bond switching, or bond swapping, is used by those portfolio managers who believe they can outperform a buy-and-hold passive policy, by actively exchanging bonds perceived to be overpriced for those perceived to be under priced.<\/p>"},{"s":2,"n":53,"id":"4080423","q":"<p>What is the benefit of shelf registration in the US bond market?<\/p>","o":[{"l":"A","h":"To provide a marketing platform for an organisation's bonds"},{"l":"B","h":"To withdraw a public offer of corporate bond without cancelling the offer entirely"},{"l":"C","h":"To issue smaller batches of bonds of varying coupons and maturity"},{"l":"D","h":"To allow the coupons and redemption of conventional bonds to be traded separately"}],"a":"C","e":"<p>Shelf registration introduced flexibility to the bond market, allowing companies to issue smaller batches of bonds, with the coupons and maturity varying according to market demand at the time.<\/p>"},{"s":2,"n":54,"id":"1075013","q":"<p>Bondvision is a dealer to client electronic trading platform connecting which two parties?<\/p>","o":[{"l":"A","h":"Dealer to Market maker"},{"l":"B","h":"Dealer to GEMM"},{"l":"C","h":"Customer to Dealer"},{"l":"D","h":"Marker maker to Inter dealer Broker"}],"a":"C","e":"<p>Bondvision is a dealer to client electronic trading platform.<\/p>"},{"s":2,"n":55,"id":"4025889","q":"<p>Who makes the decision of whether a company meets the requirements of size, control, free float and trading history for a listing on the official market?<\/p>","o":[{"l":"A","h":"The PRA"},{"l":"B","h":"The FCA"},{"l":"C","h":"The Treasury"},{"l":"D","h":"The Bank of England"}],"a":"B","e":"<p>The Main Market in the UK is typically referred to as the Official List and the criteria for admission to the Official List are set out in the Listing Rules – a rule book is maintained by the UKLA, itself a division of the regulator, the FCA<\/p>"},{"s":2,"n":56,"id":"1070778","q":"<p>Which of the following would be the most likely response in bond and equity prices when interest rates rise, or are expected to rise?<\/p>","o":[{"l":"A","h":"Bond prices will go up and equity prices will go down"},{"l":"B","h":"Bond prices will go down and equity prices will go down"},{"l":"C","h":"Bond prices will go down and equity prices will go up"},{"l":"D","h":"Bond prices will go up and equity prices will go up"}],"a":"B","e":"<p>When interest rates rise, or are expected to rise, securities prices tend to fall. Bonds fall in price to bring about a more competitive yield, and equity prices fall to remain competitive with bonds and because companies may now face increased costs on their borrowing, reducing profits. Consumers are also likely to reduce expenditure because of increased costs on their borrowing (such as mortgages) which will adversely impact company sales.<\/p>"},{"s":2,"n":57,"id":"1052098","q":"<p>Which of the following is true with regard to the dividend on a preference share?<\/p>","o":[{"l":"A","h":"Fixed and paid at the discretion of the board"},{"l":"B","h":"Fixed and paid irrespective of companies performance"},{"l":"C","h":"Variable and paid at the discretion of the board"},{"l":"D","h":"Variable and paid irrespective of companies performance"}],"a":"A","e":"<p>The dividend on a preference share is fixed (as a percentage of its nominal value), but in the event of a company performing poorly the directors can decide not to pay the preference share dividend. Note that preference share dividends should be paid in full before ordinary shareholders receive any dividend.<\/p>"},{"s":2,"n":58,"id":"4002941","q":"<p>A risk-averse investor looking to invest in bonds would most likely choose to invest in:<\/p>","o":[{"l":"A","h":"Putable bonds"},{"l":"B","h":"Exchangeable bonds"},{"l":"C","h":"Callable bonds"},{"l":"D","h":"Convertible bonds"}],"a":"A","e":"<p>Holding a bond to redemption reduces the risk of a bond (all other things being equal) as the redemption value is fixed irrespective of market price. The put provision allows the holder to redeem the bond early at that value. It may not be the best return – convertible/exchangeable would give higher returns – but of the four choices available, the putable bond offers the lowest risk.<\/p>"},{"s":2,"n":59,"id":"4025890","q":"<p>UK T-Bills and stripped gilts ALWAYS have:<\/p>","o":[{"l":"A","h":"Zero coupon"},{"l":"B","h":"Fixed coupon"},{"l":"C","h":"Floating coupon"},{"l":"D","h":"Fixed or floating coupon"}],"a":"A","e":"<p>UK Treasury Bills will always have zero coupon. When a gilt is stripped into separate components it itself becomes a zero coupon bond<\/p>"},{"s":2,"n":60,"id":"1042441","q":"<p>Which one of the following is a major disadvantage of holding property as a direct investment?<\/p>","o":[{"l":"A","h":"Corporation tax is due on the property"},{"l":"B","h":"Property can be an illiquid asset"},{"l":"C","h":"It can be highly volatile"},{"l":"D","h":"It is a tangible asset"}],"a":"B","e":"<p>Property can be difficult to sell at a price close to its market value (i.e. it can be illiquid).<\/p>"},{"s":2,"n":61,"id":"1070780","q":"<p>Which of the following statements would be least likely in relation to a pension fund?<\/p>","o":[{"l":"A","h":"A measure of return especially useful for pension funds is the gross redemption yield"},{"l":"B","h":"Pension funds can invest in high risk portfolios"},{"l":"C","h":"Liability driven pension funds will use dedicated portfolios"},{"l":"D","h":"Pension funds will have significant holdings in money market instruments"}],"a":"D","e":"<p>The gross remption yield is more appropriate for long-term investors than the flat yield. In particular, because it ignores the impact of any taxation, it is especially useful for non-tax-paying long-term investors such as pension funds and charities. Pension funds have a relatively long investment horizon, they can take risks and have tended to invest heavily in equities. Defined benefit pensions have a known liability and therefore will use decicated portfolios, for example STRIPS or duration matching to meet their liabilities. The proportion of money market instrument would not be significant.<\/p>"},{"s":2,"n":62,"id":"1079702","q":"<p>A high frequency trader successfully completes the purchase of a large holding of shares. Which of the following are they likely to do next?<\/p>","o":[{"l":"A","h":"Hedge the position with derivatives"},{"l":"B","h":"Buy more of the shares over the day"},{"l":"C","h":"Lobby the issuer to change policy"},{"l":"D","h":"Sell the shares as quickly as possible"}],"a":"D","e":"<p>Some algorithmic trading strategies can be very short-term, perhaps involving buying one minute, and selling the next, and trigger automatically executed trades on multiple occasions each day. When the objective is to exploit transitory price discrepancies, such strategies are referred to as high-frequency trading (HFT).<\/p>"},{"s":2,"n":63,"id":"1075008","q":"<p>The coupon on a bond is best described as:<\/p>","o":[{"l":"A","h":"Interest paid"},{"l":"B","h":"Running yield"},{"l":"C","h":"Gross redemption yield"},{"l":"D","h":"The dividend payment"}],"a":"A","e":"<p>The coupon of a bond is the interest paid. The running yield reflects the rate of return based on the coupon and the current price of the bond. The gross redemption yield reflects the income and the capital gain or loss if a bond I held to maturity.<\/p>"},{"s":2,"n":64,"id":"1054677","q":"<p>At what percentage of share ownership would an investor be forced to make a mandatory bid?<\/p>","o":[{"l":"A","h":"10%"},{"l":"B","h":"20%"},{"l":"C","h":"30%"},{"l":"D","h":"50%"}],"a":"C","e":"<p>If a predator acquires influence 30% or more of voting rights of a company, it must make an offer for all the remaining shares of the company.<\/p>"},{"s":2,"n":65,"id":"1079374","q":"<p>A company announces an increase in the dividend that it will pay out to shareholders in response to continued profit growth. Assuming all of the following securities are in issue, which of the following is most likely to benefit from this increase in income?<\/p>","o":[{"l":"A","h":"Depositary receipt holder"},{"l":"B","h":"Equity warrant holder"},{"l":"C","h":"Cumulative preference shareholder"},{"l":"D","h":"Floating rate bond"}],"a":"A","e":"<p>A depositary receipt is a certificate that represents ordinary shares in a company. The benefit of a higher dividend will be passed on to them. Warrants do not pay dividends and cumulative preference shares pay a fixed dividend. Floating rate bond are debt instruments and receive their payment irrespective of profits (unless default occurs).<\/p>"},{"s":2,"n":66,"id":"1044998","q":"<p>Company A is to provide services to Company B for the next three years. It will cost Company A £2,000 a year to provide these services; Company B pays the full fee of £9,000 upfront in year one. What is the profit recorded in year one by Company A?<\/p>","o":[{"l":"A","h":"£9,000"},{"l":"B","h":"£4,000"},{"l":"C","h":"£3,000"},{"l":"D","h":"£1,000"}],"a":"D","e":"<p>Using the accruals method, Company A receives £9,000 over a period of three years. Year one would show a receipt of £3,000 against a cost of £2,000, therefore giving £1,000 profit.<\/p>"},{"s":2,"n":67,"id":"1065046","q":"<p>Which instrument would be likely to provide the best indicator of long term interest rates?<\/p>","o":[{"l":"A","h":"Bond futures"},{"l":"B","h":"Bond ETF prices"},{"l":"C","h":"Current interest rates"},{"l":"D","h":"Share prices"}],"a":"A","e":"<p>Futures prices are generally regarded as being indicative of the market's view. It is worth keeping in mind, of course, that while this represents market consensus, such consensus is not guaranteed to be correct!<\/p>"},{"s":2,"n":68,"id":"1001399","q":"<p>The nominal value of a share is £1.00. The earnings per share is 15p. The dividend per share is 6p. The current share price is 120p. Calculate the dividend yield.<\/p>","o":[{"l":"A","h":"5%"},{"l":"B","h":"12.5%"},{"l":"C","h":"15%"},{"l":"D","h":"50%"}],"a":"A","e":"<p>Dividend yield = dividend / market price x 100 = 6 / 120 x 100 = 5%.<\/p>"},{"s":2,"n":69,"id":"1072170","q":"<p>On a company's statement of financial position (balance sheet), there may be liabilities based on past events for which there is an obligation but the exact amount is yet to be established. How is this commonly referred?<\/p>","o":[{"l":"A","h":"Provision"},{"l":"B","h":"Past activity"},{"l":"C","h":"Estimated expense"},{"l":"D","h":"Estimated liability"}],"a":"A","e":"<p>Such provisions may arise as a result of the company undergoing a restructuring, for example. Given the uncertainty surrounding the extent of such liabilities, companies are required to create a realistic and prudent estimate of the monetary amount of the obligation, once it is committed to taking a certain course of action.<\/p>"},{"s":2,"n":70,"id":"1079697","q":"<p>Why do shareholders get to vote on dividends at AGM?<\/p>","o":[{"l":"A","h":"To agree on a higher dividend that the directors' propose"},{"l":"B","h":"To ratify the directors' decision on the level of dividend"},{"l":"C","h":"To ensure the dividend is increased where the company has too much cash in reserve"},{"l":"D","h":"To ensure that tax is not liable on the dividend"}],"a":"B","e":"<p>Dividends for ordinary shareholders are proposed by the directors and generally ratified by the shareholders at the annual meeting. Shareholders are not given the opportunity to increase the dividend.<\/p>"},{"s":2,"n":71,"id":"1054642","q":"<p>Debt with a high interest cover will subsequently affect:<\/p>","o":[{"l":"A","h":"The ability to meet liabilities should they fall due"},{"l":"B","h":"Market valuation"},{"l":"C","h":"Securitisation"},{"l":"D","h":"Growth prospects"}],"a":"B","e":"<p>Interest cover is used to determine how easily a company can pay interest on its outstanding debt. Similar to dividend cover a ratio of lower than 1 means that the company is not generating sufficient revenues to satisfy its interest expense, therefore a measure of risk. The greater the risk, the higher the yield the cheaper the price and visa versa.<\/p>"},{"s":2,"n":72,"id":"1072157","q":"<p>An underwriter guarantees a minimum level of proceeds from a share issuance. Which of the below is most likely?<\/p>","o":[{"l":"A","h":"Any unsold shares would be bought from the issuer at a discount"},{"l":"B","h":"Any unsold shares would be bought from the issuer at a premium"},{"l":"C","h":"Any unsold shares would be bought from the issuer at market price once trading has commenced"},{"l":"D","h":"Any unsold shares would not be taken up"}],"a":"A","e":"<p>Usually the underwriters guarantee to buy the unsold portion at a discount to the share price at which the shares are offered to the public. If underwriting is done on a best efforts basis, the underwriter is not obliged to buy the unsold shares.<\/p>"},{"s":2,"n":73,"id":"1072895","q":"<p>Which of the following would be considered the difference between commercial paper in the UK and commercial paper in the US?<\/p>","o":[{"l":"A","h":"UK commercial paper settles T+2, whilst US commercial paper settles T+0"},{"l":"B","h":"Yields on commercial paper are quoted on a discount basis by using the standard of Actual/360"},{"l":"C","h":"UK commercial paper is issued only by financial institutions, whilst US commercial paper is issued by all corporates"},{"l":"D","h":"UK commercial paper typically has a maximum maturity of 365 days, whilst US commercial paper has a maximum maturity of 270 days"}],"a":"D","e":"<p>Commercial paper (CP) is a money market instrument, issued by a company. The money market is the term for the market involving cash deposits and short-term instruments that are issued with less than one year to their maturity. CP is the corporate equivalent of a government's Treasury bill. CP is issued at a discount to its nominal value and can have a maturity of up to one year in Europe and 270 days in the US; however, it is common to find in both territories that CP will be issued for three months. Yields for CP are quoted on a discount basis. Virtually all countries use the Actual/360 basis, except the UK, which uses the Actual/365 basis<\/p>"},{"s":2,"n":74,"id":"4049370","q":"<p>If someone uses MTS Cash, what does that tell us about their method of trading?<\/p>","o":[{"l":"A","h":"Dealer to dealer"},{"l":"B","h":"Dealer to customer"},{"l":"C","h":"Exchange-traded"},{"l":"D","h":"Face-to-face trading"}],"a":"A","e":"<p>MTS Cash is an over-the-counter dealer to dealer trading platform.<\/p>"},{"s":2,"n":75,"id":"1070790","q":"<p>Consider two companies, one big and the other small. Which of the following would be most likely with regards to P/E ratio and dividend yield?<\/p>","o":[{"l":"A","h":"The larger company would have a higher P/E ratio and lower dividend yield"},{"l":"B","h":"The smaller company would have a higher P/E ratio and lower dividend yield"},{"l":"C","h":"The P/E ratio and dividend yield would be the same for both companies"},{"l":"D","h":"The company with the highest P/E ratio and lowest dividend yield would be considered a value company"}],"a":"B","e":"<p>This is a very unusal question and would make more sense if the companies were quoted as established and start-up. However the examiner does test how the ratios indicate growth and therefore we have to assume that this is the purpose of this question. So high P/E ratio low dividend yield may indicate high growth and smaller companies are supposed to develop into larger companies<\/p>"},{"s":2,"n":76,"id":"1070569","q":"<p>A bond with a 2-10 year maturity is created from securitised public sector loans and mortgages, where the investor has recourse against the issuer should default occur. The assets backing the bond remain on the issuer's consolidated statement of financial position (balance sheet). This would BEST describe which of the following bonds?<\/p>","o":[{"l":"A","h":"Medium term note"},{"l":"B","h":"Asset backed security"},{"l":"C","h":"Covered bond"},{"l":"D","h":"Guaranteed bond"}],"a":"C","e":"<p>In instances when no SPV is created, the asset-backed bonds are simply referred to as 'covered bonds', referring to the pool of assets that provide the 'cover' to the bondholder. So, with covered bonds, the assets are retained on the statement of financial position of the issuing entity, such as a bank, rather than transferred to an SPV.<\/p>"},{"s":2,"n":77,"id":"4062274","q":"<p><\/p><p>A manufacturing company incurs the following expenditure in connection with a machine:<\/p><p>Acquisition cost 20,500<\/p><p>Operator’s salary 15,000<\/p><p>Annual service costs 500<\/p><p>What is the maximum expenditure that may be capitalised on the company’s Statement of Financial Position? <\/p>","o":[{"l":"A","h":"20,500"},{"l":"B","h":"21,000"},{"l":"C","h":"35,500"},{"l":"D","h":"36,000"}],"a":"A","e":"<p>Only the acquisition cost can be capitalised<\/p>"},{"s":2,"n":78,"id":"1078891","q":"<p>A company has a market capitalisation of £30m when it announces a three for one scrip issue. If the shares are currently trading at £2.75 the theoretical ex-scrip price would be:<\/p>","o":[{"l":"A","h":"206 pence"},{"l":"B","h":"183 pence"},{"l":"C","h":"92 pence"},{"l":"D","h":"69 pence"}],"a":"D","e":"<p>In a scrip issue three new shares are being offered for one existing share. Before the issue one share is worth £2.75 or 275 pence and after the issue 4 shares are now worth £2.75 in total or approximately £0.69 or 69 pence each.<\/p>"},{"s":2,"n":79,"id":"1070419","q":"<p>A company's operating loss is £6m. If work in progress has fallen by £2m and there is an increase in receivables and payables of £1m each, what is the operating cash flow?<\/p>","o":[{"l":"A","h":"Minus £8 million"},{"l":"B","h":"Minus £6 million"},{"l":"C","h":"Minus £4 million"},{"l":"D","h":"Minus £2 million"}],"a":"C","e":"<p>Operating cash flow is calculated as follows:<br/> Operating loss of £6m.<br/> Add any decrease in inventory - so, minus £6m plus £2m gives minus £4m. <br/> Add back increase in payables £1m and subtact increase in receivables £1m, these two will net each other off.<br/> So, operating cash flow = minus £4m.<\/p>"},{"s":2,"n":80,"id":"4160842","q":"<p>Private equity fund investors will normally be which one of the following?<\/p>","o":[{"l":"A","h":"Governments"},{"l":"B","h":"Unlisted companies"},{"l":"C","h":"Institutional clients"},{"l":"D","h":"Private investors"}],"a":"C","e":"<p>Private equity firms raise their capital from a variety of sources, but mainly from large investing institutions - institutional clients, only the wealthiest private investors will be targeted.<\/p>"},{"s":2,"n":81,"id":"4025886","q":"<p>In a stock borrowing and lending agreement, the borrower will provide collateral to the lender. Where the fee has been quoted as a rebate this would mean, it is where:<\/p>","o":[{"l":"A","h":"traders who put in limit orders typically receive a small rebate from the exchange upon execution of their orders because they are regarded as having contributed to liquidity in the stock."},{"l":"B","h":"the borrower has paid too much in transaction costs and taxes and this money is paid back as a rebate to the borrower"},{"l":"C","h":"cash has been placed as collateral and the lender will earn all of the interest that accrues on the cash collateral and an agreed rate will rebated to the borrower"},{"l":"D","h":"collateral of a significant credit rating has been offered up by the borrower, meaning if the borrower should default the collateral will easily cover the loss. The quality of the collateral will generate a rebate to the cost of borrowing"}],"a":"C","e":"<p>The first answer is a definition of a liquidity rebate, the second is a dictionary definition of a rebate and the last is not the text book definition of a rebate, which is, “As payment for the loan, the parties negotiate a fee, quoted as an annualised percentage of the value of the loaned securities. If the agreed form of collateral is cash, then the fee may be quoted as a rebate, meaning that the lender will earn all of the interest that accrues on the cash collateral, and will rebate an agreed rate of interest to the borrower.<\/p>"},{"s":2,"n":82,"id":"1070782","q":"<p>Which of the following debt instruments would allow the holder to exchange the debt for a set number of shares, not of the issuer but of another company's shares already held by the issuer?<\/p>","o":[{"l":"A","h":"Covered bond"},{"l":"B","h":"Convertible bond"},{"l":"C","h":"Equity linked note"},{"l":"D","h":"Exchangeable bond"}],"a":"D","e":"<p>An exchangeable bond is also a bond that pays a coupon and has a set redemption date. Like a convertible, it gives the holder the right to exchange the bond for a set number of shares, but these shares are not those of the bond issuer, but of another company's shares that are held by the issuer.<\/p>"},{"s":2,"n":83,"id":"1070791","q":"<p>Which of the following would be considered as passive bond strategy?<\/p>","o":[{"l":"A","h":"Anomaly swapping"},{"l":"B","h":"Duration Immunisation"},{"l":"C","h":"Riding the yield curve"},{"l":"D","h":"Inter-market switch"}],"a":"B","e":"<p>Duration-based immunisation involves constructing a bond portfolio with the same initial value as the present value of the liability it is designed to meet and the same duration as this liability. A portfolio that contains bonds that are closely aligned in this way is known as a bullet portfolio. Alternatively, a barbell strategy can be adopted. If a bullet portfolio holds bonds with durations as close as possible to ten years to match a liability with ten-year duration, a barbell strategy may be to hold bonds with a durations of five and 15 years. Barbell portfolios necessarily require more frequent rebalancing than bullet portfolios.<\/p>"},{"s":2,"n":84,"id":"1076204","q":"<p>Which of the following is the best definition of a bond 'on the run'?<\/p>","o":[{"l":"A","h":"One that trades in an unpopular sector of the market"},{"l":"B","h":"A bond that has suffered a series of downgrades and is heading for default"},{"l":"C","h":"One that is popular with investors due to an unexpectedly positive forecast"},{"l":"D","h":"The most recently issued Treasury bond"}],"a":"D","e":"<p>On the run bonds refer to those that are most recently issued by the issuer. Those previously issued are often referred to as off the run bonds.<\/p>"},{"s":2,"n":85,"id":"4002940","q":"<p>Which of the following could be described as a main benefit of a central counterparty?<\/p>","o":[{"l":"A","h":"It prohibits anonymity"},{"l":"B","h":"Reduction of systemic risk"},{"l":"C","h":"Increased operational risk capital requirements"},{"l":"D","h":"Elimination of all counterparty risk"}],"a":"B","e":"<p>A central counterparty (CCP) provides certain benefits to market participants, in particular significantly reduced counterparty [credit] risk. Due to the CCP's guarantee, risk of default is reduced, but not eliminated, since it is theoretically possible that the CCP itself could become insolvent and default. Reducing by largely reducing counterparty risk, the CCP thereby reduces the risk of systemic collapse of the financial system.<\/p>"},{"s":2,"n":86,"id":"4025900","q":"<p>Why would a company choose to do a rights issue?<\/p>","o":[{"l":"A","h":"To significantly reduce the share price"},{"l":"B","h":"To fund a takeover"},{"l":"C","h":"To avoid using an underwriter"},{"l":"D","h":"To ensure there is no dilution of shareholders’ interests"}],"a":"B","e":"<p>The rationale for a rights issue is usually to fund expansion, perhaps to take over a rival or to diversify into a new business area.<\/p>"},{"s":2,"n":87,"id":"4078924","q":"<p>Which of the following is most likely to offer a crossing network or matching engine for execution of securities trading?<\/p>","o":[{"l":"A","h":"Gilt edged market makers"},{"l":"B","h":"Investment firms"},{"l":"C","h":"Stock borrowing and lending intermediaries"},{"l":"D","h":"Custodian Banks"}],"a":"B","e":"<p>An order matching system or simply a matching engine is an electronic system that matches buy and sell orders for financial markets. The order matching system is the core of all electronic exchange of trades and are used to execute orders from participants. Even though these are used by exchanges the only reference to crossing networks in the manual is; where investment firms offer these systems to match trades of their clients.<\/p>"},{"s":2,"n":88,"id":"4002935","q":"<p>Where can authorised participants buy exchange traded funds (ETFs) directly from a fund manager?<\/p>","o":[{"l":"A","h":"In the secondary market"},{"l":"B","h":"In the open market without restrictions"},{"l":"C","h":"In the primary market"},{"l":"D","h":"Through creation units via a retail broker"}],"a":"C","e":"<p>Only authorised participants (typically large institutional investors) actually buy or sell shares of an ETF directly from/to the fund manager, and then only in creation units – large blocks of tens of thousands of ETF shares – which are usually exchanged in kind with baskets of the underlying securities, this would be known as the primary market. Other investors, such as individuals using a retail broker, trade ETF shares via a secondary market such as the NYSE/Arca exchange in the US, or the LSE in the UK.<\/p>"},{"s":2,"n":89,"id":"4002926","q":"<p>Frontier and emerging market equities trade mostly on:<\/p>","o":[{"l":"A","h":"Over the counter venues"},{"l":"B","h":"Multi-lateral trading facilities"},{"l":"C","h":"Organised trading facilities"},{"l":"D","h":"Stock exchanges"}],"a":"D","e":"<p>The term ‘frontier markets’ is commonly used to describe the smaller and less accessible equity markets. These equities are still investable on stock exchanges as also are the securities of emerging markets.<\/p>"},{"s":2,"n":90,"id":"1075019","q":"<p>Who are usually the direct issuers of Commercial Paper?<\/p>","o":[{"l":"A","h":"SME"},{"l":"B","h":"The Government"},{"l":"C","h":"The Treasury"},{"l":"D","h":"Financial companies"}],"a":"D","e":"<p>Financial companies are direct issuers of commercial paper.<\/p>"},{"s":2,"n":91,"id":"4025895","q":"<p>Which of the following is considered the main risk of investing in the government bonds of emerging/frontier markets as opposed to those of emerged markets?<\/p>","o":[{"l":"A","h":"The issuer's economic performance"},{"l":"B","h":"The ability of the issuer to meet obligations"},{"l":"C","h":"Potential political and economic volatility"},{"l":"D","h":"Stability of the market's currency"}],"a":"C","e":"<p>The risks of investing in emerging or even frontier market government bonds include the standard risks that accompany all debt issues, such as the variables of the issuer’s economic or financial performance and the ability of the issuer to meet payment obligations. These risks are heightened due to the potential political and economic volatility of these developing nations which could increase the risk of default (credit risk) and also allow inflation to ta
