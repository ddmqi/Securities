,600"}],"a":"B","e":"<p>If the bond is trading at £200, we always assume this is per £100 nominal value - double the par value. This means our £10,000 only bought £5,000 nominal value. The coupon, therefore, is:<\/p><p>£5,000 x 8% = £400<\/p>"},{"s":5,"n":39,"id":"4062272","q":"<p>Basic earnings per share are calculated from which of the following?<\/p>","o":[{"l":"A","h":"Shares in issue including preference shares and net income"},{"l":"B","h":"Shares in issue excluding preference shares and net income minus preference dividend"},{"l":"C","h":"Profits before taxation and shares in issue including preference shares"},{"l":"D","h":"Profits after taxation and shares in issue excluding preference shares"}],"a":"B","e":"<p>Earnings per share (EPS) is the amount of profit after tax that has been earned per ordinary share. EPS = (Net income for the financial year – Dividends on preferred shares) / Number of ordinary shares in issue<\/p>"},{"s":5,"n":40,"id":"1066465","q":"<p>Return on capital employed is BEST described as:<\/p>","o":[{"l":"A","h":"Gross profit over net current assets"},{"l":"B","h":"Profit after tax over assets plus current liabilities"},{"l":"C","h":"Profit after tax over equity plus long term debt"},{"l":"D","h":"Money returned over total financing"}],"a":"D","e":"<p>Return on capital employed (ROCE) is widely seen as the best ratio for measuring overall management performance, in relation to the capital that has been paid into the business. It looks at the amount of return (profit) that is being generated as a percentage of the finance put into the business (the capital employed). This is not the correct definition of ROCE but given the four possible answers is is the best, possibly a trial question<\/p>"},{"s":5,"n":41,"id":"1066470","q":"<p>A company has enlisted the help of financial professionals to issue a large number of new shares to the market. Which of the following would agree to support the price by buying back the newly issued shares in the market if the price falls below a certain level, therefore stabilising the price?<\/p>","o":[{"l":"A","h":"Lead manager"},{"l":"B","h":"Underwriter"},{"l":"C","h":"Sponsor"},{"l":"D","h":"Book runner"}],"a":"A","e":"<p>Stabilisation is the process whereby, to prevent a substantial fall in the value of securities when a large number of new securities is issued, the lead manager of the issue agrees to support the price by buying back the newly issued securities in the market if the market price falls below a certain pre-defined level. This is done in an attempt to give the market a reasonable chance to adjust to the increased number of securities that have become available, by stabilising the price at which they are traded.<\/p>"},{"s":5,"n":42,"id":"1039414","q":"<p>An investor chooses to invest in the forward foreign exchange market rather than the spot market. Which of the following statements is true?<\/p>","o":[{"l":"A","h":"GBP is always base in the spot markets"},{"l":"B","h":"Spot markets do not quote foreign exchange rates as a bid/offer spread"},{"l":"C","h":"Both spot and forward markets settle two business days after the deal"},{"l":"D","h":"Forward markets settle on a pre-agreed date three days or more after the deal"}],"a":"D","e":"<p>Although spot markets settle T+2, the forward markets will settle on a pre-agreed date. The examiner specifies three days or more after the deal as, if it were less, it would be a spot transaction.<\/p>"},{"s":5,"n":43,"id":"1066447","q":"<p>Which of the following would describe how UK T-bills are issued?<\/p>","o":[{"l":"A","h":"Auctions"},{"l":"B","h":"Shelf registration"},{"l":"C","h":"Cash box"},{"l":"D","h":"Tenders"}],"a":"D","e":"<p>In the UK, T-bills are issued at weekly auctions, known as tenders, held by the DMO at the end of the week (usually a Friday). These tenders are open to bids from a group of eligible bidders which include all of the major banks.<br/> Note: In a tender process, successful bidders would all pay the same price and for this reason, UK offerings of T-bills are not strictly tenders. However they are referred to as 'tenders' and for this reason, it is the correct answer in the exam!<\/p>"},{"s":5,"n":44,"id":"1066461","q":"<p>A company wishing to undergo an initial public offer will first go to:<\/p>","o":[{"l":"A","h":"The Listing Authority"},{"l":"B","h":"A listing agent"},{"l":"C","h":"The exchange"},{"l":"D","h":"An underwriter"}],"a":"B","e":"<p>A company wishing to undertake an IPO will first secure a sponsor (listing agent) - probably an investment bank - who, after confirming the company's suitability for listing, will guide it through the application process, production of a prospectus etc.<\/p>"},{"s":5,"n":45,"id":"4160841","q":"<p>A financial institution would require sight of the trust deed for a trust for which one of the following reasons?<\/p>","o":[{"l":"A","h":"To ensure that the trustee of the trust has the power and authority to undertake the proposed transactions"},{"l":"B","h":"To ensure that the trustee's actions conform to the stated purpose of the trust"},{"l":"C","h":"To ensure that the settlor of the trust has the power and authority to undertake the proposed transactions"},{"l":"D","h":"To ensure that the beneficiaries of the trust have the power and authority to undertake the proposed transactions"}],"a":"A","e":"<p>The terms of a trust are set out in a trust deed which will also appoint the trustees and give them powers to manage the trust and invest the assets.<\/p><p>As the trustees are responsible for managing the trust and are the legal owners of its assets, they have the legal capacity to enter into contracts on behalf of the trust. A financial institution will, therefore, need to see the trust deed and check the document to confirm the trustees’ authority to act and confirm their identity before accepting any instructions.<\/p>"},{"s":5,"n":46,"id":"1078773","q":"<p>In the UK, a secured corporate debt instrument is known as a debenture. Which of the following would be considered a key role performed by a trustee in the issuance of a debenture?<\/p>","o":[{"l":"A","h":"To make sure that they represent the best interests of the corporation"},{"l":"B","h":"Making sure the corporation adheres to the terms of the indenture"},{"l":"C","h":"To assist in and ensure the bond is properly marketed"},{"l":"D","h":"To ensure the custodian bank keeps track of all bonds sold"}],"a":"B","e":"<p>To make bonds a more marketable security, a trustee is assigned to represent the interests of the bondholders. Before marketing a bond, the issuer, often using the corporate trustee as its agent, will engage the services of a credit rating agency to assess the creditworthiness of the issuer and the likelihood that all of the terms of the securities offering are likely to be fulfilled. This engagement is to represent the interest of the bondholders, but no to actually market the issue themselves. The corporate trustee must keep track of all bonds sold, verifying that the amount issued is not greater than what is stated in the indenture and making sure that the corporation complies with all covenants, which are the terms of the indenture, while the bond issue is outstanding. Adherence to the covenants of the indenture is one of the principal roles of the trustee.<\/p>"},{"s":5,"n":47,"id":"1054650","q":"<p>Which members would be involved in a subscription IPO?<\/p>","o":[{"l":"A","h":"Lead manager and Co-managers"},{"l":"B","h":"Underwriters"},{"l":"C","h":"Issuer"},{"l":"D","h":"Corporate Broker"}],"a":"C","e":"<p>An offer of subscription involves a company issuing shares directly to the general public<\/p>"},{"s":5,"n":48,"id":"1069735","q":"<p>Which of the following is an advantage to investing in a real estate investment trust (REIT)?<\/p>","o":[{"l":"A","h":"No tax is paid on REIT investments"},{"l":"B","h":"The costs of investment are usually a lot lower than direct property investment"},{"l":"C","h":"Less volatile than direct property investment"},{"l":"D","h":"REITs cannot be packaged into a ISA tax wrapper"}],"a":"B","e":"<p>The share price is influenced by what is happening in equity markets as well as commercial property markets, hence it is generally more volatile than direct property investment. REITs can in fact be packaged into a NISA wrapper. In addition, although there are tax benefits, there are also tax disadvantages. Unlike dividends on standard shares, REIT investors will pay 20% or 40%, depending on their personal tax band. This is because REITs are classed as property-letting income, and will be taxed as such.<\/p>"},{"s":5,"n":49,"id":"1078535","q":"<p>During periods of inflation, which of the following would be true of an index linked government bond?<\/p>","o":[{"l":"A","h":"Coupon and redemption value would increase"},{"l":"B","h":"Coupon would increase, redemption value would remain the same"},{"l":"C","h":"Coupon would be unchanged, redemption value would increase"},{"l":"D","h":"Coupon and redemption value would increase up to a maximum level"}],"a":"A","e":"<p>Both the coupon and the redemption value of an index linked bond are adjusted for inflation, as measured by an inflation index.<\/p>"},{"s":5,"n":50,"id":"1078531","q":"<p>Which of these is shown on the statement of financial position (balance sheet)?<\/p>","o":[{"l":"A","h":"Depreciation expense"},{"l":"B","h":"Amortisation expense"},{"l":"C","h":"Turnover"},{"l":"D","h":"Investments"}],"a":"D","e":"<p>All the others are shown on the income statement<\/p>"},{"s":5,"n":51,"id":"1065028","q":"<p>During an initial public offer of shares, how is the price usually determined?<\/p>","o":[{"l":"A","h":"Completely at the discretion of the issuer"},{"l":"B","h":"Through a tender process"},{"l":"C","h":"Through an auction process"},{"l":"D","h":"Through a reverse enquiry"}],"a":"B","e":"<p>Auction process applies to UK government bond issues. Although a US government bond issue is called an auction, it is priced tender-style. Reverse enquiry applies to corporate bonds. Other answer could be a fixed price offer where the issuing house issues shares just below a point they expect a full subscription.<\/p>"},{"s":5,"n":52,"id":"1055609","q":"<p>If a limit order is entered onto the order book with no specific time of when to expire, if it does not execute, when will it normally be removed from the order book?<\/p>","o":[{"l":"A","h":"After 90 days"},{"l":"B","h":"End of the week"},{"l":"C","h":"End of the day"},{"l":"D","h":"After the uncrossing period"}],"a":"C","e":"<p>If no time limit is specified the limit order will expire at the end of the trading day on which the order was placed.<\/p>"},{"s":5,"n":53,"id":"1078536","q":"<p>A government bond wishing to be admitted to the main market of an exchange so that it may be traded, must be granted permission from the:<\/p>","o":[{"l":"A","h":"The central bank"},{"l":"B","h":"The listing Authority"},{"l":"C","h":"The executive body of the treasury"},{"l":"D","h":"The regulator"}],"a":"B","e":"<p>The United Kingdom Listing Authority (UKLA) makes the decisions as to which companies' shares and bonds (including gilts) can be admitted for trading on the LSE.<\/p>"},{"s":5,"n":54,"id":"4025885","q":"<p>Which is NOT on the income statement - statement of profit and loss?<\/p>","o":[{"l":"A","h":"Turnover"},{"l":"B","h":"Investment income"},{"l":"C","h":"Depreciation"},{"l":"D","h":"Cost of goods sold"}],"a":"B","e":"<p>Details the investment income (dividends and interest) that has been received in the form of cash during the year, the cash paid to purchase new non-current assets and any cash received from the sale of non-current assets and investments during the year will be shown on the cash flow statement. Under some accountancy rules income from investments can be shown on the income statement - statement of profit and loss but the official training makes no reference to this and we should always answer according to what is written in the manual<\/p>"},{"s":5,"n":55,"id":"1075027","q":"<p>When comparing a company quoted on the London Stock exchange with one that is not, the quoted company must do which of the following?<\/p>","o":[{"l":"A","h":"Produce a half yearly report"},{"l":"B","h":"Produce annual accounts"},{"l":"C","h":"Appoint directors"},{"l":"D","h":"Issue shares"}],"a":"A","e":"<p>All companies issue shares, have directors and produce annual accounts. But quoted companies also produce a half yearly report.<\/p>"},{"s":5,"n":56,"id":"4004404","q":"<p>A company, quoted on the London Stock Exchange’s Alternative Investment Market (AIM) one month ago, ceases to have a corporate broker on the 1st July. Which of the following statements is TRUE?<\/p>","o":[{"l":"A","h":"On the 1st September, if the broker has not been replaced, the company will enter CVA administration"},{"l":"B","h":"As the broker is only required for the first 30 days after the initial public offer, no further action is taken"},{"l":"C","h":"On the 1st October the matter of the broker will be referred to the UK Listing Authority"},{"l":"D","h":"If by the 31st July the broker has not been replaced the company will be removed from the exchange"}],"a":"D","e":"<p>If the company is without a broker or adviser for a period of one month it is removed from AIM.<\/p>"},{"s":5,"n":57,"id":"1054669","q":"<p>What is hedging used for?<\/p>","o":[{"l":"A","h":"To reduce risks"},{"l":"B","h":"To match buyers and sellers"},{"l":"C","h":"To reduce administration charges"},{"l":"D","h":"To buy options"}],"a":"A","e":"<p>Certain hedging techniques help to reduce risk. Hedging can be achieved through the use of derivatives.<\/p>"},{"s":5,"n":58,"id":"4062265","q":"<p>Where an investor is intending to place funds in the Chinese market, they should be aware that:<\/p>","o":[{"l":"A","h":"All types of A-shares can be purchased by overseas investors"},{"l":"B","h":"A-Shares have a fixed redemption rate"},{"l":"C","h":"H-Shares are those of mainland Chinese companies"},{"l":"D","h":"H-Shares have a fixed redemption rate"}],"a":"C","e":"<p>A-shares are traded on the mainland exchanges and are gradually being opened up to enable purchase by overseas investors. H-shares are mainland Chinese companies listed in Hong Kong and are available to, and popular with, global investors.<\/p>"},{"s":5,"n":59,"id":"1046708","q":"<p>What is the BEST description of the purpose of an underwriting syndicate with regards to an initial public offer?<\/p>","o":[{"l":"A","h":"Acts as sponsor"},{"l":"B","h":"Guarantee to buy any unsold shares under the issue"},{"l":"C","h":"Acts as sponsor, helps the company determine what type of security to issue, best offering price and time to bring it to the market"},{"l":"D","h":"Acts as sponsor and guarantees to buy any unsold shares under the issue"}],"a":"B","e":"<p>This is not to be confused with an origination team.<\/p>"},{"s":5,"n":60,"id":"1054677","q":"<p>At what percentage of share ownership would an investor be forced to make a mandatory bid?<\/p>","o":[{"l":"A","h":"10%"},{"l":"B","h":"20%"},{"l":"C","h":"30%"},{"l":"D","h":"50%"}],"a":"C","e":"<p>If a predator acquires influence 30% or more of voting rights of a company, it must make an offer for all the remaining shares of the company.<\/p>"},{"s":5,"n":61,"id":"1072569","q":"<p>Which of the following would be considered an advantage of a regional custodian over a local custodian?<\/p>","o":[{"l":"A","h":"They can offer opportunities for reciprocal business"},{"l":"B","h":"They hold a long track record, good customer base and goodwill in their region"},{"l":"C","h":"They offer custody services across multiple markets"},{"l":"D","h":"They are more in tune with the investor's needs"}],"a":"C","e":"<p>Local custodians may not be able to offer the price discounts that can be extended by regional custodians offering custody services across multiple markets.<\/p>"},{"s":5,"n":62,"id":"1078530","q":"<p>A UK company purchases 7% of shares in ABC plc industries to add to their 23% holdings. Why does the market need to be informed?<\/p>","o":[{"l":"A","h":"The listing rules state that the market must be informed at 5%"},{"l":"B","h":"So that investors can gauge the impact of the takeover"},{"l":"C","h":"So that the company can make a defence"},{"l":"D","h":"So that the company can launch a counter offer"}],"a":"B","e":"<p>Once the 30% has been crossed takeover proceedings will take place.<\/p>"},{"s":5,"n":63,"id":"1054661","q":"<p>An inter-dealer broker:-<\/p>","o":[{"l":"A","h":"May be a subsection of a broker dealer"},{"l":"B","h":"Matches market makers trades"},{"l":"C","h":"Can take principal positions"},{"l":"D","h":"Provides prices for a market maker"}],"a":"B","e":"<p>An inter-dealer broker deals between market makers to ensure that they remain anonymous. IDB's are not allowed to take principal positions (speculative positions on the market) but must settle transactions as if they were principal.<\/p>"},{"s":5,"n":64,"id":"1065035","q":"<p>What is the key factor that is considered by credit rating agencies when providing a credit rating for a company?<\/p>","o":[{"l":"A","h":"The company has sufficient assets"},{"l":"B","h":"Their cash flow generated will comfortably service and repay its debts"},{"l":"C","h":"The fees that could be gained by providing a more favourable credit rating"},{"l":"D","h":"The fees that could be at risk by providing an unfavourable rating"}],"a":"B","e":"<p>Credit rating agencies should be reviewing the companies independently of their remuneration. There is a potential conflict of interest as they are paid by the companies who wish to have a rating from them.<\/p>"},{"s":5,"n":65,"id":"1078533","q":"<p>On an order driven platform, when might a limit order to buy not achieve its limit price on execution?<\/p>","o":[{"l":"A","h":"Opening or closing part of the day"},{"l":"B","h":"During an uncrossing period following an auction"},{"l":"C","h":"If it can be matched against a better priced at best sell order"},{"l":"D","h":"If it can be matched against a better priced fill or kill sell order"}],"a":"B","e":"<p>There is no execution in the opening or closing auction. Limit order can be executed against a better price but this can only occur either during the uncrossing period or when the limit order is first entered. An at best order or fill or kill order would not remain on the system so in order to be executed against them the limit order would have to be entered before they come to the system in which case it can only execute at its limit price.<\/p>"},{"s":5,"n":66,"id":"1055548","q":"<p>Which one of the following is true for index-linked bonds?<\/p>","o":[{"l":"A","h":"Both the principal and coupon are adjusted against an inflation index"},{"l":"B","h":"Only the coupon is adjusted against an inflation index"},{"l":"C","h":"Both the principal and coupon are adjusted against an equity index"},{"l":"D","h":"Only the coupon is adjusted against an equity index"}],"a":"A","e":"<p>Due to inflation eroding the value of money, index-linked products have been introduced to protect against this by making sure that both coupon and capital are linked to an inflation index.<br/> Some bonds are linked to equity idices and are typically referred to as Equity-linked notes.<\/p>"},{"s":5,"n":67,"id":"1078861","q":"<p>Which of the following is MOST likely to issue direct commercial paper?<\/p>","o":[{"l":"A","h":"Junior market companies (AIM)"},{"l":"B","h":"Supranationals"},{"l":"C","h":"Financial companies"},{"l":"D","h":"Private equity companies"}],"a":"C","e":"<p>Larger issuers, especially finance companies, have the market presence to issue their paper directly to investors. They have frequent and sizeable borrowing needs and find it more economical to sell paper without the use of an intermediary. Their paper is called direct paper.<\/p>"},{"s":5,"n":68,"id":"4062229","q":"<p>A company has decided to carry out an IPO and has chosen to undertake a placing rather than adopt the other two main IPO methods. The reason for this choice was, in part, because the company wanted to:<\/p>","o":[{"l":"A","h":"Take the company private"},{"l":"B","h":"Implement an auction approach to bidding"},{"l":"C","h":"Avoid the need for underwriting"},{"l":"D","h":"Implement a greenshoe facility"}],"a":"C","e":"<p>Placing is the least expensive method of issuance, as the prospectus accompanying the issue is less detailed than that required for the other two methods and no underwriting is required.<\/p>"},{"s":5,"n":69,"id":"4062242","q":"<p><\/p><p>A central bank has just announced a change to its country’s interest rate.<\/p><p>This is most likely to have an immediate impact on:<\/p>","o":[{"l":"A","h":"Sovereign credit ratings"},{"l":"B","h":"Its GDP forecast"},{"l":"C","h":"Currency markets"},{"l":"D","h":"Inflation predictions"}],"a":"C","e":"<p>Sudden movements of exchange rates are the results of auctions of government securities and any changes in short-term rates announced by central banks.<\/p>"},{"s":5,"n":70,"id":"4004398","q":"<p>High frequency trading (HFT) creates which of the following risks?<\/p>","o":[{"l":"A","h":"Systemic"},{"l":"B","h":"Idiosyncratic"},{"l":"C","h":"Market"},{"l":"D","h":"Systematic"}],"a":"A","e":"<p>Although both market risk and systematic risk are given as options they are, in fact, the same. ‘Idiosyncratic’ risk is another name for ‘specific’ risk. The official manual states that, “HFT has also been criticised for the systemic risks that it can create,” so it’s the best answer here.<\/p>"},{"s":5,"n":71,"id":"1046711","q":"<p>Investors have been asked to give tender offers for an 'offer for sale'. The minimum price indicated by the company is 400, you give a bid of 600 and the highest bid is 660. The strike price is 490. What will you pay?<\/p>","o":[{"l":"A","h":"400"},{"l":"B","h":"490"},{"l":"C","h":"600"},{"l":"D","h":"660"}],"a":"B","e":"<p>In a tender offer such as this, investors will pay the same price, i.e. the strike price<\/p>"},{"s":5,"n":72,"id":"4049383","q":"<p>Which of the following is key advantage for a portfolio manager to hedge with futures?<\/p>","o":[{"l":"A","h":"It is a no cost strategy"},{"l":"B","h":"The number of contracts are easy to calculate"},{"l":"C","h":"It makes it easier to match the beta of the portfolio"},{"l":"D","h":"It leads to lower portfolio disruption"}],"a":"D","e":"<p>Hedging with futures creates an offsetting position in the portfolio reducing exposure to price volatility and reducing portfolio disruption. This is the key advantage. <\/p>"},{"s":5,"n":73,"id":"1066469","q":"<p>For issuance of securities the members of a syndicate would be:<\/p>","o":[{"l":"A","h":"an investment bank and its subsidiaries"},{"l":"B","h":"the lead manager and co-lead managers"},{"l":"C","h":"an issuing house and its competitors"},{"l":"D","h":"the lead manager, sponsor, reporting accountants, corporate broker, legal advisors and public relations"}],"a":"B","e":"<p>The sponsor will generally act as the lead manager of the syndicate, appointing a number of co-managers to assist.<\/p>"},{"s":5,"n":74,"id":"1052099","q":"<p>For which of the following reasons might the UK government issue a US dollar denominated bond?<\/p>","o":[{"l":"A","h":"To take advantage of higher interest rates in the US"},{"l":"B","h":"To gain cross-currency exposure"},{"l":"C","h":"To broaden the investor base"},{"l":"D","h":"To provide existing holders with a US opportunity"}],"a":"C","e":"<p>Issuing a dollar denominated bond is more likely to attract investment from overseas.<\/p>"},{"s":5,"n":75,"id":"1066462","q":"<p>A company performs a 1:4 rights issue at a subscription cost of £1.25 per share. The cum-rights price is £2.25 and the investor is holding 2000 shares. What is the number of rights they would need to sell to achieve maximum subscription at nil cost?<\/p>","o":[{"l":"A","h":"251"},{"l":"B","h":"278"},{"l":"C","h":"305"},{"l":"D","h":"455"}],"a":"C","e":"<p>The rights issue is a 1:4 and the shareholder has 2000 shares, so has 500 rights available.<br/> Calculate theoretical ex-rights price: 1 share @ 1.25 + 4 shares @ 2.25 =10.25. 10.25 ÷ 5 shares = £2.05 <br/> Number to be sold = (Issue price of new shares x number of rights) ÷ Theoretical ex-rights price<br/> i.e. (1.25 x 500) ÷2.05 = 305 rights<\/p>"},{"s":5,"n":76,"id":"1052097","q":"<p>A bond is trading at a 0.75% premium to its benchmark bond. The 3 month reference rate is 1.97% and the yield on benchmark bond is 2.5%. What is the spread of the bond to the reference rate?<\/p>","o":[{"l":"A","h":"325 bp"},{"l":"B","h":"272 bp"},{"l":"C","h":"200 bp"},{"l":"D","h":"128 bp"}],"a":"D","e":"<p>As the bond is trading at a premium of 0.75% over the benchmark of 2.5% its yield must be 3.25% (2.5% + 0.75%). As the reference rate is 1.97% the difference to the bond yield is 3.25% - 1.97% = 1.28% or 128bp<\/p>"},{"s":5,"n":77,"id":"1046695","q":"<p>What would measure the change in the price of a bond in relation to a change in the interest rate?<\/p>","o":[{"l":"A","h":"Convexity"},{"l":"B","h":"Return on capital employed"},{"l":"C","h":"Modified duration"},{"l":"D","h":"Dividend yield"}],"a":"C","e":"<p>Modified duration measures how much a gilt price changes given a 1% movement in interest rates. It can be used as a measure of VOLATILITY.<br/> Modified duration does not do a perfect job of predicting the change in price resulting from a change in yield. It over estimates price falls and under estimates price rises WHEN THE CHANGE IN YIELD IS LARGE. This margin of error is due to the curved, or non-linear, nature of the price yield relationship. The degree of curvature is referred to as the bond's CONVEXITY.<\/p>"},{"s":5,"n":78,"id":"1066476","q":"<p>A corporate bond's current price will mostly depend on:<\/p>","o":[{"l":"A","h":"A bench mark bond"},{"l":"B","h":"Time to maturity"},{"l":"C","h":"The internal rate of return"},{"l":"D","h":"The cash flows of the bond"}],"a":"C","e":"<p>The internal rate of return (IRR) of the bond is simply the discount rate that, when applied to the future cash flows of the bond, produces the current price of that bond.<\/p>"},{"s":5,"n":79,"id":"1066453","q":"<p>What is the motivation for a pension fund that permits its assets to be lent to a stock borrowing and lending intermediary?<\/p>","o":[{"l":"A","h":"To cover short positions"},{"l":"B","h":"To cover settlement failures"},{"l":"C","h":"To enhance returns"},{"l":"D","h":"To reduce tax liability"}],"a":"C","e":"<p>The borrower of the stock will pay the lender and this can allow the pension fund to make more money than simply holding on the asset.<\/p>"},{"s":5,"n":80,"id":"1052101","q":"<p>How many days prior to the ex-date can a UK listed share trade special ex-div?<\/p>","o":[{"l":"A","h":"Until pay date"},{"l":"B","h":"10 days"},{"l":"C","h":"Two days"},{"l":"D","h":"Until record date"}],"a":"B","e":"<p>Ex-div deals may be struck in the cum-div period ten business days before the ex-div date. Such deals are known as 'special ex-div' bargains.<\/p>"},{"s":5,"n":81,"id":"1066449","q":"<p>Which one of the following would BEST describe a reverse repo agreement?<\/p>","o":[{"l":"A","h":"It is where a market participant is short a bond and places government bonds as collateral for the loan"},{"l":"B","h":"A Government bond is sold by one market participant to another and on a non-defined date repurchases the bond at an agreed amount"},{"l":"C","h":"A Government bond is sold by one market participant to another and at a defined future date repurchases the bond at the market price on that day"},{"l":"D","h":"A Government bond is purchased by one market participant from another and at a defined future date it is sold back at a pre-agreed amount"}],"a":"D","e":"<p>A reverse repo is a purchase and resale agreement. It is legally binding for both buyer and seller. For example, a gilt reverse repo is a contract in which the buyer of gilts agrees to sell them back at a future specified time and price.<\/p>"},{"s":5,"n":82,"id":"1054667","q":"<p>Modified duration measures the:-<\/p>","o":[{"l":"A","h":"Expected change in a bonds price for a specified change in interest rates"},{"l":"B","h":"Maturity of a bond in relation to the coupon value"},{"l":"C","h":"Net Redemption Yield"},{"l":"D","h":"Errors due to the relationship between yields and prices being curved."}],"a":"A","e":"<p>Modified duration is a measure of a bonds volatility in relation to interest rates.<\/p>"},{"s":5,"n":83,"id":"4004401","q":"<p>An introduction is used by a company to:<\/p>","o":[{"l":"A","h":"gain extra liquidity"},{"l":"B","h":"raise funds"},{"l":"C","h":"prevent unwanted takeover"},{"l":"D","h":"facilitate a merger"}],"a":"A","e":"<p>An introduction is used by a company that does not need to raise extra capital through share issues, but wishes to gain the extra liquidity in its shares that a listing provides. This might be a company that is already listed on another, overseas stock exchange, a new company formed from two previously listed companies that have merged, or a demutualised organisation.<\/p>"},{"s":5,"n":84,"id":"1078125","q":"<p>Which of the following is false in relation to cryptocurrency?<\/p>","o":[{"l":"A","h":"It is digital or virtual currency that uses cryptography as a security measure"},{"l":"B","h":"Its encryption makes the currency extremely difficult to counterfeit"},{"l":"C","h":"It is heavily regulated"},{"l":"D","h":"Because of the anonymity, it can be widely exploited in money laundering"}],"a":"C","e":"<p>This type of currency is not issued or backed by a central authority, such as a central bank, which means it is untouched by the government and is therefore not currently subject to most financial regulation and supervision. There is also no consumer protection provided.<\/p>"},{"s":5,"n":85,"id":"1072577","q":"<p>Which of the following would not be found on the statement of financial position under intangible non-current assets?<\/p>","o":[{"l":"A","h":"Goodwill"},{"l":"B","h":"Capitalised development costs"},{"l":"C","h":"Work in progress"},{"l":"D","h":"Patents"}],"a":"C","e":"<p>Work in progress will be shown as a current asset.<\/p>"},{"s":5,"n":86,"id":"1065059","q":"<p>What is the settlement period for German government bonds?<\/p>","o":[{"l":"A","h":"T+1"},{"l":"B","h":"T+2"},{"l":"C","h":"T+3"},{"l":"D","h":"Same day"}],"a":"B","e":"<p>German government bonds settle T+2 since 6th Oct 2014.<\/p>"},{"s":5,"n":87,"id":"1046696","q":"<p>A firm lends out client stock, who would make the trade report?<\/p>","o":[{"l":"A","h":"It is not a reportable trade"},{"l":"B","h":"The firm"},{"l":"C","h":"It will be automatic"},{"l":"D","h":"The custodian"}],"a":"A","e":"<p>There is not enough to assume any selling has taken place so therefore it implies collateral lending and this is not a reportable trade.<\/p>"},{"s":5,"n":88,"id":"1046715","q":"<p>According to corporate governance requirements for a listed company, a company must:<\/p>","o":[{"l":"A","h":"Disclose price sensitive information"},{"l":"B","h":"Ensure that management responsibilities are shared within a firm"},{"l":"C","h":"Have a trading record of three years"},{"l":"D","h":"Produce quarterly accounts"}],"a":"B","e":"<p>Corporate governance - ensures that the directors are responsible and accountable for the running of the firm. It also ensures that the responsibilities are shared and that too much influence is not placed with one person.<br/> Reporting (ensuring that all shareholders are given an equal opportunity to access price-sensitive information) is a continuing obligation, but not covered by corporate governance.<\/p>"},{"s":5,"n":89,"id":"1055542","q":"<p>For a stock split and a bonus issue which one of the following is true?<\/p>","o":[{"l":"A","h":"Only a bonus issue will reduce the share price"},{"l":"B","h":"Only a stock split will reduce the nominal value"},{"l":"C","h":"Both will increase the market capitalisation"},{"l":"D","h":"A bonus is a capitalisation and a stock split is a consolidation"}],"a":"B","e":"<p>Both will result is a reduction in the share price. <br/> Both result in new shares being issued for free, but the resulting reduction is the share price will result in the market capitalisation remaining unchanged.<br/> A reverse stock split is know as a consolidation, not a stock split.<\/p>"},{"s":5,"n":90,"id":"1054651","q":"<p>Why do underwriters get paid a fee?<\/p>","o":[{"l":"A","h":"They provide a cash insurance payment on the issue"},{"l":"B","h":"They provide a marketing service for the firm"},{"l":"C","h":"They will buy the issue at the offer price"},{"l":"D","h":"Will buy unsold shares at a price that may be higher than their value"}],"a":"D","e":"<p>The underwriter agrees to purchase the shares at a discount to the offer price. If the share price falls on issue the agreed price may be higher than the current share value.<\/p>"},{"s":5,"n":91,"id":"1046693","q":"<p>A factory is planning some new developments. Which of the following would be recorded as a revenue expenditure?<\/p>","o":[{"l":"A","h":"Worker's wages"},{"l":"B","h":"Construction of new external lighting"},{"l":"C","h":"Extension to the existing cafeteria"},{"l":"D","h":"Installation of new plant and machinery"}],"a":"A","e":"<p>Anything that relates to the day-to-day running of the business, e.g. wages and salaries are revenue expenditure.<\/p>"},{"s":5,"n":92,"id":"1046454","q":"<p>Fabulous plc buys a new machine for a cost of £60,000. The company expects the machine to have a useful life of ten years after which it is expected to have a scrap value of £2,000. The employee operating the machine receives a salary of £12,000 per year. Calculate the value of the machine on the statement of financial position (balance sheet) at the end of the first year.<\/p>","o":[{"l":"A","h":"£55,400"},{"l":"B","h":"£54,200"},{"l":"C","h":"£5,800"},{"l":"D","h":"£4,600"}],"a":"B","e":"<p>The question is looking for the net book value (NBV) after one year. NBV = cost - accumulated depreciation<br/> Annual depreciation = (cost of asset - residual value) / useful life<br/> Therefore the salary of the employee is irrelevant.<br/> Annual depreciation = (60,000 - 2,000) / 10 = £5,800 NBV = 60,000 - 5,800 = 54,200<\/p>"},{"s":5,"n":93,"id":"1046700","q":"<p>A 3.25% corporate bond 2045, £100 NV with its coupon paid on 28 December is traded and is due to settle on 12 March. Calculate accrued interest using an actual/actual day count convention (it is not a leap year).<\/p>","o":[{"l":"A","h":"£3.25"},{"l":"B","h":"£1.62"},{"l":"C","h":"£0.81"},{"l":"D","h":"£0.66"}],"a":"D","e":"<p>There are 74 days in total; 3 days in December, 31 days in January, 28 days in February and 12 days in March. <br/> 74 ÷ 365 x 3.25 = 0.66<\/p>"},{"s":5,"n":94,"id":"1078898","q":"<p>Once the terms have been agreed between buyer and seller and the trade executes it next enters the:<\/p>","o":[{"l":"A","h":"Post settlement phase"},{"l":"B","h":"Settlement phase"},{"l":"C","h":"Netting phase"},{"l":"D","h":"Clearing phase"}],"a":"D","e":"<p>Clearing phase - as soon as a trade has been executed, a number of procedures and checks must be conducted before settlement can be completed. These include matching the trade instructions supplied by each counterparty to ensure that the details they have supplied for the trade correspond. It also involves conducting checks to ensure that the seller has sufficient securities to deliver and that the buyer has sufficient funds to cover the purchase cost.<\/p>"},{"s":5,"n":95,"id":"1047478","q":"<p>Company USR uses copper and buys a stake in a copper mining company. Two other copper mining companies already hold significant stakes in the mining company. <br/> How would Company USR's purchase be described?<\/p>","o":[{"l":"A","h":"Predatory"},{"l":"B","h":"Strategic"},{"l":"C","h":"Potential synthesis"},{"l":"D","h":"Passive"}],"a":"B","e":"<p>This is most likely a strategic transaction. The purchase could be viewed as preventing its competitors from taking total control of a supplier.<\/p>"},{"s":5,"n":96,"id":"1066452","q":"<p>When is it possible for a limit order residing on a London Stock Exchange platform to achieve a better price than its limit order?<\/p>","o":[{"l":"A","h":"If the client has given specific instructions for it to do so"},{"l":"B","h":"When the uncrossing algorithm is run at the start or end of the trading day, or during any intra day auctions"},{"l":"C","h":"It is only possible during the opening or closing auctions of the quote driven system"},{"l":"D","h":"If it is an incoming order matching another order on the order book"}],"a":"B","e":"<p>Orders residing on the order book will only achieve a better price during the opening and closing auctions or intra day auctions when the uncrossing algorithm is run. Quote driven systems do not have auction call periods followed by an uncrossing algorithm<\/p>"},{"s":5,"n":97,"id":"1055544","q":"<p>What would be the present value of a one year zero coupon bond with a nominal value of £100 if the interest rate is 5%?<\/p>","o":[{"l":"A","h":"£90.70"},{"l":"B","h":"£95.24"},{"l":"C","h":"£95.46"},{"l":"D","h":"£100"}],"a":"B","e":"<p>Discounted cash flow calculation:<br/> 100 / (1.05) = 95.24<\/p>"},{"s":5,"n":98,"id":"1054645","q":"<p>Which is true in regards to shareholders?<\/p>","o":[{"l":"A","h":"Their opinions can be followed at the directors' discretion"},{"l":"B","h":"Votes cannot be exercised by a third party"},{"l":"C","h":"If votes are unused they can be allocated by the directors"},{"l":"D","h":"Votes are proportional to the number of shares held"}],"a":"D","e":"<p>Shareholders receive votes in a ballot that are proportional to there share ownership. These votes can be exercised by a proxy if required. The directors are obliged to comply with instructions following a vote. Unused votes cannot be redistributed by directors.<\/p>"},{"s":5,"n":99,"id":"1047486","q":"<p>An investor is looking for long-term capital growth. You recommend:<\/p>","o":[{"l":"A","h":"Debentures"},{"l":"B","h":"Gilts"},{"l":"C","h":"Preference shares"},{"l":"D","h":"Ordinary shares"}],"a":"D","e":"<p>Ordinary shares would fulfil the objective of long-term capital growth. <br/> A debenture is a secured bond. Bonds and preference shares are more likely to be used where there is a requirement for income.<\/p>"},{"s":5,"n":100,"id":"1078853","q":"<p>Which of the following would offer treasury dealing services?<\/p>","o":[{"l":"A","h":"Investment banks"},{"l":"B","h":"The executive department of the treasury"},{"l":"C","h":"Custodian banks"},{"l":"D","h":"Institutional investors"}],"a":"A","e":"<p>An investment banking group provides treasury dealing for corporate clients in foreign currencies, with financial engineering services to protect them from interest rate and exchange rate fluctuations.<\/p>"}]</script>
<script>
(function(){
"use strict";
const QS = JSON.parse(document.getElementById('qdata').textContent);
const MQ = JSON.parse(document.getElementById('mdata').textContent);
const MOCKS = [...new Set(MQ.map(q=>q.s))].sort((a,b)=>a-b);
const PAGE_KEY = 'fca-securities-page';
const KEY = 'fca-securities-quiz-v1', THEME_KEY = 'fca-securities-theme';
const SECTIONS = [...new Set(QS.map(q=>q.s))].sort((a,b)=>a-b);
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state ---------- */
function blank(){ return {v:1, updatedAt:0, current:null, last:null, history:[], prefs:{n:20, order:'random', sections:[]}, mock:{current:null, last:null, history:[]}}; }
function loadLocal(){ try{ const r = localStorage.getItem(KEY); if(r){ const s = JSON.parse(r); if(s && s.v===1) return Object.assign(blank(), s); } }catch(e){} return null; }
let S = loadLocal() || blank();
let view = 'home', reviewing = false, navFilter = 'all', lastAnimPos = -1;
let page = 'quiz'; try{ if(localStorage.getItem(PAGE_KEY)==='mock' || location.hash==='#mocks') page='mock'; }catch(e){}
if(!S.mock) S.mock = {current:null,last:null,history:[]};
const M = () => page==='mock' ? S.mock : S;
const bank = a => (a && a.kind==='mock') ? MQ : QS;

function save(){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  queueRemote();
}

/* ---------- cloud sync (per-user private doc) ---------- */
let remoteRef = null, remoteTimer = null;
function setSync(on){ const el=$('#sync'); el.classList.toggle('on',!!on); el.lastElementChild.textContent = on ? 'Synchronisé' : 'Local'; el.title = on ? 'Progression sauvegardée sur ton compte (tous appareils)' : 'Progression sauvegardée dans ce navigateur'; }
function queueRemote(){
  if(!remoteRef) return;
  clearTimeout(remoteTimer);
  remoteTimer = setTimeout(pushRemote, 1200);
}
function pushRemote(){
  if(!remoteRef) return;
  clearTimeout(remoteTimer);
  remoteRef.set(JSON.parse(JSON.stringify(S))).then(()=>setSync(true)).catch(err=>{
    if(err && err.code==='invalid_argument'){ remoteRef=null; setSync(false); }
  });
}
function mergeTrack(out, l, r){
  const byId = new Map();
  [...((l&&l.history)||[]), ...((r&&r.history)||[])].forEach(h=>{ if(h && h.id) byId.set(h.id,h); });
  out.history = [...byId.values()].sort((a,b)=>b.date-a.date).slice(0,150);
  if(out.current && out.history.some(h=>h.id===out.current.id)) out.current = null; // finished elsewhere
}
function mergeStates(local, remote){
  const newer = (remote.updatedAt||0) > (local.updatedAt||0) ? remote : local;
  const out = Object.assign(blank(), JSON.parse(JSON.stringify(newer)));
  out.mock = Object.assign({current:null,last:null,history:[]}, out.mock||{});
  mergeTrack(out, local, remote);
  mergeTrack(out.mock, local.mock, remote.mock);
  out.updatedAt = Math.max(local.updatedAt||0, remote.updatedAt||0);
  return out;
}
async function initRemote(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    const ref = db.doc('data/users/'+uid+'/state');
    const snap = await ref.get();
    remoteRef = ref;
    if(snap.exists){
      const r = snap.data();
      if(r && r.v===1){
        const prevCur = M().current && M().current.id;
        S = mergeStates(S, JSON.parse(JSON.stringify(r)));
        try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
        if(view==='quiz' && !reviewing && (!M().current || M().current.id!==prevCur)) view='home';
        render();
      }
    }
    pushRemote();
  }catch(e){ remoteRef=null; setSync(false); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && remoteTimer) pushRemote(); });

/* ---------- theme ---------- */
const sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); $('#themeBtn').innerHTML = (t==='dark'? sun+'<span>Clair</span>' : moon+'<span>Sombre</span>'); }
let theme = 'dark'; try{ theme = localStorage.getItem(THEME_KEY)||'dark'; }catch(e){}
applyTheme(theme);
$('#themeBtn').onclick = ()=>{ theme = theme==='dark'?'light':'dark'; applyTheme(theme); try{ localStorage.setItem(THEME_KEY,theme);}catch(e){} };

/* ---------- helpers ---------- */
function stats(a){
  if(!a) return {n:0,answered:0,correct:0,pct:null};
  let answered=0, correct=0;
  for(let p=0;p<a.qids.length;p++){ const c=a.ans[p]; if(c!=='-'){ answered++; if(c===bank(a)[a.qids[p]].a) correct++; } }
  return {n:a.qids.length, answered, correct, pct: answered? Math.round(correct/answered*100) : null};
}
function poolFor(sections){ const set=new Set(sections); const out=[]; QS.forEach((q,i)=>{ if(!set.size || set.has(q.s)) out.push(i); }); return out; }
const CHAPTERS={1:'The Financial Services Industry',2:'Asset Classes - Equities',3:'Asset Classes - Debt Types and Features',4:'Asset Classes - Debt Valuation',5:'Asset Classes - Other Asset Classes',6:'Asset Classes - Collective Investment Schemes',7:'Primary Markets',8:'Secondary Markets',9:'Corporate Actions',10:'Clearing and Settlement',11:'Accounting Analysis',12:'Financial Statement Analysis',13:'Investment Management'};
const chName = s => CHAPTERS[s] || ('Chapitre '+s);
function sectionLabel(secs){ if(!secs || !secs.length || secs.length===SECTIONS.length) return 'Tous les chapitres'; if(secs.length===1) return 'Ch. '+secs[0]+' · '+chName(secs[0]); return 'Chapitres '+secs.slice().sort((a,b)=>a-b).join(', '); }
function fmtDate(t){ const d=new Date(t); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDur(ms){ const m=Math.round(ms/60000); if(m<1) return '< 1 min'; if(m<60) return m+' min'; return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'); }
function pillCls(p){ return p==null?'m': p>=80?'g': p>=60?'m':'r'; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function att(){ return reviewing ? M().last : M().current; }

/* ---------- modal ---------- */
function confirmBox(title, text, okLabel, onOk, danger){
  const root=$('#modalRoot');
  root.innerHTML = `<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal card"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn ghost" id="mNo">Annuler</button><button class="btn ${danger?'danger':'primary'}" id="mYes">${esc(okLabel)}</button></div></div></div>`;
  const close=()=>{ root.innerHTML=''; };
  $('#mNo').onclick=close; root.firstChild.onclick=e=>{ if(e.target===root.firstChild) close(); };
  $('#mYes').onclick=()=>{ close(); onOk(); };
  $('#mYes').focus();
}

/* ---------- header gauge ---------- */
function renderGauge(){
  const g=$('#gauge');
  const a = view==='quiz' ? att() : (view==='results' ? M().last : null);
  document.querySelectorAll('.tab').forEach(b=>{ if(b.dataset.page===page) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('#homeBtn').hidden = view==='home';
  if(!a){ g.hidden=true; measureHeader(); return; }
  g.hidden=false;
  const st=stats(a);
  $('#gPct').innerHTML = st.pct==null ? '–<small>%</small>' : st.pct+'<small>%</small>';
  const f=$('#gFill'); const w = st.pct||0; f.style.width = w+'%'; f.style.setProperty('--bgw', w>0 ? (100/w*100)+'%' : '100%');
  $('#pFill').style.width = (st.n? st.answered/st.n*100 : 0)+'%';
  $('#gProg').textContent = `${st.answered} / ${st.n} répondues`;
  $('#gCounts').innerHTML = `<span class="g"><b class="g">${st.correct}</b> justes</span><br><span class="r"><b class="r">${st.answered-st.correct}</b> fausses</span>`;
  measureHeader();
}
function measureHeader(){ document.documentElement.style.setProperty('--hh', $('#hdr').offsetHeight+'px'); }
window.addEventListener('resize', measureHeader);

/* ---------- views ---------- */
function render(){
  if(view==='quiz' && !att()) view='home';
  if(view==='results' && !M().last) view='home';
  if(view==='home') (page==='mock' ? renderMockHome() : renderHome()); else if(view==='quiz') renderQuiz(); else renderResults();
  renderGauge();
}

function renderHome(){
  reviewing=false;
  const P=S.prefs; const pool=poolFor(P.sections); const max=pool.length;
  P.n = Math.max(1, Math.min(P.n||20, max));
  const cur=S.current, cs=stats(cur);
  const hist=S.history;
  const avg = hist.length ? Math.round(hist.reduce((s,h)=>s+(h.pct||0),0)/hist.length) : null;
  const best = hist.length ? Math.max(...hist.map(h=>h.pct||0)) : null;
  const totalQ = hist.reduce((s,h)=>s+h.answered,0);
  app.innerHTML = `
  <section class="hero">
    <span class="eyebrow">Révision · Securities</span>
    <h1>Fitch competency <em>tests</em></h1>
    <p>${QS.length} questions officielles du fichier, réparties sur ${SECTIONS.length} chapitres. Choisis combien tu veux en faire et lance-toi.</p>
  </section>
  ${cur ? `<div class="card resume">
    <div class="txt"><span class="eyebrow">Tentative en cours</span>
      <h3>${cs.answered} / ${cs.n} questions répondues${cs.pct!=null?` · ${cs.pct}% de bonnes réponses`:''}</h3>
      <p>Commencée le ${fmtDate(cur.startedAt)} · ${esc(cur.label)} · reprise à la question ${cur.pos+1}</p></div>
    <div class="acts"><button class="btn primary" id="resumeBtn">Reprendre</button><button class="btn ghost" id="finishCur">Terminer et enregistrer</button></div>
  </div>`:''}
  <div class="home-grid">
    <section class="card setup">
      <span class="eyebrow">Nouveau quiz</span>
      <h2>Configure ton entraînement</h2>
      <div class="field">
        <div class="field-head"><span class="eyebrow">Nombre de questions</span><input class="num-in" id="nIn" type="number" min="1" max="${max}" value="${P.n}" aria-label="Nombre de questions"></div>
        <div class="count-big" id="nBig">${P.n}<small>sur ${max}</small></div>
        <input type="range" id="nRange" min="1" max="${max}" value="${P.n}" aria-label="Nombre de questions">
        <div class="scale"><span>1</span><span>${max}</span></div>
        <div class="presets">${[10,25,50,100].filter(v=>v<max).map(v=>`<button class="chip" data-preset="${v}">${v}</button>`).join('')}<button class="chip" data-preset="${max}">Toutes (${max})</button></div>
      </div>
      <div class="field">
        <div class="field-head"><span class="eyebrow">Chapitres inclus</span><button class="chip" data-sec="all" aria-pressed="${!P.sections.length}">Tous<span class="n">${QS.length}</span></button></div>
        <div class="chapters" id="secChips">
          ${SECTIONS.map(s=>`<button class="chap" data-sec="${s}" aria-pressed="${P.sections.includes(s)}"><span class="cn mono">${String(s).padStart(2,'0')}</span><span class="ct">${esc(chName(s))}</span><span class="cq mono">${QS.filter(q=>q.s===s).length}</span></button>`).join('')}
        </div>
        <p class="hint">Aucun chapitre coché = tous les chapitres. Coche-en un ou plusieurs pour cibler tes révisions.</p>
      </div>
      <div class="field">
        <span class="eyebrow">Ordre</span>
        <div class="seg">
          <button class="chip" data-order="random" aria-pressed="${P.order==='random'}">Aléatoire</button>
          <button class="chip" data-order="doc" aria-pressed="${P.order==='doc'}">Ordre du fichier</button>
        </div>
      </div>
      <button class="btn primary" id="startBtn" style="width:100%;padding:14px">Commencer · ${P.n} question${P.n>1?'s':''}</button>
      ${cur?'<p class="hint" style="margin-top:10px">Lancer un nouveau quiz remplacera ta tentative en cours.</p>':''}
    </section>
    <section class="card hist">
      <span class="eyebrow">Historique</span>
      <h2>Tes scores</h2>
      ${hist.length ? `
      <div class="hist-stats"><div><b>${hist.length}</b><span>Tentatives</span></div><div><b>${avg}%</b><span>Moyenne</span></div><div><b>${best}%</b><span>Meilleur</span></div></div>
      <div class="table-scroll"><table><thead><tr><th>Date</th><th>Questions</th><th>Justes</th><th>Score</th></tr></thead><tbody>
      ${hist.map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${h.answered}${h.answered<h.total?` / ${h.total}`:''}</td><td>${h.correct}</td><td class="sc"><span class="pill ${pillCls(h.pct)}">${h.pct==null?'–':h.pct+'%'}</span></td></tr>`).join('')}
      </tbody></table></div>
      <p class="hint" style="margin-top:10px">${totalQ} questions répondues au total.</p>` : `<div class="hist-empty">Aucun score pour l'instant. Termine un quiz et ton résultat s'enregistre ici automatiquement.</div>`}
    </section>
  </div>`;

  const range=$('#nRange'), nIn=$('#nIn');
  const setN=(v,from)=>{ v=Math.max(1,Math.min(max, parseInt(v,10)||1)); P.n=v; if(from!=='range') range.value=v; if(from!=='input') nIn.value=v;
    range.style.setProperty('--p', (max>1?(v-1)/(max-1)*100:100)+'%');
    $('#nBig').innerHTML = `${v}<small>sur ${max}</small>`; $('#startBtn').textContent = `Commencer · ${v} question${v>1?'s':''}`; };
  setN(P.n);
  range.oninput=()=>setN(range.value,'range');
  range.onchange=()=>save();
  nIn.oninput=()=>{ if(nIn.value!=='') setN(nIn.value,'input'); };
  nIn.onchange=()=>{ setN(nIn.value); save(); };
  app.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{ setN(b.dataset.preset); save(); });
  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.sec;
    if(v==='all') P.sections=[]; else { const s=+v; P.sections = P.sections.includes(s) ? P.sections.filter(x=>x!==s) : [...P.sections,s]; if(P.sections.length===SECTIONS.length) P.sections=[]; }
    save(); renderHome();
  });
  app.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{ P.order=b.dataset.order; save(); renderHome(); });
  $('#startBtn').onclick=()=>{ if(S.current) confirmBox('Remplacer la tentative ?','Ta tentative en cours sera abandonnée sans être enregistrée.','Nouveau quiz',startQuiz,true); else startQuiz(); };
  if(cur){ $('#resumeBtn').onclick=()=>{ view='quiz'; reviewing=false; navFilter='all'; render(); window.scrollTo(0,0); };
    $('#finishCur').onclick=()=>confirmBox('Terminer la tentative ?',`Ton score sera enregistré sur les ${cs.answered} questions répondues.`,'Terminer',finish); }
}

function startQuiz(){
  const P=S.prefs; let pool=poolFor(P.sections);
  if(P.order==='random') pool=shuffle(pool.slice()).slice(0,P.n); else pool=pool.slice(0,P.n);
  S.current={ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), startedAt: Date.now(), qids: pool, ans: '-'.repeat(pool.length), pos:0, label: sectionLabel(P.sections)+(P.order==='random'?' · aléatoire':' · ordre du fichier') };
  reviewing=false; navFilter='all'; view='quiz'; save(); render(); window.scrollTo(0,0);
}

function finish(){
  const T=M(); const a=T.current; if(!a) return;
  const st=stats(a);
  T.history.unshift({ id:a.id, date:Date.now(), total:st.n, answered:st.answered, correct:st.correct, pct:st.pct, dur:Date.now()-a.startedAt, label:a.label, mock:a.mock||null });
  T.history = T.history.slice(0,150);
  T.last = Object.assign({}, a, {finishedAt: Date.now()});
  T.current=null; reviewing=false; view='results'; save(); render(); window.scrollTo(0,0);
}

function renderQuiz(){
  const a=att(); const n=a.qids.length; const p=a.pos; const B=bank(a); const q=B[a.qids[p]]; const chosen=a.ans[p]; const done=chosen!=='-';
  const st=stats(a);
  const correctOpt=q.o.find(o=>o.l===q.a);
  const plain = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/\s+/g,' ').trim(); };
  const cells = a.qids.map((qi,i)=>{ const c=a.ans[i]; const cls = c==='-'?'': (c===B[qi].a?'g':'r');
      if(navFilter==='wrong' && cls!=='r') return ''; if(navFilter==='todo' && c!=='-') return '';
      return `<button class="cell ${cls} ${i===p?'cur':''}" data-go="${i}" aria-label="Question ${i+1}${cls==='g'?', juste':cls==='r'?', fausse':''}">${i+1}</button>`; }).join('');
  const unanswered = n-st.answered;
  app.innerHTML = `
  <div class="quiz">
    <article class="card qcard" id="qcard">
      <div class="qmeta">
        <span class="qnum">Question ${p+1}<small> / ${n}</small></span>
        <span class="tag">${a.kind==='mock' ? 'Mock exam '+q.s+' · Q'+q.n : 'Ch. '+q.s+' · '+esc(chName(q.s))+' · Q'+q.n}</span><span class="tag">[${esc(q.id)}]</span>
        ${reviewing?'<span class="review-banner">Mode revue</span>':''}
      </div>
      <div class="stem">${q.q}</div>
      <div class="opts">
        ${q.o.map(o=>{ let cls='', ico='';
          if(done){ if(o.l===q.a){cls='ok';ico='✓';} else if(o.l===chosen){cls='ko';ico='✕';} else cls='dim'; }
          return `<button class="opt ${cls} ${cls==='ko'&&lastAnimPos===p?'anim':''}" data-l="${o.l}" ${done||reviewing?'disabled':''}><span class="L">${o.l}</span><span class="T">${o.h}</span><span class="ico">${ico}</span></button>`; }).join('')}
      </div>
      ${done ? `<div class="expl">
        <div class="verdict ${chosen===q.a?'g':'r'}">${chosen===q.a?'✓ Bonne réponse':'✕ Mauvaise réponse — tu as choisi '+chosen}</div>
        <p class="ans-line">The correct answer is: <strong>${q.a}</strong> - ${esc(plain(correctOpt.h))}</p>
        <h4>Explanation</h4>
        <div class="expl-body">${q.e && q.e.trim() ? q.e : '<p class="none">Aucune explication dans le fichier source pour cette question.</p>'}</div>
      </div>` : (reviewing ? `<div class="expl"><p class="ans-line">Non répondue. The correct answer is: <strong>${q.a}</strong> - ${esc(plain(correctOpt.h))}</p><h4>Explanation</h4><div class="expl-body">${q.e && q.e.trim()?q.e:'<p class="none">Aucune explication dans le fichier source pour cette question.</p>'}</div></div>`:'')}
      <div class="qfoot">
        <button class="btn" id="prevBtn" ${p===0?'disabled':''}>← Précédente</button>
        <button class="btn ${done&&p<n-1?'primary':''}" id="nextBtn" ${p===n-1?'disabled':''}>Suivante →</button>
        <span class="sp"></span>
        ${!reviewing && done && p===n-1 && unanswered===0 ? '<button class="btn primary" id="finishBtn2">Voir mon résultat</button>' : ''}
        <span class="kbd">Raccourcis : A–D ou 1–4 · ← →</span>
      </div>
    </article>
    <aside class="card navp" aria-label="Navigation des questions">
      <div class="navp-head"><h3>Questions</h3><span class="mono" style="font-size:12px;color:var(--muted)">${st.answered}/${n}</span></div>
      <div class="legend"><span class="g"><i></i>Juste</span><span class="r"><i></i>Fausse</span><span><i></i>Non répondue</span></div>
      <div class="chips">
        <button class="chip" data-nf="all" aria-pressed="${navFilter==='all'}">Toutes</button>
        <button class="chip" data-nf="wrong" aria-pressed="${navFilter==='wrong'}">Fausses<span class="n">${st.answered-st.correct}</span></button>
        <button class="chip" data-nf="todo" aria-pressed="${navFilter==='todo'}">À faire<span class="n">${unanswered}</span></button>
      </div>
      <div class="grid" id="grid">${cells || '<div class="empty-filter">Rien ici.</div>'}</div>
      ${reviewing ? '<button class="btn finish" id="backRes">Retour au résultat</button>' : `<button class="btn ${unanswered===0?'primary':''} finish" id="finishBtn">${unanswered===0?'Voir mon résultat':(a.kind==='mock'?'Terminer le mock':'Terminer le quiz')}</button>`}
    </aside>
  </div>`;
  lastAnimPos=-1;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.l));
  $('#prevBtn').onclick=()=>go(p-1);
  $('#nextBtn').onclick=()=>go(p+1);
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go, true));
  app.querySelectorAll('[data-nf]').forEach(b=>b.onclick=()=>{ navFilter=b.dataset.nf; renderQuiz(); });
  const fb=()=>{ if(unanswered>0) confirmBox('Terminer maintenant ?',`Il reste ${unanswered} question${unanswered>1?'s':''} sans réponse. Ton score sera calculé sur les ${st.answered} répondues et enregistré.`,'Terminer et enregistrer',finish); else finish(); };
  if($('#finishBtn')) $('#finishBtn').onclick=fb;
  if($('#finishBtn2')) $('#finishBtn2').onclick=fb;
  if($('#backRes')) $('#backRes').onclick=()=>{ reviewing=false; view='results'; render(); window.scrollTo(0,0); };
  const curCell=app.querySelector('.cell.cur'); const grid=$('#grid');
  if(curCell && grid.scrollHeight>grid.clientHeight){ const top=curCell.offsetTop-grid.offsetTop; if(top<grid.scrollTop || top>grid.scrollTop+grid.clientHeight-40) grid.scrollTop=top-grid.clientHeight/2; }
}

function choose(l){
  const a=M().current; if(!a || reviewing) return;
  const p=a.pos; if(a.ans[p]!=='-') return;
  a.ans = a.ans.slice(0,p)+l+a.ans.slice(p+1);
  if(l!==bank(a)[a.qids[p]].a) lastAnimPos=p;
  save(); renderQuiz(); renderGauge();
  const ex=app.querySelector('.expl'); if(ex){ const r=ex.getBoundingClientRect(); if(r.top>window.innerHeight-80) ex.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'}); }
}
function go(i, fromGrid){
  const a=att(); if(!a) return; i=Math.max(0,Math.min(a.qids.length-1,i)); if(i===a.pos) return;
  a.pos=i; if(!reviewing) save(); renderQuiz();
  const qc=$('#qcard'); const r=qc.getBoundingClientRect(); const hh=$('#hdr').offsetHeight;
  if(r.top<hh || fromGrid && r.top>window.innerHeight*0.5) qc.scrollIntoView({block:'start'});
}

function renderResults(){
  const T=M(); const a=T.last; const st=stats(a); const h=T.history.find(x=>x.id===a.id);
  const pct=st.pct||0; const C=2*Math.PI*64;
  const col = st.pct==null?'var(--muted)': pct>=80?'var(--good)': pct>=60?'var(--accent)':'var(--bad)';
  const msg = st.pct==null ? 'Aucune question répondue.' : pct>=80 ? 'Très solide. Continue comme ça.' : pct>=60 ? 'Pas mal, il reste quelques points à revoir.' : 'Repasse sur tes erreurs avant de relancer.';
  app.innerHTML = `
  <section class="card results">
    <div class="res-top">
      <div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="75" cy="75" r="64" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg><div class="v">${st.pct==null?'–':pct+'%'}</div></div>
      <div style="flex:1 1 240px;min-width:0"><span class="eyebrow">Résultat · ${esc(a.label)}</span><h2>${st.correct} bonne${st.correct>1?'s':''} réponse${st.correct>1?'s':''} sur ${st.answered}</h2><p>${msg}</p><p class="saved" style="margin-top:8px">✓ Score enregistré dans ton historique</p></div>
    </div>
    <div class="res-stats">
      <div><b>${st.n}</b><span>Questions</span></div>
      <div><b>${st.answered}</b><span>Répondues</span></div>
      <div><b style="color:var(--good)">${st.correct}</b><span>Justes</span></div>
      <div><b style="color:var(--bad)">${st.answered-st.correct}</b><span>Fausses</span></div>
      <div><b>${h?fmtDur(h.dur):'–'}</b><span>Durée</span></div>
    </div>
    <div class="res-acts">
      <button class="btn primary" id="revWrong" ${st.answered-st.correct===0?'disabled':''}>Revoir mes erreurs</button>
      <button class="btn" id="revAll">Revoir toute la tentative</button>
      <button class="btn ghost" id="newQ">${a.kind==='mock'?'Retour aux mocks':'Nouveau quiz'}</button>
    </div>
  </section>`;
  const rev=(f)=>{ reviewing=true; navFilter=f; view='quiz';
    if(f==='wrong'){ const i=a.qids.findIndex((qi,k)=>a.ans[k]!=='-' && a.ans[k]!==bank(a)[qi].a); if(i>=0) a.pos=i; } else a.pos=0;
    render(); window.scrollTo(0,0); };
  $('#revWrong').onclick=()=>rev('wrong');
  $('#revAll').onclick=()=>rev('all');
  $('#newQ').onclick=()=>{ view='home'; render(); window.scrollTo(0,0); };
}

/* ---------- global ---------- */
$('#brand').onclick=$('#homeBtn').onclick=()=>{ reviewing=false; view='home'; render(); window.scrollTo(0,0); };
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ setPage(b.dataset.page); });
function setPage(p){ page=p; try{ localStorage.setItem(PAGE_KEY,p); }catch(e){} reviewing=false; navFilter='all'; view='home'; render(); window.scrollTo(0,0); }

/* ---------- mock exams ---------- */
function mockStats(k){
  const hs=S.mock.history.filter(h=>h.mock===k);
  return { n:hs.length, best: hs.length? Math.max(...hs.map(h=>h.pct||0)) : null, last: hs.length? hs[0].pct : null };
}
function startMock(k){
  const qids=[]; MQ.forEach((q,i)=>{ if(q.s===k) qids.push(i); });
  qids.sort((x,y)=>MQ[x].n-MQ[y].n);
  S.mock.current={ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), kind:'mock', mock:k, startedAt: Date.now(), qids, ans:'-'.repeat(qids.length), pos:0, label:'Mock exam '+k };
  reviewing=false; navFilter='all'; view='quiz'; save(); render(); window.scrollTo(0,0);
}
function renderMockHome(){
  reviewing=false;
  const cur=S.mock.current, cs=stats(cur);
  const hist=S.mock.history;
  const avg = hist.length ? Math.round(hist.reduce((s,h)=>s+(h.pct||0),0)/hist.length) : null;
  const best = hist.length ? Math.max(...hist.map(h=>h.pct||0)) : null;
  app.innerHTML = `
  <section class="hero">
    <span class="eyebrow">Examens blancs · Securities</span>
    <h1>Practice <em>mock exams</em></h1>
    <p>${MOCKS.length} examens de ${MQ.filter(q=>q.s===MOCKS[0]).length} questions, dans l'ordre du fichier, avec correction et explication après chaque réponse. Un seul mock à la fois : termine celui en cours avant d'en commencer un autre.</p>
  </section>
  ${cur ? `<div class="card resume">
    <div class="txt"><span class="eyebrow">Mock en cours</span>
      <h3>${esc(cur.label)} · ${cs.answered} / ${cs.n} répondues${cs.pct!=null?` · ${cs.pct}% de bonnes réponses`:''}</h3>
      <p>Commencé le ${fmtDate(cur.startedAt)} · reprise à la question ${cur.pos+1}</p></div>
    <div class="acts"><button class="btn primary" id="resumeBtn">Reprendre</button><button class="btn ghost" id="finishCur">Terminer et enregistrer</button></div>
  </div>`:''}
  <div class="mocks">
    ${MOCKS.map(k=>{ const ms=mockStats(k); const live=cur && cur.mock===k; const locked=cur && !live;
      const n=MQ.filter(q=>q.s===k).length;
      return `<article class="card mock ${live?'live':''}">
        <div class="mock-t"><span class="mock-n">${String(k).padStart(2,'0')}</span>
          ${live?`<span class="status live">En cours</span>`: ms.n?`<span class="status done">Fait ×${ms.n}</span>`:`<span class="status new">Jamais fait</span>`}</div>
        <div><h3>Mock exam ${k}</h3><span class="sub">${n} questions</span></div>
        ${live?`<div class="mini" aria-label="Progression"><i style="width:${cs.answered/cs.n*100}%"></i></div>`:''}
        <dl><div><dt>Record</dt><dd>${ms.best==null?'–':ms.best+'%'}</dd></div><div><dt>Dernier</dt><dd>${ms.last==null?'–':ms.last+'%'}</dd></div><div><dt>Essais</dt><dd>${ms.n}</dd></div></dl>
        <button class="btn ${live||!cur?'primary':''}" data-mock="${k}" ${locked?'disabled':''}>${live?'Reprendre':(ms.n?'Refaire':'Commencer')}</button>
        ${locked?`<p class="lock">Termine le Mock ${cur.mock} d'abord</p>`:''}
      </article>`; }).join('')}
  </div>
  <section class="card hist">
    <span class="eyebrow">Historique</span>
    <h2>Tes scores aux mocks</h2>
    ${hist.length ? `
    <div class="hist-stats"><div><b>${hist.length}</b><span>Mocks faits</span></div><div><b>${avg}%</b><span>Moyenne</span></div><div><b>${best}%</b><span>Meilleur</span></div></div>
    <div class="table-scroll"><table><thead><tr><th>Mock</th><th>Date</th><th>Répondues</th><th>Justes</th><th>Durée</th><th>Score</th></tr></thead><tbody>
    ${hist.map(h=>`<tr><td>Mock ${h.mock}</td><td>${fmtDate(h.date)}</td><td>${h.answered} / ${h.total}</td><td>${h.correct}</td><td>${fmtDur(h.dur)}</td><td class="sc"><span class="pill ${pillCls(h.pct)}">${h.pct==null?'–':h.pct+'%'}</span></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="hist-empty">Aucun mock terminé pour l'instant. Ton score s'enregistre ici à la fin de chaque mock.</div>`}
  </section>`;
  app.querySelectorAll('[data-mock]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.mock;
    if(cur && cur.mock===k){ view='quiz'; navFilter='all'; render(); window.scrollTo(0,0); }
    else if(!cur) startMock(k); });
  if(cur){ $('#resumeBtn').onclick=()=>{ view='quiz'; reviewing=false; navFilter='all'; render(); window.scrollTo(0,0); };
    $('#finishCur').onclick=()=>confirmBox('Terminer le mock ?',`Ton score sera enregistré sur les ${cs.answered} questions répondues.`,'Terminer',finish); }
}
document.addEventListener('keydown',e=>{
  if(view!=='quiz' || $('#modalRoot').firstChild) return;
  if(e.target.matches('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k=e.key.toUpperCase(); const map={'1':'A','2':'B','3':'C','4':'D'};
  const a=att(); if(!a) return;
  if('ABCD'.includes(k) && k.length===1){ choose(k); }
  else if(map[k]) choose(map[k]);
  else if(e.key==='ArrowRight'){ go(a.pos+1); }
  else if(e.key==='ArrowLeft'){ go(a.pos-1); }
});

render();
initRemote();
})();
</script>

</body>
</html>
