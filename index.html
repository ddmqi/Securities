ies?<\/p>","o":[{"l":"A","h":"Agent with the market maker and agent with the fund manager"},{"l":"B","h":"Agent with the market maker and principal with the fund manager"},{"l":"C","h":"Principal with the market maker and agent with the fund manager"},{"l":"D","h":"Principal with the market maker and principal with the fund manager"}],"a":"A","e":"<p>The SBLI acts as intermediary with both parties.<\/p>"},{"s":10,"n":17,"id":"1015678","q":"<p>What is the standard settlement for UK corporate bonds in CREST after the trade?<\/p>","o":[{"l":"A","h":"Two business days"},{"l":"B","h":"Three business days"},{"l":"C","h":"Four business days"},{"l":"D","h":"Five business days"}],"a":"A","e":"<p>UK Government bonds are T+1 but corporate bonds are T+2.<\/p>"},{"s":10,"n":18,"id":"1001870","q":"<p>Which of the following always describes the status of the person whose name is on the shareholder register?<\/p>","o":[{"l":"A","h":"Beneficial owner"},{"l":"B","h":"Legal owner"},{"l":"C","h":"Custodian"},{"l":"D","h":"Nominee"}],"a":"B","e":"<p>The person named on the register is the LEGAL owner of the shares.<\/p>"},{"s":10,"n":19,"id":"1001287","q":"<p>Which one of the following is the normal settlement convention for a Japanese government bond?<\/p>","o":[{"l":"A","h":"Two weeks rolling"},{"l":"B","h":"T+3"},{"l":"C","h":"T+2"},{"l":"D","h":"T+1"}],"a":"D","e":"<p>All long-term Japanese government bonds now settle T+1, as do gilts and the US T-bonds.<\/p>"},{"s":10,"n":20,"id":"1015573","q":"<p>All of the following are true of the impact continuous-linked settlement has had on the foreign exchange market EXCEPT:<\/p>","o":[{"l":"A","h":"CLS enables settlement on a payment by payment basis"},{"l":"B","h":"CLS removes Herstatt risk"},{"l":"C","h":"CLS is available to settlement members"},{"l":"D","h":"CLS settlement members pay and receive gross via central banks"}],"a":"D","e":"<p>CLS payments are generally made on a net basis.<\/p>"},{"s":10,"n":21,"id":"1002027","q":"<p>What do spot foreign exchange trades settle?<\/p>","o":[{"l":"A","h":"T+1"},{"l":"B","h":"T+2"},{"l":"C","h":"T+3"},{"l":"D","h":"T+5"}],"a":"B","e":"<p>Spot trades in the FX market settle T+2.<\/p>"},{"s":10,"n":22,"id":"1002112","q":"<p>Which of the following helps to eliminate Herstatt risk?<\/p>","o":[{"l":"A","h":"TRAX"},{"l":"B","h":"Euroclear"},{"l":"C","h":"CLS"},{"l":"D","h":"LCH.Clearnet"}],"a":"C","e":"<p>The CLS bank operates a net settlement system for FX trades, reducing the risk of settlement failures.<\/p>"},{"s":10,"n":23,"id":"1053870","q":"<p>An investor is considering the most cost-effective way of registering his shares. Which of the following would BEST meet his objective?<\/p>","o":[{"l":"A","h":"An omnibus account"},{"l":"B","h":"A designated nominee account"},{"l":"C","h":"A sole nominee account"},{"l":"D","h":"A segregated account"}],"a":"A","e":"<p>An omnibus (also known as pooled) nominee is one where individual clients are grouped together within a single nominee registration and is more cost effective than designated or sole nominees.<\/p>"},{"s":10,"n":24,"id":"1039384","q":"<p>A special ex-bargain allows an investor to:<\/p>","o":[{"l":"A","h":"Trade ex-dividend where the buyer gains the right to the dividend"},{"l":"B","h":"Trade off the order book but retain the services of a central counterparty"},{"l":"C","h":"Trade a listed company on a dark pool platform to obtain a better price"},{"l":"D","h":"Trade cum-dividend where the seller retains the right to the dividend"}],"a":"D","e":"<p>A special ex-bargain allows the investor to perform a trade in the cum-dividend period (where the buyer is entitled to the dividend), but strip the dividend from the share making it ex-dividend (out of dividend). Essentially, the seller keeps the rights to the next dividend and the buyer, having given-up this right, can buy the share more cheaply.<\/p>"},{"s":10,"n":25,"id":"1078904","q":"<p>In a stock borrowing and lending agreement which of the following is borrower not obligated to pass back to the lender?<\/p>","o":[{"l":"A","h":"Cash dividend"},{"l":"B","h":"Rights issues"},{"l":"C","h":"Voting rights"},{"l":"D","h":"Scrip dividends"}],"a":"C","e":"<p>If the lender wants to exercise its right to vote, they should recall the stock in good time so that a proxy voting form can be completed and returned to the registrar by the required deadline. Issues involved in other corporate actions such as capitalisation issues and the consequences arising from any corporate action by the issuer of a security, such as a rights issue, when that security has been lent to another would, prima facie, be to the benefit/cost of the borrower. Under the terms of the loan, it is customary that these costs/benefits flow back to the lender, and the exact manner in which this is implemented should be reflected in the securities lending agreement.<\/p>"},{"s":10,"n":26,"id":"1078902","q":"<p>An investor wishes their broker to arrange a special-ex trade, which of the following would explain their motivation?<\/p>","o":[{"l":"A","h":"They wish to avoid additional income tax"},{"l":"B","h":"They wish to receive the dividend even though they are not entitled"},{"l":"C","h":"They wish to lower their exposure to capital gains tax"},{"l":"D","h":"They wish to reward to seller for making the process of buying straight forward"}],"a":"A","e":"<p>The motivation for investors buying without the dividend entitlement tends to be related to tax. Dividend income is normally subject to income tax, so selling the right to the dividend may avoid some income tax.<\/p>"},{"s":10,"n":27,"id":"1001976","q":"<p>Which of the following is usually a bearer instrument?<\/p>","o":[{"l":"A","h":"Treasury bonds"},{"l":"B","h":"Eurobonds"},{"l":"C","h":"Gilts"},{"l":"D","h":"Equities"}],"a":"B","e":"<p>Eurobonds are usually bearer.<\/p>"},{"s":10,"n":28,"id":"1001311","q":"<p>When is standard settlement of gilts?<\/p>","o":[{"l":"A","h":"Same day"},{"l":"B","h":"24 hours"},{"l":"C","h":"48 hours"},{"l":"D","h":"72 hours"}],"a":"B","e":"<p>Gilt settlement is T+1.<\/p>"},{"s":10,"n":29,"id":"1050871","q":"<p>Under instructions from an issuing company that shareholders with a particular sized share holding must be held with a nominee company, which of the following would allow an investor to mandate dividends to a particular bank account?<\/p>","o":[{"l":"A","h":"Omnibus"},{"l":"B","h":"Designated"},{"l":"C","h":"Pooled"},{"l":"D","h":"Share register"}],"a":"B","e":"<p>A reason for registering shares in a designated or sole nominee name would be if the underlying investor requires dividends to be mandated to a particular bank account, rather than being collected by the custodian. Then registration in an omnibus / pooled account is not practicable.<\/p>"},{"s":10,"n":30,"id":"1001188","q":"<p>Who is the beneficial owner of stock in a stock loan situation?<\/p>","o":[{"l":"A","h":"The lender of the stock"},{"l":"B","h":"The stock borrowing and lending intermediary"},{"l":"C","h":"The borrowing market maker who has sold short to the principal trader"},{"l":"D","h":"The principal trader"}],"a":"D","e":"<p>In a stock borrowing situation, all rights of ownership pass from lender to borrower for the period of the loan. Hence, the end user of the stock (the principal trader who bought stock from the market maker) will gain the beneficial rights. (Despite this, in reality the borrowing market maker will make good any rights lost by the lender via the stock loan agreement).<\/p>"},{"s":10,"n":31,"id":"1008015","q":"<p>Which of the following best describes a one-stop banking service for clients that are hedge funds?<\/p>","o":[{"l":"A","h":"Global custody"},{"l":"B","h":"Global settlement"},{"l":"C","h":"Prime brokerage"},{"l":"D","h":"Floor brokerage"}],"a":"C","e":"<p>Prime Brokers are a one-stop clearing, settlement, securities financing and custody service, commonly used by hedge funds.<\/p>"},{"s":10,"n":32,"id":"1001804","q":"<p>What is the settlement time for German equity trades settling through Clearstream?<\/p>","o":[{"l":"A","h":"T+1"},{"l":"B","h":"T+2"},{"l":"C","h":"T+3"},{"l":"D","h":"T+4"}],"a":"B","e":"<p>German equities settle on a T+2 basis.<\/p>"},{"s":10,"n":33,"id":"1001960","q":"<p>What is the settlement period for OATs?<\/p>","o":[{"l":"A","h":"T+1"},{"l":"B","h":"T+2"},{"l":"C","h":"T+3"},{"l":"D","h":"Month end"}],"a":"B","e":"<p>French government bonds (OATs) settle T + 2<\/p>"},{"s":10,"n":34,"id":"1065034","q":"<p>Which of the below is not a typical service offered by prime brokerage?<\/p>","o":[{"l":"A","h":"Custody"},{"l":"B","h":"Stock lending"},{"l":"C","h":"Advice"},{"l":"D","h":"Settlement"}],"a":"C","e":"<p>All others are mentioned in the workbook as typical services. In addition to these the list also includes leveraged trade execution, cash management, re-hypothecation.<\/p>"},{"s":10,"n":35,"id":"1015625","q":"<p>Special cum-bargains in equities are permitted:<\/p>","o":[{"l":"A","h":"All year"},{"l":"B","h":"Up to the day before payment day"},{"l":"C","h":"Up to books closed day"},{"l":"D","h":"Up to three weeks, following the ex-div date"}],"a":"B","e":"<p>A share can trade special cum up to but not including the dividend payment date.<\/p>"},{"s":10,"n":36,"id":"1007636","q":"<p>The 'safekeeping and administration of a client's assets' best describes which of the following?<\/p>","o":[{"l":"A","h":"Global custody"},{"l":"B","h":"Global settlement"},{"l":"C","h":"Prime brokerage"},{"l":"D","h":"Asset management"}],"a":"A","e":"<p>This is the definition used by the FCA.<\/p>"},{"s":10,"n":37,"id":"1052050","q":"<p>A trade takes place on 4 April, the ex-div date is 6 April. Settlement takes place after the record date. When the dividend is made, who would issue the claim?<\/p>","o":[{"l":"A","h":"Seller's broker"},{"l":"B","h":"Buyer's broker"},{"l":"C","h":"The company registrar would have been fed this information from CREST and a claim would not be required as legal ownership on payment date is known"},{"l":"D","h":"The market maker who facilitated the trade"}],"a":"B","e":"<p>In a claim the seller receives and the buyer is entitled; the buyer's broker will make the claim.<\/p>"},{"s":10,"n":38,"id":"1007609","q":"<p>Which of the following is not a custody service?<\/p>","o":[{"l":"A","h":"Safekeeping"},{"l":"B","h":"Reporting on corporate actions"},{"l":"C","h":"Providing proxy voting"},{"l":"D","h":"Trade comparison/matching with the counterparty"}],"a":"D","e":"<p>Trade comparison/matching is a part of the validation of the trade process.<\/p>"},{"s":10,"n":39,"id":"1015572","q":"<p>A nominee holder of shares is all of the following, EXCEPT:<\/p>","o":[{"l":"A","h":"Beneficial owner"},{"l":"B","h":"Entitled to vote"},{"l":"C","h":"Recipient of dividend"},{"l":"D","h":"Legal owner"}],"a":"A","e":"<p>The nominee is not the beneficial holder of the shares as it is holding the shares on behalf of someone else; however, it is the legal owner.<\/p>"},{"s":10,"n":40,"id":"1055480","q":"<p>What is the normal standard settlement period in developed markets globally?<\/p>","o":[{"l":"A","h":"T+0"},{"l":"B","h":"T+1"},{"l":"C","h":"T+2"},{"l":"D","h":"No standard as it is determined by the contract specifications"}],"a":"C","e":"<p>Standard settlement for most developed markets is now T+2<\/p><p>Notable exceptions are:<\/p><p>Gilts, T-Bonds and JGBs all of which are T+1.<\/p><p>Repo and securities lending can be done on a T+0 basis.<\/p><p>Certificated stocks settle on a T+10 basis (in the UK)<\/p><p> <\/p>"},{"s":10,"n":41,"id":"1001716","q":"<p>Which of the following is responsible for coordinating foreign currency settlement on behalf of its members between the Bank of England and the Bank of Japan?<\/p>","o":[{"l":"A","h":"DVP"},{"l":"B","h":"CLS"},{"l":"C","h":"CREST"},{"l":"D","h":"BACS"}],"a":"B","e":"<p>This is the function of the CLS bank in New York.<\/p>"},{"s":10,"n":42,"id":"1016239","q":"<p>How would an international bank avoid settlement risk on a foreign exchange transaction?<\/p>","o":[{"l":"A","h":"Payment vs. payment"},{"l":"B","h":"CHAPS"},{"l":"C","h":"CREST"},{"l":"D","h":"Delivery by value"}],"a":"A","e":"<p>Payment vs. payment is the method of settlement used by the continuous-linked settlement (CLS) bank. CHAPS is the system used to make these payments via the Bank of England.<\/p>"},{"s":11,"n":1,"id":"1001784","q":"<p>Which of the following reserves can a company use to pay a dividend to shareholders?<\/p>","o":[{"l":"A","h":"Revaluation reserve"},{"l":"B","h":"Capital redemption reserve"},{"l":"C","h":"Profit and loss reserve"},{"l":"D","h":"Share premium account reserve"}],"a":"C","e":"<p>Dividends can only be paid-out of distributable profits: i.e. the profit and loss reserve.<\/p>"},{"s":11,"n":2,"id":"1014265","q":"<p>Which of the following items would be found in a cash flow statement?<\/p>","o":[{"l":"A","h":"Receivables"},{"l":"B","h":"Depreciation"},{"l":"C","h":"Cost of goods sold"},{"l":"D","h":"Equity dividends paid"}],"a":"D","e":"<p>Receivables and depreciation are balance sheet items. Cost of goods sold is an income statement item. Dividends paid is a cash expense and is a part of CF from financing.<\/p><p>Note: when the exam asks about the cash flow statement, they are referring to the direct method of cash flows. <\/p>"},{"s":11,"n":3,"id":"1026885","q":"<p>Which one of the following would be classified as capital expenditure?<\/p>","o":[{"l":"A","h":"The purchase of computers for new work premises"},{"l":"B","h":"Administration costs in relation to the upkeep of the computers"},{"l":"C","h":"Repair costs incurred in relation to the computers"},{"l":"D","h":"The purchase of inexpensive accessories for the computers"}],"a":"A","e":"<p>This is a tricky question that goes slightly outside of the syllabus and may well have been a 'trial' question. The purchase of computers for new work premises would be capitalised. <br/> Answers 'administration costs in relation to the upkeep of the computers' and 'repair costs incurred in relation to the computers' can not be capitalised and are expensed in the income statement instead. The cost of inexpensive accessories is also likely to be expensed as well.<br/> 'The purchase of computers for new work premises' is the correct answer.<\/p>"},{"s":11,"n":4,"id":"1014262","q":"<p>Which of the following is not a heading in the cash flow statement?<\/p>","o":[{"l":"A","h":"Net cash inflow from operating activities"},{"l":"B","h":"Dividends paid and proposed"},{"l":"C","h":"Equity dividends paid"},{"l":"D","h":"Increase (decrease) in short-term debt"}],"a":"B","e":"<p>Dividends paid and proposed, it is the proposed part of this statement which makes this incorrect<\/p>"},{"s":11,"n":5,"id":"1014266","q":"<p>A dividend can be paid with which of the following:<\/p>","o":[{"l":"A","h":"Revaluation reserve"},{"l":"B","h":"Share premium"},{"l":"C","h":"Profit and loss reserve"},{"l":"D","h":"Capital redemption reserve"}],"a":"C","e":"<p>The profit and loss reserve is the only distributable reserve.<\/p>"},{"s":11,"n":6,"id":"1067799","q":"<p>A large organisation is using publicly available third party research to help make investment decisions. Why might this be seen in an unfavourable context?<\/p>","o":[{"l":"A","h":"The chance of bias"},{"l":"B","h":"It is historical data"},{"l":"C","h":"Lack of depth and quality of the data sample"},{"l":"D","h":"Lack of ability to update the data"}],"a":"A","e":"<p>When using third party research or recommendations, the possibility of bias or lack of objectivity should always be considered.<\/p>"},{"s":11,"n":7,"id":"1015568","q":"<p>All of the following are current assets, except:<\/p>","o":[{"l":"A","h":"Stock"},{"l":"B","h":"Provisions"},{"l":"C","h":"Prepayments"},{"l":"D","h":"Receivables"}],"a":"B","e":"<p>Provisions are included in the liabilities of the company.<\/p>"},{"s":11,"n":8,"id":"1001376","q":"<p>All of the following are intangible non-current assets except:<\/p>","o":[{"l":"A","h":"Goodwill"},{"l":"B","h":"Brands"},{"l":"C","h":"Development costs"},{"l":"D","h":"Share premium"}],"a":"D","e":"<p>Share premium forms part of shareholders' funds. Development costs, such as the cost of developing a new body shape for a car, is often expensed. However, it is possible in some situations to capitalise it and amortise the cost over time. The cost will be capitalised as an intangible asset.<\/p>"},{"s":11,"n":9,"id":"1014259","q":"<p>The shares of a plc stand at a 50% premium to net asset value per share. The company has 100m shares and the share price is 220p. What are the net assets?<\/p>","o":[{"l":"A","h":"£73.5m"},{"l":"B","h":"£440m"},{"l":"C","h":"£110m"},{"l":"D","h":"£146.7m"}],"a":"D","e":"<p>If the share is trading at a 50% premium to NAV, it must be worth 150% of NAV. <br/> To get 100% of NAV, we need to divide by 150 (to get 1%) and multiply by 100 (to get 100%).<br/> NAV per share = 220 / 150 x 100 = 146.7<br/> Total NAV = £1.467 x 100m shares = £146.7m.<\/p>"},{"s":11,"n":10,"id":"1002142","q":"<p>Turnover less cost of sales less distribution costs less administration expenses equals:<\/p>","o":[{"l":"A","h":"Profit before tax"},{"l":"B","h":"Gross income"},{"l":"C","h":"Operating profit"},{"l":"D","h":"Distributable earnings"}],"a":"C","e":"<p>Note that operating profit is also known as 'trading profit' or 'PBIT' - profit before interest and tax.<\/p>"},{"s":11,"n":11,"id":"1002189","q":"<p>What is the effect of 'capitalisation' of expenditure on the statement of financial position?<\/p>","o":[{"l":"A","h":"Cash decreases and shareholders' funds increase"},{"l":"B","h":"Cash increases and shareholders' funds increase"},{"l":"C","h":"Cash decreases and non-current assets increase"},{"l":"D","h":"Cash increases and non-current assets decrease"}],"a":"C","e":"<p>When expenditure is capitalised it leads to an increase in non-current assets rather than a decrease in profit.<\/p>"},{"s":11,"n":12,"id":"1039418","q":"<p>When calculating earning per share (EPS), which of the following would not be removed from the operating profits of a company?<\/p>","o":[{"l":"A","h":"Tax"},{"l":"B","h":"Interest"},{"l":"C","h":"Preference share dividends"},{"l":"D","h":"Ordinary share dividends"}],"a":"D","e":"<p>EPS uses a profit figure based on profits available to ordinary shareholders. These remove any tax, interest and preference share dividends. It would also remove minority interests if they applied.<\/p>"},{"s":11,"n":13,"id":"1024378","q":"<p>A company's operating profit is £6m, and the increase in inventory at the year end is £2m. The increase in receivables and payable is £1m each. What is the operating cash flow?<\/p>","o":[{"l":"A","h":"£8m"},{"l":"B","h":"£6m"},{"l":"C","h":"£4m"},{"l":"D","h":"£2m"}],"a":"C","e":"<p>Operating cash flow is calculated as follows:<br/> Operating profit £6m. Subtract increase in inventory and receivables £3m. Add back increase in payables £1m.<br/> Operating cash flow = £4m.<\/p>"},{"s":11,"n":14,"id":"1047483","q":"<p>Which of the following has taken into consideration the repayment of debentures?<\/p>","o":[{"l":"A","h":"Enterprise cash flow"},{"l":"B","h":"Free cash flow to the firm"},{"l":"C","h":"Equity cash flow"},{"l":"D","h":"Enterprise value"}],"a":"C","e":"<p>Equity cash flow looks at the cash available to equity shareholders. This is after the repayment of all debt. It is also referred to as free cash flow to shareholders.<br/> Free cash flow to the firm is a cash flow figure before interest payments. Enterprise value is calculated as the market value of debt and equity shares. Enterprise cash flow is cash flow available to all providers of capital and it is the same as free cash to the firm.<\/p>"},{"s":11,"n":15,"id":"1002146","q":"<p>Which of the following will increase the shareholder's funds of a company?<\/p><p><strong>I<\/strong><\/p><p>Capitalisation issue<\/p><p><strong>II<\/strong><\/p><p>Rights issue<\/p><p><strong>III<\/strong><\/p><p>Offer for subscription<\/p><p><strong>IV<\/strong><\/p><p>Scrip issue<\/p>","o":[{"l":"A","h":"III and IV"},{"l":"B","h":"I and II"},{"l":"C","h":"II and IV"},{"l":"D","h":"II and III"}],"a":"D","e":"<p>Capitalisation and scrip issues are other names for a bonus issue where free shares are issued to investors hence no additional funds will be raised.<\/p>"},{"s":11,"n":16,"id":"1047405","q":"<p>All of the following have been deducted prior to calculating earnings per share, except:<\/p>","o":[{"l":"A","h":"Interest payable on bonds"},{"l":"B","h":"Preference dividends"},{"l":"C","h":"Equity dividends"},{"l":"D","h":"Cost of goods sold"}],"a":"C","e":"<p>Earnings per share are the profits available to the ordinary shareholder of the company. This is before the deduction of equity or ordinary dividends.<\/p>"},{"s":11,"n":17,"id":"4028008","q":"<p>A company has completed a 5 for 1 stock-split. Following the stock-split the most likely impact on the company's Debt to equity ratio will be:<\/p>","o":[{"l":"A","h":"It will increase by 20% in line with the stock-split ratio"},{"l":"B","h":"It will decrease by 20% in line with the stock-split ratio"},{"l":"C","h":"It will decrease by 80% in line with the stock-split ratio"},{"l":"D","h":"It will remain unchanged"}],"a":"D","e":"<p>Although the number of shares issued will increase, with a stock-split the overall value will remain unchanged.  As the value of equity is unchanged then the debt to equity ratio will also remain unchanged.<\/p><p> <\/p>"},{"s":11,"n":18,"id":"1001407","q":"<p>What is net asset value per ordinary share?<\/p>","o":[{"l":"A","h":"Assets / number of ordinary shares"},{"l":"B","h":"(Assets - liabilities) / number of ordinary shares"},{"l":"C","h":"(Assets - liabilities - goodwill) / number of ordinary shares"},{"l":"D","h":"(Assets - preference shares) / number of ordinary shares"}],"a":"B","e":"<p>NAV per ordinary share = assets - liabilities / number of ordinary shares.<\/p>"},{"s":11,"n":19,"id":"1001874","q":"<p>A microchip manufacturer incurs £100 in making each microchip. At the end of its accounting period it determines that the 1,000 chips it currently has in stock are obsolete and could only be sold for £80 each. They would need to be repackaged at an additional cost of £5 each. Assuming no other stock, what is the statement of financial position (balance sheet) value of stock recorded?<\/p>","o":[{"l":"A","h":"£100,000"},{"l":"B","h":"£80,000"},{"l":"C","h":"Nil"},{"l":"D","h":"£75,000"}],"a":"D","e":"<p>Stock is recorded at the lower of cost (£100) and net realisable value (£75).<\/p>"},{"s":11,"n":20,"id":"1015558","q":"<p>Where in the financial statements would you find tax payable?<\/p>","o":[{"l":"A","h":"Statement of financial position"},{"l":"B","h":"Statement of retained earnings"},{"l":"C","h":"Statement of cash flows"},{"l":"D","h":"Interim report"}],"a":"A","e":"<p>Payables, including tax payable, can be found in the statement of financial position within Liabilities. Tax paid is found in the statement of cash flows.<\/p>"},{"s":11,"n":21,"id":"1072572","q":"<p>The company has produced its financial statements and have enclosed additional disclosures in the notes. Which of the following will LEAST likely appear in these notes?<\/p>","o":[{"l":"A","h":"The statement of investment principles"},{"l":"B","h":"Comparison of previous year's financial statements"},{"l":"C","h":"The accounting policies"},{"l":"D","h":"Explanation of this year's profit/loss"}],"a":"A","e":"<p>The financial statements also include certain additional disclosures, such as the comparative figures from the previous year's financial statements, explanatory notes to accompany certain individual balance sheet and income statement items, and disclosure of the company's accounting policies. The accounting policies are the basis on which the accounts have been prepared.<\/p>"},{"s":11,"n":22,"id":"1001375","q":"<p>All of the following are current assets except:<\/p>","o":[{"l":"A","h":"Inventories"},{"l":"B","h":"Receivables"},{"l":"C","h":"Cash"},{"l":"D","h":"Payables"}],"a":"D","e":"<p>Current assets include inventories, receivables and cash. Payables are a current liability.<\/p>"},{"s":11,"n":23,"id":"4055671","q":"<p>The role of the auditor includes:<\/p>","o":[{"l":"A","h":"Preparing accounts for the shareholders"},{"l":"B","h":"Providing assurance to directors as to whether the accounts give a true and fair view' of the financial state of the company"},{"l":"C","h":"To report whether the accounts have been properly prepared in accordance with the accounting policies"},{"l":"D","h":"Ensuring that the company adheres to listing requirements"}],"a":"C","e":"<p>The role of the auditor is to report to shareholders on whether the accounts have been properly prepared in accordance with the accounting policies, and all other accounting legislation, and also to state whether they give a 'true and fair view' of the financial state of the company.<\/p>"},{"s":11,"n":24,"id":"1054673","q":"<p>Which of these is shown on the income statement (statement of profit and loss and other comprehensive income)?<\/p>","o":[{"l":"A","h":"Bank overdraft"},{"l":"B","h":"Prepayments"},{"l":"C","h":"Trade receivables"},{"l":"D","h":"Interest"}],"a":"D","e":"<p>Bank overdraft is a liability, prepayments and trade receivable are current assets. Interest is an expense and therefore a component of profit.<\/p>"},{"s":11,"n":25,"id":"1001380","q":"<p>The accounting equation can be described as:<\/p>","o":[{"l":"A","h":"Assets - liabilities = capital - reserves"},{"l":"B","h":"Assets + liabilities = capital + reserves"},{"l":"C","h":"Assets = capital + reserves + liabilities"},{"l":"D","h":"Assets - long term liabilities = capital - short term liabilities"}],"a":"C","e":"<p>The accounting equation is a narrative summary of the statement of financial position.<\/p>"},{"s":11,"n":26,"id":"1014264","q":"<p>In which of the following financial statements would you find \"Proceeds on issue of bonds and equities\"?<\/p>","o":[{"l":"A","h":"Income statement"},{"l":"B","h":"Balance sheet"},{"l":"C","h":"Cash flow statement"},{"l":"D","h":"None of these"}],"a":"C","e":"<p>Proceeds on issue of bonds and equities represents the net cash flow in relation to financing activities during the accounting period.<\/p>"},{"s":11,"n":27,"id":"1014260","q":"<p>The effect on a company's accounts of borrowing money would be to:<\/p>","o":[{"l":"A","h":"Increase current assets and shareholders' funds"},{"l":"B","h":"Increase current assets and decrease shareholders' funds"},{"l":"C","h":"Increase current assets and decrease liabilities"},{"l":"D","h":"Increase current assets and increase liabilities"}],"a":"D","e":"<p>Current assets go up (cash), and the level of debt also increases.<\/p>"},{"s":11,"n":28,"id":"1001381","q":"<p>In a statement of financial position, prepayments come under which category?<\/p>","o":[{"l":"A","h":"Non-current assets"},{"l":"B","h":"Current assets"},{"l":"C","h":"Reserves"},{"l":"D","h":"Current liabilities"}],"a":"B","e":"<p>Pre-payments come under current assets. They are payments made in advance of the statement of financial position date.<\/p>"},{"s":11,"n":29,"id":"1001374","q":"<p>Which of the following would not be included within shareholders funds?<\/p>","o":[{"l":"A","h":"Revaluation reserve"},{"l":"B","h":"Share premium account"},{"l":"C","h":"Issued share capital"},{"l":"D","h":"Warrants"}],"a":"D","e":"<p>Prior to their exercise, warrants do not form part of a company's share capital.<\/p>"},{"s":11,"n":30,"id":"1024379","q":"<p>When would a company disclose a minority interest in the statement of financial position?<\/p>","o":[{"l":"A","h":"A company owns between 10 and 30% of the shares of another company"},{"l":"B","h":"A company has shares held by both private and public investors"},{"l":"C","h":"A subsidiary company is not fully owned by the group"},{"l":"D","h":"A subsidiary is not controlled by the parent company"}],"a":"C","e":"<p>A minority interest is recorded when a subsidiary is not 100% owned by the parent company.<\/p>"},{"s":11,"n":31,"id":"1039454","q":"<p>Which of the following is not a non-current asset?<\/p>","o":[{"l":"A","h":"A partly-constructed factory"},{"l":"B","h":"A fleet of delivery vans"},{"l":"C","h":"Inventory held in the company warehouse"},{"l":"D","h":"Capitalised development costs"}],"a":"C","e":"<p>Inventories are current assets.<\/p>"},{"s":11,"n":32,"id":"1066418","q":"<p>A company's operating profit is £6m, and the increase in inventory for raw materials is £2m. The increase in receivables is £1m and the increase in payables is £1m. What is the operating cash flow?<\/p>","o":[{"l":"A","h":"£2 million"},{"l":"B","h":"£4 million"},{"l":"C","h":"£6 million"},{"l":"D","h":"£8 million"}],"a":"B","e":"<p>Operating cash flow is calculated as follows:<br/> Operating profit £6m. Subtract increase in inventory and receivables £3m. Add back increase in payables £1m.<br/> Operating cash flow = £4m.<\/p>"},{"s":11,"n":33,"id":"1047442","q":"<p>The best definition of enterprise cash flow would be:<\/p>","o":[{"l":"A","h":"Cash flow for equity holders"},{"l":"B","h":"The market value of all equity and debt"},{"l":"C","h":"Cash flow to all providers of finance"},{"l":"D","h":"Cash flow to the directors"}],"a":"C","e":"<p>Cash flow for equity holders would be equity cash flow and the market value of all equity and debt is enterprise value.<br/> <br/> Enterprise cash flow is also known as free cash flow to the firm.<\/p>"},{"s":11,"n":34,"id":"1001373","q":"<p>Which of the following would usually be found under non-current assets in a statement of financial position?<\/p><p><strong>I<\/strong><\/p><p>Work in progress<\/p><p><strong>II<\/strong><\/p><p>Computers<\/p><p><strong>III<\/strong><\/p><p>Land and buildings<\/p><p><strong>IV<\/strong><\/p><p>Prepayments<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"I and IV"}],"a":"C","e":"<p>Work in progress = stock = current asset. Prepayment = expense paid in advance = current asset.<\/p>"},{"s":11,"n":35,"id":"1024373","q":"<p>Which of the following does NOT appear in the cash flow statement?<\/p>","o":[{"l":"A","h":"Net assets"},{"l":"B","h":"Acquisitions"},{"l":"C","h":"Dividends paid"},{"l":"D","h":"Taxation"}],"a":"A","e":"<p>Net assets is a figure which appears on the balance sheet.<\/p>"},{"s":11,"n":36,"id":"1001692","q":"<p>Which of the following would you see on a cash flow statement?<\/p>","o":[{"l":"A","h":"Called-up share capital"},{"l":"B","h":"Deferred tax"},{"l":"C","h":"Gross profit"},{"l":"D","h":"Equity dividends paid"}],"a":"D","e":"<p>'Called-up share capital' and 'deferred tax' would appear on the balance sheet; and 'gross profit' would appear on the profit and loss account.<br/> Therefore, 'equity dividends paid' is the correct answer.<\/p>"},{"s":11,"n":37,"id":"1047477","q":"<p>If a predator pays more for a target than its net asset value, due to loyal customer base and innovation in the market, how will this be justified in financial statements?<\/p>","o":[{"l":"A","h":"Investments"},{"l":"B","h":"Goodwill"},{"l":"C","h":"Development costs"},{"l":"D","h":"Potential earnings"}],"a":"B","e":"<p>The excess would be referred to as goodwill on the balance sheet and goodwill is classified as an intangible asset.<br/> The company will need to record an asset because otherwise the cash paid for the company will not match the assets recorded on the group balance sheet.<\/p>"},{"s":11,"n":38,"id":"1039416","q":"<p>Where on a company's statement of financial position would you find the share premium account?<\/p>","o":[{"l":"A","h":"Fixed assets"},{"l":"B","h":"Capital and reserves"},{"l":"C","h":"Financing activities"},{"l":"D","h":"Liabilities"}],"a":"B","e":"<p>The share premium account can be found in the capital and reserves. Financing activities are on the cash flow statement.<\/p>"},{"s":11,"n":39,"id":"1067520","q":"<p>The current ratio is typically used to measure which one of the following within a company?<\/p>","o":[{"l":"A","h":"Profitability"},{"l":"B","h":"Liquidity"},{"l":"C","h":"Return to shareholders"},{"l":"D","h":"Liquidation"}],"a":"B","e":"<p>The current ratio is a liquidity ratio calculated as current assets divided by current liabilities<\/p>"},{"s":11,"n":40,"id":"1078906","q":"<p>Which of the following would best describe enterprise cash flow?<\/p>","o":[{"l":"A","h":"Free cash flow after financing costs to lenders but before preference dividends"},{"l":"B","h":"Money needed to run the firm"},{"l":"C","h":"Free cash flow before considering any financing costs"},{"l":"D","h":"Money available to shares outstanding"}],"a":"C","e":"<p>The enterprise cash flow is the free cash flow before considering payments made to any of the providers of finance to the firm. The providers of finance to the firm are both the lenders and the equity holders. The enterprise cash flow will, therefore, be the free cash flow before considering any financing costs.<\/p>"},{"s":11,"n":41,"id":"1072172","q":"<p>Which of the below would NOT be on an income statement (statement of profit and loss)?<\/p>","o":[{"l":"A","h":"Trade payables"},{"l":"B","h":"Depreciation"},{"l":"C","h":"Revenues"},{"l":"D","h":"Distribution costs"}],"a":"A","e":"<p>Trade payables is a liability and would therefore be found on the balance sheet, not the income statement or also known as the statement of profit and loss.<\/p>"},{"s":11,"n":42,"id":"1001378","q":"<p>Which of the following is not part of shareholders' funds?<\/p>","o":[{"l":"A","h":"Authorised share capital"},{"l":"B","h":"Share premium reserve"},{"l":"C","h":"Capital redemption reserve"},{"l":"D","h":"Retained earnings"}],"a":"A","e":"<p>ISSUED share capital is in the balance sheet - AUTHORISED share capital (the maximum the company is allowed to issue) is not in the balance sheet.<\/p>"},{"s":11,"n":43,"id":"1065025","q":"<p>On the statement of financial position, which one below would not appear as intangible non current assets?<\/p>","o":[{"l":"A","h":"Goodwill"},{"l":"B","h":"Trademarks"},{"l":"C","h":"Revaluation reserve"},{"l":"D","h":"Capitalised development costs"}],"a":"C","e":"<p>All others are examples of intangible non current assets. Revaluation would come under the heading capital and reserves.<\/p>"},{"s":11,"n":44,"id":"1039417","q":"<p>Which of the following is an example of revenue expenditure?<\/p>","o":[{"l":"A","h":"Purchases of intangible non-current assets"},{"l":"B","h":"Purchases of tangible non-current assets"},{"l":"C","h":"Purchases that have an immediate impact on profit and loss financial statements"},{"l":"D","h":"Purchases made in cash"}],"a":"C","e":"<p>Revenue expenditure has an impact on the revenue of the company, so needs to have an immediate impact on the income statement / statement of profit and loss and other comprehensive income. Purchases made in cash could be revenue expenditure, but could also be capital expenditure.<\/p>"},{"s":11,"n":45,"id":"4027312","q":"<p>The share premium account could be used in which one of the following situations?<\/p>","o":[{"l":"A","h":"A company does a capitalisation issue"},{"l":"B","h":"The payment of a cash dividend, when the profits for the year do not cover the amount to be paid."},{"l":"C","h":"A company completes a stock split"},{"l":"D","h":"A company sells a non-current asset for more than the original purchase price."}],"a":"A","e":"<p>An acceptable use of the share premium account is to account for IPO costs and cover the nominal value of new shares issed via a capitalisation issue (bonus issue).<\/p><p>Retained earning would be used to cover the payment of a dividend if the profits for the year are not enough. An uncovered dividend.<\/p><p>Stock-splits do not impact the balance sheet.<\/p><p>The sale of a non-current asset would show a reduction in non-current assets and a corresponding increase in current assets (cash). <\/p>"},{"s":11,"n":46,"id":"1024374","q":"<p>Which of the following is NOT part of shareholders' funds?<\/p>","o":[{"l":"A","h":"Share premium account"},{"l":"B","h":"Investments in associates"},{"l":"C","h":"Capital redemption reserve"},{"l":"D","h":"Retained earnings"}],"a":"B","e":"<p>Investments in associates would appear as an item in non-current assets. Capital redemption reserve is created when a company buys back its shares and cancels them.<\/p>"},{"s":11,"n":47,"id":"1001366","q":"<p>Which of the following best describes a minority interest/non-controlling interest in the context of a consolidated income statement / statement of profit and loss and other comprehensive income?<\/p>","o":[{"l":"A","h":"Profits due to outside shareholders in subsidiaries"},{"l":"B","h":"Cumulative preference dividends"},{"l":"C","h":"Interest on debentures and unsecured loan stock"},{"l":"D","h":"Participating preference dividends"}],"a":"A","e":"<p>By definition. You will only see minority or non-controlling interests in a set of GROUP accounts, when one of the subsidiaries is not wholly owned by the parent company: i.e. there is a minority shareholding.<\/p>"},{"s":11,"n":48,"id":"1001372","q":"<p>Which would you NOT find as a current liability in a statement of financial position?<\/p>","o":[{"l":"A","h":"Trade creditors / payables"},{"l":"B","h":"Interest paid"},{"l":"C","h":"Dividends not paid"},{"l":"D","h":"Overdraft"}],"a":"B","e":"<p>A current liability is an obligation payable within one year of the statement of financial position date. Interest paid would appear in the cash flow statement.<\/p>"},{"s":11,"n":49,"id":"1072568","q":"<p>A company has an operating profit of £12 million. If raw materials increased by £4 million, receivables decreased by £2 million and accounts payable increased by £2 million, the operating cash flow would be:<\/p>","o":[{"l":"A","h":"£8 million"},{"l":"B","h":"£10 million"},{"l":"C","h":"£12 million"},{"l":"D","h":"£14 million"}],"a":"C","e":"<p>Any increase in inventory: deduct from trading profit, the decrease in receivables: add to trading profit and the Increase in payables: add to trading profit.<br/> £12m - £4m + £2m + £2m = £12m<\/p>"},{"s":11,"n":50,"id":"1001369","q":"<p>What would you not expect to find under tangible non-current assets?<\/p>","o":[{"l":"A","h":"Land"},{"l":"B","h":"Buildings"},{"l":"C","h":"Work-in-progress"},{"l":"D","h":"Plant and machinery"}],"a":"C","e":"<p>Tangible fixed assets are long-term assets with physical substance. Land, buildings and plant and machinery are all tangible fixed assets. Work in progress is part of stock, which is a current asset.<\/p>"},{"s":11,"n":51,"id":"1002062","q":"<p>Which of the following would appear on a cash flow statement?<\/p>","o":[{"l":"A","h":"Net profit"},{"l":"B","h":"Total assets less current liabilities"},{"l":"C","h":"Operating profit"},{"l":"D","h":"Acquisitions and disposals"}],"a":"D","e":"<p>'Net profit' and 'operating profit' are profit and loss account headings and 'total assets less current liabilities' belongs in the balance sheet.<br/> 'Acquisitions and disposals' is the correct answer.<\/p><p>When the exams asks about the \"cash flow statement\", they are referring to the direct method of cash flows. <\/p>"},{"s":11,"n":52,"id":"1014261","q":"<p>Which of the following would NOT be found in an income statement / statement of profit and loss and other comprehensive income?<\/p>","o":[{"l":"A","h":"Cost of sales"},{"l":"B","h":"Loss on disposal of plant"},{"l":"C","h":"Deferred tax liability"},{"l":"D","h":"Interest expense"}],"a":"C","e":"<p>Deferred tax liability would be found on the balance sheet.<\/p>"},{"s":11,"n":53,"id":"1014263","q":"<p>Which of the following statements does not apply to cash flow statements?<\/p>","o":[{"l":"A","h":"They show cash from new capital raised during the year"},{"l":"B","h":"They show how much tax was physically paid during the year"},{"l":"C","h":"They show how much gross profit was earned during the year"},{"l":"D","h":"They show the effect of the year's transactions on the company's cash"}],"a":"C","e":"<p>The cash flow statement shows CASH inflows and outflows during the year. Cash and profit are not always the same, as the profit and loss account is prepared on an accruals basis rather than a cash basis. The cash flow statement does not show profit for the year.<\/p>"},{"s":11,"n":54,"id":"1039455","q":"<p>Which of the following is an example of capital expenditure?<\/p>","o":[{"l":"A","h":"Maintenance costs on buildings"},{"l":"B","h":"Purchase of non-current assets"},{"l":"C","h":"Depreciation of tangible assets"},{"l":"D","h":"Tax and interest payments"}],"a":"B","e":"<p>Purchase of non-current (fixed) assets has a direct impact on the balance sheet so is a capital expense - the expense is capitalised.<br/> The rest have an impact on the income statement so would be revenue expenditure - the expense impacts on our revenue.<\/p>"},{"s":11,"n":55,"id":"1001384","q":"<p>Which of the following items does not appear in the cash flow statement?<\/p>","o":[{"l":"A","h":"Deferred taxation"},{"l":"B","h":"Cash paid to suppliers"},{"l":"C","h":"Financing"},{"l":"D","h":"Disposal of non-current assets"}],"a":"A","e":"<p>Taxation heading in the cash flow statement shows physical cash paid in respect of corporation tax during the accounting period - not the deferred taxation which is an accounting adjustment. Cash inflows and outflows in relation to fixed assets are recorded.<\/p>"},{"s":11,"n":56,"id":"1047418","q":"<p>Which of the following is FALSE regarding a repo?<\/p>","o":[{"l":"A","h":"Assists with liquidity"},{"l":"B","h":"The repo rate is the cost of borrowing the bond"},{"l":"C","h":"A tripartite repo may involve a custodian"},{"l":"D","h":"Normally overnight"}],"a":"B","e":"<p>A repo is a sale and repurchase agreement normally involving instruments such as Gilts. The asset is sold and then repurchased at a later date. It is a type of secured borrowing that generates a repo rate. The difference between the sale and repurchase price represents the interest paid on the loan of cash.<br/> Tripartite repos use a custodian to facilitate the transfer of cash and collateral.<br/> Repos can be for any period of time, not just overnight. However overnight repos are the most common.<\/p>"},{"s":12,"n":1,"id":"1049745","q":"<p>For its most recent financial year XYZ plc paid dividends per share of 10p. If EPS was 25p, what was XYZ plc's dividend cover?<\/p>","o":[{"l":"A","h":"2.5"},{"l":"B","h":"3.5"},{"l":"C","h":"1.5"},{"l":"D","h":"2"}],"a":"A","e":"<p>Dividend cover = earnings per share / dividend per share.<br/> Dividend cover = 25p / 10p = 2.5x.<\/p>"},{"s":12,"n":2,"id":"1040037","q":"<p>Which of the following is most likely to cause an increase in interest coverage?<\/p>","o":[{"l":"A","h":"A reduction in working capital"},{"l":"B","h":"A reduction in the tax rate"},{"l":"C","h":"Switching to depreciate an asset over ten years rather than just five years"},{"l":"D","h":"An increase in the interest rate payable on an outstanding loan"}],"a":"C","e":"<p>Interest coverage is EBIT/interest payable.<br/> Depreciating an asset over ten years will lower the depreciation charge, increase EBIT and so increase the interest coverage ratio<\/p>"},{"s":12,"n":3,"id":"1001394","q":"<p>EPS is calculated after all of the following except:<\/p>","o":[{"l":"A","h":"Interest"},{"l":"B","h":"Extraordinary items"},{"l":"C","h":"Minority interests"},{"l":"D","h":"Ordinary dividends"}],"a":"D","e":"<p>EPS is calculated after EVERYTHING (except ordinary dividends) has been charged to profit.<\/p>"},{"s":12,"n":4,"id":"1023947","q":"<p>An investor holds 650 shares. The mid-market price is 95p. The dividend cheque received during the year was £32.50. What is the gross dividend yield for the investor?<\/p>","o":[{"l":"A","h":"5.3%"},{"l":"B","h":"5.4%"},{"l":"C","h":"5.6%"},{"l":"D","h":"5.8%"}],"a":"A","e":"<p>The calculation of gross dividend yield is: Gross dividend / share price . The gross dividend received was £32.50 The market value of the shareholding is 650 shares x £0.95 = £617.5 Yield = (£32.50 / £617.5) x 100 = 5.3%<\/p>"},{"s":12,"n":5,"id":"1067666","q":"<p>The gross profit margin will take into account which of the following?<\/p>","o":[{"l":"A","h":"Only the cost of goods"},{"l":"B","h":"Cost of goods and administration and selling expenses"},{"l":"C","h":"Cost of goods, administration and selling expenses, and interest and taxation"},{"l":"D","h":"Only the administration and selling expenses, and interest and taxation"}],"a":"A","e":"<p>Gross profit margin accounts for just the cost of goods sold. Operating profit margin accounts for the cost of goods sold, and administration/selling expenses. The net profit margin analyses profitability further by also taking into account interest and taxation.<\/p>"},{"s":12,"n":6,"id":"1001395","q":"<p>The following information relates to Alaska plc:<br/> Profit after interest, tax and extraordinary items £5m<br/> Share capital £15m (ordinary shares of 50p each)<br/> Current market price per share 100p.<br/> What is Alaska plc's P/E ratio?<\/p>","o":[{"l":"A","h":"2x"},{"l":"B","h":"4x"},{"l":"C","h":"6x"},{"l":"D","h":"8x"}],"a":"C","e":"<p>Number of ordinary shares = £15m / 0.5 = 30m. Earnings per share = £5m / 30m = 16.6p. P/E = 100p / 16.6p = 6x.<\/p>"},{"s":12,"n":7,"id":"1001401","q":"<p>A company has turnover of £550,000, profit before tax of £50,000 and profit after tax of £30,000. If dividends are £10,000, what is the dividend cover?<\/p>","o":[{"l":"A","h":"5x"},{"l":"B","h":"4.5x"},{"l":"C","h":"3x"},{"l":"D","h":"2.7x"}],"a":"C","e":"<p>Dividend cover = profit after tax / net dividend.<br/> = £30,000 / £10,000.<br/> = 3x.<\/p>"},{"s":12,"n":8,"id":"1078907","q":"<p>Analysts assess the prospects of companies on their investment potential and also assist the board to assess their company's position in the current market. Which of the following is the main tool for making these assessments?<\/p>","o":[{"l":"A","h":"Technical analysis"},{"l":"B","h":"Ratio analysis"},{"l":"C","h":"Spatial analysis"},{"l":"D","h":"Optimisation"}],"a":"B","e":"<p>The purpose of ratio analysis is: To assist in assessing business performance, by identifying meaningful relationships between numbers contained within company financial statements, that may not be immediately apparent; to summarise financial information into an easily understandable form; to identify trends, strengths and weaknesses by comparing the ratios to those of the same company in prior periods, other similar companies, sector averages and market averages.<\/p>"},{"s":12,"n":9,"id":"1002114","q":"<p>Which of the following makes ratio analysis most beneficial?<\/p>","o":[{"l":"A","h":"Selecting information from the balance sheet"},{"l":"B","h":"Comparing the ratios of companies in a similar sector"},{"l":"C","h":"Basing ratios on general economic data"},{"l":"D","h":"Comparing the ratios of companies in the same stage of the product life cycle"}],"a":"B","e":"<p>Comparing ratios within a sector ensures comparability: comparing 'like-with-like'.<\/p>"},{"s":12,"n":10,"id":"1001412","q":"<p>Which of the following is true regarding the calculation of EPS? It is:<\/p>","o":[{"l":"A","h":"Profit before tax divided by authorised share capital excluding preference shares"},{"l":"B","h":"Profit after tax divided by issued shares excluding preference shares"},{"l":"C","h":"Profit before tax divided by free float issued shares excluding preference shares"},{"l":"D","h":"Profit after tax divided by shares outstanding including preference shares"}],"a":"B","e":"<p>EPS is the profit available to ordinary shareholders divided among the number of ordinary shares.<\/p>"},{"s":12,"n":11,"id":"1002024","q":"<p>Dividend cover is calculated by dividing earnings by:<\/p>","o":[{"l":"A","h":"Share price"},{"l":"B","h":"Dividends"},{"l":"C","h":"Net earnings"},{"l":"D","h":"Sales"}],"a":"B","e":"<p>Dividend cover = earnings per share/dividend per share.<\/p>"},{"s":12,"n":12,"id":"1078911","q":"<p>An analyst is making comparisons between companies' enterprise value relative to earnings before interest, tax, depreciation and amortisation. Which of the following would NOT be a factor they will consider?<\/p>","o":[{"l":"A","h":"A company's total revenues less expenses"},{"l":"B","h":"A valuation that considers holders of both equity and debt"},{"l":"C","h":"The true cash earnings of the company"},{"l":"D","h":"The open market cost purchasing the entire company"}],"a":"C","e":"<p>Care must be taken as EBITDA does not truly represent cash earnings: it leaves out the cash required to fund working capital and the replacement of old equipment, which can be significant.<\/p>"},{"s":12,"n":13,"id":"1001755","q":"<p>MR plc has 20m 10p ordinary shares in issue. The dividend is 4.17p per share, and the dividend yield is 4%. What is the market price per share?<\/p>","o":[{"l":"A","h":"£0.94"},{"l":"B","h":"£1.25"},{"l":"C","h":"£1.04"},{"l":"D","h":"£1.88"}],"a":"C","e":"<p>This question asks you to calculate the market price. The question gives you the dividend per share and the dividend yield. We use the dividend yield calculation to work this out.<\/p><p>Dividend yield = dividend per share / share price<\/p><p>0.04 = 4.17p / share price<\/p><p>share price = 4.17p / 0.04 = 104.25p or £1.04<\/p><p>Note: dividend yield is 4% or 0.04<\/p>"},{"s":12,"n":14,"id":"1001754","q":"<p>The measure of income return provided by an equity investment is known as which ratio?<\/p>","o":[{"l":"A","h":"P/E ratio"},{"l":"B","h":"Dividend yield"},{"l":"C","h":"Debt-to-equity ratio"},{"l":"D","h":"Dividend cover"}],"a":"B","e":"<p>The percentage measure of income return is the dividend as a percentage of the share price.<\/p>"},{"s":12,"n":15,"id":"1001751","q":"<p>The shares of a plc stand at a 50% premium to net asset value per share. The company has 100m shares and the share price is 220p. What are the net assets?<\/p>","o":[{"l":"A","h":"£73.4m"},{"l":"B","h":"£440m"},{"l":"C","h":"£110m"},{"l":"D","h":"£146.7m"}],"a":"D","e":"<p>If share price is at a 50% premium to net asset value, then net asset value must be 100 / 150 (or 2 / 3) of the share price.<br/> 220p x 2 / 3 = 146.7p=£1.467<br/> £1.467 x 100m shares = £146.7m<\/p>"},{"s":12,"n":16,"id":"1001386","q":"<p>If a company undergoes a stock split, which of the following will have to be restated?<\/p>","o":[{"l":"A","h":"Gearing"},{"l":"B","h":"Leverage"},{"l":"C","h":"Current ratio"},{"l":"D","h":"Net asset value per share"}],"a":"D","e":"<p>No new money is raised by the company during a share split. As a result, there is no effect on the gearing ratio or net assets. As net asset value per share equals total net assets divided by the number of shares, a share split will have the effect of REDUCING this ratio. Note: leverage is the US term for gearing.<\/p>"},{"s":12,"n":17,"id":"1013712","q":"<p>Which of the following best describes the quick ratio (acid test)?<\/p>","o":[{"l":"A","h":"(Receivables + cash + inventory) / (payables - short-term borrowings)"},{"l":"B","h":"(Receivables + cash) / (payables - short-term borrowings)"},{"l":"C","h":"(Receivables + cash) / (payables + short-term borrowings)"},{"l":"D","h":"(Receivables + cash + inventory) / (payables + short-term borrowings)"}],"a":"C","e":"<p>The quick ratio excludes inventory, because inventory cannot be easily converted into cash.<\/p>"},{"s":12,"n":18,"id":"1001408","q":"<p>Some shares are trading at 250p, have paid a dividend of 10p, and are twice covered by post-tax earnings. What is their P/E ratio?<\/p>","o":[{"l":"A","h":"12.5"},{"l":"B","h":"18"},{"l":"C","h":"22.5"},{"l":"D","h":"25"}],"a":"A","e":"<p>The dividend of 10p is covered twice by post-tax earnings, which are therefore 20p. The share price is 250 and the P/E ratio is therefore given by 250 / 20 = 12.5.<\/p>"},{"s":12,"n":19,"id":"1024380","q":"<p>A company's profit after tax was £5,270. Interest paid was £240. The assets were £29,870 and the current liabilities £5,100. What is the return on capital employed?<\/p>","o":[{"l":"A","h":"15.3%"},{"l":"B","h":"18.4%"},{"l":"C","h":"16.8%"},{"l":"D","h":"22.2%"}],"a":"D","e":"<p>Return on capital employed is:<br/> Operating profit before interest and tax / (assets - current liabilities) x 100<br/> Although we should use PBIT, the questions does not give us a tax charge - or any other method of calculating a tax charge - so we have to use the next best alternative, profit before interest.<br/> (£5,270 + £240) / (£29,870 - £5,100) x 100<br/> £5,510 / £24,770 x 100 = 22.2%<\/p>"},{"s":12,"n":20,"id":"1001396","q":"<p>Four shares have the following share prices and EPS. Which is the most highly-rated?<\/p>","o":[{"l":"A","h":"190p and 6p"},{"l":"B","h":"275p and 12p"},{"l":"C","h":"200p and 10p"},{"l":"D","h":"150p and 8p"}],"a":"A","e":"<p>Share price divided by EPS gives the PE ratio. '190p and 6p' gives the highest PE ratio (31.7x) and so is the most highly-rated.<\/p>"},{"s":12,"n":21,"id":"1001391","q":"<p>What is the best definition of gearing?<\/p>","o":[{"l":"A","h":"A measure of the proportion of debt to equity that a company raises"},{"l":"B","h":"A measure of the proportion of equity to debt that a company raises"},{"l":"C","h":"A measure of the short-term liquidity of a company"},{"l":"D","h":"A measure of the profitability of a company"}],"a":"A","e":"<p>In theory, debt will allow the company to 'advance' faster (because the company gets tax relief on debt interest). Hence the process of raising debt is known as 'gearing-up'.<\/p>"},{"s":12,"n":22,"id":"1001404","q":"<p>A company's shares have a nominal value of 20p and a share price of 360p. If the P/E ratio is 24, what is EPS?<\/p>","o":[{"l":"A","h":"15p"},{"l":"B","h":"6.7p"},{"l":"C","h":"11.25p"},{"l":"D","h":"18p"}],"a":"A","e":"<p>PE ratio = market price per share / EPS.<br/> 24 = 360p / EPS.<br/> EPS = 360p / 24 = 15p.<\/p>"},{"s":12,"n":23,"id":"1043287","q":"<p>A company paid a dividend of 20p per share last year, its dividend cover was 8 and the dividend yield was 6%. What was the P/E ratio of the company?<\/p>","o":[{"l":"A","h":"3.33"},{"l":"B","h":"2.1"},{"l":"C","h":"1.6"},{"l":"D","h":"0.2"}],"a":"B","e":"<p>When asked to calculate P/E ratio, we generally expect to be given the price and the EPS. We are given neither. However, we are given enough information to work them out.<br/> We can get the price from the dividend yield calculation.<br/> Dividend yield = dividend / price<br/> 0.06 = 20p / price<br/> Price = 20p / 0.06 = 333p<br/> We can get the EPS from the dividend cover calculation.<br/> Dividend cover = EPS / Dividend<br/> 8 = EPS / 20p<br/> EPS = 8 x 20p = 160p<br/> Now we have both the price and the EPS, so:<br/> P/E ratio = 333 / 160 = 2.081<\/p>"},{"s":12,"n":24,"id":"1063929","q":"<p>Profit &amp; Co. made a profit for ordinary shareholders of £105m in 2012. It has shareholder funds of £300m and total assets of £700m. Calculate the return on equity for Profit &amp; Co in 2012.<\/p>","o":[{"l":"A","h":"42.9%"},{"l":"B","h":"35%"},{"l":"C","h":"15%"},{"l":"D","h":"10.5%"}],"a":"B","e":"<p>ROE = Profit to ordinary shareholders / shareholder funds = £105m / £300m = 35%<\/p>"},{"s":12,"n":25,"id":"1039456","q":"<p>Return on capital employed takes into consideration which of the following?<\/p><p><strong>I<\/strong><\/p><p>Profits before interest and tax<\/p><p><strong>II<\/strong><\/p><p>Profits available to ordinary shareholders<\/p><p><strong>III<\/strong><\/p><p>Total assets + current liabilities<\/p><p><strong>IV<\/strong><\/p><p>Equity + non-current liabilities<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"I and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"II and IV"}],"a":"B","e":"<p>Return on capital employed (ROCE) = operating profit / capital employed.<br/> Operating profit is PBIT (profits before interest and tax).<br/> Capital employed is equity + non-current liabilities or total assets - current liabilities<\/p>"},{"s":12,"n":26,"id":"1078819","q":"<p>Which of the following would explain why an investor wishes to use a net total return index rather than a price return index?<\/p>","o":[{"l":"A","h":"They wish to factor in the effects of further tax on their returns"},{"l":"B","h":"They wish to observe the effects of market capitalisation"},{"l":"C","h":"They wish to factor in the effects of dividend reinvestment"},{"l":"D","h":"They wish to observe the effects of mean variance returns"}],"a":"C","e":"<p>The question is asking us to compare a price return index with a net total return index.<\/p><p>Price return, which measures the price performance and, therefore, disregards income from dividends. Total return, which measures the performance of both price return and dividend reinvestment. Net total return, which accounts for dividend reinvestment after the deduction of a withholding tax.<\/p><p>Although tax is a factor, the most significant factor will be the recognition of the payment and reinvestment of dividends.<\/p>"},{"s":12,"n":27,"id":"1001411","q":"<p>XYZ dividend is 10p, dividend cover is two times, and the P/E ratio is 15. The dividend yield is:<\/p>","o":[{"l":"A","h":"3.3%"},{"l":"B","h":"4.17%"},{"l":"C","h":"12.5%"},{"l":"D","h":"20%"}],"a":"A","e":"<p>Dividend yield = dividend / share price<br/> We have the dividend, but not the share price. The share price can be calculated through the P/E ratio:<br/> P/E ratio = Price / EPS<br/> First we need to work out the EPS using dividend cover: = EPS / dividend 2 = EPS / 10 or rearranged to 2 x 10 so the EPS =20 Price earnings ratio = Price / earnings per share 15 = Price / 20 or rearranged to 15 x 20 so the price = 300p Dividend yield = net dividend / share price = 10p / 300p = 0.033 or 3.3%.<\/p>"},{"s":12,"n":28,"id":"1001757","q":"<p>What is the best definition of gearing?<\/p>","o":[{"l":"A","h":"A measure of the proportion of debt to equity that a company raises"},{"l":"B","h":"A measure of the proportion of equity to debt that a company raises"},{"l":"C","h":"A measure of the short-term liquidity of a company"},{"l":"D","h":"A measure of the profitability of a company"}],"a":"A","e":"<p>In theory debt will allow the company to 'advance' faster (because the company gets tax relief on debt interest). Hence the process of raising debt is known as 'gearing-up'.<\/p>"},{"s":12,"n":29,"id":"1001392","q":"<p>Which of the following statements is most likely to be FALSE regarding a company with a low P/E ratio relative to its sector?<\/p>","o":[{"l":"A","h":"The market perceives it to have low growth prospects"},{"l":"B","h":"It might be regarded as being more risky than its sector"},{"l":"C","h":"It is perceived to be underperforming by investors"},{"l":"D","h":"It is likely to have a low dividend yield"}],"a":"D","e":"<p>The P/E ratio and dividend yield tend to have an inverse relationship; i.e. a company with a relatively low P/E ratio will tend to have a high dividend yield. A company that pays most of its profit out as dividends (and therefore has a high dividend yield) will not have much profit to reinvest for future growth (and thus has a low P/E).<\/p>"},{"s":12,"n":30,"id":"1048177","q":"<p>MR plc has 20m 10p ordinary shares in issue. The net dividend is 4.17p per share, and the dividend yield is 4%. What is the market price per share?<\/p>","o":[{"l":"A","h":"£0.94"},{"l":"B","h":"£1.25"},{"l":"C","h":"£1.04"},{"l":"D","h":"£1.88"}],"a":"C","e":"<p>Dividend yield (4%) is 4.17p divided by the share price.<br/> Therefore share price is £1.04.<\/p>"},{"s":12,"n":31,"id":"1001413","q":"<p>A company undertakes a 2:3 scrip issue. To correctly restate the previously reported EPS figure, multiply it by:<\/p>","o":[{"l":"A","h":"2/3"},{"l":"B","h":"2/5"},{"l":"C","h":"3/5"},{"l":"D","h":"3/2"}],"a":"C","e":"<p>You need to reduce the existing EPS by 2 / 5: i.e. multiply by 3/5 of the existing figure. Example: if EPS is 100/100, earnings do not change but number of shares increases to 166.67. EPS should now be 60% of previous figure which is 3/5.<\/p>"},{"s":12,"n":32,"id":"1043288","q":"<p>A company pays a dividend of 20p per share. If the share price is 200p, what is the dividend yield?<\/p>","o":[{"l":"A","h":"10%"},{"l":"B","h":"12%"},{"l":"C","h":"11.11%"},{"l":"D","h":"13%"}],"a":"A","e":"<p>20p / 200p x 100 = 10%.<\/p>"},{"s":12,"n":33,"id":"1078910","q":"<p>The best definition of earnings per share is:<\/p>","o":[{"l":"A","h":"Profit after tax but before preference dividend divided by issued share capital"},{"l":"B","h":"Profit after tax minus preference dividend divided by ordinary shares plus convertibles"},{"l":"C","h":"Profit after tax but before preference dividend divided by the average weighted number of shares outstanding"},{"l":"D","h":"Profit after tax minus preference dividend divided by shares outstanding"}],"a":"D","e":"<p>Earnings Per Share = (Net income for the financial year – Dividends on preferred shares) / Number of ordinary shares in issue.<\/p>"},{"s":12,"n":34,"id":"1002176","q":"<p>How is dividend cover calculated?<\/p>","o":[{"l":"A","h":"Earnings Per Share/Dividend payments per share"},{"l":"B","h":"Earnings Per Share/Preference dividend payments per share"},{"l":"C","h":"Dividend payments per share/Earnings per share"},{"l":"D","h":"Preference dividend payments per share/Earnings per share"}],"a":"A","e":"<p>Dividend cover looks at how many times a company could have paid out its dividend based on the profit per year, and is calculated by dividing EPS by dividends per share.<\/p>"},{"s":12,"n":35,"id":"1001402","q":"<p>A company has 10m shares in issue. Its share price is 50p and its earnings are £200,000. Calculate the P/E ratio.<\/p>","o":[{"l":"A","h":"Five times"},{"l":"B","h":"Ten times"},{"l":"C","h":"20 times"},{"l":"D","h":"25 times"}],"a":"D","e":"<p>The earnings per share = £200,000 / 10m shares = £0.02<br/> P/E = price per share / earnings per share = 50p / 2p = 25.<\/p>"},{"s":12,"n":36,"id":"1072176","q":"<p>Which of the below would be a consideration when calculating earnings per share of a company?<\/p><p><strong>I<\/strong><\/p><p>Profit after tax<\/p><p><strong>II<\/strong><\/p><p>Profit before tax<\/p><p><strong>III<\/strong><\/p><p>Shares excluding preference shares<\/p><p><strong>IV<\/strong><\/p><p>Shares including preference shares<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and IV"},{"l":"C","h":"III and IV"},{"l":"D","h":"I and III"}],"a":"D","e":"<p>EPS = Profit available to ordinary shareholders / number of ordinary shares<\/p>"},{"s":12,"n":37,"id":"1001407","q":"<p>What is net asset value per ordinary share?<\/p>","o":[{"l":"A","h":"Assets / number of ordinary shares"},{"l":"B","h":"(Assets - liabilities) / number of ordinary shares"},{"l":"C","h":"(Assets - liabilities - goodwill) / number of ordinary shares"},{"l":"D","h":"(Assets - preference shares) / number of ordinary shares"}],"a":"B","e":"<p>NAV per ordinary share = assets - liabilities / number of ordinary shares.<\/p>"},{"s":12,"n":38,"id":"1024375","q":"<p>If a company produces summary financial statements, under the financial standards rules, which ratio must also be included?<\/p>","o":[{"l":"A","h":"Dividend cover and dividend yield"},{"l":"B","h":"PE ratio"},{"l":"C","h":"Diluted earnings per share"},{"l":"D","h":"Return on capital employed"}],"a":"C","e":"<p>Summary financial statements must reflect the full financial statements and IAS 33 requires the disclosure of basic and diluted EPS on the face of the statement of profit and loss, whether summary or full.<\/p>"},{"s":12,"n":39,"id":"1047482","q":"<p>What is the significant difference between the P/E ratio and EV/EBITDA?<\/p>","o":[{"l":"A","h":"P/E ratio considers operating profits"},{"l":"B","h":"EV/EBITDA considers profits after tax"},{"l":"C","h":"P/E ratio includes profits available to preference shareholders"},{"l":"D","h":"EV/EBITDA includes the market value of debt"}],"a":"D","e":"<p>P/E ratio is calculated as Share price / Earnings per share EV/EBITDA is calculated as Enterprise value / Earnings before interest, tax, depreciation and amortisation. Enterprise value is calculated as the market value of both the debt and equity of a company. <br/> EV/EBITDA looks at the full enterprise value of the company (equity and debt). The P/E ratio looks at ordinary shares only.<\/p>"},{"s":12,"n":40,"id":"1001390","q":"<p>Which of the following relationships is true?<\/p>","o":[{"l":"A","h":"Dividend yield multiplied by return on capital equals earnings per share"},{"l":"B","h":"Price earnings ratio multiplied by dividend yield equals price per share"},{"l":"C","h":"Price earnings ratio multiplied by earnings per share equals price per share"},{"l":"D","h":"Price per share divided by gearing ratio equals price earnings ratio"}],"a":"C","e":"<p>Price/Earnings x earnings/share = share price.<\/p>"},{"s":12,"n":41,"id":"1001389","q":"<p>An uncovered dividend is one paid out of:<\/p>","o":[{"l":"A","h":"Revaluation reserve"},{"l":"B","h":"Retained earnings"},{"l":"C","h":"Current profits"},{"l":"D","h":"Share capital"}],"a":"B","e":"<p>An uncovered dividend is a dividend that cannot be paid from the current year's profits. The company is therefore paying the dividend out of the retained earnings.<\/p>"},{"s":12,"n":42,"id":"1057677","q":"<p>Which of the following is the key difference between the current ratio and the quick ratio?<\/p>","o":[{"l":"A","h":"Debt"},{"l":"B","h":"Fixed assets"},{"l":"C","h":"Inventory"},{"l":"D","h":"Non-current liabilities"}],"a":"C","e":"<p>Current ratio = Current assets ÷ Current liabilities<br/> and<br/> Quick ratio = (Current assets - Inventories) ÷ Current liabilities<\/p>"},{"s":12,"n":43,"id":"1048178","q":"<p>The nominal value of a share is a £1.00. The earnings per share is 15p. The dividend per share is 5p and the current market price is £1.60. What is the dividend cover?<\/p>","o":[{"l":"A","h":"20x"},{"l":"B","h":"10.7x"},{"l":"C","h":"6.7x"},{"l":"D","h":"3x"}],"a":"D","e":"<p>Dividend cover = EPS / DPS = 15p / 5p = 3 times.<\/p>"},{"s":12,"n":44,"id":"1015647","q":"<p>When using ratio analysis to consider how well a company acquires and manages its resources, we are considering the efficiency of which department?<\/p>","o":[{"l":"A","h":"Compliance"},{"l":"B","h":"Purchasing"},{"l":"C","h":"Finance"},{"l":"D","h":"Risk"}],"a":"C","e":"<p>The finance department is responsible for acquisition and management of resources.<\/p>"},{"s":12,"n":45,"id":"1050530","q":"<p>A company has net assets of £30 million, long-term debts of £10 million and current liabilities of £5 million. The gross profit, operating profit and profit after tax are £5 million, £4 million and £2 million, respectively. What is the return on capital employed (ROCE)?<\/p>","o":[{"l":"A","h":"6.7%"},{"l":"B","h":"11.1%"},{"l":"C","h":"10%"},{"l":"D","h":"11.4%"}],"a":"C","e":"<p>The ROCE is calculated as operating profit divided by total capital employed. Total capital employed includes shareholders' equity and non-current liabilities, but not current liabilities. Net assets, which equal the shareholders' equity by definition, are £30 million. We add the £10 million in long-term debt to find capital employed equals £40 million.<br/> The ROCE is then calculated as operating profit of £4 million divided by capital employed of £40 million, which equals 10%.<\/p>"},{"s":12,"n":46,"id":"1014171","q":"<p>Which one of the following is NOT a type of P/E ratio?<\/p>","o":[{"l":"A","h":"Prospective"},{"l":"B","h":"Forward"},{"l":"C","h":"Estimated"},{"l":"D","h":"Permitted"}],"a":"D","e":"<p>Prospective P/E ratio is based on the current financial year's forecast earnings. This is also known as the forward or estimated P/E ratio.<\/p>"},{"s":12,"n":47,"id":"1001388","q":"<p>Which of the following events would not lead to a dilution of earning per share?<\/p>","o":[{"l":"A","h":"A negative cash flow"},{"l":"B","h":"The conversion of a convertible preference share"},{"l":"C","h":"The conversion of a convertible loan stock"},{"l":"D","h":"The exercise of a warrant"}],"a":"A","e":"<p>Convertibles, warrants and bonus issues can increase the share capital of the company, thereby diluting (reducing) earnings per share.<\/p>"},{"s":12,"n":48,"id":"1002031","q":"<p>What is the current price of a company's shares if its trailing P/E ratio is 15.0x and it has just announced earnings per share of $0.22?<\/p>","o":[{"l":"A","h":"$2.20"},{"l":"B","h":"$3.30"},{"l":"C","h":"$0.15"},{"l":"D","h":"$3.32"}],"a":"B","e":"<p>Price = PE x EPS = 15 x $.22 = $3.30.<\/p>"},{"s":12,"n":49,"id":"1001405","q":"<p>A company has a share price of 280p and EPS of 20p. If dividend cover is 2.5x, what is the company's dividend yield?<\/p>","o":[{"l":"A","h":"2.86%"},{"l":"B","h":"7.14%"},{"l":"C","h":"0.89%"},{"l":"D","h":"2.57%"}],"a":"A","e":"<p>Dividend yield = dividend / market price.<br/> Dividend cover = EPS/dividend. 2.5x = 20p / dividend. Dividend = 8p.<br/> Dividend yield = 8p / 280p = 2.86%.<\/p>"},{"s":12,"n":50,"id":"1001387","q":"<p>A company's profit after tax is £2m. If interest is £200,000, taxation is £600,000, and capital employed is £20m, what is the return on capital employed?<\/p>","o":[{"l":"A","h":"10%"},{"l":"B","h":"12%"},{"l":"C","h":"14%"},{"l":"D","h":"16%"}],"a":"C","e":"<p>Return on capital employed = profit before interest and tax / capital employed.<br/> ROCE = (£2m + £0.2m + £0.6m) / £20m = 14%.<\/p>"},{"s":12,"n":51,"id":"1001756","q":"<p>Which of the following statements is most likely to be false regarding a company with a low P/E ratio relative to its sector?<\/p>","o":[{"l":"A","h":"The market perceives it to have low growth prospects"},{"l":"B","h":"It might be regarded as being more risky than its sector"},{"l":"C","h":"It is perceived to be under performing by investors"},{"l":"D","h":"It is likely to have a low dividend yield"}],"a":"D","e":"<p>The PE ratio and dividend yield tend to have an inverse relationship i.e. a company with a relatively low PE ratio will tend to have a high dividend yield. A company that pays most of its profit out as dividends (and therefore has a high dividend yield) will not have much profit to reinvest for future growth (and thus has a low PE).<\/p>"},{"s":12,"n":52,"id":"1001752","q":"<p>Four shares have the following share prices and EPS. Which is the most highly-rated in relation to growth?<\/p>","o":[{"l":"A","h":"190p and 6p"},{"l":"B","h":"275p and 12p"},{"l":"C","h":"200p and 10p"},{"l":"D","h":"150p and 8p"}],"a":"A","e":"<p>Share price divided by EPS gives the PE ratio. '190p and 6p' gives the highest PE ratio (31.7x) and so is the most highly-rated.<\/p>"},{"s":12,"n":53,"id":"1035235","q":"<p>If a company has high interest cover on unsecured loan stock which it has recently issued, what is the consequence of this?<\/p>","o":[{"l":"A","h":"More difficult to pay interest"},{"l":"B","h":"Increased liquidity"},{"l":"C","h":"Improved market rating"},{"l":"D","h":"Dilution of earnings"}],"a":"C","e":"<p>High interest cover indicates that the company can easily afford to pay the interest on its loan capital. Credit rating agencies will view this in a favourable light and the credit rating of the company will reflect this.<\/p>"},{"s":12,"n":54,"id":"1001399","q":"<p>The nominal value of a share is £1.00. The earnings per share is 15p. The dividend per share is 6p. The current share price is 120p. Calculate the dividend yield.<\/p>","o":[{"l":"A","h":"5%"},{"l":"B","h":"12.5%"},{"l":"C","h":"15%"},{"l":"D","h":"50%"}],"a":"A","e":"<p>Dividend yield = dividend / market price x 100 = 6 / 120 x 100 = 5%.<\/p>"},{"s":12,"n":55,"id":"1001878","q":"<p>If an investor holds one share in a company that subsequently undertakes a 4:1 bonus issue, they would have to multiply EPS by:<\/p>","o":[{"l":"A","h":"4"},{"l":"B","h":"0.20"},{"l":"C","h":"1.20"},{"l":"D","h":"0.8"}],"a":"B","e":"<p>If the profit after tax of a company is £1 and 1 share is in issue, EPS will be £1. If the company undergoes a 4:1 bonus issue the EPS will be diluted to £0.20 (£1/5 shares). To avoid any perceived dilution, the former value of £1 would need to be multiplied by 0.20.<\/p>"},{"s":13,"n":1,"id":"1001924","q":"<p>Which of the following is true about money market funds? They invest in securities that are:<\/p>","o":[{"l":"A","h":"Long-term, high-risk"},{"l":"B","h":"Long-term, low-risk"},{"l":"C","h":"Short-term, low-risk"},{"l":"D","h":"Short-term, high-risk"}],"a":"C","e":"<p>Money market funds seek to provide a higher level of current income than traditional bank savings accounts, while also offering liquidity, safety and stability. By investing in short-term corporate and government debt, money market fund managers aim to maintain a consistent net asset value and pay a competitive dividend.<\/p>"},{"s":13,"n":2,"id":"1001465","q":"<p>What is the process by which pension funds can remove re-investment risk and therefore impose certainty in the return of the fund?<\/p>","o":[{"l":"A","h":"Immunisation"},{"l":"B","h":"Indexation"},{"l":"C","h":"Stock selection"},{"l":"D","h":"Market timing"}],"a":"A","e":"<p>Immunisation is the process of buying instruments that have a duration that matches the liability in question.<\/p>"},{"s":13,"n":3,"id":"1015538","q":"<p>The value of which of the following investments is likely to be least volatile?<\/p>","o":[{"l":"A","h":"Building society deposits"},{"l":"B","h":"UK Treasury bonds"},{"l":"C","h":"UK index-linked gilt"},{"l":"D","h":"US T-bill"}],"a":"A","e":"<p>This question should be taken at face value. The value of cash in a building society does not decrease, whereas all the other investments suffer from price risk, i.e. their price could change if interest rates change.<\/p>"},{"s":13,"n":4,"id":"1001793","q":"<p>Which of the following would enable an investor to benefit from future growth in the share price of a company?<\/p>","o":[{"l":"A","h":"Ordinary debt"},{"l":"B","h":"Subordinated loan stock"},{"l":"C","h":"Convertible loan stock"},{"l":"D","h":"Junior debt"}],"a":"C","e":"<p>The conversion element enables the investor to benefit from a rise in the company share price.<\/p>"},{"s":13,"n":5,"id":"1001806","q":"<p>Which of the following is a reason for diversifying a portfolio? To reduce:<\/p>","o":[{"l":"A","h":"Market risk"},{"l":"B","h":"Systematic risk"},{"l":"C","h":"Business risk"},{"l":"D","h":"Unsystematic risk"}],"a":"D","e":"<p>Market/Systematic risk are ways of referring to the risks affecting all companies in the market. They cannot be diversified away. Inherent/Unsystematic can be reduced by diversification. Business risk is often seen as a subset of unsystematic risk, but unsystematic risk is a better answer.<\/p>"},{"s":13,"n":6,"id":"1015563","q":"<p>Why would an investor choose a CC-rated bond as opposed to an A-rated bond?<\/p>","o":[{"l":"A","h":"The CC-rated bond is more certain to pay-out"},{"l":"B","h":"The A-rated bond is more risky"},{"l":"C","h":"The CC-rated bond would give a higher potential return"},{"l":"D","h":"The A-rated bond is classified as a junk bond and is not worth investing in"}],"a":"C","e":"<p>The CC-rated bond has a lower credit bond, and therefore is a riskier investment; as such, it will have a higher-yield or return than the A-rated bond.<\/p>"},{"s":13,"n":7,"id":"1014270","q":"<p>Which of the following investments are regarded as being very high-risk?<\/p>","o":[{"l":"A","h":"National savings certificates"},{"l":"B","h":"Buying options or warrants"},{"l":"C","h":"Listed equities"},{"l":"D","h":"Buying or selling futures"}],"a":"D","e":"<p>Buying and selling futures is regarded as being contingent liability where the investor has<br/> the ability to lose his investment completely and be subject to further losses. Therefore<br/> they represent high-risk investments. Buying options (paying for the choice to<br/> be able to buy or sell) are not regarded as being very high-risk because the investor can only lose what was originally invested.<\/p>"},{"s":13,"n":8,"id":"1002063","q":"<p>Which of the following would be the preferred investment for a life assurance company to fund its long-term obligations?<\/p>","o":[{"l":"A","h":"Treasury bills"},{"l":"B","h":"Equities"},{"l":"C","h":"Warrants"},{"l":"D","h":"Futures"}],"a":"B","e":"<p>Long-term equities will provide the better return. Fixed income securities do not offer a long-term hedge against inflation.<\/p>"},{"s":13,"n":9,"id":"1055551","q":"<p>John is less than 30 years old and is in a good health. John's personal pension is most likely to be predominently invested in?<\/p>","o":[{"l":"A","h":"Gilts"},{"l":"B","h":"Volatile commodity funds"},{"l":"C","h":"Emerging markets equities"},{"l":"D","h":"Corporate bonds"}],"a":"C","e":"<p>Given John's age the best answer is equities, which would be considered to be medium risk, whereas gilts and corporate bonds will have a lower risk profile.<br/> It is possible that John could hold some volatile commodity funds, but these would not be main asset type.<\/p>"},{"s":13,"n":10,"id":"1001469","q":"<p>When choosing more investments to add into a portfolio, which type of correlation with existing investments would reduce the risk the greatest?<\/p>","o":[{"l":"A","h":"Strongly negatively correlated"},{"l":"B","h":"Positively correlated"},{"l":"C","h":"Uncorrelated"},{"l":"D","h":"Weak positive correlation"}],"a":"A","e":"<p>If the returns of one investment fell it would be offset by an increase in the other investment. This is negative correlation.<\/p>"},{"s":13,"n":11,"id":"1001461","q":"<p>Which of the following is TRUE in respect of passive fund management relative to active fund management?<\/p>","o":[{"l":"A","h":"Aim to exceed the benchmark"},{"l":"B","h":"Higher management fees"},{"l":"C","h":"Greater number of trades"},{"l":"D","h":"Fewer trades"}],"a":"D","e":"<p>The others are characteristics of active fund management.<\/p>"},{"s":13,"n":12,"id":"1048095","q":"<p>What investment entity would be interested in commercial paper?<\/p>","o":[{"l":"A","h":"Pension fund"},{"l":"B","h":"Money market fund"},{"l":"C","h":"Life fund"},{"l":"D","h":"Defined benefit fund"}],"a":"B","e":"<p>Commercial paper is a money market instrument.<\/p>"},{"s":13,"n":13,"id":"1051394","q":"<p>An investor wants to hedge a short equity position as she believes that the stock price will rise thereby incurring a loss on her positions. Which of the following is the best strategy to adopt?<\/p>","o":[{"l":"A","h":"Short-futures"},{"l":"B","h":"Long-futures"},{"l":"C","h":"Short-call options"},{"l":"D","h":"Long-put options"}],"a":"B","e":"<p>A long-futures position will make money in a rising market; therefore hedging the loss she makes on the short-cash position.<\/p>"},{"s":13,"n":14,"id":"1015564","q":"<p>If interest rates rise, which ONE of the following is TRUE of the Treasury 6.75% 2028 stock? Its price and yield will:<\/p>","o":[{"l":"A","h":"Rise and rise"},{"l":"B","h":"Fall and rise"},{"l":"C","h":"Fall and fall"},{"l":"D","h":"Rise and fall"}],"a":"B","e":"<p>Interest rates and bond prices have an inverse relationship, so an increase in interest rates will result in a decrease in the price. Yield is calculated as return/price - therefore the yield will increase when prices fall.<\/p>"},{"s":13,"n":15,"id":"1001455","q":"<p>Diversification within a portfolio where the risk/reward profile is maximised would be where it contains:<\/p>","o":[{"l":"A","h":"Random selection"},{"l":"B","h":"Investments within one sector"},{"l":"C","h":"Uncorrelated stocks"},{"l":"D","h":"Correlated stocks"}],"a":"C","e":"<p>Risk will be reduced by diversifying into different companies, business sectors, and types of security and market.<\/p>"},{"s":13,"n":16,"id":"1026886","q
