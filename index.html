ke hold.<\/p>"},{"s":2,"n":92,"id":"1072177","q":"<p>Why might an investor be more interested in using net debt to equity ratio instead of total debt to equity?<\/p>","o":[{"l":"A","h":"To see if the company holds substantial cash and short term investments"},{"l":"B","h":"To determine if the company has been running for less than 3 years"},{"l":"C","h":"The company has an interest cover less than 5"},{"l":"D","h":"To assess why the total debt to gearing ratio appears very low"}],"a":"A","e":"<p>Gearing ratios tend to look at the total debt compared to equity. Sometimes this ratio may be less useful because, as well as holding substantial amounts of debt, the company also holds substantial cash and short-term investments that could be used to repay the debt. So the company is not as risky as it might have seemed.<\/p>"},{"s":2,"n":93,"id":"4004408","q":"<p>Eurobonds, as bearer documents, typically need to be kept safe. They would normally be:<\/p>","o":[{"l":"A","h":"immunised and held in Euroclear or Clearstream"},{"l":"B","h":"immobilised in the investor's personal filing cabinets"},{"l":"C","h":"held in the investor’s name with the issuer holding these details"},{"l":"D","h":"held in depositaries"}],"a":"D","e":"<p>As bearer documents, it is important that eurobonds are kept safe, and this is often achieved by holding the bonds in depositaries, particularly those maintained by Euroclear and Clearstream. When the bonds are deposited in these organisations they are described as being immobilised. Immobilisation does not mean that the bonds cannot be transferred in secondary market transactions, it simply means that the bonds are safely held within a reputable depositary and a buyer is likely to retain the bonds in their immobilised form.<\/p>"},{"s":2,"n":94,"id":"1066448","q":"<p>A household contents insurance company is most likely to invest in:<\/p>","o":[{"l":"A","h":"T-Bills"},{"l":"B","h":"ISA"},{"l":"C","h":"MTN"},{"l":"D","h":"National Savings Certificates"}],"a":"A","e":"<p>General insurance is where insurance is written by an insurance company against short-term personal and commercial risks, such as car or household contents insurance. Because of the short-term nature of the liabilities, the funds from the premiums tend to be invested in low-risk, liquid, short-term assets such as money market instruments.<\/p>"},{"s":2,"n":95,"id":"1065062","q":"<p>Which of the following best describes commercial paper?<\/p>","o":[{"l":"A","h":"Unsecured, discount instrument"},{"l":"B","h":"Secured, coupon bearing instrument"},{"l":"C","h":"Issued by companies, short to medium term"},{"l":"D","h":"Discount instrument, secured by named assets"}],"a":"A","e":"<p>Commercial paper can be looked at as a corportate version of a government T-bill. It is a short term instrument issued at a discount to its face value. Because it is issued by a company and is generally unsecured, commercial paper will have a slightly higher yield than a comparable T-bill.<\/p>"},{"s":2,"n":96,"id":"1079695","q":"<p>Which of the following would show depreciation in the GBP/USD currency rates?<\/p>","o":[{"l":"A","h":"An increase in tourism to the UK"},{"l":"B","h":"A decline in exports from the US"},{"l":"C","h":"Imports to the UK becoming more expensive than exports"},{"l":"D","h":"Federal Reserve sells USD to overseas markets"}],"a":"C","e":"<p>The question does not indicate which currency we are looking for the depreciation in, but, from the answers available, we can identify a solution. Three of the events would relatively strengthen GBP and weaken USD. Imports to the UK becoming more expensive than imports would have the opposite effect.<\/p>"},{"s":2,"n":97,"id":"1065066","q":"<p>An investor is considering the benefits of buying a convertible bond instead of shares in a company. Which of the following would be a benefit of owning the convertible bond?<\/p>","o":[{"l":"A","h":"It would not be affected by a fall in the company's share price"},{"l":"B","h":"Cash flows from the bond ensure a better overall return"},{"l":"C","h":"The opportunity to earn interest on the bond while profiting from any gain in the share price"},{"l":"D","h":"There is no overall benefit"}],"a":"C","e":"<p>The price of a convertible bond would respond to a change in price of the shares. Should the share price increase, the convertible bond holder would therefore profit from this while continuing to receive the coupon payments.<\/p>"},{"s":2,"n":98,"id":"1072143","q":"<p>If there is an increase in inflation, what would be expected impact on interest rates and bond prices?<\/p>","o":[{"l":"A","h":"Rates would increase, price would increase"},{"l":"B","h":"Rates would decrease, price would fall"},{"l":"C","h":"Rates would decrease, price would increase"},{"l":"D","h":"Rates would increase, price would fall"}],"a":"D","e":"<p>If inflation increases, the expection is that the Bank of England would increase interest rates to reduce spending. If interest rates go up, the bond yields would go up by a fall in the bond prices.<\/p>"},{"s":2,"n":99,"id":"1065083","q":"<p>An investor owns 10,000 shares of XYZ plc, which has just announced a 1 for 4 rights offering. The current price of XYZ shares is £1.45 but the subscription price in the offering is £1.20. <br/> The investor would like to take up as many of the rights as possible without using any new cash, so she decides to finance her purchase of shares entirely through the sale of some of her rights. <br/> What is the maximum number of new shares that she can buy in this way?<\/p>","o":[{"l":"A","h":"357"},{"l":"B","h":"714"},{"l":"C","h":"1786"},{"l":"D","h":"2143"}],"a":"A","e":"<p>This question is asking us to calculate the 'maximum subscription at nil cost'...<br/> First we calculate the TERP (share price after the issue)<br/> 4 shares @ £1.45 = £5.80 1 share @ £1.20 = £1.20 Total 5 shares @ £7.00, so TERP = £1.40<br/> No. of rights to be sold = no. of rights x subscription price/ TERP = 2,500 x £1.20/£1.40 = 2143 So number of remaining rights = 2,500 - 2143 = 357<\/p>"},{"s":2,"n":100,"id":"1015667","q":"<p>A company with 6m ordinary shares in issue makes a profit of £1.8m. Given that the current share price is 360p, calculate the P/E.<\/p>","o":[{"l":"A","h":"24"},{"l":"B","h":"12"},{"l":"C","h":"15"},{"l":"D","h":"30"}],"a":"B","e":"<p>PE ratio = share price / EPS<br/> EPS = profit / number of shares = £1.8m / £6m = 30p<br/> Therefore PE = 360p / 30p = 12x<\/p>"},{"s":3,"n":1,"id":"4062268","q":"<p>Which of the following services is commonly provided by a custodian bank?<\/p>","o":[{"l":"A","h":"Managing cash flows"},{"l":"B","h":"Profit forecasting"},{"l":"C","h":"Corporate tax return filing"},{"l":"D","h":"Basic execution only dealing services"}],"a":"A","e":"<p>The core activities that custodian banks undertake include: - holding assets in safekeeping, such as equities and bonds - arranging settlement of any purchases and sales of securities - processing corporate actions, including collecting income from assets, namely dividends in the case of equities and coupons in the case of bonds - providing information on the underlying companies and their annual general meetings (AGMs)<\/p><p>- managing cash transactions<\/p><p>- performing FX transactions when required<\/p><p>- providing regular reporting on all their activities to their clients.<\/p>"},{"s":3,"n":2,"id":"4002931","q":"<p>A company has performed well during the course of the year. In which way is it MOST likely to reward its shareholders?<\/p>","o":[{"l":"A","h":"Declare a high interim dividend"},{"l":"B","h":"Announce a share buyback programme"},{"l":"C","h":"Propose a scrip dividend"},{"l":"D","h":"Declare a high final dividend"}],"a":"D","e":"<p>Dividends are usually paid twice a year and are expressed in pence per share. Interim dividends (based on the first six months' results) are paid in the second half of a company’s accounting period, while final dividends, usually the larger of the two payments, are paid after the end of the company’s accounting year.<\/p>"},{"s":3,"n":3,"id":"1078515","q":"<p>Diversification will help to deal with what type of risk?<\/p>","o":[{"l":"A","h":"Unsystematic"},{"l":"B","h":"Systematic"},{"l":"C","h":"Credit"},{"l":"D","h":"Operational"}],"a":"A","e":"<p>Unsystematic risk is the risk that a particular event will have an adverse effect on a particular share price. The best way for an investor to deal with this is to diversify the portfolio.<\/p>"},{"s":3,"n":4,"id":"4002939","q":"<p>Who recognises the London Stock Exchange?<\/p>","o":[{"l":"A","h":"The Financial Conduct Authority"},{"l":"B","h":"The Competition and Markets Authority"},{"l":"C","h":"The Prudential Regulatory Authority"},{"l":"D","h":"The Financial Services Authority"}],"a":"A","e":"<p>The FCA has to give its recognition before an exchange is allowed to operate in the UK. It has granted recognition to the LSE and, by virtue of this recognition, the exchange is described as a recognised investment exchange (RIE). Note: The 'Financial Services Authority no longer exists, since being broken up in 2013.<\/p>"},{"s":3,"n":5,"id":"1072137","q":"<p>In order to raise capital a company can issue a convertible bond or an exchangeable bond. Would it be possible to have these underwritten with a greenshoe option?<\/p>","o":[{"l":"A","h":"Yes, only on the convertible bond"},{"l":"B","h":"Yes, only on the exchangeable bond"},{"l":"C","h":"Yes, on both types of bonds"},{"l":"D","h":"A greenshoe can only be used with Equities"}],"a":"C","e":"<p>The structure of an offering of a convertible or exchangeable bond mirrors that of equities - the issuer will set a base amount of bonds it wishes to issue and perhaps retain a greenshoe, reserving the right to issue more if demand is strong.<\/p>"},{"s":3,"n":6,"id":"1075031","q":"<p>What is the name given to the firm that has been given joint responsibility to co-ordinate the issue of securities in a particular geographical region?<\/p>","o":[{"l":"A","h":"Co-lead manager"},{"l":"B","h":"Co-manager"},{"l":"C","h":"Syndicate member"},{"l":"D","h":"Book-runner"}],"a":"A","e":"<p>The Co-lead manager is given joint responsibility to co-ordinate the issue of securities in a particular geographical region?<\/p>"},{"s":3,"n":7,"id":"1065095","q":"<p>A firm has received a sell limit order from a professional client. The order is the tenth order received from that client over a period of three months. The order cannot be executed immediately through the firm. <br/> Which of the following reasons would justify the firm not making the order public on the LSE?<\/p>","o":[{"l":"A","h":"The frequency of trading is too high"},{"l":"B","h":"The firm has the discretion to not make the order public"},{"l":"C","h":"The client has instructed otherwise"},{"l":"D","h":"The firm is required to make the order public"}],"a":"C","e":"<p>Limit orders from all customers, not executed immediately, must be made public. <br/> The only exceptions to this requirement is if the client instructs otherwise, or if the order volume is greater than normal market size.<\/p>"},{"s":3,"n":8,"id":"4049388","q":"<p>The bond is trading at 108.00. The accrued interest is calculated at £3.50. How much will an investor pay on settlement?<\/p>","o":[{"l":"A","h":"£3.50"},{"l":"B","h":"£104.50"},{"l":"C","h":"£108.00"},{"l":"D","h":"£111.50"}],"a":"D","e":"<p>The traded price is the clean price or flat price of the bond. This does not include accrued interest. The price paid on settlement (the dirty price) will include accrued interest:<\/p><p>Clean price + accrued interest = Dirty Price<\/p><p>£108.00 + £3.50 = £111.50<\/p>"},{"s":3,"n":9,"id":"1075023","q":"<p>The term 'high water mark' relates to which of the following in a fund?<\/p>","o":[{"l":"A","h":"The annual management fee"},{"l":"B","h":"The ongoing charges"},{"l":"C","h":"The performance fee"},{"l":"D","h":"The investment risk profile"}],"a":"C","e":"<p>The high water mark is used to determine the performance fee.<\/p>"},{"s":3,"n":10,"id":"1078506","q":"<p>Which of the following is not a function of the UK Debt Management Office (DMO)?<\/p>","o":[{"l":"A","h":"Issuance of gilts and T-bills"},{"l":"B","h":"To provide a high quality and efficient service to investors in government debt, and to deal fairly and professionally with market participants in the gilts and money markets, consistent with achieving low cost issuance and an efficient market"},{"l":"C","h":"To make information publicly available on the debt and Treasury bill markets and DMO policies that contributes, through openness and predictability, to efficient markets and lower costs of issuance"},{"l":"D","h":"To regulate the money markets"}],"a":"D","e":"<p>The money markets are regulated by the regulator.<\/p>"},{"s":3,"n":11,"id":"1072153","q":"<p>Which of the below is a definition of a dealer member of an exchange?<\/p>","o":[{"l":"A","h":"A member who trades for the firm's own books"},{"l":"B","h":"A member who trades on behalf of their clients"},{"l":"C","h":"A member who deals directly with the issuer"},{"l":"D","h":"A member who is able to deal for their own books as well as their clients"}],"a":"A","e":"<p>By definition a dealer member can only trade for themselves. They would need a broker dealer membership to trade for both themselves and clients. A broker can only trade as an agent of the client.<\/p>"},{"s":3,"n":12,"id":"1072150","q":"<p>Which of the following would least likely account for the higher risk associated with hedge funds?<\/p>","o":[{"l":"A","h":"High use of derivatives"},{"l":"B","h":"No FSCS cover"},{"l":"C","h":"Less liquid"},{"l":"D","h":"Diversification"}],"a":"D","e":"<p>Hedge funds fall under unregulated collective invesment schemes and deemed to be greater risk based on a few things. Outside of the answers which indicate risks, other factors are:<br/> Little supervision, larger positions (less diverisified), higher charges.<\/p>"},{"s":3,"n":13,"id":"1078894","q":"<p>A 1 for 5 rights issue is announced where the cum-rights price is £7.60 and the subscription cost is £4.60. If the investor is holding 500 shares what is the theoretical ex-rights price?<\/p>","o":[{"l":"A","h":"£2.50"},{"l":"B","h":"£3.24"},{"l":"C","h":"£5.50"},{"l":"D","h":"£7.10"}],"a":"D","e":"<p>5 existing shares x £7.60 = £38.00 + 1 share x £4.60 gives a total of £42.60<br/> £42.60 divided by the 6 shares = £7.10 (theoretical ex rights price).<\/p>"},{"s":3,"n":14,"id":"1072148","q":"<p>An investor relinquishes their investment directly with an authorised corporate director. Which investment vehicle are they using?<\/p>","o":[{"l":"A","h":"Unit trust"},{"l":"B","h":"OEIC"},{"l":"C","h":"Investment Trust"},{"l":"D","h":"Special purpose vehicle"}],"a":"B","e":"<p>In both a unit trust and OEIC, the investor buys and sells directly with the fund manager. In an ICVC/OEIC, the fund manager is known as the authorised coporate director.<\/p>"},{"s":3,"n":15,"id":"1072567","q":"<p>A company wishes to raise capital cheaply. From the company's point of view, which of the following would be seen as the BEST advantage of issuing warrants?<\/p>","o":[{"l":"A","h":"It helps raise the company's profile as it indicates future financial stability"},{"l":"B","h":"To delay the payment of dividends until some time in the future"},{"l":"C","h":"To make a floating charge over assets more attractive to investors"},{"l":"D","h":"To improve the earnings per share"}],"a":"B","e":"<p>The sale of warrants for cash will raise money for the company, and, if the warrants are exercised, further capital will be raised by the company. Holding the warrant does not entitle the investor to receive dividends or to vote at company meetings, so the capital raised, until the warrant is exercised, could be considered as free.<\/p>"},{"s":3,"n":16,"id":"1078413","q":"<p>The Bank for International Settlements identifies different models for delivery versus payment. Which of the following is most likely used in the US?<\/p>","o":[{"l":"A","h":"Model 1 - a system that settle transfer instructions for both securities and funds on a trade-by-trade basis, with unconditional transfer of assets and cash at the same time as a final transfer"},{"l":"B","h":"Model 2 - a system that settle transfer instructions for securities on a gross basis, with final transfer of assets occuring throughout the processing cycle and funds instructions on a net basis with the final transfer of funds at the end of the cycle"},{"l":"C","h":"Model 3 - a system that settle transfer instructions for both securities and funds on a net basis with final transfers taking place at the end of the processing cycle"},{"l":"D","h":"Model 4 - a system that settle transfer instructions for one currency and another currency on a gross basis, with final transfer of payments .instructions on a net basis with the final transfer of funds at the end of the cycle"}],"a":"B","e":"<p>Model 1 is used mostly in Europe and Eurasia. Model 2 is mostly used in the US and emerging markets. Model 4 does not exist and has been made up<\/p>"},{"s":3,"n":17,"id":"4002938","q":"<p>Calculate the present value of a two year principal strip from a 2% Treasury using yields of 8% pa.<\/p>","o":[{"l":"A","h":"£85.73"},{"l":"B","h":"£87.58"},{"l":"C","h":"£89.30"},{"l":"D","h":"£92.59"}],"a":"A","e":"<p>As the bond is stripped there are no coupons to discount, therefore it is only for the principal that we need to find the present value. £100 ÷ 1.08^2 = £85.73.<\/p>"},{"s":3,"n":18,"id":"1078509","q":"<p>Which one of the following statements about hybrid trading systems used by exchanges is true?<\/p>","o":[{"l":"A","h":"They are used for trading the largest companies on the LSE"},{"l":"B","h":"NASDAQ in the USA is a hybrid trading system"},{"l":"C","h":"It describes where exchanges allow brokers to deal with company directors"},{"l":"D","h":"They feature both order-driven and quote-driven systems"}],"a":"D","e":"<p>Some trading systems combine features of both order-driven and quote-driven systems – these are referred to as hybrid systems and include the LSE’s Stock Exchange Electronic Trading Service – quotes and crosses (SETSqx).<\/p><p>Order-driven systems are very common in the equity markets – the NYSE, the TSE and trading in the shares of the largest companies on the LSE are all examples of order-driven equity markets.<\/p><p>NASDAQ is an example of a quote-driven system.<\/p>"},{"s":3,"n":19,"id":"1066421","q":"<p>An investor is holding a convertible bond purchased at the market price of £125 per £100 nominal value. The terms of the bond means that the investor has the right to convert into 50 shares, which are currently trading at £2.10 per share. What is the conversion premium?<\/p>","o":[{"l":"A","h":"10%"},{"l":"B","h":"16%"},{"l":"C","h":"19%"},{"l":"D","h":"84%"}],"a":"C","e":"<p>£100 nominal value is one bond and one bond gives 50 shares. Therefore as the investor paid £125 for the bond each share would cost £125 ÷50 = £2.50. Therefore the investor has overpaid 40p for each share. 40p ÷ £2.10 = 0.19 x 100 gives us 19%<\/p>"},{"s":3,"n":20,"id":"4002933","q":"<p>Why would a company perform a stock split, rather than a capitalisation issue?<\/p>","o":[{"l":"A","h":"To reduce the risk of the nominal value going below a certain amount"},{"l":"B","h":"To better improve the liquidity of the company’s shares"},{"l":"C","h":"To protect the dividend per share ratio"},{"l":"D","h":"To ensure there is no change in the share capital line"}],"a":"D","e":"<p>There is little difference between a bonus issue (also known as a 'capitalisation issue') and a stock split in terms of the impact on share price, but the way in which the two impact the accounts of the company is different. A bonus issue will increase the share capital balance reflected in the accounts, with a corresponding movement from reserves. A stock split will not alter the share capital balance – it will be the same total amount but will be subdivided into a larger number of shares, each with a smaller nominal value.<\/p>"},{"s":3,"n":21,"id":"1066464","q":"<p>Which of the following would be FALSE when investing in overseas bonds?<\/p>","o":[{"l":"A","h":"It poses a higher risk which is mainly down to currency risk"},{"l":"B","h":"The strategy could be subject to double withholding tax unless there is a double taxation agreement"},{"l":"C","h":"In the event of liquidation the investor will be covered by FSCS"},{"l":"D","h":"To encourage investors from overseas, governments can issue bonds denominated in a non-domestic currency"}],"a":"C","e":"<p>The Financial Services Compensation Scheme (FSCS) covers only UK authorised firms, so not all investments have FSCS coverage.<\/p>"},{"s":3,"n":22,"id":"4049376","q":"<p>Eurozone investor buys a US T-bond denominated in Euros. For which reason will they need to sacrifice the risk free return commonly associated with government debt?<\/p>","o":[{"l":"A","h":"It is the only way to avoid currency risk"},{"l":"B","h":"It is the only way to avoid inflation risk"},{"l":"C","h":"Euros can only be printed in the Eurozone"},{"l":"D","h":"Only Eurozone bonds are default risk free"}],"a":"C","e":"<p>Although the US government issues risk-free bonds, this is only when they are denominated in their domestic currency. This condition eliminates default risk as, if all things fail, the US government can always print more dollars to pay off a dollar debt. If the debt is in Euros, however, this method of meeting obligations is not possible. <\/p>"},{"s":3,"n":23,"id":"4049372","q":"<p>The market is showing signs of unrest. If an investor wishes to pursue a flight to quality, which of the following bonds might they choose?<\/p>","o":[{"l":"A","h":"Recently issued 10-year US T-bond"},{"l":"B","h":"An SPV-issued asset-backed security"},{"l":"C","h":"A high-yield corporate bond"},{"l":"D","h":"A UK floating charge debenture"}],"a":"A","e":"<p>Of the four bond, the US T-Bond is the least risky and most likely to meet its obligations.<\/p>"},{"s":3,"n":24,"id":"1072149","q":"<p>When is an investor able to find out the price of shares of exchange traded funds?<\/p>","o":[{"l":"A","h":"At the end of each day"},{"l":"B","h":"Weekly"},{"l":"C","h":"Continuously"},{"l":"D","h":"Monthly"}],"a":"C","e":"<p>One of the key features of ETFs is that, since they are listed securities and trade in the same manner as shares, the pricing takes place in real time and the funds can be bought or<br/> sold during all times when markets are open.<\/p>"},{"s":3,"n":25,"id":"1078507","q":"<p>Who decides whether a company is appropriate to apply for a quotation on the junior market of an exchange?<\/p>","o":[{"l":"A","h":"Listing agent"},{"l":"B","h":"Broker"},{"l":"C","h":"Listing authority"},{"l":"D","h":"Company secretary"}],"a":"A","e":"<p>The listing agent/nominated adviser (NOMAD) is responsible, amongst other duties, for warranting to the Exchange that a particular company is appropriate for the UK's junior market.<\/p>"},{"s":3,"n":26,"id":"1072138","q":"<p>The credit rating of a particular corporate bond has changed from A3 to A1, what is the likely effect on the bond?<\/p>","o":[{"l":"A","h":"Increase in price"},{"l":"B","h":"Increase in the coupon"},{"l":"C","h":"Increase in the running yield"},{"l":"D","h":"Decrease in modified duration"}],"a":"A","e":"<p>The question is using the Moody's rating system which indicates an upgrade and therefore the price will rise and the yield would fall. Lower yielding bonds have a higher modified duration.The coupon would remain unchanged in a conventional bond.<\/p>"},{"s":3,"n":27,"id":"1072159","q":"<p>An investor places a bid in a tender offer. Which of the below BEST explains their allocation of shares?<\/p>","o":[{"l":"A","h":"Their allocation will be on a pro rate basis across the board based on the total bids received"},{"l":"B","h":"Their allocation will be taken up at their bid price"},{"l":"C","h":"They will only be successful if their price is above the acceptance level"},{"l":"D","h":"They will receive all of the shares if their bid was on time"}],"a":"C","e":"<p>In a tender offer, you will only be successful if the bid price is above the acceptance level and if successful the price paid is the same for all.<\/p>"},{"s":3,"n":28,"id":"4002932","q":"<p>Company X increases its holdings in company Y and yet does NOT trigger disclosure under the Takeover Code, which of the following would BEST explain this?<\/p>","o":[{"l":"A","h":"Holdings in Y increases from 30.1% by just 2%"},{"l":"B","h":"A formal offer for Y from X is under consideration"},{"l":"C","h":"X is a major supplier of Y"},{"l":"D","h":"An offer is made and it is all in cash"}],"a":"C","e":"<p>All the other three choices require disclosure. There is no indication that X has breached the 3% disclosure ceiling from the content of the question.<\/p>"},{"s":3,"n":29,"id":"1066467","q":"<p>A company performs a 2:1 bonus issue, which of the following is most likely?<\/p>","o":[{"l":"A","h":"The market capitalisation of the company will fall"},{"l":"B","h":"The share price will increase"},{"l":"C","h":"The share premium account will fall"},{"l":"D","h":"The earning per share will increase"}],"a":"C","e":"<p>The issuing of new shares for the bonus issue will increase the called up share capital (number of shares issued x nominal value) on the balance sheet. To offset this, the share premium account will fall.<\/p>"},{"s":3,"n":30,"id":"4049375","q":"<p><\/p><p>How would a trader normally gain dark liquidity?<\/p>","o":[{"l":"A","h":"Partially hidden orders"},{"l":"B","h":"Private transactions"},{"l":"C","h":"Multilateral trading facilities"},{"l":"D","h":"Market makers"}],"a":"C","e":"<p>The obvious answer is dark pools. Dark pools are a form of MTF (or alternative trading system (ATS) in the US).<\/p>"},{"s":3,"n":31,"id":"1072169","q":"<p>Which of the below would NOT appear on a company's financial statements?<\/p>","o":[{"l":"A","h":"The nominal value of equity and preference share capital the company has in issue"},{"l":"B","h":"Cash the company generated over the accounting period"},{"l":"C","h":"Summary of the trading activities of the company over the year"},{"l":"D","h":"Disclosures in relation to contingent liabilities"}],"a":"D","e":"<p>The choices A B and C appear within a statement of financial position, cash flow statement and income statement respectively. There may be other information that needs to be disclosed in the notes but would not appear in the financial statements itself.<\/p>"},{"s":3,"n":32,"id":"1078514","q":"<p>Any company traded on an exchange must, according to company legislation do which of the following?<\/p>","o":[{"l":"A","h":"Produce interim financial statements"},{"l":"B","h":"Hold annual general meetings"},{"l":"C","h":"Make all information available to directors available to shareholders"},{"l":"D","h":"Make sure shareholder rights are upheld in merger situations"}],"a":"B","e":"<p>Company legislation details the requirements for companies generally, such as the requirement to prepare annual accounts, to have accounts audited and for Annual General Meetings. Of particular significance to the LSE are the Companies Act requirements to enable a company to be a plc, since one of the requirements for a company to be listed and traded on the exchange is that the company is a plc.<\/p>"},{"s":3,"n":33,"id":"1078511","q":"<p>Which of the following is required for a company seeking to be admitted to a premium market of an exchange?<\/p>","o":[{"l":"A","h":"Independently audited accounts covering at least three years."},{"l":"B","h":"A minimum market capitalisation of £10,000,000"},{"l":"C","h":"A nominated advisor"},{"l":"D","h":"1 year of working capital"}],"a":"A","e":"<p>The issuer must have produced consolidated, independently audited accounts covering at least three years.<br/> The expected market value of all securities issued by the company, and to be listed, must be at least £30,000,000 for shares and £200,000 for debt securities. (There are exceptions where the amount of debt securities is not fixed, and also if the securities of the same class are already listed).<br/> At least 10% of the shares must be available for public trading, i.e., not be held by directors or significant shareholders (5%+). This is known as free float. A nominated advisor (NOMAD) is required for AIM.<\/p>"},{"s":3,"n":34,"id":"1072152","q":"<p>An investor chooses to buy a bond and sell it before maturity. Which of the following poses a risk for them?<\/p>","o":[{"l":"A","h":"Reduction of the capital value"},{"l":"B","h":"Default on capital redemption"},{"l":"C","h":"Price increases above the nominal value"},{"l":"D","h":"Price falls below the nominal value"}],"a":"D","e":"<p>The capital value of the bond remains the same and does not change. If the investor sells the bond, they would not be entitled to the coupons anyways. If the price falls below the nominal value they would lose as had they held the bond to maturity then they would have received the nominal value.<\/p>"},{"s":3,"n":35,"id":"1072570","q":"<p>A convertible bond paying semi annual coupons gives the holder the opportunity to convert into 25 shares. If the bond is trading at £130 and the current share price is £4.40, what is the conversion premium?<\/p>","o":[{"l":"A","h":"7.7%"},{"l":"B","h":"9.1%"},{"l":"C","h":"15.4%"},{"l":"D","h":"18.2%"}],"a":"D","e":"<p>A convertible bond issued is trading at £130. It offers the holder the option of converting £100 nominal into 25 shares. The shares are currently trading at £4.40. To calculate the premium, first work out the share value of the conversion choice. For £100 nominal value, that is £4.40 x 25 shares = £110.00.<br/> The bond is trading at £130, so the premium in absolute terms is £130 - £110.00 = £20.00.<br/> It is more usual to express it as a percentage of the conversion value: (£20.00/£110) x 100 = 18.18%<\/p>"},{"s":3,"n":36,"id":"1072136","q":"<p>Upon liquidation of a company, which would rank above subordinated loan stock?<\/p>","o":[{"l":"A","h":"Unsecured debt"},{"l":"B","h":"Mezzanine debt"},{"l":"C","h":"Ordinary shares"},{"l":"D","h":"Preference shares"}],"a":"A","e":"<p>All creditors would be ranked above shareholders of a company. Within bond holders the order would be; fixed charge holders, floating charge holders, loan stock, subordinated loan stock, mezzanine debt.<\/p>"},{"s":3,"n":37,"id":"1065564","q":"<p>Which of the following would account for increased volatility in the foreign exchange markets on the first Friday of every month?<\/p>","o":[{"l":"A","h":"Where currency futures, options and forward contracts expire on that day"},{"l":"B","h":"Issuance of the Non-Farms Payroll"},{"l":"C","h":"Publication of the Fed Funds target rate"},{"l":"D","h":"Publication of the Personal Consumption Expenditure Price Index"}],"a":"B","e":"<p>The most volatile periods for FX trading are often seen in conjunction with the release of key economic data. The US Labour Department issues its monthly employment data, more commonly known as the Non-Farms Payroll (NFP) report, on the first Friday of each month at 8:30 Eastern time, and it can often be a major mover of foreign exchange rates.<br/> Triple witching takes place 4 times a year, Fed Funds target rates take place 8 times a year and the PCEPI is monthly but not necessarily on the first Friday in every month.<\/p>"},{"s":3,"n":38,"id":"4049377","q":"<p><\/p><p>Where a bond is repaid in a single lump sum at the maturity date, this is an example of:<\/p>","o":[{"l":"A","h":"Sinking funds"},{"l":"B","h":"Bullet bond"},{"l":"C","h":"Floating rate bond"},{"l":"D","h":"Putable bond"}],"a":"B","e":"<p>This is a bullet bond (or plain vanilla bond) where the full redemption is made on the redemption date only.<\/p>"},{"s":3,"n":39,"id":"1072578","q":"<p>An investor has held a 2.75% Treasury 2037 gilt for 2 years and are just about to receive the income payment. How much would they receive expressed as a percentage?<\/p>","o":[{"l":"A","h":"11%"},{"l":"B","h":"5.5%"},{"l":"C","h":"2.75%"},{"l":"D","h":"1.375%"}],"a":"D","e":"<p>Gilts are paid semi-annually so the investor will receive on the next coupon payment date half of the annual coupon.<\/p>"},{"s":3,"n":40,"id":"1072168","q":"<p>How are shares held when using a corporate nominee account?<\/p>","o":[{"l":"A","h":"Shares of each investor is held separately"},{"l":"B","h":"Investor can choose how they wish for them to be held"},{"l":"C","h":"Nominee would be kept separate to the register"},{"l":"D","h":"Shares of all investors are pooled together"}],"a":"D","e":"<p>The corporate nominee is a halfway house between the pooled and the designated nominee structures offered by stockbrokers. It will result in a single entry for all the shareholders together in the company's register (like the pooled nominee) but beneath this the issuing company (or its registrar) will be aware of the individual holdings that make up the nominee.<\/p>"},{"s":3,"n":41,"id":"1072166","q":"<p>A listed company wishes to announce some information regarding a new project it has undertaken. How should this be disclosed?<\/p>","o":[{"l":"A","h":"Through the media"},{"l":"B","h":"Through a primary information provider"},{"l":"C","h":"Through a secondary information provider"},{"l":"D","h":"Through the London Stock Exchange"}],"a":"B","e":"<p>Under the disclosure and transparency rules, any price sensitive information should be disclosed through a primary information provider.<\/p>"},{"s":3,"n":42,"id":"1072140","q":"<p>What does immobilisation mean in the context of Eurobonds?<\/p>","o":[{"l":"A","h":"They are held in depositaries"},{"l":"B","h":"They can only be settled through one CSD"},{"l":"C","h":"They can only be issued by a single bank"},{"l":"D","h":"They can not be sold in countries with exchange rate controls in place"}],"a":"A","e":"<p>As Eurobonds are issued in bearer form, they are hold securely in depositaries.<\/p>"},{"s":3,"n":43,"id":"1072147","q":"<p>Which of the following is a service that is typically offered by a prime broker?<\/p>","o":[{"l":"A","h":"Leveraged trade execution"},{"l":"B","h":"Transfer service"},{"l":"C","h":"Foreign exchange advice"},{"l":"D","h":"Income enhancement"}],"a":"A","e":"<p>The typical services include:<br/> Securities lending and borrowing<br/> Leveraged trade execution<br/> Cash management<br/> Custody<br/> Core settlement<br/> Rehypothecation<\/p>"},{"s":3,"n":44,"id":"1075034","q":"<p>Which of the following German Government bonds has the shortest maturity at issuance?<\/p>","o":[{"l":"A","h":"Bobl"},{"l":"B","h":"Bund"},{"l":"C","h":"Schatz"},{"l":"D","h":"Band"}],"a":"C","e":"<p>The Schatz has 2 years. The Bobl has 3 to 5 and Bund 10-30 years to maturity.<\/p>"},{"s":3,"n":45,"id":"1072163","q":"<p>Which of the below is a benefit of using a central counterparty service?<\/p>","o":[{"l":"A","h":"Price transparency"},{"l":"B","h":"Improved prices"},{"l":"C","h":"Removes systemic risk"},{"l":"D","h":"Transparency of counterparty"}],"a":"B","e":"<p>As more participants are willing to transact anonymously, it is argued that a CCP results in improvements in price. Price transparency is a benefit of an exchange. CCPs help in reducing systemic risk as it reduces counterparty risk but does not remove it completely. Another benefit is total anonymity as don't know who the original counterparty was.<\/p>"},{"s":3,"n":46,"id":"4004400","q":"<p>Bill is a closed-ended fund manager and Andy is an authorised open-ended fund manager. Which of the following is TRUE?<\/p>","o":[{"l":"A","h":"Bill’s fund will offer bid/ask pricing whereas Andy’s fund will not"},{"l":"B","h":"Both funds can invest in quoted companies"},{"l":"C","h":"Investors in Bill’s fund will only buy in the primary market whereas investors can buy Andy’s fund in the secondary market"},{"l":"D","h":"The price of purchasing Andy’s and Bill’s funds is driven by supply and demand"}],"a":"B","e":"<p>Closed-ended investment trusts have wider investment freedom than authorised open-ended investment funds, such as unit trusts and OEICs. Unlike authorised OEICs, closed-ended investment trusts can: • invest in unquoted private companies as well as quoted companies • provide venture capital to new companies or companies requiring new funds for expansion. • borrow money to help them achieve their objectives. Authorised open-ended collective schemes’ powers to borrow are more limited. The ability to borrow allows an investment trust to leverage returns for the investor. Such gearing also increases the volatility of returns. Both funds can offer bid/offer pricing, both can invest in quoted companies, Bill’s fund trades in the secondary market, whereas Andy’s does not and Andy’s fund must trade at their net asset value.<\/p>"},{"s":3,"n":47,"id":"1078513","q":"<p>Which of the following best outlines the main role of a nominated adviser after the company has been admitted for trading?<\/p>","o":[{"l":"A","h":"Only sponsors have continuing obligations"},{"l":"B","h":"To support trading in the company's shares"},{"l":"C","h":"Provide advice on exchange rules"},{"l":"D","h":"To assist in pricing and marketing in a flotation"}],"a":"C","e":"<p>The nominated adviser (nomad) must be available at all times to advise and guide the directors of its clients about their obligations and to ensure compliance with the exchange rules.<br/> Supporting trading in the company's shares and assisting in pricing and marketing in a flotation are the roles of the nominated brokers.<\/p>"},{"s":3,"n":48,"id":"4002929","q":"<p>The diluted EPS figure is:<\/p>","o":[{"l":"A","h":"An actual calculation based on assumptions about the present impact of convertibles and warrants which will take place, and its importance to any potential investor"},{"l":"B","h":"A theoretical calculation based on assumptions about the future, which will not actually take place, and its importance to the reader of the accounts and any potential investor"},{"l":"C","h":"An actual calculation based on assumptions about present events limited to this year, due to the exercise of any convertible securities and it shows the importance to the reader of the accounts"},{"l":"D","h":"A theoretical calculation based on assumptions about future events, which may or may not actually take place, and its importance to the reader of the accounts and any potential investor"}],"a":"D","e":"<p>The diluted EPS figure is a theoretical calculation based on assumptions about the future (which may or may not actually take place) and it is considered of such importance to the reader of the accounts and a potential investor that its calculation and disclosure is required by IAS 33 – earnings per share (FRS 22 in the UK). IAS 33 requires the disclosure of both basic and diluted EPS on the face of the statement of profit and loss, both for net profit or loss for the period and profit or loss for continuing operations.<\/p>"},{"s":3,"n":49,"id":"1072161","q":"<p>A company announces a 1:3 rights issue and a shareholder wishes not to take up their right to buy the shares but to sell their rights. If the subscription price is £3, the shareholder has 1800 shares and the cum rights price is £4. Calculate the expected nil paid premium per right?<\/p>","o":[{"l":"A","h":"50p"},{"l":"B","h":"75p"},{"l":"C","h":"£90"},{"l":"D","h":"£450"}],"a":"B","e":"<p>The expected nil paid premium is the theoretical ex-rights price - subscription price. TERP: Before rights issue: 3 shares x £4 = £12 During rights issue: 1 share x £3 = £3 Total value = £15 / 4 total shares = £3.75 So nil paid price per share = £3.75 - £3 = 75p<br/> Careful as the question is asking per right/share!<\/p>"},{"s":3,"n":50,"id":"1078855","q":"<p>Preference shares can come in a variety of forms, which of the following is LEAST likely about a participating preference share?<\/p>","o":[{"l":"A","h":"They typically do not get voting rights"},{"l":"B","h":"Their dividend can be dependent on profit"},{"l":"C","h":"They are considered safer than ordinary shares"},{"l":"D","h":"In liquidation they rank equally with mezzanine debt"}],"a":"D","e":"<p>In the event of liquidation all equity is below debt. A drawback of preference shares when compared to ordinary shares is that, if the company starts to generate large profits, the ordinary shareholders will often see their dividends rise, whereas the preference shareholders still get a fixed level of dividend. To counter this these type of preference shares offer the opportunity to participate in higher distributions.<\/p>"},{"s":3,"n":51,"id":"4062254","q":"<p>If a company chooses to release part of its equity stake in order to obtain a listing using the offer for sale route, what initially happens to the newly issued shares?<\/p>","o":[{"l":"A","h":"They are auctioned to a panel of investment banks"},{"l":"B","h":"They are sold to an issuing house"},{"l":"C","h":"Existing shareholders are invited to tender for them"},{"l":"D","h":"Existing shareholders are invited to buy them outright"}],"a":"B","e":"<p>The issuing company sells its shares to the issuing house (usually an investment bank), which then invites applications from the public at a slightly higher price than the issuing house has paid and on the basis of a detailed prospectus, known as the offer document.<\/p>"},{"s":3,"n":52,"id":"4062269","q":"<p>Which types of bonds are most commonly purchased following a carry trade in the foreign exchange markets?<\/p>","o":[{"l":"A","h":"Bonds with high yields"},{"l":"B","h":"Bonds with low yields"},{"l":"C","h":"Bonds with short periods to redemption"},{"l":"D","h":"Bonds with long periods to redemption"}],"a":"A","e":"<p>The carry trade in FX involves the borrowing of funds in a currency where the rate of interest is relatively low and then the purchase of securities, often government bonds, which have a relatively high yield<\/p>"},{"s":3,"n":53,"id":"4002930","q":"<p>Money market funds aim to achieve maximum returns while minimising credit, market and liquidity risks. These funds typically invest in:<\/p>","o":[{"l":"A","h":"Government securities, short-term bonds, commercial paper, repurchase agreements or even other money market funds"},{"l":"B","h":"T-bills, medium-term bonds, commercial paper, repurchase agreements or even stock lending agreements"},{"l":"C","h":"T-bills, medium-term bonds, commercial paper, repurchase agreements or even enterprise investment schemes"},{"l":"D","h":"Government securities, long-term bonds, commercial paper, repurchase agreements or even cross currency swaps"}],"a":"A","e":"<p>Money market funds are managed funds that invest in short-term, low-risk credit securities. They aim to achieve maximum returns while minimising credit, market and liquidity risks. They typically invest in assets such as government securities, short-term bonds, commercial paper (CP), repurchase agreements or even other money market funds.<\/p>"},{"s":3,"n":54,"id":"1072177","q":"<p>Why might an investor be more interested in using net debt to equity ratio instead of total debt to equity?<\/p>","o":[{"l":"A","h":"To see if the company holds substantial cash and short term investments"},{"l":"B","h":"To determine if the company has been running for less than 3 years"},{"l":"C","h":"The company has an interest cover less than 5"},{"l":"D","h":"To assess why the total debt to gearing ratio appears very low"}],"a":"A","e":"<p>Gearing ratios tend to look at the total debt compared to equity. Sometimes this ratio may be less useful because, as well as holding substantial amounts of debt, the company also holds substantial cash and short-term investments that could be used to repay the debt. So the company is not as risky as it might have seemed.<\/p>"},{"s":3,"n":55,"id":"1078872","q":"<p>A company is looking to be listed in the UK, to whom would the application be made?<\/p>","o":[{"l":"A","h":"The FCA as the UK's Listing Authority"},{"l":"B","h":"The Prudential Regulatory Authority"},{"l":"C","h":"The Bank of England"},{"l":"D","h":"The Debt Management Office"}],"a":"A","e":"<p>The formal description of the FCA's role as the United Kingdom Listing Authority (UKLA) is that it is the competent authority for listing - making the decisions as to which companies' shares and bonds (including UK government bonds or gilts) can be admitted to be traded on the main market of the London Stock Exchange (LSE).<\/p>"},{"s":3,"n":56,"id":"1072162","q":"<p>A company announces a 2:3 scrip issue which has an ex-price of £1.20. Calculate the cum-scrip price.<\/p>","o":[{"l":"A","h":"£2"},{"l":"B","h":"£0.72"},{"l":"C","h":"£1"},{"l":"D","h":"£1.36"}],"a":"A","e":"<p>Ex-price is the price after the scrip issue which is the reduced price to get to the original price:<br/> £1.20 x 5 new shares / 3 old shares= £2<\/p>"},{"s":3,"n":57,"id":"4002942","q":"<p>What is the main purpose of a dividend paid by a UK company?<\/p>","o":[{"l":"A","h":"To provide a return on risk capital"},{"l":"B","h":"To distribute profits to the owners of the company"},{"l":"C","h":"To distribute sales income to the shareholders"},{"l":"D","h":"To ensure shareholders are compensated due to the effects of inflation"}],"a":"B","e":"<p>The owners of a company are its shareholders. If the company is sufficiently profitable, the ordinary shareholders may receive dividends. Dividends for ordinary shareholders are proposed by the directors and generally ratified by the shareholders at the annual meeting (often referred to as the annual general meeting (AGM)).<\/p>"},{"s":3,"n":58,"id":"1064037","q":"<p>Which of the following is NOT an advantage of REITs?<\/p>","o":[{"l":"A","h":"Shareholders do not pay tax on income received"},{"l":"B","h":"REITs are traded on stock exchanges"},{"l":"C","h":"Investors can adjust their strategic and tactical asset allocation using REITs"},{"l":"D","h":"REITs produce steady income for shareholders"}],"a":"A","e":"<p>Shareholders do pay personal tax on income and capital gains received from REITs, but they avoid double taxation as REITs do not pay corporate taxes<\/p>"},{"s":3,"n":59,"id":"1075566","q":"<p>Which one of the following institutions would most likely manage cash transactions and perform foreign exchange transactions on behalf of clients, whilst also looking after securities which belong to those clients and ensuring they are properly protected.<\/p>","o":[{"l":"A","h":"Investment Bank"},{"l":"B","h":"Custodian Bank"},{"l":"C","h":"Insurance Company"},{"l":"D","h":"Private Bank"}],"a":"B","e":"<p>Custodians are banks that specialise in safe custody services, looking after portfolios of shares and bonds on behalf of others. This would include cash transactions, for example paying for shares bought by clients and FX deals if the stock was in a foreign currency.<\/p>"},{"s":3,"n":60,"id":"4025897","q":"<p>Generally Accepted Accounting Practices (GAAP) are which of the following?<\/p>","o":[{"l":"A","h":"Provide a basis for good practice"},{"l":"B","h":"Legal everywhere"},{"l":"C","h":"A single set of rules that all companies must follow"},{"l":"D","h":"Can be ignored in the areas listing authority deems it to be necessary"}],"a":"A","e":"<p>Officially it should not have the term ‘practices’ but this might give away the answer if the correct principles are used. The combination of accounting regulations is often referred to as the generally accepted accounting principles (GAAP) and efforts are being made to harmonise GAAP throughout the world, however there are still some differences<\/p>"},{"s":3,"n":61,"id":"1072155","q":"<p>Which of the following processes is used primarily to increase the marketability of a company's shares?<\/p>","o":[{"l":"A","h":"Offer for subscription"},{"l":"B","h":"Offer for sale"},{"l":"C","h":"Introduction"},{"l":"D","h":"Rights issue"}],"a":"C","e":"<p>All of the answers could help a company in terms of marketability but the other three answers involve the company raising capital. An introduction does not raise further share capital but obtains another listing purely to have more liquidity and therefore this is the best answer.<\/p>"},{"s":3,"n":62,"id":"1078508","q":"<p>A benefit of a central counterparty service is:<\/p>","o":[{"l":"A","h":"Reduced administration"},{"l":"B","h":"Disclosure of parties to the trade"},{"l":"C","h":"Reduced FX risk"},{"l":"D","h":"Increased credit risk"}],"a":"A","e":"<p>The identity of the counterparty will not be disclosed, the CCP service has no impact of FX, and it reduces credit risk. However, there is a reduction in administration thanks to the ability to settle on a net basis with a single counterparty, such as LCH.<\/p>"},{"s":3,"n":63,"id":"1072158","q":"<p>For asset backed securities, why is a special purpose vehicle used?<\/p>","o":[{"l":"A","h":"They are backed by the government"},{"l":"B","h":"They provide off balance sheet treatment"},{"l":"C","h":"Higher yield for the investors"},{"l":"D","h":"They provide a guarantee to investors"}],"a":"B","e":"<p>The special purpose vehicle (SPV) is a legal entity created for the sole purpose of issuing bonds and would be separate to the issuer of debt, therefore bankruptcy remote. This adds to the security of investors but there is no guarantee that the SPV will be able to meet its obligations as it would rely on cash flows from other debt obligations.<\/p>"},{"s":3,"n":64,"id":"1070792","q":"<p>Which of the following would BEST describe the point when a pension fund interest in shares of another company might no longer be considered to be in the free float?<\/p>","o":[{"l":"A","h":"3%"},{"l":"B","h":"5%"},{"l":"C","h":"Greater than 5%"},{"l":"D","h":"Shares held by the pension fund will always be considered in the free float"}],"a":"B","e":"<p>The free-float or a public float is usually defined as being all shares held by investors. Shares held by owners owning 5% of all shares (those could be institutional investors (such as pension funds), strategic shareholders, founders, executives, and other insiders' holdings);<\/p>"},{"s":3,"n":65,"id":"1072133","q":"<p>A bond's annual income is based on which of the following?<\/p>","o":[{"l":"A","h":"Price of the bond"},{"l":"B","h":"Capital value of the bond"},{"l":"C","h":"Interest rates"},{"l":"D","h":"Inflation rates"}],"a":"B","e":"<p>A bond's income (coupon) is expressed as a percentage of the nominal value which represents the capital value of the bond.<\/p>"},{"s":3,"n":66,"id":"1067797","q":"<p>ABC plc's 3 year bond has a yield of 4.5% and its 10 year bond is yielding 6.5%. If an investor believes that the yield spread between the two bonds will increase to 250 basis points. If he is correct, which of the following strategies would be profitable?<\/p>","o":[{"l":"A","h":"Buy the 3 year and sell the 10 year"},{"l":"B","h":"Sell the 3 year and buy the 10 year"},{"l":"C","h":"Buy the 3 year and buy the 10 year"},{"l":"D","h":"Sell the 3 year and sell the 10 year"}],"a":"A","e":"<p>The spread is widening here, which means that the yield of the 10 year bond is increasing relative to the 3 year issue. The longer term bond's yield will increase, its price will be falling. The investor would therefore buy the 3 year bond and sell the 10 year bond .<\/p>"},{"s":3,"n":67,"id":"1066429","q":"<p>A US company has an obligation to pay a British supplier; the current exchange rate is 1GBP:1.5251USD. They approach their bank to enquire the exchange rate and are quoted 240/262. At what price will they be able to convert into sterling?<\/p>","o":[{"l":"A","h":"1.5240"},{"l":"B","h":"1.5251"},{"l":"C","h":"1.5262"},{"l":"D","h":"1.5273"}],"a":"C","e":"<p>The buyer's rate and seller's rate refer to buying and selling dollars respectively. The difference between the buyer's and seller's rates is generally referred to as the bid-offer spread. It enables the bank offering the deals to make money.<br/> How much will an investor get if the above spot rate is applied? If the investor wants to sell $50,000 for pounds sterling, he will get £32,761.10. This is based on the seller's rate of $1.5262:£1.<br/> A typical sterling/dollar spot quote might look something like this: GBP/USD spot rate 1.5240-1.5262<br/> Buyer's rate: £1 buys $1.5240<br/> Seller's rate: $1.5262 buys £1<\/p>"},{"s":3,"n":68,"id":"4049373","q":"<p>A dealer acting as principal will perform which of the following?<\/p>","o":[{"l":"A","h":"Buying and selling securities with clients"},{"l":"B","h":"Advising on a commission only basis"},{"l":"C","h":"Providing advice on capital structure"},{"l":"D","h":"Arranging deals for clients"}],"a":"A","e":"<p>A principal trader with trade for their own account either with counterparties or clients.<\/p>"},{"s":3,"n":69,"id":"1068212","q":"<p>If the Dow Jones divisor is 0.2 and the sum of share prices in the index increases by $2m, what would be the impact on the sum of prices used to calculate the index?<\/p>","o":[{"l":"A","h":"An increase of $10m"},{"l":"B","h":"An increase of $0.4m"},{"l":"C","h":"A decrease of $0.4m"},{"l":"D","h":"A decrease of $10m"}],"a":"A","e":"<p>The sum of the prices of all 30 DJIA stocks is divided by the Dow divisor. If the sum of prices increases by $2m, then the sum of prices used to calculate the index is increased by $2m / 0.2 = $10m<\/p><p>The Dow Divisor is used to maintain the historical continuity of the index, since there have been numerous stock splits, spinoffs and changes among the Dow constituents since the index was first introduced in 1896. The Divisor is continually adjusted to account for these changes, since the value of the Dow would be distorted otherwise. The fact that the Divisor is now well below one means that the divisor actually functions as a multiplier!<\/p>"},{"s":3,"n":70,"id":"1072130","q":"<p>Which of the following does not lead to an increase in the number of shares of a company?<\/p>","o":[{"l":"A","h":"Rights issue"},{"l":"B","h":"Capitalisation issue"},{"l":"C","h":"Stock split"},{"l":"D","h":"A call on partly paid shares"}],"a":"D","e":"<p>An investor who holds partly paid shares may be asked to pay the remainder amount at a later date but the shares were already issued so does not lead to further issuance. All other answers lead to an increase in the number of shares.<\/p>"},{"s":3,"n":71,"id":"1078876","q":"<p>Which of the following bond issuances would ensure the bonds purchased were at the highest price at which they could ALL be sold?<\/p>","o":[{"l":"A","h":"Auction"},{"l":"B","h":"Schedule programme"},{"l":"C","h":"Reverse inquiry"},{"l":"D","h":"Tender"}],"a":"D","e":"<p>The tender offer is the lowest successful price and everyone will pay this price. As this price applies to all the bonds purchased this is the highest price that will be paid for ALL the bonds issued.<\/p>"},{"s":3,"n":72,"id":"1075026","q":"<p>A company is unlikely to have a secondary offer under what circumstances?<\/p>","o":[{"l":"A","h":"Bear market"},{"l":"B","h":"Bull market"},{"l":"C","h":"Equity markets are robust"},{"l":"D","h":"The company needs more capital"}],"a":"A","e":"<p>The company is unlikely to go ahead with the follow up offer if market conditions are negative.<\/p>"},{"s":3,"n":73,"id":"1070571","q":"<p>A firm or investor aims to buy a substantial holding in the takeover-target company's equity by buying the shares as soon as the stock markets open. This technique is known as:<\/p>","o":[{"l":"A","h":"Saturday night special"},{"l":"B","h":"Greenmail"},{"l":"C","h":"Poison pill"},{"l":"D","h":"Dawn raid"}],"a":"D","e":"<p>When a firm or investor buys a substantial number of shares in a company first thing in the morning when the stock markets open, it is refered to as a dawn raid. Because the bidding company builds a substantial stake in its target at the prevailing stock market price, the takeover costs are likely to be significantly lower than they would be had the acquiring company first made a formal takeover bid. Although this is a learning objective 4.5.2, there is no content in the manual to explain its meaning.<\/p>"},{"s":3,"n":74,"id":"4062233","q":"<p>An authorised participant has purchased creation units in an exchange-traded fund. This will enable that authorised participant to:<\/p>","o":[{"l":"A","h":"Market the fund to institutional investors only"},{"l":"B","h":"Act as a custodian for real investors"},{"l":"C","h":"Act as a market maker for the fund shares"},{"l":"D","h":"Restrict the supply of the fund shares"}],"a":"C","e":"<p>Authorised participants may wish to invest in the ETF shares long-term, but usually act as market makers on the open market, using their ability to exchange creation units with their underlying securities to provide liquidity of the ETF shares and help ensure that their intra-day market price approximates to the NAV of the underlying assets.<\/p>"},{"s":3,"n":75,"id":"1078510","q":"<p>A shareholder increases its proportion of shares in a company from 28.6% to 30.9%, what are they obliged to do?<\/p>","o":[{"l":"A","h":"To take more active role in corporate governance"},{"l":"B","h":"To inform the markets"},{"l":"C","h":"To tell the exchange"},{"l":"D","h":"Make an offer under takeover laws"}],"a":"D","e":"<p>Once a shareholder crosses the 30% threshold they are then in a takeover situation.<\/p>"},{"s":3,"n":76,"id":"1065045","q":"<p>Two 10-year, 5% coupon bonds are being quoted at a spread to the benchmark, X at 50 b.p. and Y at 80b.p. Which of the following statements is true?<\/p>","o":[{"l":"A","h":"X is riskier than Y"},{"l":"B","h":"X has a higher yield than Y"},{"l":"C","h":"Y is riskier than X"},{"l":"D","h":"Y is priced higher than X"}],"a":"C","e":"<p>Bond Y's yield is 30 b.p. more than bond X's. All other things being equal, if a bond's yield is higher than a comparable instrument, the additional yield is to compensate for additional risk. Bond Y is therefore riskier.<\/p>"},{"s":3,"n":77,"id":"1078856","q":"<p>What shows the expected change in a fixed income instrument's price, given a specified change in interest rates?<\/p>","o":[{"l":"A","h":"Modified duration"},{"l":"B","h":"Immunisation"},{"l":"C","h":"The yield curve"},{"l":"D","h":"Macaulay duration"}],"a":"A","e":"<p>The Macaulay duration calculates the weighted average time before a bondholder would receive the bond's cash flows. Conversely, modified duration measures the price sensitivity of a bond when there is a change in the yield/interest rate to maturity.<\/p>"},{"s":3,"n":78,"id":"1072580","q":"<p>Inflation is expected to rise from 1.9% to 2.9%. How or when could an investor achieve the same real return as before?<\/p>","o":[{"l":"A","h":"Rebalance their portfolio to hold a greater percentage of bonds"},{"l":"B","h":"There is an increase in the nominal rate of interest"},{"l":"C","h":"Place excess cash in savings accounts"},{"l":"D","h":"There is a decrease in the nominal rate of interest"}],"a":"B","e":"<p>Real interest rate = [(1 + nominal interest rate) / (1 + inflation rate)] - 1. Therefore if inflation is rising, an investor will need to earn a higher nominal rate in order to maintain a 'real' return.<\/p>"},{"s":3,"n":79,"id":"1072588","q":"<p>Which of the following financial statements will show dividend payments made?<\/p>","o":[{"l":"A","h":"Cash flow statement"},{"l":"B","h":"Balance sheet"},{"l":"C","h":"Income statement"},{"l":"D","h":"Statement of financial position"}],"a":"A","e":"<p>As the dividend payment is made it means the cash has been moved therefore will be shown on the cash flow statement.<\/p>"},{"s":3,"n":80,"id":"1078916","q":"<p>An investor holds a position in UK equity and decides to hedge by buying put options. Which of the following statements is true?<\/p>","o":[{"l":"A","h":"This strategy would be called a covered put"},{"l":"B","h":"The right will take away the opportunity to realise profit should their holding rise in value"},{"l":"C","h":"The danger is that their maximum loss on the option is unlimited"},{"l":"D","h":"The value of this right will be increasingly valuable as the price falls"}],"a":"D","e":"<p>The motivation behind buying a put option will be to protect against a fall in the share price. The holder of a put obtains the right, but not the obligation, to sell at a fixed price. The value of this right will become increasingly valuable as the asset price falls. The greatest profit that will arise from buying a put will be achieved if the asset price falls to zero. Their greatest loss is the premium and this would be called a protective put.<\/p>"},{"s":3,"n":81,"id":"1075010","q":"<p>Where a cum-dividend equity trade fails to settle on contractual settlement what will happen?<\/p>","o":[{"l":"A","h":"The client buying will make a claim on the client who is selling"},{"l":"B","h":"The broker of the client buying will make a claim on the client selling"},{"l":"C","h":"The broker of the client buying will make a claim on the broker of the client selling"},{"l":"D","h":"The Client buying will make a claim on the broker of the client selling"}],"a":"C","e":"<p>A claim will arise between the brokers on behalf of their clients.<\/p>"},{"s":3,"n":82,"id":"1072790","q":"<p>What was the primary reason for the introduction of the Continuous Settlement Bank system?<\/p>","o":[{"l":"A","h":"To ensure certainty of payments"},{"l":"B","h":"To facilitate payment versus payment"},{"l":"C","h":"To mitigate default risk"},{"l":"D","h":"To allow for 24 hour settlement in the foreign exchange markets"}],"a":"C","e":"<p>The two parties to an FX transaction will buy and sell the respective currencies exchanged and the payments made will occur simultaneously. Unless such simultaneity in payments is ensured, there is a possibility of settlement risk which is a type of default risk. The first two answers are benefits of CLS not a reason.<\/p>"},{"s":3,"n":83,"id":"1072156","q":"<p>A company is in the process of issuing its shares and there is an origination team working on their behalf. Who would assess the best method for bringing the company to the market?<\/p>","o":[{"l":"A","h":"Legal Advisor"},{"l":"B","h":"Reporting Accountant"},{"l":"C","h":"Corporate Broker"},{"l":"D","h":"Sponsor"}],"a":"D","e":"<p>The role of the sponsor includes assessing the company's suitability for listing, the best method of bringing the company to the market, and co-ordinating the production of the prospectus.<\/p>"},{"s":3,"n":84,"id":"1072791","q":"<p>When shares are held together in an omnibus account the name on the company's register will be:<\/p>","o":[{"l":"A","h":"The registrar"},{"l":"B","h":"The parent of the nominee"},{"l":"C","h":"The company"},{"l":"D","h":"The nominee"}],"a":"D","e":"<p>Clients brought together with others in a pooled (omnibus) nominee have no visibility to the company: it is the single nominee name, covering multiple clients, which the company recognises. Importantly, from a voting perspective it is only the single bulk nominee that is entitled to vote; no separate entitlement accrues from the registrar's standpoint to each individual client making up the total holding.<\/p>"},{"s":3,"n":85,"id":"1066425","q":"<p>In which of the following circumstances would it be possible for a hedge fund (Unregulated Collective Investment Scheme) to market itself to a retail investor?<\/p>","o":[{"l":"A","h":"If the client was insistent and is placing execution only instructions"},{"l":"B","h":"If the client were experienced in buying UCITS funds"},{"l":"C","h":"If the client currently performed an approved role"},{"l":"D","h":"If the client were a sophisticated or high net worth individual"}],"a":"D","e":"<p>UCISs cannot be promoted to retail investors unless they meet specific exemptions; for example they can be shown to be sophisticated or high net worth investors. Hedge funds (UCIS) are not authorised, they cannot be freely marketed. This combined with the requirement to invest substantial minimum amounts, means that hedge funds tend to be accessible only to institutional investors and high net worth individuals.<\/p>"},{"s":3,"n":86,"id":"1065042","q":"<p>Which of the following is a Primary Information Provider?<\/p>","o":[{"l":"A","h":"Thomson Reuters"},{"l":"B","h":"Newswire"},{"l":"C","h":"Bloomberg"},{"l":"D","h":"Financial Times"}],"a":"B","e":"<p>Newswire is a PIP. The others are all secondary providers.<\/p>"},{"s":3,"n":87,"id":"4049366","q":"<p><\/p><p>Why would an investment trust not be allowed to be an exchange-traded fund?<\/p>","o":[{"l":"A","h":"An investment trust is closed-ended"},{"l":"B","h":"An investment trust is open-ended"},{"l":"C","h":"An investment trust can be leveraged"},{"l":"D","h":"An investment trust is listed on an exchange"}],"a":"A","e":"<p>An investment trust is a closed-ended vehicle, whereas exchange-traded funds (ETF) are open-ended. This would prohibit the investment trust becoming an ETF. It is true that investment trusts are listed and can be leveraged, but so can ETFs, so this would not be prohibitive in itself.<\/p>"},{"s":3,"n":88,"id":"1076206","q":"<p>What is the purpose of a trading platform providing liquidity rebates?<\/p>","o":[{"l":"A","h":"To ensure best execution is provided to consumers at all times"},{"l":"B","h":"To encourage market makers to use their systems by offering them commission on trades"},{"l":"C","h":"To improve liquidity in illiquid shares by offering customers a discount on quoted prices"},{"l":"D","h":"To provide information on the implicit cost of liquidity (or illiquidity) in a share"}],"a":"B","e":"<p>One area of competition among exchanges is to encourage market makers to use their platforms over others by providing liquidity rebates for each share that is sold to or purchased from each posted bid or offer. The market makers are paid a commission on all transactions that use their systems.<\/p>"},{"s":3,"n":89,"id":"4049382","q":"<p>If shares are held in a corporate nominee account, which of the following is true of the name on the register?<\/p>","o":[{"l":"A","h":"It is the name of the individual investor"},{"l":"B","h":"It is a single nominee name"},{"l":"C","h":"No name appears on the register"},{"l":"D","h":"It is an individual designation per investor"}],"a":"B","e":"<p>A corporate nominee account is a pooled account held by the issuing company. Although the issuing company knows who each investor is, only one name appears on the register of owners.<\/p>"},{"s":3,"n":90,"id":"4004401","q":"<p>An introduction is used by a company to:<\/p>","o":[{"l":"A","h":"gain extra liquidity"},{"l":"B","h":"raise funds"},{"l":"C","h":"prevent unwanted takeover"},{"l":"D","h":"facilitate a merger"}],"a":"A","e":"<p>An introduction is used by a company that does not need to raise extra capital through share issues, but wishes to gain the extra liquidity in its shares that a listing provides. This might be a company that is already listed on another, overseas stock exchange, a new company formed from two previously listed companies that have merged, or a demutualised organisation.<\/p>"},{"s":3,"n":91,"id":"1072131","q":"<p>When global depositary receipts are issued, whose name appears on the company's register of owners?<\/p>","o":[{"l":"A","h":"Bearer holder"},{"l":"B","h":"Depositary bank"},{"l":"C","h":"The issuing company"},{"l":"D","h":"The bank that issued the GDR"}],"a":"B","e":"<p>This seems a tricky question as it may be possible that the bank issuing may be holding the shares themselves but is not always the case and therefore in line with the CISI book, the depositary bank is the best answer.<\/p>"},{"s":3,"n":92,"id":"4025899","q":"<p>Which two do companies need/have to follow according to listing obligations when an issuer is planning on having its securities listed?<\/p>","o":[{"l":"A","h":"Directors’ remuneration and reporting"},{"l":"B","h":"Good ethics and directors’ remuneration"},{"l":"C","h":"Reporting and good corporate governance"},{"l":"D","h":"Corporate governance and good ethics"}],"a":"C","e":"<p>An issuer that is planning to have its securities listed will have to accept certain obligations. Like the requirements for advisers, the precise obligations can vary across jurisdictions, but they always include obligations in relation to good corporate governance and regular reporting<\/p>"},{"s":3,"n":93,"id":"1072574","q":"<p>An investor receives a provisional allotment letter in relation to an offer for sale. This would suggest which of the following?<\/p>","o":[{"l":"A","h":"The investor is a company director"},{"l":"B","h":"The investor is looking to receive the nil-paid amount"},{"l":"C","h":"The investor has received details of a greenshoe option being exercised"},{"l":"D","h":"The investor is an existing shareholder"}],"a":"D","e":"<p>A rights issue is usually to fund expansion, perhaps to take over a rival or to diversify into a new business area. Existing shareholders receive a provisional allotment letter, which tells them how many shares they are entitled to and what the price will be.<\/p>"},{"s":3,"n":94,"id":"1064488","q":"<p>When can an investor sell a share in an OEIC?<\/p>","o":[{"l":"A","h":"When they find a willing buyer on the open market"},{"l":"B","h":"When the fund has enough money to repurchase shares"},{"l":"C","h":"Any time outside 3 business days from purchase"},{"l":"D","h":"Any period specified by the OEIC prospectus"}],"a":"D","e":"<p>The holder of a share in an OEIC can sell back the share to the company in any period specified in the prospectus.<\/p>"},{"s":3,"n":95,"id":"4004402","q":"<p>Which of the following is a corporate debt instrument backed by a particular company asset?<\/p>","o":[{"l":"A","h":"Floating charge bond"},{"l":"B","h":"Guaranteed bond"},{"l":"C","h":"Covered bond"},{"l":"D","h":"Fixed charge bond"}],"a":"D","e":"<p> Fixed charge debt provides holders with the legal right to particular company asset (e.g. land, buildings etc.) in the event of a liquidation. Both floating and covered bonds are backed by a pool of assets. Guaranteed debt is when a guarantee is provided by someone other than the issuer. The guarantor is typically the parent company, or another company in the same group<\/p>"},{"s":3,"n":96,"id":"1072145","q":"<p>What might be a main benefit for holding money market instruments for a private investor?<\/p>","o":[{"l":"A","h":"Price volatility"},{"l":"B","h":"Price stability"},{"l":"C","h":"High income levels"},{"l":"D","h":"Achieve long term objectives"}],"a":"B","e":"<p>These investments are low-risk, relatively secure and deliver income, but provide little scope for capital growth. For investors that do not want their money tied up for long periods, however, the predictable value and liquidity of these short-term investments is important.<\/p>"},{"s":3,"n":97,"id":"1072575","q":"<p>Which of the following offers a guaranteed yield?<\/p>","o":[{"l":"A","h":"Linkers"},{"l":"B","h":"Equity"},{"l":"C","h":"Guaranteed bonds"},{"l":"D","h":"UK gilts"}],"a":"D","e":"<p>This is the best answer as gilts where the risk of default is low, investors can be virtually certain of the yield that their investment will deliver, as long as they hold their bonds to maturity.<\/p>"},{"s":3,"n":98,"id":"1072129","q":"<p>Which of the following is ALWAYS true for participating preference shares?<\/p>","o":[{"l":"A","h":"Have voting rights"},{"l":"B","h":"Company has a legal obligation to pay a dividend"},{"l":"C","h":"Can participate in the profits of the company"},{"l":"D","h":"Can convert into ordinary shares"}],"a":"C","e":"<p>Preference shares usually don't have voting rights but can be evoked in some cases in relation to unpaid dividends. A company never has an obligation to pay a dividend and convertible preference shares have the conversion rights to ordinary shares. Participating preference shares may receive a bonus dividend if the company is highly profitable.<\/p>"},{"s":3,"n":99,"id":"1069769","q":"<p>Aiden is an adventurous 28 year old and has disposable income to invest for future rewards. Which of the following would be the most suitable investments in his portfolio?<\/p>","o":[{"l":"A","h":"Low beta FTSE 100 index shares"},{"l":"B","h":"Soft commodities with low liquidity"},{"l":"C","h":"Investment grade sovereign bonds and bills"},{"l":"D","h":"Medium and high-risk equity investments"}],"a":"D","e":"<p>The more conservative investor will hold a greater proportion of low-risk bonds and money market instruments. These lower-risk investments are likely to give rise to lower, but more predictable, returns. The more adventurous investor will hold a greater proportion of medium and high-risk equity investments, because higher risk means greater potential for higher returns. Essentially, the choice of investments is driven by the investor's attitude to risk and the fact that there is a trade-off between risk and return.<\/p>"},{"s":3,"n":100,"id":"4004407","q":"<p>The role of a gilt inter-dealer broker is to:<\/p>","o":[{"l":"A","h":"ensure market makers remain anonymous"},{"l":"B","h":"provide bid/offer pricing during the mandatory quote period"},{"l":"C","h":"trade as principal with GEMMs"},{"l":"D","h":"help the Debt Management Office gain successful issuance"}],"a":"A","e":"<p>Gilt IDBs arrange deals between gilt-edged market makers anonymously. They are not allowed to take principal positions, and the identity of the market makers using the service remains anonymous at all times. The IDB will act as agent, but settle the transaction as if it were the principal. The IDB is only allowed to act as a broker between GEMMs, and has to be a separate company and not a division of a broker-dealer.<\/p>"},{"s":4,"n":1,"id":"1046451","q":"<p>If an investor placed an order in a competitive gilt auction, which of the following best describes the price the investor will pay?<\/p>","o":[{"l":"A","h":"The investor will pay the price they bid if they are successful"},{"l":"B","h":"The investor will pay the lowest successful price in the auction"},{"l":"C","h":"The investor will pay a volume weighted average price"},{"l":"D","h":"The investor will pay the uncrossing price"}],"a":"A","e":"<p>In a competitive gilt auction, investors pay the price they bid if they are successful. In a non-competitive gilt auction, investors pay a volume weighted average price of the successful competitive bids.<br/> The investor will pay the lowest successful price in a tender offer.<\/p>"},{"s":4,"n":2,"id":"1079699","q":"<p>Which of the following is true of capital reserves and revenue reserves?<\/p>","o":[{"l":"A","h":"Capital reserves are freely distributed to shareholders"},{"l":"B","h":"Revenue reserve form the capital base of the company"},{"l":"C","h":"Capital reserves can be converted into a bonus issue of shares"},{"l":"D","h":"Revenue reserves are the surplus above nominal value raised on issue"}],"a":"C","e":"<p>Capital reserves - capital reserves include revaluation reserves and the share premium account. The revaluation reserve arises from the upward revaluation of non-current assets, and the share premium reserve arises when the company issues shares at a price above their nominal value. Capital reserves are not distributable to the company's shareholders in the form of dividends, as they form part of the company's capital base, although they can be converted into a bonus issue of ordinary shares.<br/> Revenue reserves - the major revenue reserve is the accumulated retained earnings of the company. This represents the accumulation of the company's distributable profits that have not been paid to the company's shareholders as dividends but have been retained in the business.<\/p>"},{"s":4,"n":3,"id":"1065060","q":"<p>A company is looking to raise additional capital. For which of the following reasons might the company choose to do so through a rights issue?<\/p>","o":[{"l":"A","h":"Easier to administer"},{"l":"B","h":"Cheaper for institutional investors"},{"l":"C","h":"Will not affect the share price"},{"l":"D","h":"Fair treatment for existing shareholders"}],"a":"D","e":"<p>A rights issue gives shareholders the right to buy additional shares in an amount proportional to the number that they already own (e.g. 1 for 4). They therefore have the opportunity to maintain their proportional holding and avoid the diluting effect that the issuance of new shares will produce.<\/p>"},{"s":4,"n":4,"id":"1052079","q":"<p>Where a bond is trading below par, which of the following statements is TRUE with regard to redemption value and yields?<\/p>","o":[{"l":"A","h":"There would be capital gain: the flat yield will be less than the gross redemption yield"},{"l":"B","h":"There would be capital loss: the flat yield will be less than the gross redemption yield"},{"l":"C","h":"There would be capital gain: the flat yield will be greater than the gross redemption yield"},{"l":"D","h":"There would be capital loss: the flat yield will be greater than the gross redemption yield"}],"a":"A","e":"<p>Key to remember Price &gt; Nominal then Coupon &gt; Flat yield &gt; Gross redemption yield and vice versa.<\/p>"},{"s":4,"n":5,"id":"1066446","q":"<p>The interaction between the cash price of bonds and the futures prices is a dynamic two-way process. This is an example of:<\/p>","o":[{"l":"A","h":"systematic risk"},{"l":"B","h":"arbitrage trading"},{"l":"C","h":"diversification"},{"l":"D","h":"idiosyncratic risk"}],"a":"B","e":"<p>The interaction between the cash price of bonds and the futures prices is a dynamic two-way process in which prices are constantly being adjusted through arbitrage and through the activities of hedgers as well as speculators.<\/p>"},{"s":4,"n":6,"id":"1065064","q":"<p>In the offering of a bond issue, which of the following would NOT be a responsibility of the listing agent?<\/p>","o":[{"l":"A","h":"Pitching"},{"l":"B","h":"Servicing"},{"l":"C","h":"Communicating with the listing authorities"},{"l":"D","h":"Co-ordinating activities of others involved in the offering"}],"a":"B","e":"<p>These are all responsibilities of the listing agent with the exception of 'servicing', which is the ongoing payment of the bond's interest. This will be the responsibility of the issuing company!<\/p>"},{"s":4,"n":7,"id":"1078529","q":"<p>A market analyst produces a report on market depth and liquidity. What would be the sources of this report?<\/p>","o":[{"l":"A","h":"Exchanges and trade reports"},{"l":"B","h":"Approved reporting mechanisms and clearing houses"},{"l":"C","h":"Transaction reports and alternative trading systems"},{"l":"D","h":"Internal desk research and central security depositories"}],"a":"A","e":"<p>Trade reporting is a mechanism to feedback to the marketplace on market depth and liquidity - a measure of market transparency. Trade reporting assists in price formation. Trade reports must include a variety of details, including the identity of the reporting member firm, the date and time of the transaction, the security traded and the type of trade.<\/p>"},{"s":4,"n":8,"id":"1055538","q":"<p>Which one of the following is ALWAYS true about participating preference shares?<\/p>","o":[{"l":"A","h":"They can participate in further profits of the company"},{"l":"B","h":"They can convert into ordinary shares of the company"},{"l":"C","h":"They carry the opportunity to vote at general meetings"},{"l":"D","h":"They have a guaranteed dividend"}],"a":"A","e":"<p>One drawback of preference shares, when compared to ordinary shares, is that, if the company starts to generate large profits, the ordinary shareholders will often see their dividends rise, whereas the preference shareholders still get a fixed level of dividend. To counter this, some preference shares offer the opportunity to participate in higher distributions.<\/p>"},{"s":4,"n":9,"id":"1078522","q":"<p>With regard to compan
