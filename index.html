":"<p>Real assets take into account which of the following factors?<\/p>","o":[{"l":"A","h":"Credit ratings"},{"l":"B","h":"Interest rates"},{"l":"C","h":"Inflation"},{"l":"D","h":"Modified duration"}],"a":"C","e":"<p>Real assets take into account the impact of inflation. A real interest rate is a rate of interest that reflects the effects of inflation.<\/p>"},{"s":13,"n":17,"id":"1066484","q":"<p>Which of the following are secondary information providers?<\/p>","o":[{"l":"A","h":"Markit Boat and Newswire"},{"l":"B","h":"RNS and TRAX"},{"l":"C","h":"Thomson Reuters and Bloomberg"},{"l":"D","h":"News Release Express and Omgeo oasys"}],"a":"C","e":"<p>Primary Information Providers offer a service that receives regulatory information from listed companies, process that information and disseminate it by circulating it to Secondary Information Providers (SIPs). The SIPs then disseminate the information to the wider financial community, such as stockbrokers and research analysts. Thomson Reuters and Bloomberg are both secondary information providers.<\/p>"},{"s":13,"n":18,"id":"1065049","q":"<p>A large fire destroys a company's warehouse and this, in turn, causes the company's share price to fall. This is an example of:<\/p>","o":[{"l":"A","h":"Systematic risk"},{"l":"B","h":"Unsystematic risk"},{"l":"C","h":"Insurance risk"},{"l":"D","h":"Random risk"}],"a":"B","e":"<p>This is an example of unsystematic or specific risk. It is the risk associated with a specific asset and it can be reduced by diversifying one's holdings. Sytematic risk, on the other hand, is the risk inherent in the market as a whole. This can not be reduced by diversification.<\/p>"},{"s":13,"n":19,"id":"1001468","q":"<p>Which of the following explains the relationship for risk and return for any 'rational' investor?<\/p>","o":[{"l":"A","h":"A positive relationship"},{"l":"B","h":"Inverse relationship"},{"l":"C","h":"No relationship"},{"l":"D","h":"Indirect relationship"}],"a":"A","e":"<p>As risk increases, a rational investor would want more return to compensate. This is a positive relationship.<\/p>"},{"s":13,"n":20,"id":"4028010","q":"<p>Policy switching would be best described as which one of the following?<\/p>","o":[{"l":"A","h":"Moving between government bonds and corporate bonds when it is believed that the difference in the yield doesn't reflect the risk premium correctly"},{"l":"B","h":"Selling shorter dated, low-duration bonds and buying longer-dated, high-duration bonds in expectation of a cut in interest rates"},{"l":"C","h":"Trading the yield curve when future interest rate movements are incorrectly anticipated by the yield curve"},{"l":"D","h":"Moving between two bonds similar in all respects apart from the yield and price at which each trades."}],"a":"B","e":"<p>Anomaly switching involves moving between two bonds similar in all respects apart from the yield and price on which each trades. This pricing anomaly is exploited by switching away from the more to the less highly priced bond.<\/p><p>Selling shorter dated, low-duration bonds and buying longer-dated, high-duration bonds in expectation of a cut in interest rates is referred to as policy switching.<\/p><p>Trading the yield curve when future interest rate movements are incorrect anticipated by the yield curve is an example of market timing.<\/p><p>Moving between government bonds and corporate bonds when it is believed that the difference in the yield doesn't reflect the risk premium correctly is an inter-market spread switch<\/p>"},{"s":13,"n":21,"id":"1078918","q":"<p>Secondary information providers take information from primary information providers and then disseminate this information mostly to:<\/p>","o":[{"l":"A","h":"Listed companies"},{"l":"B","h":"Brokers and research analysts"},{"l":"C","h":"Thomson Reuters"},{"l":"D","h":"Government bodies"}],"a":"B","e":"<p>Primary information providers simply offer a service that receives regulatory information from listed companies, processes that information and disseminates it by circulating it to secondary information providers (SIPs). Examples of SIPs include Bloomberg, Reuters and the Dow Jones. The SIPs disseminate the information to the wider financial community, such as stockbrokers and research analysts.<\/p>"},{"s":13,"n":22,"id":"1001451","q":"<p>What is the aim of portfolio diversification?<\/p>","o":[{"l":"A","h":"To optimise the risk-reward trade-off"},{"l":"B","h":"To reduce risk to zero"},{"l":"C","h":"To reduce returns at all times"},{"l":"D","h":"To expose the portfolio to the maximum risk"}],"a":"A","e":"<p>The idea of diversification is not to 'put all your eggs in one basket'.<\/p>"},{"s":13,"n":23,"id":"1001768","q":"<p>What is the aim of portfolio diversification?<\/p>","o":[{"l":"A","h":"To optimise the risk-reward trade-off"},{"l":"B","h":"To reduce risk to zero"},{"l":"C","h":"To reduce returns at all times"},{"l":"D","h":"To expose the portfolio to the maximum risk"}],"a":"A","e":"<p>The idea of diversification is not to 'put all your eggs in one basket'.<\/p>"},{"s":13,"n":24,"id":"1048088","q":"<p>A rise in inflation would benefit:<\/p>","o":[{"l":"A","h":"A depositor"},{"l":"B","h":"An exporter"},{"l":"C","h":"A borrower"},{"l":"D","h":"Pensioners"}],"a":"C","e":"<p>Borrowers benefit because the value of borrowers' debt falls in real terms.<\/p>"},{"s":13,"n":25,"id":"1052311","q":"<p>Which one of the following is most likely to levy performance-related fees on the investor?<\/p>","o":[{"l":"A","h":"OEIC"},{"l":"B","h":"Exchange-traded funds"},{"l":"C","h":"Unit trusts"},{"l":"D","h":"Hedge funds"}],"a":"D","e":"<p>Hedge funds typically levy performance fees which the investor pays if certain performance levels are reached. Performance fees can be substantial.<\/p>"},{"s":13,"n":26,"id":"1057391","q":"<p>An investor owns a large portfolio of UK equity but now has a very bearish attitude to the markets. What would you recommend to them if they are a very high risk investor?<\/p>","o":[{"l":"A","h":"Sell the portfolio in its entirety and sit on the cash"},{"l":"B","h":"Sell futures and buy puts on the market"},{"l":"C","h":"Buy futures and calls on the market"},{"l":"D","h":"Sell futures and sell puts on the market"}],"a":"B","e":"<p>A bearish investor expects the market to fall. Selling the portfolio and sitting on cash would not meet the high risk profile, so selling futures and buying puts (which profit from falling markets) is the expected response.<\/p>"},{"s":13,"n":27,"id":"1001462","q":"<p>Which of the following securities is most suitable if you are an investor who wishes to have an increase in returns as the performance of the company improves?<\/p>","o":[{"l":"A","h":"Debentures"},{"l":"B","h":"Participating preference shares"},{"l":"C","h":"Cumulative preference shares"},{"l":"D","h":"Redeemable preference shares"}],"a":"B","e":"<p>Participating preference shares have a fixed dividend but also have a bonus tethered to them in years of improved performance. Cumulative preference shares, redeemable preference shares and debentures all have a fixed return.<\/p>"},{"s":13,"n":28,"id":"1015559","q":"<p>Which of the following institutions would be most interested in assets that are highly-liquid and low-risk?<\/p>","o":[{"l":"A","h":"Pension fund management"},{"l":"B","h":"Hedge fund management"},{"l":"C","h":"Life insurance company"},{"l":"D","h":"Home insurance company"}],"a":"D","e":"<p>A general insurance company would wish to hold most of its assets in a near cash form so that it is able to meet claims as they fall due.<\/p>"},{"s":13,"n":29,"id":"1024205","q":"<p>Money market funds would most likely invest the vast majority of their portfolio in which of the following?<\/p>","o":[{"l":"A","h":"Gilts"},{"l":"B","h":"Treasury bills"},{"l":"C","h":"Equities"},{"l":"D","h":"Warrants"}],"a":"B","e":"<p>Money market funds invest in cash and near cash instruments such as Treasury bills.<\/p>"},{"s":13,"n":30,"id":"1001467","q":"<p>All other things being equal, which of the following bonds indicates more risk?<\/p>","o":[{"l":"A","h":"10yr, 5% coupon gilt"},{"l":"B","h":"10yr, 8% coupon gilt"},{"l":"C","h":"5yr, 5% coupon gilt"},{"l":"D","h":"5yr, 8% coupon gilt"}],"a":"A","e":"<p>Bonds that are longer-dated and have lower coupons express higher-risk as their price is more volatile.<\/p>"},{"s":13,"n":31,"id":"1001454","q":"<p>What best achieves diversification?<\/p>","o":[{"l":"A","h":"Selling futures against a holding of the underlying asset"},{"l":"B","h":"Combining securities which are not highly-correlated"},{"l":"C","h":"Buying put options against a holding of the underlying asset"},{"l":"D","h":"Constructing a fund which beats a defined benchmark"}],"a":"B","e":"<p>Diversification is 'not putting all your eggs in one basket'. 'Selling futures against a holding of the underlying asset' and 'buying put options against a holding of the underlying asset' both describe hedging strategies. 'Constructing a fund which beats a defined benchmark' describes active fund management.<br/> Therefore, 'combining securities which are not highly correlated' is the correct answer.<\/p>"},{"s":13,"n":32,"id":"1055862","q":"<p>When would you advise a client to consider equities?<\/p>","o":[{"l":"A","h":"During a period of lower inflation. The client is cautious and wishes to prioritise income."},{"l":"B","h":"During a period of higher inflation. The client wishes to invest in successful companies."},{"l":"C","h":"When the client has a short-term investment horizon, requiring low risk and low volatility."},{"l":"D","h":"When the client requires capital protection and regular income over a fixed period of time."}],"a":"B","e":"<p>In times of higher inflation, investment in successful companies can, over time, provide a good inflation hedge, as both the share price and the dividend should rise. If the client is cautious and income-seeking, exposure to equities should be kept low. If they have a short-term investment horizon and a low risk appetite, exposure to equities should be kept low. Capital protection and regular income over a fixed period of time is closer to a bond's reward profile than equity.<\/p>"},{"s":13,"n":33,"id":"1078484","q":"<p>Rank the following in ascending order of risk, least risky first:<\/p><p><strong>I<\/strong><\/p><p>Equities listed the LSE's principal market<\/p><p><strong>II<\/strong><\/p><p>Equities quoted on AIM<\/p><p><strong>III<\/strong><\/p><p>UK Government bonds<\/p><p><strong>IV<\/strong><\/p><p>FTSE 100 secured corporate bonds<\/p>","o":[{"l":"A","h":"II, I, IV, III"},{"l":"B","h":"IV, III, I, II"},{"l":"C","h":"IV, II, I, III"},{"l":"D","h":"III, IV, I, II"}],"a":"D","e":"<p>Bonds guaranteed by the government will be less risky than corporate bonds. Corporate bonds will be less risky than equities as they are secured on the assets of the company and are obliged to pay interest.<\/p>"},{"s":13,"n":34,"id":"1001464","q":"<p>Which of the following would a charity find most useful?<\/p>","o":[{"l":"A","h":"Flat-yield"},{"l":"B","h":"Income yield"},{"l":"C","h":"Gross redemption yield"},{"l":"D","h":"Net redemption yield"}],"a":"C","e":"<p>Charities do not pay tax and hold bonds in the long-term.<\/p>"},{"s":13,"n":35,"id":"1050901","q":"<p>Which of the following statements about systemic risk is LEAST LIKELY to be correct?<\/p>","o":[{"l":"A","h":"It is very difficult for asset managers and other firms to insure against"},{"l":"B","h":"If realised, it would cause widespread panic and chaos in the capital markets"},{"l":"C","h":"Its likelihood is typically linked to uncertainty and the fragility of market liquidity"},{"l":"D","h":"Econometric models accurately predict the likelihood and impact of the risk occurring"}],"a":"D","e":"<p>Systemic risk is the risk of the entire market collapsing. A great contributor to both the likelihood and potential impact of systemic risk is the dependence of financial institutions on ongoing liquidity. If the entire market collapses, then this would very likely cause panic and chaos and it's a difficult risk to insure against, because few counterparties would be left standing in the event. Unfortunately, systemic risk is very difficult to model and forecast, and econometrics and other quantitative disciplines offer few, if any, solutions for this problem.<\/p>"},{"s":13,"n":36,"id":"1001728","q":"<p>In which of the following funds would you expect to see commercial paper?<\/p>","o":[{"l":"A","h":"Derivatives fund"},{"l":"B","h":"Money market fund"},{"l":"C","h":"Securities fund"},{"l":"D","h":"Warrants fund"}],"a":"B","e":"<p>Commercial paper is short-dated debt issued by corporates. CPs have maturities of between seven days and 12 months.<\/p>"},{"s":13,"n":37,"id":"1014269","q":"<p>A higher-rate taxpayer has been recommended UK government debt. If they have a low-risk preference and considering their tax position, which of the following types of gilts would be most appropriate?<\/p>","o":[{"l":"A","h":"Low-coupon, short-dated"},{"l":"B","h":"Medium-coupon, short-dated"},{"l":"C","h":"Low-coupon, long-dated"},{"l":"D","h":"Medium-coupon, long-dated"}],"a":"A","e":"<p>Low-coupons and long-dated suggest high-volatility, so high-risk. Although medium-coupon, short-dated would have little risk, we need to take into consideration that this is a higher rate taxpayer. To reduce tax burden, the low-coupon is most appropriate.<\/p>"},{"s":13,"n":38,"id":"1050947","q":"<p>Which of the following statements regarding passive fund management is LEAST LIKELY to be true?<\/p>","o":[{"l":"A","h":"It is consistent with the idea that markets are efficient"},{"l":"B","h":"It typically employs index tracking strategies"},{"l":"C","h":"The funds may be exchange traded"},{"l":"D","h":"The fund will take defensive measures as required"}],"a":"D","e":"<p>The inherent lack of control dictated by being passive prevents defensive measures if it appears that a certain class of asset prices, specifically equities, may be heading for turbulent trading conditions and possible capital losses.<\/p>"},{"s":13,"n":39,"id":"1066479","q":"<p>The equity risk premium is:<\/p>","o":[{"l":"A","h":"Expected to be lower than the risk of a corporate bond"},{"l":"B","h":"The total return on a stock over a period minus the risk free rate"},{"l":"C","h":"How much the investor will be paid in the future"},{"l":"D","h":"The total return for investing in equity"}],"a":"B","e":"<p>For equity investors there is an equity risk premium, which effectively is a higher rate of return that is required to entice investors to take on the risk of owning shares or equity, as opposed to holding a secured asset such as a bond. <br/> . An investment in stocks or equities has far more risk associated with it, as it is a non-secured asset and companies can suffer from adverse business conditions or go bankrupt, in which case shareholders often receive no residual value.<br/> As an example, if the total return on a stock is 10% over a given period and the risk-free rate over the same period is 3%, the equity-risk premium is 7%.<\/p>"},{"s":13,"n":40,"id":"1001937","q":"<p>Which of the following is the most likely reason why hedge funds are attractive to sophisticated investors?<\/p>","o":[{"l":"A","h":"The ability to invest in a certain market"},{"l":"B","h":"The ability to invest in a certain sector"},{"l":"C","h":"The ability to reduce risk through diversification"},{"l":"D","h":"The ability to take on more speculative positions than traditional open-ended schemes"}],"a":"D","e":"<p>Despite its name, hedge funds tend to be riskier than traditional unit trusts and ICVCs. For instance, there is no limit to the amount of borrowing a hedge fund can take on. Hedge funds are also permitted to take long AND short positions in stock.<\/p>"},{"s":13,"n":41,"id":"1052054","q":"<p>The Insolvency Act 1986 and the Enterprise Act 2002 define a strict order of repayment of company debts in liquidation. In the order of repayment, who/what is paid before subordinated loan stock?<\/p>","o":[{"l":"A","h":"Preference shareholders"},{"l":"B","h":"Unsecured loans"},{"l":"C","h":"Preference ordinary shareholders"},{"l":"D","h":"Mezzanine debt"}],"a":"B","e":"<p>All the others are paid after subordinated loan stock.<\/p>"},{"s":13,"n":42,"id":"1024381","q":"<p>An investor looking for an investment that provides long-term capital growth, regular and predictable income should invest in which of the following?<\/p>","o":[{"l":"A","h":"A long-dated bond trading above par"},{"l":"B","h":"Commercial property"},{"l":"C","h":"Equities"},{"l":"D","h":"Warrants"}],"a":"B","e":"<p>Commercial property is the best answer here as equities do not necessarily provide a regular income. A bond trading above par will ultimately give a capital loss as it will be redeemed at par.<\/p>"},{"s":13,"n":43,"id":"1001877","q":"<p>If a fund manager fully subscribes to the efficient market hypothesis he is likely to adopt which of the following strategies?<\/p>","o":[{"l":"A","h":"Active"},{"l":"B","h":"Passive"},{"l":"C","h":"High-risk"},{"l":"D","h":"Long-short"}],"a":"B","e":"<p>Believing that markets are fully efficient is a view that active fund management will not realise abnormal returns; hence passive management, such as indexation, would be favoured.<\/p>"},{"s":13,"n":44,"id":"1050080","q":"<p>A bank is seeking to hedge a short-term exposure to interest rates using a standardised, liquid, low-cost contract. Which of the following would be best?<\/p>","o":[{"l":"A","h":"A forward rate agreement"},{"l":"B","h":"An interest rate swap"},{"l":"C","h":"A short-term interest rate future"},{"l":"D","h":"An interest rate option"}],"a":"C","e":"<p>Standardised and liquid suggests an on exchange contract which rules out an FRA. A swap would not be used short-term. Exchange-traded STIR futures generally provide a cheaper hedge than options because there is no upfront premium.<\/p>"},{"s":13,"n":45,"id":"1078919","q":"<p>Which of the following statements about a pension fund is least likely?<\/p>","o":[{"l":"A","h":"They are some of largest lenders in stock borrowing and lending agreements"},{"l":"B","h":"They need to make sure investments are right to meet their liabilities"},{"l":"C","h":"They have a low risk profile compared to general insurance companies"},{"l":"D","h":"Income and gains typically accumulate in the fund free of tax"}],"a":"C","e":"<p>A pension fund typically has a long-term investment horizon where their proportion of equity investments are high. Their proportion of money market instruments will be low and their relative risk profile will be high. All the other statements are correct.<\/p>"},{"s":13,"n":46,"id":"1057382","q":"<p>An investor buys commercial paper direct from an issuing company. Which of the following could be a motivation?<\/p>","o":[{"l":"A","h":"To facilitate the secondary market trading of these investments"},{"l":"B","h":"To reduce the impact of costs through elimination of broker's charges"},{"l":"C","h":"To decrease the credit risk on the paper"},{"l":"D","h":"To dematerialise the paper"}],"a":"B","e":"<p>The question refers to direct paper. This is issued directly to investors to eliminate any intermediaries. They are typically issued to buy and hold investors. Dealer paper uses intermediaries, which facilitate secondary market trading. The two forms do not affect credit risk, nor do they determine whether they are dematerialised or bearer.<\/p>"},{"s":13,"n":47,"id":"1078912","q":"<p>Which one of the following could be considered a subsection of market risk?<\/p>","o":[{"l":"A","h":"Operational risk"},{"l":"B","h":"Interest rate risk"},{"l":"C","h":"Counterparty risk"},{"l":"D","h":"Management risk"}],"a":"B","e":"<p>Changes in interest rates will affect prices; this is a sub category of market risk.<\/p>"},{"s":13,"n":48,"id":"1050845","q":"<p>Where an issuing company markets short term debt securities directly to a buy and hold investor such as most money market funds, they would be selling which of the following?<\/p>","o":[{"l":"A","h":"Medium term note"},{"l":"B","h":"Dealer commercial paper"},{"l":"C","h":"Bill of exchange"},{"l":"D","h":"Direct commercial paper"}],"a":"D","e":"<p>Commercial paper programs may be promoted by dealers, in which case the paper is called 'dealer paper'. Larger issuers, especially finance companies, have the market presence to issue their paper directly to investors. Their paper is called 'direct paper'. A bill of exchange is a short-term zero coupon money market instrument issued by a reputable bank and a medium term note is a debt product over two-ten years.<\/p>"},{"s":13,"n":49,"id":"1001459","q":"<p>Which of the following is the most suitable for a medium-risk investor?<\/p>","o":[{"l":"A","h":"UK government bonds"},{"l":"B","h":"Derivatives"},{"l":"C","h":"A single company's equity"},{"l":"D","h":"Portfolio of diversified equity securities"}],"a":"D","e":"<p>UK government bonds - low-risk. Derivatives - high-risk. Equities - medium-risk.<br/> The aim of diversification is to maximise the risk vs. reward trade-off. 'Portfolio of diversified equity securities' is, therefore, the most suitable for a medium-risk investor.<\/p>"},{"s":13,"n":50,"id":"1039443","q":"<p>Diversification is best described as:<\/p>","o":[{"l":"A","h":"Eliminating total risk"},{"l":"B","h":"Reducing specific risk"},{"l":"C","h":"Reducing market risk"},{"l":"D","h":"Reducing systematic risk"}],"a":"B","e":"<p>Diversification reduces the specific risk associated with individual companies by combining the shares of different companies.<\/p>"},{"s":13,"n":51,"id":"1001816","q":"<p>Which two of the following investments can provide capital appreciation and income?<\/p><p><strong>I<\/strong><\/p><p>Property<\/p><p><strong>II<\/strong><\/p><p>Options<\/p><p><strong>III<\/strong><\/p><p>Equities<\/p><p><strong>IV<\/strong><\/p><p>Premium Bond<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"II and III"},{"l":"C","h":"III and IV"},{"l":"D","h":"I and II"}],"a":"A","e":"<p>Options give the chance for capital gains only. Premium bonds provide income (in the form of prizes) only.<\/p>"},{"s":13,"n":52,"id":"1001985","q":"<p>Recent inflation data released in the UK shows a significant increase in prices. Which of the following would you expect to happen to the prices of gilts and the prices of other fixed income instruments (including Treasury bills)?<\/p>","o":[{"l":"A","h":"Increase, Increase"},{"l":"B","h":"Increase, Decrease"},{"l":"C","h":"Decrease, Decrease"},{"l":"D","h":"Decrease, Increase"}],"a":"C","e":"<p>Inflation has increased. There will therefore be an expectation that interest rates will increase to control inflation and therefore bond prices will decrease.<\/p>"},{"s":13,"n":53,"id":"1065088","q":"<p>Luciano manages an equity portfolio of large UK company shares. He is a little concerned about the short to medium term prospects for the stock market and would like to hedge his position in order to protect the portfolio against any fall. Which of the following instruments could he use to create this hedge?<\/p><p><strong>I<\/strong><\/p><p>Buy FTSE 100 futures<\/p><p><strong>II<\/strong><\/p><p>Sell FTSE 100 futures<\/p><p><strong>III<\/strong><\/p><p>Buy FTSE 100 put options<\/p><p><strong>IV<\/strong><\/p><p>Sell FTSE 100 call options<\/p>","o":[{"l":"A","h":"I only"},{"l":"B","h":"II and III"},{"l":"C","h":"I and IV"},{"l":"D","h":"III and IV"}],"a":"B","e":"<p>To create a hedge, you would take an 'offsetting' (equal and opposite) position to that which you already hold. In this case, Luciano owns the shares, so he would sell futures in the FTSE. A put option gives the holder the right to sell at a certain price. If the market falls, these put options will increase in value and this would offset any fall in the value of the portfolio. Selling call options would bring in some cash but will not provide protection if the market falls.<\/p>"},{"s":13,"n":54,"id":"1001904","q":"<p>Which of the following investment institutions would most likely invest in low-risk, low-return, short-dated investments?<\/p>","o":[{"l":"A","h":"Life assurance firms"},{"l":"B","h":"Unit trust managers"},{"l":"C","h":"Fund managers managing pension funds"},{"l":"D","h":"General insurance companies"}],"a":"D","e":"<p>General insurance companies sell holiday, motor, home contents and buildings insurance policies. These policies have a short life of less than a year; the insurance company therefore needs to place their assets in short-dated investments.<\/p>"},{"s":13,"n":55,"id":"4028009","q":"<p>Which one of the following is the best description of anomaly switching?<\/p>","o":[{"l":"A","h":"Moving between two bonds similar in all respects apart from the yield and price at which each trades."},{"l":"B","h":"Selling shorter dated, low-duration bonds and buying longer-dated, high-duration bonds in expectation of a cut in interest rates"},{"l":"C","h":"Trading the yield curve when future interest rate movements are incorrectly anticipated by the yield curve"},{"l":"D","h":"Moving between government bonds and corporate bonds when it is believed that the difference in the yield doesn't reflect the risk premium correctly"}],"a":"A","e":"<p>Anomaly switching involves moving between two bonds similar in all respects apart from the yield and price on which each trades. This pricing anomaly is exploited by switching away from the more to the less highly priced bond.<\/p><p>Selling shorter dated, low-duration bonds and buying longer-dated, high-duration bonds in expectation of a cut in interest rates is referred to as policy switching.<\/p><p>Trading the yield curve when future interest rate movements are incorrect anticipated by the yield curve is an example of market timing.<\/p><p>Moving between government bonds and corporate bonds when  it is believed that the difference in the yield doesn't reflect the risk premium correctly is an inter-market spread switch<\/p>"},{"s":13,"n":56,"id":"1026884","q":"<p>The risk of a share performing differently from other shares is known as:<\/p>","o":[{"l":"A","h":"Systematic risk"},{"l":"B","h":"Sector risk"},{"l":"C","h":"Market risk"},{"l":"D","h":"Unsystematic risk"}],"a":"D","e":"<p>Unsystematic risk is also known as idiosyncratic risk or specific. It is the risk that relates specifically to the individual company.<br/> Systematic risk is the risk that relates to investing in shares and bonds rather than other investments.<\/p>"},{"s":13,"n":57,"id":"1050526","q":"<p>An investor holds an asset. In order to hedge, they should:<\/p>","o":[{"l":"A","h":"Buy puts"},{"l":"B","h":"Sell puts"},{"l":"C","h":"Buy calls"},{"l":"D","h":"Sell calls"}],"a":"A","e":"<p>To hedge a long position, we need to take an opposite position in a derivatives contract. The best answer here is to buy a put option because this contract will make money when the asset value falls. As the asset falls further the put will make more money to offset a loss.<\/p>"},{"s":13,"n":58,"id":"1078914","q":"<p>Which one of the following could be considered an example of an unsystematic risk?<\/p>","o":[{"l":"A","h":"The change of a company's price relative to the market"},{"l":"B","h":"A political crisis"},{"l":"C","h":"The costs of goods and services changing"},{"l":"D","h":"A profit warning from a single company"}],"a":"D","e":"<p>A specific (or unsystematic) risk is that something adverse impacts the value of a particular investment, but the adverse impact is not market-wide. An obvious example is a company's management making some sort of error – perhaps producing a defective product with resultant impact on profits and customer goodwill. Specific risk can be diversified away by holding many investments.<\/p>"},{"s":13,"n":59,"id":"1015547","q":"<p>Which of the following best achieves diversification within a portfolio?<\/p>","o":[{"l":"A","h":"Random selection across the market"},{"l":"B","h":"Selection within a market sector"},{"l":"C","h":"Holding stocks that do not have correlated returns"},{"l":"D","h":"Holding stocks that have correlated returns"}],"a":"C","e":"<p>We cannot identify whether the correlation is positive or negative, therefore the best answer is 'holding stocks that do not have correlated returns'.<\/p>"},{"s":13,"n":60,"id":"1001466","q":"<p>Which term correctly describes the difference in returns of a tracker fund and that of the index which the fund is tracking?<\/p>","o":[{"l":"A","h":"Basis risk"},{"l":"B","h":"Tracking error"},{"l":"C","h":"Sovereign risk"},{"l":"D","h":"Standard deviation"}],"a":"B","e":"<p>The answer is 'tracking error', since the tracker fund is set-up to mimic the return of an index: e.g. FTSE 100. Any difference will be classified as a tracking error; probably to differing portfolio contents to that of the index.<\/p>"},{"s":13,"n":61,"id":"1078860","q":"<p>An investor is concerned that there could be another financial crisis and is looking to a 'flight to safety' approach using short term UK government T-bills. Which of the following is the correct observation about the period leading up to the crisis?<\/p>","o":[{"l":"A","h":"The redemption value is likely to increase due to the UK government trying to control money supply"},{"l":"B","h":"The yields achievable on the T-bills are likely to fall and possibly become negative"},{"l":"C","h":"Corporates are likely to be crowded out as the government issues more T-bills to satisfy demand"},{"l":"D","h":"The central bank will need to manage the FX rate to ensure the currency does depreciate dramatically"}],"a":"B","e":"<p>During a financial crisis, many institutions want to replace all their other money market holdings with the shortest-duration T-bills. This can have the perverse consequence, on extreme occasions, of making such instruments, which are priced on a discount basis, yield a negative return or at a rate which is far below that which would normally be expected. The desire to move into such short-term paper during moments of crisis is referred to as a flight to safety.<\/p>"},{"s":13,"n":62,"id":"4028005","q":"<p>A PIP would normally provide information to:<\/p>","o":[{"l":"A","h":"SIP"},{"l":"B","h":"RNS"},{"l":"C","h":"Listed companies"},{"l":"D","h":"Regulators"}],"a":"A","e":"<p>Primary Information Providers (PIPs) such as the LSE’s Regulatory New Service (RNS) provide a service that receives regulatory information from listed companies, processes that information and disseminates it by circulating it to secondary information providers (SIPs).<\/p>"},{"s":13,"n":63,"id":"1052038","q":"<p>Which of the following is a secondary information provider?<\/p>","o":[{"l":"A","h":"PR Business Wire"},{"l":"B","h":"Regulatory News Service"},{"l":"C","h":"Thomson Financial"},{"l":"D","h":"Business Link"}],"a":"C","e":"<p>The best answer is Thomson Financial, even through Thomson merged with Reuters in 2008 the FSA still has Thomson Financial registered as a SIP. Business Link was a Primary Information Provider but has since lost this status. Business Wire and PR Newswire are registered as PIPs. We can only assume that the examiner got a little confused with the options.<\/p>"},{"s":13,"n":64,"id":"1058360","q":"<p>Which of the following best indicates the risk of a share you own performing poorly in relation to shares of other companies?<\/p>","o":[{"l":"A","h":"Market"},{"l":"B","h":"Sector"},{"l":"C","h":"Systemic"},{"l":"D","h":"Unsystematic"}],"a":"D","e":"<p>'Unsystematic risk' or 'specific risk' is the risk associated with a particular instrument. 'Sector risk', as the name suggests, applies to a particular sector (technology, retailers etc) while 'market risk', is the risk inherent in the market as a whole. 'Systemic risk' is the risk of collapse of our entire financial system and is not to be confused with 'systematic risk', which is the same as market risk.<\/p>"},{"s":13,"n":65,"id":"1001447","q":"<p>Rank the following investments in order of risk, riskiest first:<\/p><p><strong>I<\/strong><\/p><p>Ordinary shares<\/p><p><strong>II<\/strong><\/p><p>Secured debentures<\/p><p><strong>III<\/strong><\/p><p>Convertible loan stock<\/p><p><strong>IV<\/strong><\/p><p>Preference shares<\/p>","o":[{"l":"A","h":"I, IV, III, II"},{"l":"B","h":"I, IV, II, III"},{"l":"C","h":"I, III, II, IV"},{"l":"D","h":"II, I, IV, III"}],"a":"A","e":"<p>In the event of a winding-up, debt (even convertible debt) will be paid before preference shares, which in turn will be paid before ordinary shares.<\/p>"}]</script>
<script type="application/json" id="mdata">[{"s":1,"n":1,"id":"1075552","q":"<p>A 2 year corporate bond has a 100bp spread over the published reference interest rate. What is most likely to be the spread of the corporate bond over a 5 year Gilt?<\/p>","o":[{"l":"A","h":"0 bp"},{"l":"B","h":"50 bp"},{"l":"C","h":"100 bp"},{"l":"D","h":"150 bp"}],"a":"D","e":"<p>One would expect gilt yields to be lower than the comparable reference rate. This would mean that the spread between gilts and corporate bonds is likely to be wider than the corporate bond's spread to the published reference interest rate.<\/p>"},{"s":1,"n":2,"id":"1072586","q":"<p>An investor has placed their money into an infrequent actively managed account. Which of the following is most likely?<\/p>","o":[{"l":"A","h":"In the long run the investor could see enhanced returns to the benchmark"},{"l":"B","h":"The manager will be using strategies like optimisation to enhance returns"},{"l":"C","h":"The beta will allow the investor to determine the performance of the manager"},{"l":"D","h":"They would be subject to much higher charges than a passive fund"}],"a":"A","e":"<p>Active fund management strategies will try to achieve the goal of outperforming a designated benchmark. Those that involve frequent trading generate higher transaction costs which diminish the fund's return. With an infrequently managed account, this will be less of an impact.<\/p>"},{"s":1,"n":3,"id":"1078493","q":"<p>An investor approaches you looking for an investment that can provide capital growth over a long period and the possibility of some income. They are also happy to take on a high-level of risk. What would you recommend?<\/p>","o":[{"l":"A","h":"UK government bonds"},{"l":"B","h":"AA-rated corporate bond"},{"l":"C","h":"Deposit account"},{"l":"D","h":"Equity in a newly-formed company which is traded on a junior market of an exchange"}],"a":"D","e":"<p>Equity in a newly-formed company traded on a junior market best fits the investment profile - it offers high potential growth, with a possibility of income (although this is unlikely in the early years). It also offers the highest level of risk in the choices available.<\/p>"},{"s":1,"n":4,"id":"1075004","q":"<p>What is the function of a trustee in a debenture issue?<\/p>","o":[{"l":"A","h":"To ensure the issuer complies with the terms of the issuance"},{"l":"B","h":"To issue the debenture"},{"l":"C","h":"To ensure regulatory reporting is performed"},{"l":"D","h":"To ensure that the issuance is fully underwritten"}],"a":"A","e":"<p>The trustee ensures that issuer complies with the terms and condition of the debt issuance. It does this on behalf of the debenture holders.<\/p>"},{"s":1,"n":5,"id":"1066471","q":"<p>Modified duration shows the expected change in a bond's price, given a specified change in interest rates. Which of the following is most likely?<\/p>","o":[{"l":"A","h":"The lower the modified duration, the more the price of that instrument will move"},{"l":"B","h":"The higher the modified duration, the more the price of that instrument will move"},{"l":"C","h":"The higher the modified duration, the less the price of that instrument will move"},{"l":"D","h":"The higher the modified duration, the less of an effect the interest change will have on the bond's price."}],"a":"B","e":"<p>The modified duration of a particular debt instrument shows the expected change in its price, given a specified change in interest rates. The higher the modified duration, the more the price of that instrument will move. The modified duration is the approximate percentage change in the price of a bond brought about by a 1% change in the interest rate.<\/p>"},{"s":1,"n":6,"id":"1046719","q":"<p>What is the purpose of an ICEBERG order?<\/p>","o":[{"l":"A","h":"To guarantee the order is filled"},{"l":"B","h":"To allow large orders to be executed at once"},{"l":"C","h":"For anonymity"},{"l":"D","h":"To reduce market impact"}],"a":"D","e":"<p>ICEBERG orders were introduced in September 2003 and are available on SETS and the international order book. Previously, market participants with large orders to execute would have been reluctant to route these through the order book because of the potentially adverse market impact.<br/> An ICEBERG order manages this problem by allowing the order to be partially hidden from the market view.<\/p>"},{"s":1,"n":7,"id":"1078494","q":"<p>A UK government bond sale takes place 2 days before the 'coupon paid date'. The trade is known as:<\/p>","o":[{"l":"A","h":"Ex-coupon"},{"l":"B","h":"Special ex-coupon"},{"l":"C","h":"Cum-interest"},{"l":"D","h":"Cum-coupon"}],"a":"A","e":"<p>The gilt was bought during the 7-day 'ex-coupon' period. The buyer would therefore not be entitled to receive any of the coupon.<\/p>"},{"s":1,"n":8,"id":"1079679","q":"<p>In relation to equity issued by companies, which of the following is best defined as 'registered title'?<\/p>","o":[{"l":"A","h":"The legal name of the company registered at Companies house"},{"l":"B","h":"The trading code given to a security traded on an exchange"},{"l":"C","h":"The name of the legal owner of the share"},{"l":"D","h":"The broker's name holding the nominee company"}],"a":"C","e":"<p>Registered title simply means ownership that is backed by registration. In terms of share ownership, registered title makes it straightforward for the company to give shareholders the right to vote on important company matters, to pay dividends to their shareholders and to enable participation in other corporate actions, such as rights issues. Most shares issued today are issued in registered form.<\/p>"},{"s":1,"n":9,"id":"1052087","q":"<p>Which of the following is a capital expenditure?<\/p>","o":[{"l":"A","h":"Admin costs for the purchase of computer hardware"},{"l":"B","h":"Purchase of toner for existing printers"},{"l":"C","h":"Equipment for a new office"},{"l":"D","h":"Office staff wages"}],"a":"C","e":"<p>'Capital expenditure' is money spent to buy non-current assets, such as plant, property and equipment. It is reflected on the balance sheet.<\/p>"},{"s":1,"n":10,"id":"1052103","q":"<p>Bloomberg and Thomson Reuters are which type of information provider?<\/p>","o":[{"l":"A","h":"Primary Information Provider"},{"l":"B","h":"Secondary Information Provider"},{"l":"C","h":"Regulatory Information Provider"},{"l":"D","h":"Regulatory Information Service"}],"a":"B","e":"<p>Bloomberg and Thomson Reuters are both an example of secondary information providers.<\/p>"},{"s":1,"n":11,"id":"1046453","q":"<p>Which of the following cash flows would not be listed under operating cash flows in a company's cash flow statement?<\/p>","o":[{"l":"A","h":"Receipts from customers on goods sold"},{"l":"B","h":"Payments to suppliers for stock purchased"},{"l":"C","h":"Profits realised on disposal of an asset"},{"l":"D","h":"Tax paid to HMRC"}],"a":"C","e":"<p>Profits are not a cash flow and would not be shown on the cash flow statement. The proceeds on disposal of an asset would be considered a cash flow and would typically be shown in investing cash flows.<\/p>"},{"s":1,"n":12,"id":"1052084","q":"<p>An investment bank when engaging in a foreign exchange transaction with another investment bank in a different time zone could be exposed to risk. This risk could mitigated by the use of which of the following mechanisms?<\/p>","o":[{"l":"A","h":"Novation"},{"l":"B","h":"Delivery versus payment"},{"l":"C","h":"Adherence to the Basel Accord"},{"l":"D","h":"Continuous linked settlement"}],"a":"D","e":"<p>To prevent gross settlement risk, a group of investment banks set up a payment versus payment system to net positions and give more end of day certainty. This is called continuous linked settlement.<\/p>"},{"s":1,"n":13,"id":"1075007","q":"<p>Which of the following is FALSE of a Eurobond?<\/p>","o":[{"l":"A","h":"Typically traded OTC"},{"l":"B","h":"Regulated by The International Capital Markets Association"},{"l":"C","h":"Trades are reported through TRAX"},{"l":"D","h":"Coupons are paid net"}],"a":"D","e":"<p>The coupon on a Eurobond is paid Gross not net.<\/p>"},{"s":1,"n":14,"id":"4049386","q":"<p>6% bond can be redeemed at £100 in 1 year. What is the maximum you would pay today?<\/p>","o":[{"l":"A","h":"£94.00"},{"l":"B","h":"£94.34"},{"l":"C","h":"£100"},{"l":"D","h":"£106"}],"a":"D","e":"<p>Of the answer available, £106 is the best answer. An investor can receive £6 in coupons and £100 in redemption value over the next year. If the rate of return used was 0%, the value of the bond would be £106.<\/p>"},{"s":1,"n":15,"id":"1078497","q":"<p><\/p><p>Which of the following is considered as a sell side-to-sell side electronic trading platform for bonds?<\/p>","o":[{"l":"A","h":"MTS Cash"},{"l":"B","h":"Bloomberg bond trader"},{"l":"C","h":"BondVision"},{"l":"D","h":"TradeWeb"}],"a":"A","e":"<p>Dealer-to-dealer trading can occur via an electronic market, known as an electronic trading platform, such as Message Transfer System (MTS Cash) or Brokertec.<\/p>"},{"s":1,"n":16,"id":"1078854","q":"<p>Which one of the following would not increase the issued share capital?<\/p>","o":[{"l":"A","h":"A capitalisation issue"},{"l":"B","h":"A call on partly paid shares"},{"l":"C","h":"Exercise of warrants"},{"l":"D","h":"A rights issue"}],"a":"B","e":"<p>A company may not demand all the value of some shares at issue, these shares are then referred to as being partly paid. At some later date, the company will call on the shareholders to pay the remaining nominal value and make the shares fully paid. This does not increase the number of shares issued.<\/p>"},{"s":1,"n":17,"id":"1052089","q":"<p>Financial ratio analysis can be used to assess many aspects of a company. Which of the following would be used to identify potentially high future growth prospects?<\/p>","o":[{"l":"A","h":"High P/E ratio : high dividend yield"},{"l":"B","h":"High P/E ratio : low dividend yield"},{"l":"C","h":"Low P/E ratio : low dividend yield"},{"l":"D","h":"Low P/E ratio : high dividend yield"}],"a":"B","e":"<p>These ratios look at the market expectation of the company. <br/> If the share price is high relative to historic earnings, it can show an expectation of future growth in earnings, i.e., the market prices this growth in early. This gives a high, p/e ratio.<br/> If the dividend yield is low, it can show a company reinvesting profits to achieve future growth.<\/p>"},{"s":1,"n":18,"id":"4062240","q":"<p>What key factor is MOST likely to dissuade a company from carrying out a secondary offer?<\/p>","o":[{"l":"A","h":"Low interest rates"},{"l":"B","h":"Existing warrants close to expiry date"},{"l":"C","h":"Bear market"},{"l":"D","h":"Bull market"}],"a":"C","e":"<p>Issuing more shares in a follow-on offering will only be considered if the equity markets are sufficiently robust. In a bear market, there is unlikely to be sufficient demand for the shares at the price the issuing company wants.<\/p>"},{"s":1,"n":19,"id":"1072577","q":"<p>Which of the following would not be found on the statement of financial position under intangible non-current assets?<\/p>","o":[{"l":"A","h":"Goodwill"},{"l":"B","h":"Capitalised development costs"},{"l":"C","h":"Work in progress"},{"l":"D","h":"Patents"}],"a":"C","e":"<p>Work in progress will be shown as a current asset.<\/p>"},{"s":1,"n":20,"id":"4025887","q":"<p>Capital employed can be defined as:<\/p>","o":[{"l":"A","h":"Total equity plus non-current liabilities"},{"l":"B","h":"Total assets plus non- current liabilities"},{"l":"C","h":"Total assets plus current liabilities"},{"l":"D","h":"Total equity plus current liabilities"}],"a":"A","e":"<p>The amount of capital employed is the equity plus the long-term debt. This is the money that the company holds from shareholders and debt providers, and it is from this money that the management should be able to generate profits.<\/p>"},{"s":1,"n":21,"id":"1067795","q":"<p>Which of the following best differentiates medium term notes (MTNs) from other bond issues?<\/p>","o":[{"l":"A","h":"They are cheaper"},{"l":"B","h":"They are more expensive"},{"l":"C","h":"Issuers make payments in kind"},{"l":"D","h":"Issuers use shelf registration"}],"a":"D","e":"<p>MTNs are issued on a scheduled funding basis. Shelf registration allows several issues to be authorised under one registration, allowing the company to roll out the issues over the next two years.<\/p>"},{"s":1,"n":22,"id":"1075885","q":"<p>Which of the following would be MOST associated with rollover risk?<\/p>","o":[{"l":"A","h":"Commercial paper"},{"l":"B","h":"Spot FX contracts"},{"l":"C","h":"Unit trusts"},{"l":"D","h":"Rights issues"}],"a":"A","e":"<p>Commercial paper is a rolling form of debt, with new issues generally funding the retirement of old issues, the main risk is that the issuer will not be able to issue new commercial paper. This is called rollover risk.<\/p>"},{"s":1,"n":23,"id":"1078496","q":"<p>Regulators suggests that portfolio managers use diversification to reduce which type of risk?<\/p>","o":[{"l":"A","h":"Systematic"},{"l":"B","h":"Market"},{"l":"C","h":"Specific"},{"l":"D","h":"Credit"}],"a":"C","e":"<p>The risk that can be removed is known as the specific or unsystematic risk.<\/p>"},{"s":1,"n":24,"id":"1079682","q":"<p>Why is it important that 'request for quote' systems run alongside the dealer-to-customer market?<\/p>","o":[{"l":"A","h":"To cater for large volumes"},{"l":"B","h":"To achieve better prices"},{"l":"C","h":"To avoid volatility"},{"l":"D","h":"To compensate for inflation risk"}],"a":"B","e":"<p>RFQ systems bring dealers into direct competition with each other which should deliver price improvement for investors. They also offer a significant improvement over voice communication in terms of ease and speed of trading.<\/p>"},{"s":1,"n":25,"id":"1066441","q":"<p>Which of the following would be shown as a liability on the statement of financial position (balance sheet)?<\/p>","o":[{"l":"A","h":"Prepayments"},{"l":"B","h":"Debentures"},{"l":"C","h":"Share premium account"},{"l":"D","h":"Patents"}],"a":"B","e":"<p>Non-current liabilities - this comprises the company's borrowing not repayable within the next 12 months. This could include bond issues as well as longer-term bank borrowing.<\/p>"},{"s":1,"n":26,"id":"4004409","q":"<p>Stock borrowing and lending was created to address which of the following?<\/p>","o":[{"l":"A","h":"Market risk"},{"l":"B","h":"Settlement risk"},{"l":"C","h":"Custodian charges"},{"l":"D","h":"Interest rate risk"}],"a":"B","e":"<p>The principal reason for borrowing securities is to cover a short position. Sellers are sometimes obliged to deliver securities that they do not hold and in such circumstances, they will have to borrow them. At the end of an agreed period they have to return the equivalent quantity of securities to the lender.<\/p>"},{"s":1,"n":27,"id":"1078882","q":"<p>Modern electronic trading environments lend themselves to algorithmic trading, a negative aspect of high frequency trading is the possibility of a 'flash crash' which can be summarised as which of the following?<\/p>","o":[{"l":"A","h":"Where the market has fallen by 50% with a dramatic fall in the value of companies"},{"l":"B","h":"Where there has been a rapid decline in the value of the market for it then to recover relatively quickly"},{"l":"C","h":"Where there a been a failure in the exchanges validation and verification programs lending to lack of confidence in the market"},{"l":"D","h":"It will be paid continuously through the collection of variation margin"}],"a":"B","e":"<p>Potential criticisms of high frequency trading include seeing the traders as 'vultures' exploiting the genuine, longer-term investors and, given their dominance of market turnover, the impact they can have on pricing. The impact on pricing can be substantial, and be exhibited in the so-called 'flash crash', market prices fall rapidly, within a short time period, only to recover again around 20 minutes later.<\/p>"},{"s":1,"n":28,"id":"1070055","q":"<p>If the price of the investment falls in a year only to rise again in the next, the fund manager will not become eligible to receive an additional fee, until the previous maximum fund price is surpassed. This would be the best description of which of the following?<\/p>","o":[{"l":"A","h":"Plimsoll line"},{"l":"B","h":"High water mark"},{"l":"C","h":"Performance fees"},{"l":"D","h":"Hurdle rate"}],"a":"B","e":"<p>A high water mark which is usually associated with UCIS funds and especially hedge funds. It means that if the price of the investment falls in a year only to rise again in the next, the manager will not become eligible to receive an additional fee, until the previous maximum fund price is surpassed.<\/p>"},{"s":1,"n":29,"id":"1072164","q":"<p>Which of the following is not a consideration in order priority for execution on an exchange order driven system?<\/p>","o":[{"l":"A","h":"Volume"},{"l":"B","h":"Price"},{"l":"C","h":"Date"},{"l":"D","h":"Time"}],"a":"A","e":"<p>The order priority is by price and then time (date is also captured under time for orders that are instructed to remain on the system after close of day). Volume is not considered for order priority.<\/p>"},{"s":1,"n":30,"id":"4080424","q":"<p>Which of the following is NOT true of US Treasury securities?<\/p>","o":[{"l":"A","h":"T-Bills are sold by a single-priced auction held weekly"},{"l":"B","h":"T-notes and T-bonds pay interest every six months until they mature"},{"l":"C","h":"Five-year T-notes are issued more frequently than ten-year T-notes"},{"l":"D","h":"The DMO is responsible for the issuance and redemption of US Treasuries"}],"a":"D","e":"<p>The Treasury Department conducts auctions and direct sales of US Government securities. The remaining statements are true.<\/p>"},{"s":1,"n":31,"id":"4080425","q":"<p>Sometimes there are periods when US Treasury cash balances are particularly low and there is a need to raise money for less than a month. At these times, the US Treasury is likely to issue which of the following?<\/p>","o":[{"l":"A","h":"Treasury Bill"},{"l":"B","h":"Cash Management Bill"},{"l":"C","h":"Treasury Note"},{"l":"D","h":"Treasury Bond"}],"a":"B","e":"<p>During periods when Treasury cash balances are particularly low, the Treasury may sell cash management bills (or CMBs). These are sold at a discount and by auction just like weekly T-bills. They differ in that they are irregular in amount; term (often less than 21 days); and day of the week for auction, issuance, and maturity.<\/p>"},{"s":1,"n":32,"id":"1066472","q":"<p>In normal market conditions which of the following statements about interest rates and inflation is most likely?<\/p>","o":[{"l":"A","h":"Inflation would be expected to be higher than interest rates"},{"l":"B","h":"Inflation would be expected to be the same as interest rates"},{"l":"C","h":"Inflation would be expected to be lower than interest rates"},{"l":"D","h":"Inflation and interest rates are not linked together"}],"a":"C","e":"<p>The interest rate itself is heavily impacted by inflationary expectations. Simplistically, if inflation is expected to be at 4% per annum, the interest rate will have to be greater than this in order to provide the investor with any real return.<\/p>"},{"s":1,"n":33,"id":"1078492","q":"<p>All of the following are true regarding UK government bond issues except:<\/p>","o":[{"l":"A","h":"Gilts are issued by the Debt Management Office, an executive agency of the Treasury"},{"l":"B","h":"If a tranche is issued between coupon dates its price will usually include accrued interest"},{"l":"C","h":"A primary dealer (GEMM) does not have to participate in the auction process"},{"l":"D","h":"GEMMs may place bids for up to 0.5% of the issue, even if this exceeds £500,000"}],"a":"C","e":"<p>All primary dealers must participate in the auction process.<\/p>"},{"s":1,"n":34,"id":"1070783","q":"<p>Where the lender of stock wishes to cast their vote on a special resolution, which of the following statements is TRUE?<\/p>","o":[{"l":"A","h":"The lender is never permitted to vote once the stock has been lent"},{"l":"B","h":"The lender always retains legal ownership and can vote accordingly"},{"l":"C","h":"As the security has been lent to another prima facie rules would apply"},{"l":"D","h":"The lender should recall the stock in good time"}],"a":"D","e":"<p>If the lender wants to exercise its right to vote, it should recall the stock in good time so that a proxy voting form can be completed and returned to the registrar by the required deadline. <br/> Technically, the consequences arising from any corporate action by the issuer of a security, such as a capitalisation matter or rights issue, when that security has been lent to another would, prima facie, be to the benefit/cost of the borrower. <br/> Under the terms of the security agreement it is customary that these costs/benefits flow back to the lender, and the exact manner in which this is implemented should be reflected in the securities lending agreement.<\/p>"},{"s":1,"n":35,"id":"1066468","q":"<p>Which of the following would account for UK government debt being considered risk free?<\/p>","o":[{"l":"A","h":"The Bank of England is a reputable body"},{"l":"B","h":"The UK is part of NATO"},{"l":"C","h":"The UK government can simply raise taxes"},{"l":"D","h":"The UK has an established Keynesian economic policy"}],"a":"C","e":"<p>The yield available on UK gilts is considered the risk-free rate for sterling-denominated bonds - after all, the UK government can simply raise taxes to repay its debt and that ultimately the UK controls the printing of sterling, so the UK gilts are effectively credit risk-free.<\/p>"},{"s":1,"n":36,"id":"1078893","q":"<p>A company announces a rights issue where an existing shareholder is currently holding 2000 shares and one new share for every 5 existing is being offered. If the cost of purchasing the new shares is £5.00 and the current share price is £9.20, what will be the nil paid value of the right?<\/p>","o":[{"l":"A","h":"£3.50"},{"l":"B","h":"£4.50"},{"l":"C","h":"£5.70"},{"l":"D","h":"£8.50"}],"a":"A","e":"<p>5 existing shares x £9.20 = £46.00 + 1 share x £5.00 gives a total of £51.00<br/> £51.00 divided by the 6 shares = £8.50 (theoretical ex rights price)<br/> £8.50 (theoretical ex rights price) - £5.00 (subscription cost) = £3.50 (theoretical nil paid value).<\/p>"},{"s":1,"n":37,"id":"1079691","q":"<p>Which of the following best reflects the role of the origination team in the quotation of a company?<\/p>","o":[{"l":"A","h":"PR and accounting"},{"l":"B","h":"Accounting and marketing"},{"l":"C","h":"Sponsorship and PR"},{"l":"D","h":"A broad range of advice"}],"a":"D","e":"<p>The sponsor is only part of the origination team helping the company in the flotation. In addition to the sponsor, the issuing company will appoint a variety of other advisers, such as reporting accountants, legal advisers, public relations (PR) consultants and a corporate broker.<\/p>"},{"s":1,"n":38,"id":"1066474","q":"<p>ADR dividends are paid to the holder in:<\/p>","o":[{"l":"A","h":"US dollars"},{"l":"B","h":"the domestic currency of the sponsor company"},{"l":"C","h":"either Euros or US dollars as specified by the prospectus"},{"l":"D","h":"the home currency of the depositary bank"}],"a":"A","e":"<p>When the company pays a dividend, it is paid in the company's domestic currency to the bank, which then converts the dividend into dollars and passes it on to the DR holders. The US investors therefore need not concern themselves with currency movements. Furthermore, when a DR holder decides to sell, the DRs will be sold on in dollars. This removal of the need for any currency transactions for the US investor is a key attraction of the DR.<\/p>"},{"s":1,"n":39,"id":"1052095","q":"<p>With respect to government bonds from the US &amp; France, which one of the following is true?<\/p>","o":[{"l":"A","h":"US government bonds have a greater settlement period"},{"l":"B","h":"Both have the same coupon frequency"},{"l":"C","h":"French government bonds have a greater settlement period"},{"l":"D","h":"Both have the same settlement period"}],"a":"C","e":"<p>French Government Bonds settle on a T+2 basis, whereas US T-Bonds settle on T+1. French government bonds pay an annual coupon, whereas US T-Bonds pay a semi-annual coupon.<\/p>"},{"s":1,"n":40,"id":"1067794","q":"<p>The price of a company's bond increases. This is most likely to have happened because of:<\/p>","o":[{"l":"A","h":"Announcement of excellent earnings by companies in its peer group"},{"l":"B","h":"An upgrade in its credit rating by a ratings agency"},{"l":"C","h":"Rumours of a takeover by a larger company"},{"l":"D","h":"An increase in the company's share price"}],"a":"B","e":"<p>The greatest concern of any bondholder is the possibility of default by the issuing company. The company's credit rating provides the most significant indication of its financial stability and general well-being.<\/p>"},{"s":1,"n":41,"id":"4004405","q":"<p>Which of the following investments would a 30-year-old person in good health be most likely to hold within their personal pension?<\/p>","o":[{"l":"A","h":"High risk commodity funds"},{"l":"B","h":"Low yielding corporate debt"},{"l":"C","h":"Medium risk equities"},{"l":"D","h":"Money market funds"}],"a":"C","e":"<p>Pension funds are set up with the aim of providing retirement funds for the beneficiaries. The money in the fund is invested by fund managers and, because pension funds have a relatively long investment horizon, they can take risks and have tended to invest heavily in equities.<\/p>"},{"s":1,"n":42,"id":"1066473","q":"<p>What BEST describes the settlement process of UK government debt held within CREST, which is an example of Model 1 as defined by the Bank for International Settlements?<\/p>","o":[{"l":"A","h":"Settlement would take place on the bargain date"},{"l":"B","h":"Settlement would take place the day after the bargain"},{"l":"C","h":"Settlement would take place during the third day after the bargain has been agreed"},{"l":"D","h":"Settlement would take place 10 days after the bargain date"}],"a":"B","e":"<p>Here bargain simply means trade and is only used to confuse. Dematerialised gilts (held in CREST) settle T+1.<\/p>"},{"s":1,"n":43,"id":"1075551","q":"<p>A Global custodian finds itself in financial difficulty. What should it do to protect its client's assets?<\/p>","o":[{"l":"A","h":"Continue as before segregating its clients' assets in internal accounts"},{"l":"B","h":"Ask client how to proceed with their assets and follow their instructions to move assets in accordance with the claimants' wishes"},{"l":"C","h":"Seek permission to legally segregate client assets depending on the outcome of the financial difficulties"},{"l":"D","h":"Use the clients' assets to provide a capital buffer against the firm's financial difficulties"}],"a":"A","e":"<p>If the custodian has properly segregated the assets, they are protected from the financial difficulties of the custodian. This is a fundamental obligation of custodians.<\/p>"},{"s":1,"n":44,"id":"1079684","q":"<p>A bank is assisting a client to issue securities in emerging and frontier markets. Which considerations should specifically be stated in relation to the client?<\/p>","o":[{"l":"A","h":"There is always more fraud and money laundering risk"},{"l":"B","h":"Secondary markets are generally less sophisticated than in developed countries"},{"l":"C","h":"There is likely to be less liquidity in the primary markets"},{"l":"D","h":"Economic volatility may lead to high levels of inflation"}],"a":"C","e":"<p>We are looking at advice to an issuer of securities. Their goal is to raise capital on the primary markets. The most relevant consideration to them is how much liquidity there is in this market. The secondary markets may well be less sophisticated, and the economy may be more volatile, but these are more issues for investors than issuers. It is true that fraud and money laundering risk may be higher, but stating it is always so is too strong.<\/p>"},{"s":1,"n":45,"id":"1072576","q":"<p>Which of the following is the lowest form of debt?<\/p>","o":[{"l":"A","h":"Floater"},{"l":"B","h":"Asset back security"},{"l":"C","h":"PIK"},{"l":"D","h":"Subordinated debt"}],"a":"C","e":"<p>Payment in kind (PIK) if it exists will be even more risky than the subordinated debt. It will rank below other forms of debt but above the equity in a liquidation.<\/p>"},{"s":1,"n":46,"id":"1079687","q":"<p>A company obtains a quotation on an exchange without adjusting their capital structure. How did they achieve this?<\/p>","o":[{"l":"A","h":"A placing"},{"l":"B","h":"An offer for sale"},{"l":"C","h":"A share-buy back"},{"l":"D","h":"An introduction"}],"a":"D","e":"<p>An introduction is used by a company that does not need to raise extra capital through share issues but wishes to gain the extra liquidity in its shares that a listing provides. This might be a company that is already listed on another, overseas stock exchange, a new company formed from two previously listed companies that have merged, or a demutualised organisation.<\/p>"},{"s":1,"n":47,"id":"4025888","q":"<p>Who decides whether a company’s shares are admitted to both the official list and the LSE?<\/p>","o":[{"l":"A","h":"LSE"},{"l":"B","h":"Sponsor"},{"l":"C","h":"OFT"},{"l":"D","h":"FCA"}],"a":"D","e":"<p>The Main Market in the UK is typically referred to as the Official List and the criteria for admission to the Official List are set out in the Listing Rules – a rule book is maintained by the FCA and applications are made to the FCA, formerly known as the UKLA<\/p>"},{"s":1,"n":48,"id":"1075556","q":"<p>Which one of these items is NOT a non-current asset?<\/p>","o":[{"l":"A","h":"Property, plant and equipment"},{"l":"B","h":"Intangible assets"},{"l":"C","h":"Deferred Tax"},{"l":"D","h":"Goodwill"}],"a":"C","e":"<p>Deferred tax is considered a liability in the exam. All of the others are non-current assets.<\/p>"},{"s":1,"n":49,"id":"4004406","q":"<p>Which of the following types of corporate debt would most likely have the lowest coupon?<\/p>","o":[{"l":"A","h":"UK treasury bonds"},{"l":"B","h":"Contingent convertible bonds"},{"l":"C","h":"Guaranteed bonds"},{"l":"D","h":"Mezzanine bonds"}],"a":"C","e":"<p>Treasury bonds would have the lowest coupon but as the question asks about corporate debt the answer has to be a guaranteed bond, as the treasury is a government bond. A guaranteed bond is likely to be issued with a lower coupon due the credit enhancement of the guarantee from a third party.<\/p>"},{"s":1,"n":50,"id":"1075005","q":"<p>A Depositary Receipt may be pre-released however the issuer must deliver the underlying shares for deposit within:<\/p>","o":[{"l":"A","h":"One month"},{"l":"B","h":"Three months"},{"l":"C","h":"Six months"},{"l":"D","h":"Nine months"}],"a":"B","e":"<p>The issuer of DRs must deliver the underlying shares within three in order to satisfy the rules of the pre-release issue. During the pre-release period the position must be collateralised with cash.<\/p>"},{"s":1,"n":51,"id":"1079678","q":"<p>The providers of which of the following services would be considered a participant in the wholesale market?<\/p>","o":[{"l":"A","h":"Investment services"},{"l":"B","h":"Derivatives trading"},{"l":"C","h":"Financial planning"},{"l":"D","h":"Retail banking"}],"a":"B","e":"<p>Derivatives trading is associated with the wholesale market - as would other trading services. The other services would be associated with the retail markets.<\/p>"},{"s":1,"n":52,"id":"1079681","q":"<p>Which of the following could result in a 'rebate' in a stock lending situation?<\/p>","o":[{"l":"A","h":"It is securities driven"},{"l":"B","h":"The term is relatively short"},{"l":"C","h":"Insufficient liquidity"},{"l":"D","h":"Cash is used as collateral"}],"a":"D","e":"<p>If the agreed form of collateral is cash, then the fee may be quoted as a rebate, meaning that the lender will earn all of the interest that accrues on the cash collateral, and will rebate an agreed rate of interest to the borrower.<\/p>"},{"s":1,"n":53,"id":"1047410","q":"<p>If the yield curve is considered normal which of the following is TRUE?<\/p>","o":[{"l":"A","h":"Short dated yields move independently to short dated prices"},{"l":"B","h":"Long dated yields move independently to long dated prices"},{"l":"C","h":"Long dated yields move inversely to long dated prices"},{"l":"D","h":"Short dated prices and yields move in the same direction"}],"a":"C","e":"<p>A yield curve measures bond yields against the maturities. A normal yield curve occurs when yields increase as maturities increase. <br/> Regardless of the nature of the yield curve there is an inverse relationship between bond prices and yields. As the price of the bond goes up, the return on the bond (or yield) will fall.<\/p>"},{"s":1,"n":54,"id":"1039452","q":"<p>A company wishes to exchange GBP for USD in three months' time. The current spot rate is 1.4500/05USD, and the company is quoted a 20/18 forward adjustment. <br/> What would be the outright bid on the forward contract?<\/p>","o":[{"l":"A","h":"1.4520"},{"l":"B","h":"1.4480"},{"l":"C","h":"1.4523"},{"l":"D","h":"1.4487"}],"a":"B","e":"<p>The forward adjustment is a premium, therefore we subtract from spot. The bid is the price at which the bank will buy our GBP and is the first number in the spread.<br/> 1.4500 - 0.0020 = 1.4480<\/p>"},{"s":1,"n":55,"id":"4062275","q":"<p>If the spot rate is GBP/USD is £1:$1.4200, the interest rates in the US is 3.1% p.a. and 2.2% p.a. in the UK. Calculate the one year forward rate?<\/p>","o":[{"l":"A","h":"$1.4076"},{"l":"B","h":"$1.4325"},{"l":"C","h":"$1.4232"},{"l":"D","h":"$1.4263"}],"a":"B","e":"<p>This would be solved by using the formula:<\/p><p>(1 + rate (quote)) / (1 + rate (base)) x spot = forward.<\/p><p>As the question is asking for the one year forward rate we do not need to adjust for time as we are given the annual rates.<\/p><p>(1+0.031) / (1+0.022) x 1.4200 = $1.4325<\/p>"},{"s":1,"n":56,"id":"1075011","q":"<p>Where a company wants to improve the liquidity of its shares but not reduce the nominal value of the shares it is most likely to perform which of the following?<\/p>","o":[{"l":"A","h":"Have a scrip issue"},{"l":"B","h":"Have a share buy back"},{"l":"C","h":"Have a stock split"},{"l":"D","h":"Have a rights issue"}],"a":"A","e":"<p>A scrip issue is also known as a bonus issue. It's a free issue of shares to existing shareholders and is performed to reduce an 'expensive' share price. A stock split would produce the same result, but it is achieved by reducing the nominal value of shares and increasing the number of shares issued.<\/p>"},{"s":1,"n":57,"id":"1052090","q":"<p>A life insurance company that wishes to gain long term capital growth would invest in which asset class?<\/p>","o":[{"l":"A","h":"Equity"},{"l":"B","h":"Bonds"},{"l":"C","h":"Money market"},{"l":"D","h":"Derivatives"}],"a":"A","e":"<p>Because of the long-term nature of life assurance business, the funds tend to be willing to invest in higher risk investments involving a heavy weighting in equity investments. Unlike pension funds, the income and the gains made within life assurance funds are subject to tax.<\/p>"},{"s":1,"n":58,"id":"1075558","q":"<p>A corporate bond is often quoted against a benchmark bond. Which one of these most likely a benchmark bond?<\/p>","o":[{"l":"A","h":"A government bond in the same currency with a similar maturity"},{"l":"B","h":"A similar corporate bond which has been performed competitively"},{"l":"C","h":"Another bond with the same maturity issued by the same company"},{"l":"D","h":"A credit index covering all bonds of the same maturity"}],"a":"A","e":"<p>Benchmark bonds are typically government bonds in the same currency with a similar maturity.<\/p>"},{"s":1,"n":59,"id":"1046731","q":"<p>A bond rated AA moves to A-, what will be the effect on price and yield?<\/p>","o":[{"l":"A","h":"Rise, fall"},{"l":"B","h":"Rise, rise"},{"l":"C","h":"Fall, fall"},{"l":"D","h":"Fall, rise"}],"a":"D","e":"<p>If a bond is downgraded, this will have a negative impact on price (and a positive impact on yield). The most marked impact on price will be if a bond is downgraded from investment grade to non-investment grade. The opposite is true if a bond is upgraded.<\/p>"},{"s":1,"n":60,"id":"1075006","q":"<p>Which of the following could make up part of a company's free float?<\/p>","o":[{"l":"A","h":"Shares held by owners owning 5% of the company's shares"},{"l":"B","h":"Restricted holders of the company's directors"},{"l":"C","h":"Shares held by an institutional investor holding 4% of the company's shares"},{"l":"D","h":"A 7% shareholding by the Government"}],"a":"C","e":"<p>The free-float or a public float is usually defined as being all shares held by investors other than shares held by owners owning 5% or more of all shares (those could be government holdings, institutional investors, strategic shareholders, founders, executives holdings) and restricted stocks granted to executives.<\/p>"},{"s":1,"n":61,"id":"1075015","q":"<p>What is a key benefit of using an Inter-Dealer Broker (IDB)?<\/p>","o":[{"l":"A","h":"Liquidity"},{"l":"B","h":"Anonymity"},{"l":"C","h":"Tighter dealing spreads"},{"l":"D","h":"Creates larger Normal Market Sizes"}],"a":"B","e":"<p>An IDB allows market makers to trade with each other without revealing their identity.<\/p>"},{"s":1,"n":62,"id":"1072895","q":"<p>Which of the following would be considered the difference between commercial paper in the UK and commercial paper in the US?<\/p>","o":[{"l":"A","h":"UK commercial paper settles T+2, whilst US commercial paper settles T+0"},{"l":"B","h":"Yields on commercial paper are quoted on a discount basis by using the standard of Actual/360"},{"l":"C","h":"UK commercial paper is issued only by financial institutions, whilst US commercial paper is issued by all corporates"},{"l":"D","h":"UK commercial paper typically has a maximum maturity of 365 days, whilst US commercial paper has a maximum maturity of 270 days"}],"a":"D","e":"<p>Commercial paper (CP) is a money market instrument, issued by a company. The money market is the term for the market involving cash deposits and short-term instruments that are issued with less than one year to their maturity. CP is the corporate equivalent of a government's Treasury bill. CP is issued at a discount to its nominal value and can have a maturity of up to one year in Europe and 270 days in the US; however, it is common to find in both territories that CP will be issued for three months. Yields for CP are quoted on a discount basis. Virtually all countries use the Actual/360 basis, except the UK, which uses the Actual/365 basis<\/p>"},{"s":1,"n":63,"id":"4062266","q":"<p>A company has a current market price per share of £3, dividend per share of 20p and dividend cover of 1.5. What is the company’s price earnings (P/E) ratio?<\/p>","o":[{"l":"A","h":"4.5"},{"l":"B","h":"10"},{"l":"C","h":"2"},{"l":"D","h":"15"}],"a":"B","e":"<p>The P/E ratio is share price divided by earnings per share (EPS). Dividend cover is earnings per share divided by dividend per share. EPS = 20p x 1.5. Share price of 300p divided by 30p equals 10.<\/p>"},{"s":1,"n":64,"id":"1072180","q":"<p>Which of the below is likely to invest more in money market instruments?<\/p>","o":[{"l":"A","h":"Bank"},{"l":"B","h":"Life assurance company"},{"l":"C","h":"Pension fund"},{"l":"D","h":"Hedge funds"}],"a":"A","e":"<p>In accordance with the CISI book, banks and insurance companies are more likely to need this level of liquidity to invest in short term products like money market instruments.<\/p>"},{"s":1,"n":65,"id":"4062243","q":"<p>Floating rate bonds offer greater protection against inflation risk than fixed interest bonds because:<\/p>","o":[{"l":"A","h":"They are directly linked to movements in the RPI"},{"l":"B","h":"They tend to attract a higher agency rating"},{"l":"C","h":"Their interest rates tend to rise to offset the impact"},{"l":"D","h":"Their redemption values increase proportionally"}],"a":"C","e":"<p>Floating-rate bonds will suffer less because the higher inflation will bring about a higher interest rate, but the real value of the principal at redemption will fall. Inflation-protected securities will not suffer.<\/p>"},{"s":1,"n":66,"id":"4062252","q":"<p>In which market can companies use an offer for subscription as a method to float their share to raise capital?<\/p>","o":[{"l":"A","h":"Dark pools"},{"l":"B","h":"Secondary"},{"l":"C","h":"Primary"},{"l":"D","h":"OTC market"}],"a":"C","e":"<p>An offer for subscription is a primary market activity<\/p>"},{"s":1,"n":67,"id":"1072573","q":"<p>Which of the following ratios would allow an investor to determine the income returned from equity over the current share price?<\/p>","o":[{"l":"A","h":"Dividend yield"},{"l":"B","h":"Return on capital employed"},{"l":"C","h":"Asset turnover"},{"l":"D","h":"Dividend cover"}],"a":"A","e":"<p>The dividend yield expresses the total dividends per share paid out over the last year as a percentage of the current share price.<\/p>"},{"s":1,"n":68,"id":"1066442","q":"<p>Revenue expenditure will have an initial impact on the:<\/p>","o":[{"l":"A","h":"cash flow statement"},{"l":"B","h":"income statement"},{"l":"C","h":"statement of financial position"},{"l":"D","h":"balance sheet"}],"a":"B","e":"<p>Revenue expenditure is money spent that immediately impacts the income statement. Examples of revenue expenditure include wages paid to staff, rent paid on property and professional fees, like audit fees.<\/p>"},{"s":1,"n":69,"id":"1047408","q":"<p>Which of the following is the best definition of the gross redemption yield (GRY)?<\/p>","o":[{"l":"A","h":"The annual interest rate for a bond held to maturity"},{"l":"B","h":"The difference between the current price and nominal value"},{"l":"C","h":"The total return if held to maturity"},{"l":"D","h":"The annualised total return for a bond held to maturity"}],"a":"D","e":"<p>This is a trickly question. Whilst 'The annual interest rate for a bond held to maturity' could be considered correct, 'The annualised total return for a bond held to maturity' is the best available definition as it considers the total return, not just the interest rate on the bond.<\/p>"},{"s":1,"n":70,"id":"1072179","q":"<p>Hedging with the use of derivatives is a strategy that helps investors with:<\/p>","o":[{"l":"A","h":"Protecting against losses"},{"l":"B","h":"Removing or reducing their upside"},{"l":"C","h":"Increasing their exposure to assets"},{"l":"D","h":"Taking short positions"}],"a":"A","e":"<p>Derivatives can be used in many ways to achieve many different things, When used for hedging it is about reducing their risk to investments by protecting the downside.<\/p>"},{"s":1,"n":71,"id":"1047416","q":"<p>A credit rating is normally applied to a company's:<\/p>","o":[{"l":"A","h":"Equity"},{"l":"B","h":"Debt"},{"l":"C","h":"Futures"},{"l":"D","h":"Warrants"}],"a":"B","e":"<p>A company's debt will often have a credit rating applied to it. The credit rating of debt is based on credit or default risk. Credit or default risk is the risk that the company will not meet its obligations, i.e. payment of interest and principal.<\/p>"},{"s":1,"n":72,"id":"1079688","q":"<p>Which of the following is true of a full-service broker and a discount broker?<\/p>","o":[{"l":"A","h":"Both will impose a minimum charge of at least £10 on trades"},{"l":"B","h":"The full-service broker will have a higher minimum charge than the discount broker"},{"l":"C","h":"Both brokers' minimum charges will be a percentage of the value traded"},{"l":"D","h":"Only discount brokers are permitted to offer a minimum charge"}],"a":"B","e":"<p>Both types of broker are likely to have a minimum charge that will apply if the value of the securities traded is small. It will be a fixed amount, not a percentage. It will not, however, be the same. It might be £7.50 or equivalent for a discount broker and perhaps £19.95 for a full-service broker.<\/p>"},{"s":1,"n":73,"id":"1079700","q":"<p>An investor buys a 4% 4-year bond for £109 per £100nv. If the investor holds the bond for the full four years, what will be the redemption value?<\/p>","o":[{"l":"A","h":"£100"},{"l":"B","h":"£104"},{"l":"C","h":"£109"},{"l":"D","h":"£116"}],"a":"A","e":"<p>The redemption value will be the nominal value of the bond. This is returned to the investors at the end of the life of the bond.<\/p>"},{"s":1,"n":74,"id":"4062235","q":"<p>What is the chief role that a trustee is appointed to fulfil when debenture stock is issued to investor in the UK?<\/p>","o":[{"l":"A","h":"To underwrite the issuance of the relevant security"},{"l":"B","h":"To receive and administer applications to purchase the security"},{"l":"C","h":"To ensure that the issuer adheres to the terms of the indenture"},{"l":"D","h":"To act as the transfer agent when changes of ownership occur"}],"a":"C","e":"<p>The corporate trustee must keep track of all bonds sold, verifying that the amount issued is not greater than what is stated in the indenture (legal structure of the debt issuance) and making sure that the corporation complies with all covenants, which are the terms of the indenture, while the bond issue is outstanding.<\/p>"},{"s":1,"n":75,"id":"1075560","q":"<p>Which of the following would best describe the purpose of index linked gilts?<\/p>","o":[{"l":"A","h":"To raise capital"},{"l":"B","h":"To increase the PSNCR"},{"l":"C","h":"To provide a product with a deflation floor"},{"l":"D","h":"To provide an inflation protected product"}],"a":"D","e":"<p>This is a difficult question and most likely a trial question. If the government simply wanted to raise capital it would issue conven
