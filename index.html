d arithmetic index of stock prices"},{"l":"B","h":"Unweighted geometric index of stock prices"},{"l":"C","h":"Weighted geometric index of stock prices"},{"l":"D","h":"Weighted arithmetic index of stock prices"}],"a":"D","e":"<p>It is weighted according to each constituent's market capitalisation.<\/p>"},{"s":8,"n":33,"id":"1078460","q":"<p>What is the minimum order size on an electronic order driven system?<\/p>","o":[{"l":"A","h":"1 share"},{"l":"B","h":"10 shares"},{"l":"C","h":"100 shares"},{"l":"D","h":"1,000 shares"}],"a":"A","e":"<p>There is no minimum order size for order driven securities on the order book. The maximum order size is 99,999.99 x EMS (Exchange Market Size) of the security.<\/p>"},{"s":8,"n":34,"id":"1002025","q":"<p>The role of market maker in the US government bond market is fulfilled by:<\/p>","o":[{"l":"A","h":"Specialists"},{"l":"B","h":"Traders"},{"l":"C","h":"Brokers"},{"l":"D","h":"Primary dealers"}],"a":"D","e":"<p>A primary dealer in the US is the equivalent of GEMMs.<\/p>"},{"s":8,"n":35,"id":"1078466","q":"<p>Which two of the following statements in reference to electronic order book trading is least likely?<\/p><p><strong>I<\/strong><\/p><p>Orders can be anonymous<\/p><p><strong>II<\/strong><\/p><p>The highest priced sell order will be at the top of the sell side of the order book<\/p><p><strong>III<\/strong><\/p><p>Orders at the same price will be matched on a time priority basis<\/p><p><strong>IV<\/strong><\/p><p>Orders at the same price will be matched on the basis of highest volume first<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"II and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"III and IV"}],"a":"B","e":"<p>Option II is incorrect as it is the LOWEST priced sell order that will be at the top of the sell side of the order book. Option IV is incorrect as order book priority is PRICE then TIME (volume is irrelevant).<\/p>"},{"s":8,"n":36,"id":"1076205","q":"<p>Which of the following monitors compliance with the requirements for authorised firms to report their transactions?<\/p>","o":[{"l":"A","h":"LSE Market Operations Division"},{"l":"B","h":"PRA Structural Reform Committee"},{"l":"C","h":"FCA Transaction Monitoring Unit"},{"l":"D","h":"The National Storage Mechanism"}],"a":"C","e":"<p>In the UK, the Financial Conduct Authority's Transaction Monitoring Unit (TMU) monitors compliance with the requirements for authorised firms to report their transactions, as well as approving certain reporting mechanisms that can be used.<\/p>"},{"s":8,"n":37,"id":"1001996","q":"<p>All of the following are uses of the FTSE 100 index except:<\/p>","o":[{"l":"A","h":"Provides an indication of company prospects"},{"l":"B","h":"Benchmark to evaluate fund manager's performance"},{"l":"C","h":"Provides an indication of market trends"},{"l":"D","h":"Used as the underlying for pricing derivatives"}],"a":"A","e":"<p>The FTSE 100 does NOT provide an indication of how companies will perform.<\/p>"},{"s":8,"n":38,"id":"1023963","q":"<p>A fund manager wishing to use an index as a benchmark for a fund dealing in Asian equities (excluding Japan) is most likely to use which of the following indices?<\/p>","o":[{"l":"A","h":"Nikkei 225"},{"l":"B","h":"Hang Seng"},{"l":"C","h":"Extramark"},{"l":"D","h":"Stoxx"}],"a":"B","e":"<p>The best answer here is Hang Seng as it is a non-Japanese Asian index. Extramark is a FTSE technology index and the Stoxx indices are numerous.<\/p>"},{"s":8,"n":39,"id":"1055879","q":"<p>What is the advantage of a quoted market compared to an order-driven market?<\/p>","o":[{"l":"A","h":"Absence of market makers"},{"l":"B","h":"Pre-trade transparency"},{"l":"C","h":"Enhanced liquidity"},{"l":"D","h":"Automatic execution"}],"a":"C","e":"<p>Market makers are required to make quotes in a quoted market. In this way they guarantee liquidity in the market. The transparency requirements are the same for both order-driven and quote-driven markets. There is no automatic execution on a quote-driven market. Instead, market makers quote prices and investors will call them up to trade.<\/p>"},{"s":8,"n":40,"id":"1078486","q":"<p>A broker-dealer is a member firm that:<\/p><p><strong>I<\/strong><\/p><p>Makes two-way prices in securities in which it is registered<\/p><p><strong>II<\/strong><\/p><p>Buys and sells shares as principal<\/p><p><strong>III<\/strong><\/p><p>Is an intermediary between market makers<\/p><p><strong>IV<\/strong><\/p><p>Arranges the purchase and sale of shares on behalf of clients<\/p>","o":[{"l":"A","h":"I and II only"},{"l":"B","h":"I and III only"},{"l":"C","h":"II and IV only"},{"l":"D","h":"I, II, III and IV"}],"a":"C","e":"<p>Broker-dealer broken down:<br/> Broker - the firm buys and sells as an agent<br/> Dealer - the firms buys and sells as principal<br/> <br/> The other answers describe a market maker or an inter-dealer broker.<\/p>"},{"s":8,"n":41,"id":"1001722","q":"<p>Which of the following stock indices can be regarded as a 'broad measure' of performance?<\/p>","o":[{"l":"A","h":"Nikkei"},{"l":"B","h":"CAC"},{"l":"C","h":"Dow Jones"},{"l":"D","h":"Hang Seng"}],"a":"A","e":"<p>Nikkei 225 - broad measure.<br/> CAC 40 - narrow measure.<br/> DJIA (Dow Jones Industrial Average) - 30 shares, therefore narrow measure.<br/> Hang Seng - narrow measure.<\/p>"},{"s":8,"n":42,"id":"1001183","q":"<p>During trading, using an electronic order book, an order is placed to execute as much as possible at a specified price and reject the unexecuted portion. This order type is known as:<\/p>","o":[{"l":"A","h":"Market order"},{"l":"B","h":"Execute and eliminate"},{"l":"C","h":"Fill or kill"},{"l":"D","h":"Limit order"}],"a":"B","e":"<p>An execute or eliminate order specifies a volume of shares and a limit price; it is executed immediately. Any unexecuted part is rejected from the order book.<\/p>"},{"s":8,"n":43,"id":"1001882","q":"<p>Which of the following is a principal trade?<\/p>","o":[{"l":"A","h":"The first trade of the day"},{"l":"B","h":"The firm is an actual party to the transaction"},{"l":"C","h":"The firm is acting on behalf of a client"},{"l":"D","h":"The transaction has priority over other transactions"}],"a":"B","e":"<p>A principal trade is where the firm is acting on its own account, as opposed to an agency transaction where the firm is acting on behalf of a client.<\/p>"},{"s":8,"n":44,"id":"1001720","q":"<p>On what basis are companies selected for inclusion in the FTSE 100?<\/p>","o":[{"l":"A","h":"Turnover"},{"l":"B","h":"Net profits"},{"l":"C","h":"Number of shares in issue"},{"l":"D","h":"Market capitalisation"}],"a":"D","e":"<p>It is the market worth that is considered in determining a company's inclusion in the FTSE 100. Note: market capitalisation = number of shares in issue x market price per share.<\/p>"},{"s":8,"n":45,"id":"1078461","q":"<p>During normal trading on an electronic order book, in which of the following circumstances would orders be removed from the order book in a given security?<\/p>","o":[{"l":"A","h":"If the exchange declares a trading halt in that security"},{"l":"B","h":"If the exchange suspends automatic execution in that security"},{"l":"C","h":"If the listing authority suspends that security"},{"l":"D","h":"If a trade varies +/- 5% from the last automated trade"}],"a":"C","e":"<p>Although all four options will result in an interruption to order book trading, only option 'if the listing authority suspends the listing in that security' will actually result in the orders being removed from the order book.<\/p>"},{"s":8,"n":46,"id":"1015643","q":"<p>When might a limit order be undertaken at a price other than its stated limit price?<\/p>","o":[{"l":"A","h":"When exercised during the opening period of the order books"},{"l":"B","h":"During the uncrossing algorithm"},{"l":"C","h":"When matched against a better priced at best order"},{"l":"D","h":"When matched against a better priced fill or kill order"}],"a":"B","e":"<p>Limit orders may be exercised at the uncrossing price following the uncrossing algorithm. There is no execution during the auction.<br/> Limit orders can also be matched at a better price than the limit price if it hits a better priced order that resides on the order book. However, at best order and fill or kill order are not persistent and do not reside on the order book.<\/p>"},{"s":8,"n":47,"id":"1002054","q":"<p>What is the best definition of free float?<\/p>","o":[{"l":"A","h":"Absence of any restrictions on share ownership in the articles of association"},{"l":"B","h":"The proportion of a company's shares in public hands"},{"l":"C","h":"Absence of restrictions on exchange rates"},{"l":"D","h":"A company listed by the UKLA"}],"a":"B","e":"<p>Free float ignores shares that are unavailable for trading on the secondary markets. For example, shares held by directors of the issuing company.<\/p>"},{"s":8,"n":48,"id":"1057387","q":"<p>Which of the following is a feature of a quote-driven market rather than an order-driven market?<\/p>","o":[{"l":"A","h":"Automatic execution of orders"},{"l":"B","h":"Market makers matching client orders"},{"l":"C","h":"Market makers obliged to quote prices"},{"l":"D","h":"Buyers and sellers negotiating prices"}],"a":"C","e":"<p>In a quote-driven market, market makers are obligated to quote prices. This is not the case of order-driven markets. The other choices are features of order-driven markets.<\/p>"},{"s":8,"n":49,"id":"1001172","q":"<p>On an electronic order book, the best offer price is:<\/p>","o":[{"l":"A","h":"The lowest priced sell order"},{"l":"B","h":"The lowest priced buy order"},{"l":"C","h":"The highest priced sell order"},{"l":"D","h":"The highest priced buy order"}],"a":"A","e":"<p>Note: the best bid price is the highest priced buy order.<\/p>"},{"s":8,"n":50,"id":"1078475","q":"<p>Which of the following best describes the nature of a circuit breaker?<\/p>","o":[{"l":"A","h":"It is an automated suspension of trading where prices have moved more than a predetermined amount"},{"l":"B","h":"Where the listing authority has suspended the listing of particular security on a recognised investment exchange"},{"l":"C","h":"Where trading has exceeded the previous days high water mark resulting in a suspension of trading"},{"l":"D","h":"It is an exchange system which is used to highlight financial crime to the regulator"}],"a":"A","e":"<p>It is an automated suspension of trading where prices have moved more than a predetermined amount to enable market participants to reflect and prevent panic buying or selling<\/p>"},{"s":8,"n":51,"id":"1078481","q":"<p>Which of the following is a benefit of a central counterparty service for an order driven execution system?<\/p>","o":[{"l":"A","h":"Improved liquidity"},{"l":"B","h":"Making the identity of market participants known"},{"l":"C","h":"Increased default risk"},{"l":"D","h":"Better access to US securities"}],"a":"A","e":"<p>The CPP service has led to fully anonymous trading and has reduced default risk.<\/p>"},{"s":8,"n":52,"id":"1055886","q":"<p>Which of the following most likely describes the features and benefits of a putable bond?<\/p>","o":[{"l":"A","h":"The issuer of a putable bond has the right, but not the obligation, to redeem early repayment of the principal, usually exercisable on specified dates, which is good for the issuer usually when interest rates are rising"},{"l":"B","h":"The holder of a putable bond has the right, but not the obligation, to demand early repayment of the principal, usually exercisable on specified dates, which is good for the holder usually when interest rates are rising"},{"l":"C","h":"The holder of a putable bond has the right, but not the obligation, to demand early repayment of the principal, usually exercisable on specified dates, which is good for the holder usually when interest rates are falling"},{"l":"D","h":"The issuer of a putable bond has the right, but not the obligation, to redeem early repayment of the principal, usually exercisable on specified dates, which is good for the issuer usually when interest rates are falling"}],"a":"B","e":"<p>Putable bonds all about the holder having rights, so forget the two answers talking about the issuer. They are particularly useful when interest rates are rising, which generally means that bond prices are falling. When interest rates hit a certain height (and the bond price has fallen a certain amount), provided that the bond is within specified dates, the bond holder can simply hand back the bond to the issuer. This effectively means a putable bond has a price floor, when within those specified dates.<\/p>"},{"s":8,"n":53,"id":"1002047","q":"<p>GEMMs on the London Stock Exchange need to be vetted and registered by which of the following?<\/p>","o":[{"l":"A","h":"LSE"},{"l":"B","h":"FCA"},{"l":"C","h":"DMO"},{"l":"D","h":"DTI"}],"a":"C","e":"<p>The Debt Management Office issues gilts and vets gilt-edged market makers.<\/p>"},{"s":8,"n":54,"id":"1078469","q":"<p>For which of the following reasons has the exchange the right to prohibit trading in listed securities?<\/p>","o":[{"l":"A","h":"Too high trading volume"},{"l":"B","h":"Narrow spreads"},{"l":"C","h":"Fast price movements"},{"l":"D","h":"Any reason"}],"a":"D","e":"<p>Typically rule books allow the right for exchanges to prohibit trading for any reason.<\/p>"},{"s":8,"n":55,"id":"1078482","q":"<p>If a limit order is entered into an order book during the opening auction call period, what price will it be executed at:<\/p>","o":[{"l":"A","h":"The limit price"},{"l":"B","h":"The uncrossing price"},{"l":"C","h":"The best price"},{"l":"D","h":"The premium price"}],"a":"B","e":"<p>The uncrossing price is calculated at the end of an auction call. All trades that can be executed at this price, will be. This means that if the uncrossing price is equal to or better than any limit prices placed during the auction, these limit orders will be executed. This can result in a limit order getting a better than limit price.<\/p><p>Those limit orders where the uncrossing price is worse than their limit price, will remain on the order book unfilled.<\/p>"},{"s":8,"n":56,"id":"1072789","q":"<p>Which of the following is given access to direct telephone contact systems on the issuance of UK Government bonds?<\/p>","o":[{"l":"A","h":"Fund managers and dealers"},{"l":"B","h":"Debt Management Office"},{"l":"C","h":"Primary dealers"},{"l":"D","h":"Inter-dealer brokers"}],"a":"C","e":"<p>Bond trading, including both corporate and government bonds, is either conducted between dealers, some of which is arranged by IDBs, or between dealers and their customers, like asset managers. However dealers will be the only ones who will use direct telephone contact. Dealer to customer trading is done via voice trading or electronic platforms.<\/p>"},{"s":8,"n":57,"id":"1001163","q":"<p>A market order contains which of the following information?<\/p><p><strong>I<\/strong><\/p><p>Whether the order is a buy or sell<\/p><p><strong>II<\/strong><\/p><p>Limit price<\/p><p><strong>III<\/strong><\/p><p>Volume of shares<\/p><p><strong>IV<\/strong><\/p><p>Expiry date<\/p>","o":[{"l":"A","h":"II and III"},{"l":"B","h":"I and IV"},{"l":"C","h":"I and III"},{"l":"D","h":"I, III and IV"}],"a":"C","e":"<p>A market order will execute at the current best price on the order book whatever that may be. It will also execute immediately. Consequently, such an order will not specify a price or an expiry time.<\/p>"},{"s":8,"n":58,"id":"1078886","q":"<p>A buy order matches a sell order 10 mins before a trading halt was imposed by the exchange. What will happen to this order?<\/p>","o":[{"l":"A","h":"The order will wait for the halt to finish determined by the exchange and then proceed to the clearing system"},{"l":"B","h":"As the order is in a suspended security the order will be cancelled with the system informing each party that the trade has failed"},{"l":"C","h":"The trade will be reported to the regulator to see if the member firms are punishable for financial crime"},{"l":"D","h":"The order will proceed straight to the settlement system as normal"}],"a":"D","e":"<p>If a security is suspended, permission is required from the exchange before a member firm can affect a transaction in that security. The length of the trading halt is at the discretion of the exchange. Trades that have occurred but have not yet settled at the time of suspension are settled as normal.<\/p>"},{"s":8,"n":59,"id":"1078880","q":"<p>A company traded on the UK's Alternative Investment Market (AIM) has a nominated adviser and a corporate broker. If the company should lose any of these which of the following will occur?<\/p>","o":[{"l":"A","h":"If the company should be without either for one month or more the company will be suspended from trading"},{"l":"B","h":"If there is at least a nominated adviser the shares can still be traded on exchange but will be suspend from trading OTC"},{"l":"C","h":"The company's shares will be instantly suspended from trading activities"},{"l":"D","h":"The company will need to apply to the regulatory authority to ask permission for their shares to be traded"}],"a":"C","e":"<p>In relation to AIM companies and their broker and nominated adviser; the broker and adviser can be the same firm; if a company ceases, at any time, to have a broker or adviser, then the firm's shares are suspended from trading. If the company is without a broker or adviser for a period of one month it is removed from AIM.<\/p>"},{"s":8,"n":60,"id":"1002091","q":"<p>Which of the following is true of an inter-dealer broker?<\/p>","o":[{"l":"A","h":"They deal as principal to other participants"},{"l":"B","h":"They set and publish prices"},{"l":"C","h":"They seek and bring together market participants"},{"l":"D","h":"They take positions in anticipation of market participant needs"}],"a":"A","e":"<p>IDBs trade on instruction as principal. They have a passive role which includes price display (on screen) but not price setting.<\/p>"},{"s":8,"n":61,"id":"1016215","q":"<p>Which of the following would be the primary consideration of a company choosing a market on which to float?<\/p>","o":[{"l":"A","h":"A sound regulatory framework"},{"l":"B","h":"Geographical location"},{"l":"C","h":"Tax incentives"},{"l":"D","h":"High liquidity to enable price discovery"}],"a":"D","e":"<p>A company would primarily look at liquidity. A company's aim in floating their company is to generate capital. The more liquid the market, the more likely the company is to raise capital.<\/p>"},{"s":8,"n":62,"id":"1014155","q":"<p>Dealer-to-dealer bond trading can take place using all of the following methods apart from which one?<\/p>","o":[{"l":"A","h":"MTS cash"},{"l":"B","h":"Brokertec"},{"l":"C","h":"MTS BondVision"},{"l":"D","h":"Direct phone contact"}],"a":"C","e":"<p>MTS BondVision is a system used for dealer-to-customer bond trading.<\/p>"},{"s":8,"n":63,"id":"1001836","q":"<p>Which of the following statements regarding trading halts is true?<\/p>","o":[{"l":"A","h":"The LSE can halt a listed security but for no longer than five business days"},{"l":"B","h":"The LSE can halt a listed security at its discretion and for as long as necessary"},{"l":"C","h":"Only the FCA (UKLA) can halt trading of a specific listed security"},{"l":"D","h":"The LSE can halt a listed security, but only in relation to price movements of more than 10%"}],"a":"B","e":"<p>The LSE has the power to suspend a security for any reason and any length of time at its discretion. It has been delegated the right to halt trading by the FCA<\/p>"},{"s":8,"n":64,"id":"1014105","q":"<p>Which one of the following is NOT a service of prime brokerage in relation to hedge funds?<\/p>","o":[{"l":"A","h":"Core settlement"},{"l":"B","h":"Securities lending and borrowing"},{"l":"C","h":"Leveraged trade execution"},{"l":"D","h":"Formulating investment strategies"}],"a":"D","e":"<p>The managers of a hedge fund or alternative asset management vehicle are primarily concerned with formulating and executing investment strategies. The administration of the fund's account is usually left to the prime broker, which has the expertise and organisational systems to offer more specialised and supportive services, such as:<br/> Securities lending and borrowing<br/> Leveraged trade execution<br/> Cash management<br/> Core settlement<br/> Custody<\/p>"},{"s":8,"n":65,"id":"1046704","q":"<p>An order book is as follows.<br/> A client gives a firm an order to sell 3,000 at a limit price of 756. How will this be reflected on the order book after the order is sent to the exchange?<\/p><p><img src=\"data:image/gif;base64,R0lGODlh4AF4AHAAACH5BAEAAFUALAAAAADgAXgAhg4JFx0TLyogOXNydU5JVzsmXlRBcubk652Tr2FRfvf2+f////z8/HZoj/Dv81JAcUMvZevp7/n4+ru0x+bj6sW+z0g0aXhqkZOHpkArYtXR3Z2SrtHM2djU3/Tz9paLqe/t8uDd5t7a5LSswWRjZxYOI0lFUhcPJBwSLT8/P39/f29vbxAQECAgIF9fX9/f30BAQL+/v8PDwwYGBsnJyd7e3h0dHerq6vv7+01NTQAAAAsLCxERETIyMvX19aenp2ZmZlBQUPf39x4eHnJycsjIyJ2dnVlZWSUlJcHBwVRUVDMzMxgYGCoqKkRERIyMjKKioigoKJKSklFRUXt7ewAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf/gDMog4SFhoeIiYgBJQIDipCRkpOUlZaXmJmalYwEJpuajI6gpKWmp6iplwGCBa6vsLGys7S1BiC1ubq7vL2+v8DBwsPACAjEyLfIy8zNzs/QwQEo0b8PFNXZ2tvc2cbdtNfg4+Tl5q+D57APuOru7/C/3+rs8fb3+OjU7w8h+f8Ayc071y+gwYPZ0vFrh7Chw2ADzdV7SLHiLoXuClrcyLFAxHIaO4qkiJEew5EoA344ZjKlS4Mlz0HwR8vAgps4GxSwaSEWCJ0vgwr7SG6mLps4IbyasIBChQUglAqdGiymOWW0EniQWqDBAggZZGX4SbXsLqLjsNK6sOCDK69A/z3oJGu27sV97gzQnGXAgwFYIC7Qomu3sCu04PTm0oAB1oeofQ0YkMDVsGVXVsuplZXg66sLHHZ6ZrugBogElwuvzHsyls3KnT/gxOnWw02lt2p4Tv0yc9G9spDOnlBA618PbmUL5m0WcTejtBpE9fkhct8HBRgXeGxhcmPmvfGq2xxLK1ebDV5faJdBLviyzrmRhyU97Kv2GLRa6AwhAeUCYzXQGWrvpeRbWsC5JsFfroxV3YKPSUVYgS+tNl6CsNzC4CuB2STZgsLddEFkFKJ0YGKtweIfVxD8tOJ6YbUIVIkuxbfNfPfV8N1huOjHH38q7kYjRyc+h+Erk20YYZqSBSC33QIzDjmSjdpAF90C38FVHIgLZueWhyRKuVGR8qX4SmezebZicTdNcJqYKFl4Do6x2HabK1o9sCYEduq0JpwVkXnjkYCCR2U2ihUqpaDa0  it becomes the best sell order and the other offer orders move down.<\/p>"},{"s":8,"n":66,"id":"4027315","q":"<p>Which one of the following services offered by a prime broker would be used by a hedge fund to cover a short position?<\/p>","o":[{"l":"A","h":"Rehypothecation"},{"l":"B","h":"Leveraged trade execution"},{"l":"C","h":"Securities lending and borrowing"},{"l":"D","h":"Core settlement"}],"a":"C","e":"<p>Securities lending and borrowing is used to cover short positions by hedge funds in long/short strategy.<\/p><p>Leveraged trade execution is where the prime broker lends cash to the fund to finance trades.<\/p><p>Rehypothecation is a process whereby the prime broker reuses collateral posted by the hedge fund for their own purposes.<\/p>"},{"s":8,"n":67,"id":"1039433","q":"<p>A prime broker provides all but which of the following services?<\/p>","o":[{"l":"A","h":"Custody"},{"l":"B","h":"Settlement"},{"l":"C","h":"Investment advice"},{"l":"D","h":"Cash management"}],"a":"C","e":"<p>Prime brokers provide administrative services to hedge funds. They do not offer investment advisory services.<\/p>"},{"s":8,"n":68,"id":"1015612","q":"<p>Which of the following would a broker-dealer undertake?<\/p><p><strong>I<\/strong><\/p><p>Quote prices on a quote driven system<\/p><p><strong>II<\/strong><\/p><p>Buy and sell shares on their own behalf<\/p><p><strong>III<\/strong><\/p><p>Buy and sell shares on behalf of clients<\/p><p><strong>IV<\/strong><\/p><p>Provide a facility for dealing anonymously between market makers<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and III"},{"l":"C","h":"I and IV"},{"l":"D","h":"I and III"}],"a":"B","e":"<p>Quote driven quotations are the responsibility of a market maker. A facility for dealing anonymously between market makers describes an inter-dealer broker.<\/p>"},{"s":8,"n":69,"id":"1078472","q":"<p>Which of the following is responsible for providing liquidity in the secondary market trading of government debt securities?<\/p>","o":[{"l":"A","h":"The executive department of the Treasury"},{"l":"B","h":"Central bank"},{"l":"C","h":"Primary dealers"},{"l":"D","h":"The exchange"}],"a":"C","e":"<p>In the UK the Debt Management Office approves primary dealers (GEMMs), who are then supervised by the FCA, and are obliged to provide two-way quotes for gilts during the mandatory quote period.<\/p>"},{"s":8,"n":70,"id":"1001174","q":"<p>A limit order will never execute at its limit price:<\/p>","o":[{"l":"A","h":"During the uncrossing period"},{"l":"B","h":"During the opening auction period"},{"l":"C","h":"If executed against an at best order"},{"l":"D","h":"If executed against a better priced fill or kill order"}],"a":"B","e":"<p>Automatic execution does not take place during the opening auction period, so execution will never take place.<\/p>"},{"s":8,"n":71,"id":"1014106","q":"<p>What does the financial term rehypothecation refer to?<\/p>","o":[{"l":"A","h":"A prime broker might administer any corporate actions on behalf of the asset manager"},{"l":"B","h":"A prime broker might pledge hypothecated client-owned securities as collateral for a brokerage's bank loan"},{"l":"C","h":"A prime broker might arrange for the appropriate shares to be borrowed to cover a hedge fund's short-position"},{"l":"D","h":"A prime broker might arrange for the sale of securities owned by a hedge fund for cash"}],"a":"B","e":"<p>A prime broker may hold collateral relating to a hedge fund's portfolio or a charge over such assets; rehypothecation means that the prime broker might also require a right to re-charge the customer's assets which are subject to the security.<\/p>"},{"s":8,"n":72,"id":"1025255","q":"<p>Which of the following is the MAIN benefit to a company of obtaining a listing?<\/p>","o":[{"l":"A","h":"To raise awareness of the company"},{"l":"B","h":"To widen access to new sources of capital"},{"l":"C","h":"To prevent a takeover"},{"l":"D","h":"To reduce the influence of directors"}],"a":"B","e":"<p>The principle reason that most companies seek a listing is to raise capital.<\/p>"},{"s":8,"n":73,"id":"1078881","q":"<p>A characteristic of quote driven systems is:<\/p>","o":[{"l":"A","h":"that only the most liquid securities are traded"},{"l":"B","h":"that orders are electronically matched with other orders"},{"l":"C","h":"that orders are populated by agents"},{"l":"D","h":"that there is two-way pricing by market makers"}],"a":"D","e":"<p>The presence of market makers on quote-driven systems provides liquidity that might be lacking on an order-driven system. Market makers are required to quote two-way prices, resulting in an ability for trades to be executed.<\/p>"},{"s":8,"n":74,"id":"1078468","q":"<p>Which of the following represents the main benefit to investors of a central counterparty?<\/p>","o":[{"l":"A","h":"Lower cost"},{"l":"B","h":"Lower risk"},{"l":"C","h":"Faster execution"},{"l":"D","h":"Wider spreads"}],"a":"B","e":"<p>The CCP service provides greater protection for investors against the risk of settlement default.<\/p>"},{"s":8,"n":75,"id":"1078501","q":"<p>If an investor is interested in dark liquidity on the London Stock Exchange, on which platform would they be looking to trade?<\/p>","o":[{"l":"A","h":"Order driven"},{"l":"B","h":"Quote driven"},{"l":"C","h":"Hybrid system"},{"l":"D","h":"Voice broking systems"}],"a":"A","e":"<p>Dark pools refer to the non-displayed or hidden nature of the buy and sell orders that reside in a crossing platform. The term dark liquidity can also be applied to all forms of non-displayed liquidity such as the order blotters of buy-side dealing desks.<br/> Even though there are few organised dark pools within Europe, there is dark liquidity. Dark liquidity is provided when exchanges offer iceberg orders which enable traders to have a lot more available to trade than is currently displayed on the screen or in an order book at any moment in time. The biggest sources of dark liquidity are within the investment banks and major brokers.<\/p>"},{"s":8,"n":76,"id":"1001176","q":"<p>There are no buy orders on the order book for a particular security. What is disseminated as the best bid price?<\/p>","o":[{"l":"A","h":"Zero"},{"l":"B","h":"Highest sell price"},{"l":"C","h":"Highest buy price"},{"l":"D","h":"Mid-market price"}],"a":"A","e":"<p>If there are no buy orders on the SETS order book for a particular security, the best bid price will be zero.<\/p>"},{"s":8,"n":77,"id":"1078465","q":"<p>In which situation is trading in an order book traded security NOT permitted away from the order book?<\/p>","o":[{"l":"A","h":"Pre-offer period"},{"l":"B","h":"Suspension of listing"},{"l":"C","h":"Suspension of automatic execution"},{"l":"D","h":"Disorderly market"}],"a":"B","e":"<p>When the exchange calls a halt to automatic execution, non-order book trading is still permitted.<\/p>"},{"s":8,"n":78,"id":"1014156","q":"<p>Dealer-to-dealer bond trading cannot take place using which one of the following methods?<\/p>","o":[{"l":"A","h":"IDB voice broking"},{"l":"B","h":"Brokertec"},{"l":"C","h":"Direct phone contact"},{"l":"D","h":"TradeWeb"}],"a":"D","e":"<p>TradeWeb is a dealer-to-customer bond trading method.<\/p>"},{"s":8,"n":79,"id":"1001934","q":"<p>Which of the following statements regarding Eurobonds is least accurate?<\/p>","o":[{"l":"A","h":"They are bearer securities"},{"l":"B","h":"Interest is paid gross"},{"l":"C","h":"They can be held in Euroclear"},{"l":"D","h":"Prices quoted include accrued interest"}],"a":"D","e":"<p>Quoted prices are 'clean' prices, i.e. they exclude accrued interest.<\/p>"},{"s":8,"n":80,"id":"1039388","q":"<p>The role of an inter-dealer broker is BEST described as:<\/p>","o":[{"l":"A","h":"Matching the quotes of market makers"},{"l":"B","h":"Ensuring anonymous transactions between counterparties"},{"l":"C","h":"Providing quotes to market participants"},{"l":"D","h":"Introducing market makers and broker deals to one another"}],"a":"B","e":"<p>Inter-Dealer Brokers (IDBs) provide an anonymous trading service to market makers and broker dealers.<\/p>"},{"s":8,"n":81,"id":"1015993","q":"<p>Which one of the following is not a usual method of quotation regarding bonds?<\/p>","o":[{"l":"A","h":"Yield spread"},{"l":"B","h":"Yield of the bond"},{"l":"C","h":"Price of the bond"},{"l":"D","h":"Redemption date"}],"a":"D","e":"<p>Bonds are not usually quoted in terms of their redemption dates.<\/p>"},{"s":8,"n":82,"id":"1014107","q":"<p>When assets have been rehypothecated, to whom do they then belong?<\/p>","o":[{"l":"A","h":"Prime broker"},{"l":"B","h":"Customer"},{"l":"C","h":"Hedge fund"},{"l":"D","h":"Mortgage company"}],"a":"A","e":"<p>Rehypothecation is where the hedge fund hands over-hypothecated assets to the prime broker so that he can use them as collateral for a further finance. <br/> Effectively the assets have been hypothecated twice - rehypothecated.<\/p>"},{"s":8,"n":83,"id":"1078463","q":"<p>When an exchange calls a trading halt in an order driven security due to a disorderly market, which of the following is true? <\/p>","o":[{"l":"A","h":"The security cannot be traded either on the order book or outside the order book"},{"l":"B","h":"The security can be traded either on the order book or outside the order book"},{"l":"C","h":"Automatic execution ceases, but trading outside the order book is permitted"},{"l":"D","h":"Automatic execution continues, but trading outside the order book is not permitted"}],"a":"C","e":"<p>If a trading halt is called automatic execution is halted; however trading is permitted away from the order book.<\/p>"},{"s":8,"n":84,"id":"1078474","q":"<p>To whom must primary dealers in the government bond market quote firm two-way prices?<\/p>","o":[{"l":"A","h":"Anyone on request"},{"l":"B","h":"Other primary dealers"},{"l":"C","h":"Customers on demand"},{"l":"D","h":"Secondary information providers"}],"a":"C","e":"<p>Primary dealers e.g. GEMMs are obliged to make effective two-way prices to customers on demand, up to a size agreed with the DMO.<\/p><p>Thye are not required to quote firm two-way prices to other GEMMs.<\/p>"},{"s":8,"n":85,"id":"1078485","q":"<p>To which ONE of the following are primary dealers in government bonds obliged to trade at quoted prices?<\/p>","o":[{"l":"A","h":"Broker acting for a primary dealer"},{"l":"B","h":"Broker acting for an IDB"},{"l":"C","h":"Broker acting for themselves"},{"l":"D","h":"Broker acting for a client"}],"a":"D","e":"<p>Primary dealers, e.g. GEMMS, must quote firm prices to brokers acting as agents for a client and also to any clients known directly to them.<\/p>"},{"s":8,"n":86,"id":"1014110","q":"<p>Why might a hedge fund wish to use a prime broker?<\/p>","o":[{"l":"A","h":"All hedge funds have to use a prime broker as part of their business"},{"l":"B","h":"The prime broker provides a securities clearing facility"},{"l":"C","h":"A more tailored and bespoke range of services is offered to them"},{"l":"D","h":"The prime broker offers acquisition advice to hedge funds"}],"a":"C","e":"<p>Prime brokerage is the term given to a collection of services provided by investment banks to their hedge fund clients.<\/p>"},{"s":8,"n":87,"id":"1001141","q":"<p>If free float increases from 80% to 100%, what is the % increase in market capitalisation?<\/p>","o":[{"l":"A","h":"0%"},{"l":"B","h":"20%"},{"l":"C","h":"25%"},{"l":"D","h":"80%"}],"a":"A","e":"<p>Free float is the percentage of shares held by the public rather than the total number of shares issued by the company. If the company has a free float of 80%, this means 80% of the issued shares are in the public hands.<\/p><p>Market capitalisation is based on the number of shares issued.<\/p><p>If the free float increases, this just means that more of the issued shares are now available in the public hands. This does not affect the market capitalisation.<\/p>"},{"s":8,"n":88,"id":"1001181","q":"<p>An inter-dealer broker (IDB) can deal with which of the following?<\/p><p><strong>I<\/strong><\/p><p>Market maker acting as principal<\/p><p><strong>II<\/strong><\/p><p>Market maker acting as an agent<\/p><p><strong>III<\/strong><\/p><p>Stock borrowing and lending intermediary<\/p><p><strong>IV<\/strong><\/p><p>Broker dealer<\/p>","o":[{"l":"A","h":"I only"},{"l":"B","h":"I and II"},{"l":"C","h":"I, II and III"},{"l":"D","h":"I, II, III and IV"}],"a":"D","e":"<p>IDBs offer their services to other member firms. These are often market makers wishing to trade-out of large positions but retain their anonymity.<\/p>"},{"s":8,"n":89,"id":"1046718","q":"<p>In a stock borrowing and lending situation which of the following statements are FALSE?<\/p>","o":[{"l":"A","h":"The lender of the stock may receive an artificial dividend"},{"l":"B","h":"The lender of the stock loses voting rights"},{"l":"C","h":"The lender of the stock can still sell the stock"},{"l":"D","h":"The lender of the stock will have stock returned at a future date"}],"a":"C","e":"<p>If the lender of the stock wished to sell it, the stock would have to be returned from the Stock Borrowing and Lending Intermediary.<\/p>"},{"s":8,"n":90,"id":"1046724","q":"<p>Where do corporate bonds mostly trade?<\/p>","o":[{"l":"A","h":"Exchanges"},{"l":"B","h":"Liquidity pools"},{"l":"C","h":"OTC"},{"l":"D","h":"TRAX"}],"a":"C","e":"<p>TRAX is a reporting mechanism. Even though corporate bonds trade through the other three mechanisms it is OTC where they are most frequently traded.<\/p>"},{"s":8,"n":91,"id":"1078488","q":"<p>A fixed interest market maker MUST trade with which of the following once they have displayed two-way prices on a dealing system?<\/p>","o":[{"l":"A","h":"Primary dealers"},{"l":"B","h":"Fixed interest market makers"},{"l":"C","h":"IDBs"},{"l":"D","h":"Customers"}],"a":"D","e":"<p>Fixed interest market makers are not obliged to offer firm prices for other market makers or IDBs.<\/p>"},{"s":8,"n":92,"id":"1001702","q":"<p>Which of the following is not associated with order-driven trading systems?<\/p>","o":[{"l":"A","h":"Orders are displayed by priority of price and time"},{"l":"B","h":"Trade anonymity"},{"l":"C","h":"Firm quotes during the MQP"},{"l":"D","h":"Automatic execution of trades"}],"a":"C","e":"<p>Market makers have to provide quotes during the mandatory quote period on quote-driven systems, such as SEAQ.<\/p>"},{"s":8,"n":93,"id":"1014102","q":"<p>Prime brokerage relates to the provision of services by investment banks to whom?<\/p>","o":[{"l":"A","h":"Other investment banks"},{"l":"B","h":"Hedge fund clients"},{"l":"C","h":"High net worth individuals"},{"l":"D","h":"Issuers of eurobonds"}],"a":"B","e":"<p>Hedge fund clients will benefit from the services that prime brokerage covers.<\/p>"},{"s":8,"n":94,"id":"1039430","q":"<p>What is the BIGGEST advantage to the investors of using a central counterparty service (CCP)?<\/p>","o":[{"l":"A","h":"Netting-off transactions"},{"l":"B","h":"Managing credit risk exposure"},{"l":"C","h":"Eliminates anonymous transactions"},{"l":"D","h":"Allows direct settlement between member firms"}],"a":"B","e":"<p>The biggest advantage to the investor is the management of credit risk exposure through the process of novation. Netting-off transactions is an advantage provided by CCPs, but this is more an administrative advantage, so would benefit the firms more than the investors.<\/p>"},{"s":8,"n":95,"id":"1001108","q":"<p>A company aims to reduce its free float without cancelling any of its shares. All other things being equal, what would the effect of this be on the company's market capitalisation?<\/p>","o":[{"l":"A","h":"The market capitalisation would not be affected"},{"l":"B","h":"The market capitalisation would increase"},{"l":"C","h":"The market capitalisation would decrease"},{"l":"D","h":"The market capitalisation would be reassessed by the LSE"}],"a":"A","e":"<p>The market capitalisation equals the number of shares in issue multiplied by the market price of the share. How many of those shares are in the hands of the public is irrelevant to the calculation.<\/p>"},{"s":8,"n":96,"id":"1001175","q":"<p>In which two situations may a limit order not receive the limit price?<\/p><p><strong>I<\/strong><\/p><p>If it participates in the uncrossing<\/p><p><strong>II<\/strong><\/p><p>If it is incoming and executes against a better priced at best order residing on the order book<\/p><p><strong>III<\/strong><\/p><p>If it is incoming and executes against a better priced limit order residing on the order book<\/p><p><strong>IV<\/strong><\/p><p>If it resides on the order book and executes against a better priced incoming limit order<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"II and IV"},{"l":"C","h":"I and IV"},{"l":"D","h":"II and III"}],"a":"A","e":"<p>A limit order may not receive the limit price if it:<br/> 1. Participates in the uncrossing.<br/> 2. Is incoming and executes against a better priced limit order residing on the order book.<\/p>"},{"s":8,"n":97,"id":"1052046","q":"<p>A secondary issue would take place to serve which purpose?<\/p>","o":[{"l":"A","h":"Leveraged trade execution."},{"l":"B","h":"To dilute shareholders' interest"},{"l":"C","h":"To return funds back to existing shareholders"},{"l":"D","h":"To satisfy a large debt"}],"a":"D","e":"<p>The proceeds from the secondary offering might be used to pay off some debt or used for needed company expansion. A dilutive offering will dilute earnings on a per share basis but this not the purpose of the offering.<\/p>"},{"s":8,"n":98,"id":"1002105","q":"<p>Which of the following statements does not apply to both limit orders and execute and eliminate orders?<\/p>","o":[{"l":"A","h":"Specify a volume"},{"l":"B","h":"Set a 'no worse than' price"},{"l":"C","h":"Participate in the opening auction"},{"l":"D","h":"May be entered during continuous trading"}],"a":"C","e":"<p>Only limit and market orders are available for input during the opening auction.<\/p>"},{"s":8,"n":99,"id":"1001203","q":"<p>A firm using an electronic order book that wishes to execute as much of an order as possible, at a price no worse than the specified price, rejecting any unfilled portion from the order book, should use which of the following orders?<\/p>","o":[{"l":"A","h":"Fill or kill"},{"l":"B","h":"Execute and eliminate"},{"l":"C","h":"Market order"},{"l":"D","h":"Limit"}],"a":"B","e":"<p>Execute and eliminate - a limit order where unfilled amounts are cancelled.<\/p>"},{"s":8,"n":100,"id":"1078480","q":"<p>On an exchange's order-driven platform, during which of the following periods is a member firm not permitted to delete orders?<\/p>","o":[{"l":"A","h":"Continuous order book trading"},{"l":"B","h":"Opening auction period"},{"l":"C","h":"Housekeeping period"},{"l":"D","h":"Closing algorithm"}],"a":"D","e":"<p>A member cannot enter, amend or delete orders during the running of the uncrossing algorithm.<\/p>"},{"s":8,"n":101,"id":"1001155","q":"<p>If an investor wishes to enter an order that would execute the entire order at a given price or, failing that, reject the entire order in whole, which order would they choose?<\/p>","o":[{"l":"A","h":"Limit order"},{"l":"B","h":"Execute and eliminate order"},{"l":"C","h":"Market order"},{"l":"D","h":"Fill or kill order"}],"a":"D","e":"<p>A fill or kill order is an 'all or nothing' order. A fill or kill order can only be used during continuous order book trading between 8.00am and 4.30pm. It cannot be used during the opening or closing auction call periods.<\/p>"},{"s":9,"n":1,"id":"1002132","q":"<p>The cum-price of a share before a 5:1 capitalisation issue was 300p. What is the theoretical 'ex' price?<\/p>","o":[{"l":"A","h":"25p"},{"l":"B","h":"50p"},{"l":"C","h":"100p"},{"l":"D","h":"250p"}],"a":"B","e":"<p>Before the scrip issue: 1 share @ 300p.<br/> During the scrip issue: 5 shares were issued at no cost.<br/> After the rights issue: 6 shares @ 300p.<br/> Therefore, the theoretical 'ex' price = 300p/6 shares = 50p.<\/p>"},{"s":9,"n":2,"id":"1001114","q":"<p>Which of the following is not a consequence of a company undergoing a scrip issue?<\/p>","o":[{"l":"A","h":"An increase in the number of shares issued"},{"l":"B","h":"An increase in earnings per share"},{"l":"C","h":"A decrease in reserves"},{"l":"D","h":"An increase in share capital"}],"a":"B","e":"<p>A scrip issue (also known as a bonus/capitalisation issue) is usually paid out of the share premium account, resulting in a movement of reserves. Note: a scrip issue is one of the limited uses of the share premium account. The other main uses are writing-off preliminary expenses and writing-off the costs associated with the issue of securities: e.g. underwriting fees. Earnings per share would actually decrease as the number of shares has increased.<\/p>"},{"s":9,"n":3,"id":"4028002","q":"<p><\/p><p>A company's shares are currently trading at £6.00. If the company was to undertake a 1:5 bonus issue the theoretical share price after the bonus would be:<\/p><p> <\/p>","o":[{"l":"A","h":"£6.00"},{"l":"B","h":"£5.00"},{"l":"C","h":"£1.00"},{"l":"D","h":"£0.00"}],"a":"B","e":"<p>The theoretical ex-bonus price would be £5.00:<\/p><p>5 shares at £6.00 equals £30.00<\/p><p>1 new share per five shares held equals £0.00<\/p><p>Therefore you now have 6 shares with a net value of £30.00 or £5.00 per share.<\/p>"},{"s":9,"n":4,"id":"1076737","q":"<p>What do we call a mandatory corporate action that sees two companies join their interests?<\/p>","o":[{"l":"A","h":"An Initial Public Offer"},{"l":"B","h":"A merger"},{"l":"C","h":"A consolidation"},{"l":"D","h":"A takeover"}],"a":"B","e":"<p>This is the definition of a merger. Please note that a takeover is a voluntary not a mandatory action.<\/p>"},{"s":9,"n":5,"id":"1001698","q":"<p>A firm makes a 1:10 scrip issue; you have a client whose portfolio contains 15,000 shares and was worth £50,000 before the scrip issue. Your client wants to know what his portfolio will be worth after the issue. It will be worth:<\/p>","o":[{"l":"A","h":"£20,000"},{"l":"B","h":"£30,000"},{"l":"C","h":"£50,000"},{"l":"D","h":"£55,000"}],"a":"C","e":"<p>A scrip issue will not change the overall value of the portfolio. Rather than having 15,000 shares worth £50,000, the investor will have 16,500 {15,000 + (15,000 / 10) } shares worth £50,000.<\/p>"},{"s":9,"n":6,"id":"1016013","q":"<p>Which one of the following is not a method of stakebuilding using an indirect method?<\/p>","o":[{"l":"A","h":"Buying Forwards"},{"l":"B","h":"Buying shares"},{"l":"C","h":"Buying options"},{"l":"D","h":"Buying futures"}],"a":"B","e":"<p>Buying shares in a company is a direct means of stakebuilding.<\/p>"},{"s":9,"n":7,"id":"1023953","q":"<p>Which of the following is the best description of the meaning of a pre-emption rights issue?<\/p>","o":[{"l":"A","h":"Shares issued without voting rights"},{"l":"B","h":"Shares issued pro-rata to existing shareholdings"},{"l":"C","h":"A rights issue without the ability to sell on the rights nil paid"},{"l":"D","h":"A rights issue where shareholders can buy more rights if they wish to"}],"a":"B","e":"<p>A pre-emption right is the right of the shareholder to be able to buy shares to maintain their existing percentage shareholding.<\/p>"},{"s":9,"n":8,"id":"1001136","q":"<p>ABC is currently trading at 320. The company makes a 1:4 rights issue at 280. What is the theoretical ex-rights price?<\/p>","o":[{"l":"A","h":"288"},{"l":"B","h":"300"},{"l":"C","h":"312"},{"l":"D","h":"390"}],"a":"C","e":"<p>Before the rights issue: 4 shares at 320 = 1,280<br/> During the rights issue: 1 share at 280 = 280<br/> After rights issue: 5 shares = 1,560<br/> So, after the rights issue each share is worth 312 [1,560 ÷ 5].<\/p>"},{"s":9,"n":9,"id":"1001118","q":"<p>Which of the following would result in an issuer of shares receiving cash?<\/p>","o":[{"l":"A","h":"Secondary market sale"},{"l":"B","h":"Pre-emptive rights issue"},{"l":"C","h":"Capitalisation issue"},{"l":"D","h":"Introduction"}],"a":"B","e":"<p>The pre-emptive rights issue is the only one to raise capital. In a capitalisation issue the company issues shares for free. No new shares are issued in either a secondary market sale or an introduction.<\/p>"},{"s":9,"n":10,"id":"4028003","q":"<p>Which one of the following statements best reflects what happens with respect to the merger of two companies?<\/p>","o":[{"l":"A","h":"One company will exchange new shares for the shares of the other company"},{"l":"B","h":"Both companies will issue new shares and exchange them with each other"},{"l":"C","h":"One company buys a majority of the shares the company"},{"l":"D","h":"Both companies buy majority stakes in each other"}],"a":"A","e":"<p>As per the CISI manual, a merger is where two companies of a similar size come together to form a larger, merged entity. In a merger it is usual for one company to exchange new shares for the shares of the other.<\/p>"},{"s":9,"n":11,"id":"1001124","q":"<p>A company undergoes a 1:3 rights issue at a subscription price of 130p. The current share price is 170p. Calculate the theoretical ex-rights price.<\/p>","o":[{"l":"A","h":"130p"},{"l":"B","h":"170p"},{"l":"C","h":"160p"},{"l":"D","h":"150p"}],"a":"C","e":"<p>Value of shares before rights issue 3 x 170 = 510p Add in subscription price 1 x 130 = 130p Total new value 4 shares = 640p<br/> Therefore ex rights price is 160p (640p / 4 shares)<\/p>"},{"s":9,"n":12,"id":"1001148","q":"<p>What would the theoretical ex-rights price be given to the following?<br/> A stock is priced 155p cum-dividend. It will trade ex-dividend of 10p next week. There is a 3:5 rights issue at 110p.<br/> The new shares have the same rights as the original shares, except for the dividend. The shares do not qualify for a dividend.<\/p>","o":[{"l":"A","h":"110p"},{"l":"B","h":"131.9p"},{"l":"C","h":"138.1p"},{"l":"D","h":"136.4p"}],"a":"B","e":"<p>As the shares do not qualify for a dividend we use the ex-dividend price. To find the ex-rights price we need to first take the value of the share after the dividend has been deducted = 155p - 10p = 145p<br/> 3 shares x 110p = 330p 5 shares x 145p = 725p 330p + 725p = 1055p 1055p / 8 shares = 131.9p.is the ex-rights price<\/p>"},{"s":9,"n":13,"id":"1001116","q":"<p>There is a 1:2 bonus issue. What was the cum-bonus price if the ex-bonus price is £5 per share?<\/p>","o":[{"l":"A","h":"£2.00"},{"l":"B","h":"£4.50"},{"l":"C","h":"£5.50"},{"l":"D","h":"£7.50"}],"a":"D","e":"<p>After the bonus the shareholder has three shares worth £5 each = £15. Prior to the bonus this same total value was spread over two shares.<br/> Therefore: £15 / 2 = £7.50.<\/p>"},{"s":9,"n":14,"id":"1001115","q":"<p>The market price of a share is £1.50. A 1:4 rights issue at £1 per share is announced. The theoretical nil paid price of the rights is:<\/p>","o":[{"l":"A","h":"40p"},{"l":"B","h":"50p"},{"l":"C","h":"£1"},{"l":"D","h":"£1.50"}],"a":"A","e":"<p>Step 1) Calculate the theoretical ex-rights price:<br/> Before: 4 shares @ £1.50 = £6 During: 1 share @ £1 = £1 After: 5 shares £7<br/> Ex-rights price = £7 / 5 shares = £1.40<br/> Step 2) Calculate theoretical nil paid price:<br/> Theoretical nil paid price = ex-rights price - subscription price = £1.40 - £1 = 40p.<\/p>"},{"s":9,"n":15,"id":"1016012","q":"<p>A company wishes to deploy excess cash flow and return it to its shareholders. This is an example of which one of the following?<\/p>","o":[{"l":"A","h":"Share buy back"},{"l":"B","h":"Market abuse"},{"l":"C","h":"Stakebuilding"},{"l":"D","h":"Opportunistic issuance"}],"a":"A","e":"<p>A company wishing to buy back its own shares may be wishing to deploy excess cash flow and return it to its shareholders.<\/p>"},{"s":9,"n":16,"id":"1078451","q":"<p>Which of the following corporate actions raises new capital?<\/p>","o":[{"l":"A","h":"Bonus issue"},{"l":"B","h":"Capitalisation issue"},{"l":"C","h":"Scrip issue"},{"l":"D","h":"Rights issue"}],"a":"D","e":"<p>Bonus, scrip and capitalisation issues are all where shares are being given away free of charge to existing shareholders<\/p>"},{"s":9,"n":17,"id":"1001131","q":"<p>On receipt of a letter announcing a rights issue, the holder may do all of the following except:<\/p>","o":[{"l":"A","h":"Trade the rights that they have been given to a third party"},{"l":"B","h":"Split the rights so that they sell some rights in order to raise the capital to purchase some of the shares they have a right to"},{"l":"C","h":"Wait until after the rights issue to assess the impact on the market before deciding on their course of action"},{"l":"D","h":"Pay the sum required by the company to take-up their rights before the acceptance date"}],"a":"C","e":"<p>In a rights issue an allotment letter is received - this can be sold on, split (i.e. part exercised and part sold on), allowed to lapse or exercised in full. If the rights are exercised, payments (known as 'call payments') must be made before the exercise/acceptance date.<\/p>"},{"s":9,"n":18,"id":"1001978","q":"<p>What would the theoretical ex-rights price be, given the following?<br/> A stock is priced 155p cum dividend. It will trade ex-dividend of 10p next week. There is a 3:5 rights issue at 110p.<br/> The new shares rank pari passu except for the dividend.<\/p>","o":[{"l":"A","h":"110p"},{"l":"B","h":"131.9p"},{"l":"C","h":"138.1p"},{"l":"D","h":"136.4"}],"a":"B","e":"<p>Ex-div price = 155p - 10p = 145p 3 shares x 110p = 330p 5 shares x 145p = 725p 330p + 725p = 1,055p 1,055p / 8 shares = 131.9p<\/p><p>The question specifically states that 'It will trade ex-dividend of 10p next week'. This is why the 10p dividend is stripped out of the cum-div price<\/p>"},{"s":9,"n":19,"id":"1001749","q":"<p>What best describes the effect on the balance sheet of a 1:1 bonus issue?<\/p>","o":[{"l":"A","h":"Share capital remains constant; reserves increase"},{"l":"B","h":"Share capital decreases; reserves increase"},{"l":"C","h":"Share capital increases; reserves increase"},{"l":"D","h":"Share capital increases; reserves decrease"}],"a":"D","e":"<p>The share capital accounts is calculated by multiplying the number of shares by their nominal value. Therefore as the number of shares increases, the share capital account increases. <br/> As the net assets and shareholders' funds remain unchanged, the opposite entry is to reduce the profit and loss account (effectively funding the increase in the share capital) - this means that reserves are reduced. The share premium account can also be used for this purpose.<\/p>"},{"s":9,"n":20,"id":"1001117","q":"<p>The net asset value (NAV) per share will be REDUCED after a 1:4 scrip issue by:<\/p>","o":[{"l":"A","h":"1/5"},{"l":"B","h":"1/4"},{"l":"C","h":"4/5"},{"l":"D","h":"3/4"}],"a":"A","e":"<p>Before scrip NAV (say) £100 Shares (say) 4 NAV / share £25 <br/> After scrip NAV (say) £100 Shares (say) 5 NAV / share £20 Therefore, NAV has reduced by 20%, or 1/5.<\/p>"},{"s":9,"n":21,"id":"1014144","q":"<p>Which one of the following is not a method of a company buying back its own shares?<\/p>","o":[{"l":"A","h":"Bought deal"},{"l":"B","h":"Payment in kind"},{"l":"C","h":"Accelerated bookbuild"},{"l":"D","h":"Block trades"}],"a":"B","e":"<p>Payment in kind is not a method associated with a company buying back its own shares.<\/p>"},{"s":9,"n":22,"id":"1014147","q":"<p>Stakebuilding may be undertaken for which of the following purposes?<\/p>","o":[{"l":"A","h":"To facilitate the issue of new shares"},{"l":"B","h":"To assist investment banks regarding corporate acquisitions"},{"l":"C","h":"To encourage institutional investors to buy more shares in a company"},{"l":"D","h":"To bring about a possible acquisition"}],"a":"D","e":"<p>Stakebuilding is used when an investor wishes to bring about an acquisition.<\/p>"},{"s":9,"n":23,"id":"1014146","q":"<p>An accelerated bookbuild is which one of the following?<\/p>","o":[{"l":"A","h":"An investment bank contacts larger institutional investors in the company to see if they would be willing to sell their shares at a certain price"},{"l":"B","h":"An investment bank will undertake a small number of large trades with investors in a company, on an exchange"},{"l":"C","h":"An investment bank agrees the terms of a buy back of a company's shares at the outset"},{"l":"D","h":"An investment bank buys shares itself in a particular company"}],"a":"A","e":"<p>An accelerated bookbuild is when an investment bank contacts larger institutional investors in the company, to see if they would be willing to sell their shares at a certain price.<\/p>"},{"s":9,"n":24,"id":"1001753","q":"<p>Which of the following would not increase a company's share capital?<\/p>","o":[{"l":"A","h":"Exercising an option on partially paid-up shares"},{"l":"B","h":"A rights issue"},{"l":"C","h":"Exercising a warrant"},{"l":"D","h":"A capitalisation issue"}],"a":"A","e":"<p>The company's share capital account reflects the nominal value of all shares in issue. The shares deliverable on the option are already in issue so would not increase the share capital.<\/p>"},{"s":9,"n":25,"id":"1016211","q":"<p>Why would a company issue shares via a rights issue rather than a placing?<\/p>","o":[{"l":"A","h":"To give priority to institutional investors"},{"l":"B","h":"It cuts down on the administration"},{"l":"C","h":"It provides the company with an increase in capital"},{"l":"D","h":"It considers all shareholders fairly"}],"a":"D","e":"<p>Rights issues are done on a pro rata basis, so all shareholders have a fair opportunity to subscribe. Both methods would raise capital for the company.<\/p>"},{"s":9,"n":26,"id":"1078896","q":"<p>A company has acquired the shares of another company resulting in takeover proceedings. Which of the following would be the minimum percentage where the takeover be considered successful?<\/p>","o":[{"l":"A","h":"30%"},{"l":"B","h":"50%"},{"l":"C","h":"75%"},{"l":"D","h":"100%"}],"a":"C","e":"<p>An acquisition of another company is achieved by purchasing MORE than 50% of the shares, and thereby gaining control of the votes and the company. It is usual to talk in terms of the acquiring company being the predator or offeror and the company being acquired as the target or offeree.<\/p>"},{"s":9,"n":27,"id":"1053980","q":"<p>Which of the following corporate actions would a company take in order to convert its reserves into new ordinary share capital?<\/p>","o":[{"l":"A","h":"Rights issue"},{"l":"B","h":"Stock split"},{"l":"C","h":"Consolidation"},{"l":"D","h":"Scrip issue"}],"a":"D","e":"<p>A company converts its reserves, which may have arisen from issuing new shares in the past at a premium to their nominal value, or from the accumulation of undistributed past profits, into new ordinary shares. <br/> These shares rank pari passu with those already in issue and are distributed to ordinary shareholders in proportion to their existing shareholdings free of charge.<\/p>"},{"s":9,"n":28,"id":"1001129","q":"<p>Which of the following is an alternative to a rights issue to raise capital?<\/p>","o":[{"l":"A","h":"Placing"},{"l":"B","h":"Bonus issue"},{"l":"C","h":"Introduction"},{"l":"D","h":"Capitalisation issue"}],"a":"A","e":"<p>A bonus (or 'capitalisation') issue and an introduction do not raise new capital for the company.<\/p>"},{"s":9,"n":29,"id":"1001143","q":"<p>Dixi plc is undertaking a 2:5 rights issue at a subscription price of 120 pence. The cum-rights price of the shares is 160 pence. Calculate the theoretical tradable nil paid price.<\/p>","o":[{"l":"A","h":"29 pence"},{"l":"B","h":"£1.49"},{"l":"C","h":"£10.40"},{"l":"D","h":"40 pence"}],"a":"A","e":"<p>Step 1: Calculate the ex-rights price (5 shares x £1.6) + (2 shares x £1.2) = £10.40 Ex-rights price = £10.40 / 7 shares = £1.49<br/> Step 2: Calculate nil paid price NP = £1.49 - £1.20 = £0.29.<\/p>"},{"s":9,"n":30,"id":"1002065","q":"<p>A company does a 1:5 scrip issue when the share price is £1.80. What is the ex-scrip price?<\/p>","o":[{"l":"A","h":"£1.30"},{"l":"B","h":"£1.50"},{"l":"C","h":"£1.65"},{"l":"D","h":"£1.80"}],"a":"B","e":"<p>The portfolio before a scrip issue is worth 5 x £1.80 = £9.00. £9.00/6 = £1.50 per share.<\/p>"},{"s":9,"n":31,"id":"1001132","q":"<p>What is the effective purchase price of shares after a 1:5 scrip issue if they were originally purchased for £1.50 per share?<\/p>","o":[{"l":"A","h":"£1.25"},{"l":"B","h":"£1.50"},{"l":"C","h":"£1.75"},{"l":"D","h":"£1.80"}],"a":"A","e":"<p>The question is asking for the ex-scrip price.<br/> Before: 5 x 1.50 = 7.50.<br/> Scrip: 1 x 0 = 0.<br/> After: 6 x ? = 7.50.<br/> Therefore ex scrip price is 7.50 / 6 = £1.25.<\/p>"},{"s":9,"n":32,"id":"1001897","q":"<p>Which one of the following is normally associated with the term 'open offer'?<\/p>","o":[{"l":"A","h":"Capitalisation issue"},{"l":"B","h":"Bonus issue"},{"l":"C","h":"Rights issue"},{"l":"D","h":"Scrip issue"}],"a":"C","e":"<p>Rights issues can also be known as open offers.<\/p>"},{"s":9,"n":33,"id":"1078490","q":"<p>What is a purpose of the rules contained in relevant legislation relating to a company buying back its own shares? It is there to:<\/p>","o":[{"l":"A","h":"To protect the interests of the company"},{"l":"B","h":"To protect the interests of creditors"},{"l":"C","h":"To protect the rights of its competitors"},{"l":"D","h":"To help the company to rationalise its capital structure"}],"a":"B","e":"<p>The legislation helps protect the interests of creditors, who may become exposed to greater risk if cash is returned to shareholders.<\/p>"},{"s":9,"n":34,"id":"1078489","q":"<p>Whose approval is required before a company can buy back its own shares?<\/p>","o":[{"l":"A","h":"The regulator"},{"l":"B","h":"The central bank"},{"l":"C","h":"Shareholders"},{"l":"D","h":"A takeover authority"}],"a":"C","e":"<p>Shareholders approval is required before a company buys back its own shares. There will inevitably be restrictions on a company's ability to buy back its own shares, partly to prevent shareholders from being unfairly preferred to creditors, and partly to make sure that the company has gained approval to buy back from its own shareholders. To prevent unfair prejudice against the creditors, regulation limits the amount that can be used to repurchase shares.<\/p>"},{"s":9,"n":35,"id":"4027316","q":"<p>ABC plc has done a 1:3 rights issue and your client who is holding 12,000 shares has ask that you split the allotment letter.  What is the most likely reason for this request?<\/p>","o":[{"l":"A","h":"The client intends to exercise their right in full and purchase the shares offered"},{"l":"B","h":"The client intends to sell all the rights"},{"l":"C","h":"The client intends to subscribe at nil-cost with the rights they have received."},{"l":"D","h":"The client wishes to lapse their entitlement"}],"a":"C","e":"<p>A subscription at nil-cost involves selling a large proportion of the rights received and the using the proceeds to take up the shares using the remaining rights.  as such the provisional allotment letter would need to be split in two.<\/p><p> <\/p>"},{"s":9,"n":36,"id":"1078892","q":"<p>A company announces a rights issue where an existing shareholder is allocated 1000 rights, if the cost of purchasing the new shares is £0.40 and the nil paid value of the right is £0.10 how many shares will they be able purchase at nil cost?<\/p>","o":[{"l":"A","h":"100"},{"l":"B","h":"200"},{"l":"C","h":"250"},{"l":"D","h":"400"}],"a":"B","e":"<p>If the nil paid value of the right is 10p and the new shares cost 40p then the investor will need to use 4 rights to buy 1 new share, so they would need to sell 800 of their rights to generate enough income to buy 200 shares. 800 x £0.10 = £80 of income to equal 200 x £0.40 = an £80 cost.<\/p>"},{"s":9,"n":37,"id":"1001127","q":"<p>The current share price is £2. A company makes a 1:3 rights issue at a subscription price of £1.60. What is the theoretical ex-rights price?<\/p>","o":[{"l":"A","h":"£2"},{"l":"B","h":"£1.90"},{"l":"C","h":"£1.70"},{"l":"D","h":"£1.60"}],"a":"B","e":"<p>Before: 3 shares @ £2 = £6.<br/> Rights: 1 share @ £1.60 = £1.60.<br/> After: 4 shares worth £7.60 (£1.90 each).<\/p>"},{"s":9,"n":38,"id":"1001128","q":"<p>A company announces a 2:5 scrip issue. The cum-price is 105p. What is the ex-price?<\/p>","o":[{"l":"A","h":"75p"},{"l":"B","h":"30p"},{"l":"C","h":"262.5p"},{"l":"D","h":"42p"}],"a":"A","e":"<p>Before: 5 shares @ £1.05 = £5.25<br/> Scrip: 2 free shares<br/> After: 7 shares worth £5.25 (75p each).<\/p>"},{"s":9,"n":39,"id":"1039460","q":"<p>Established plc wishes to perform a share buy-back. What would they need before they can perform this action?<\/p>","o":[{"l":"A","h":"The directors need to approve a resolution"},{"l":"B","h":"The creditors of the company need to approve the action"},{"l":"C","h":"The Office of Fair Trading need to approve the action"},{"l":"D","h":"Shareholders need to approve a resolution at a company meeting"}],"a":"D","e":"<p>To perform a share buy-back the company would need to pass a special resolution at a company meeting.<br/> Although the creditors of the company are not required to approve, there is regulation to protect them. The company is required to maintain a 'creditors buffer'. This is effectively retaining enough capital within the company equal to the capital raised through the issuance of debt.<\/p>"},{"s":9,"n":40,"id":"1016015","q":"<p>More than what percentage of a target company's voting shares must a predator company own before legal control is achieved?<\/p>","o":[{"l":"A","h":"50%"},{"l":"B","h":"55%"},{"l":"C","h":"60%"},{"l":"D","h":"70%"}],"a":"A","e":"<p>In order to gain control the predator company must purchase more than 50% of the target company's voting shares.<\/p>"},{"s":9,"n":41,"id":"1001135","q":"<p>Rights issues are initially offered to:<\/p>","o":[{"l":"A","h":"Existing shareholders"},{"l":"B","h":"The public"},{"l":"C","h":"Institutions"},{"l":"D","h":"Private investors only"}],"a":"A","e":"<p>A rights issue is an invitation to existing shareholders to buy new shares in proportion to their holding of old shares. The name arises from the company law principle of pre-emption rights.<\/p>"},{"s":9,"n":42,"id":"1016007","q":"<p>Which one of the following is not a reason for a company to buy back its own shares?<\/p>","o":[{"l":"A","h":"To rationalise the capital structure"},{"l":"B","h":"To substitute dividend pay-outs with share repurchases"},{"l":"C","h":"To execute larger orders with a small number of investors"},{"l":"D","h":"To deploy excess cash flow and return it to shareholders"}],"a":"C","e":"<p>This is not a reason why a company would wish to buy back its own shares.<\/p>"},{"s":9,"n":43,"id":"4028006","q":"<p>Following a rights issue you have received 2,000 nil paid rights, which are currently trading at 10p each. If the subscription price per new share is 40p, what would be the maximum subscription at nil cost?<\/p>","o":[{"l":"A","h":"600 new shares"},{"l":"B","h":"500 new shares"},{"l":"C","h":"400 new shares"},{"l":"D","h":"100 new shares"}],"a":"C","e":"<p>As the subscription price is 40p, you need to sell 4 rights at 10p to cover the cost. This would use 5 rights (sell 4 and take-up 1).<\/p><p>As you have 2,000 rights you would be able to repeat this process 400 times.<\/p><p>Mathematically, 400 x 40p = 16,000p = 1,600 x 10p<\/p>"},{"s":9,"n":44,"id":"1016016","q":"<p>Buying options over a company's shares is a method that may be used by an investor to build a stake in a company. This is an example of which one of the following?<\/p>","o":[{"l":"A","h":"Direct stakebuilding"},{"l":"B","h":"Indirect stakebuilding"},{"l":"C","h":"Position stakebuilding"},{"l":"D","h":"Strategic stakebuilding"}],"a":"B","e":"<p>Buying options over a company's shares is an example of indirect stakebuilding.<\/p>"},{"s":9,"n":45,"id":"1015510","q":"<p>An individual holds 2,100 shares in X plc. The cum-rights share price is £6 when the company performs a 1:3 rights issue. The subscription price is £5. What is the maximum subscription at nil cost?<\/p>","o":[{"l":"A","h":"700 shares"},{"l":"B","h":"609 shares"},{"l":"C","h":"91 shares"},{"l":"D","h":"273 shares"}],"a":"C","e":"<p>2,100 shares will give the shareholder 700 rights as it is 1:3 rights issue. The formula to calculate the number of rights that need to be sold is the no. of rights x Subscription price / Theoretical ex-rights price <br/> TERP = ((£6x3)+£5)/4 shares = £5.75<br/> 700 x £5 / £5.75 =609<br/> These rights are then deducted from the rights available to give the maximum subscription at nil cost.<br/> 700 - 609 = 91 shares<\/p>"},{"s":9,"n":46,"id":"1079689","q":"<p>An investor receives a provision allotment letter from a company performing an offer for sale. What does this confirm about the investor?<\/p>","o":[{"l":"A","h":"She is an existing shareholder"},{"l":"B","h":"She has bought nil paid rights"},{"l":"C","h":"She is a director of the company"},{"l":"D","h":"She has exercised a greenshoe option"}],"a":"A","e":"<p>Existing shareholders receive a provisional allotment letter, which tells them how many shares they are entitled to and what the price will be when the company performs a rights issue. <br/> Note: this is not to be confused with an over-allotment (or greenshoe) option.<\/p>"},{"s":9,"n":47,"id":"1001126","q":"<p>How is the net asset per share affected following a 1:3 scrip?<\/p>","o":[{"l":"A","h":"Decreased by 1/4"},{"l":"B","h":"Decreased by 1/3"},{"l":"C","h":"Increased by 1/4"},{"l":"D","h":"Increased by 1/3"}],"a":"A","e":"<p>Assets remain constant - remember that no cash is raised - say at £30,000.<br/> The number of shares increases by 1/3 - say, from 3,000 to 4,000.<br/> Therefore assets per share falls by 1/4 - say from £10 to £7.50.<\/p>"},{"s":9,"n":48,"id":"1015616","q":"<p>Which of the following does a shareholder not have the right to do if a company wishes to raise funds through a rights issue and they dispatched the rights letter to all shareholders on the register?<\/p>","o":[{"l":"A","h":"Do nothing"},{"l":"B","h":"Take-up the shares and hold them"},{"l":"C","h":"Increase the holding by buying additional rights nil paid from the company"},{"l":"D","h":"Take-up the shares and sell them"}],"a":"C","e":"<p>The nil paid rights would be bought from other shareholders, not from the company.<\/p>"},{"s":9,"n":49,"id":"1078895","q":"<p>A company has reduced the size of its operations by selling off a part of its group which accounted for 15% of its revenue. How would it likely to return this surplus cash back to its shareholders?<\/p>","o":[{"l":"A","h":"A scrip issue"},{"l":"B","h":"A share buyback"},{"l":"C","h":"A reverse inquiry"},{"l":"D","h":"A reverse stock split"}],"a":"B","e":"<p>A share buyback occurs when a company decides to use cash to repurchase shares from existing shareholders. There are two common scenarios where share buybacks may be considered worthwhile:<br/> 1. When the company has reduced its activities (perhaps having sold a major part of its business) and has surplus cash to return to shareholders.<br/> 2. When the company wants to reorganise its capital structure to include more debt and less equity. In these circumstances the company can borrow money (by issuing bonds or from banks), and use it to buy back and therefore reduce the number of shares it has in issue.<\/p>"},{"s":9,"n":50,"id":"1001133","q":"<p>ABC makes a 1:10 capitalisation issue. Their shares are currently trading at 500. What is the theoretical ex-capitalisation price?<\/p>","o":[{"l":"A","h":"454.5"},{"l":"B","h":"45.4"},{"l":"C","h":"546.0"},{"l":"D","h":"54.6"}],"a":"A","e":"<p>1:10 means 1 new share for every 10 held by the investor.<br/> (10 shares x 500) divided by 11 shares = 454.5.<\/p>"},{"s":9,"n":51,"id":"1014145","q":"<p>Which one of the following is not a reason for a company wanting to buy back its own shares?<\/p>","o":[{"l":"A","h":"A company may have reduced its activities and has surplus cash"},{"l":"B","h":"A company has announced a capitalisation issue"},{"l":"C","h":"A company has sold-off part of its business"},{"l":"D","h":"A company wishes to have more debt instruments and less equity in issue"}],"a":"B","e":"<p>A company announcing a capitalisation issue is not a reason for a company to want to buy back its own shares.<\/p>"},{"s":9,"n":52,"id":"1001898","q":"<p>A share has a nil paid right value of 10p and a subscription price of 40p. If you hold 2,000 rights what is the maximum subscription at nil cost?<\/p>","o":[{"l":"A","h":"100"},{"l":"B","h":"200"},{"l":"C","h":"400"},{"l":"D","h":"1,400"}],"a":"C","e":"<p>Ex-rights price = 10 + 40 = 50p. <br/> Rights to be sold = [2,000 x 40] / 50 = 1,600 rights to be sold. <br/> Maximum subscription is therefore 400 shares.<\/p>"},{"s":9,"n":53,"id":"1001113","q":"<p>A company makes two scrip issues during the year: a 1:5 followed by a 1:10. How many shares will a holder of 100 shares at the start of the year have at the year end?<\/p>","o":[{"l":"A","h":"130 shares"},{"l":"B","h":"105 shares"},{"l":"C","h":"115 shares"},{"l":"D","h":"132 shares"}],"a":"D","e":"<p>The first scrip/bonus issue will result in (100 / 5) 20 new shares, after which the shareholder will hold 120 shares. The second scrip will result in (120 / 10) 12 new shares. The investor now has 120 + 12 = 132 shares.<\/p>"},{"s":10,"n":1,"id":"1007868","q":"<p>Which of the following is TRUE of a global custody structure?<\/p>","o":[{"l":"A","h":"The investor deals directly with each of the custodians in the structure"},{"l":"B","h":"The investor deals with one custodian in each geographical region of the world"},{"l":"C","h":"The investor deals with one custodian based in one country"},{"l":"D","h":"The investor does not deal with any custodians"}],"a":"C","e":"<p>The global custodian then deals with each of the sub-custodians in the structure.<\/p>"},{"s":10,"n":2,"id":"1052035","q":"<p>Which of the following nominee accounts would best facilitate proxy voting at a company's annual general meeting?<\/p>","o":[{"l":"A","h":"Designated"},{"l":"B","h":"Omnibus"},{"l":"C","h":"Legal"},{"l":"D","h":"Pooled"}],"a":"A","e":"<p>Designated is where the nominee name also includes indicators to the beneficial owner. If corporate nominee was present then that would be a better answer, but given the options designated is the best option here.<\/p>"},{"s":10,"n":3,"id":"1046440","q":"<p>A broker holds the shares of a client in a pooled nominee account. Which of the following would be true?<\/p>","o":[{"l":"A","h":"The shares will be registered in the broker's name"},{"l":"B","h":"The shares will be pooled with the firm's shares"},{"l":"C","h":"The issuer of the shares will pay any dividends to the client"},{"l":"D","h":"The client is entitled to receive the benefits of ownership"}],"a":"D","e":"<p>The share will not be registered in the broker's name, but a nominee name. Although the account is referred to as a pooled account, this does not mean that the shares are pooled with those of the firm; instead it means that the shares will be pooled with those of other clients. The issuer will pay any dividends to the broker, as it will not know who the underlying client is. However, the client is entitled to any benefits.<\/p>"},{"s":10,"n":4,"id":"1078903","q":"<p>Foreign exchange trades are fed into the continuous linked settlement system. Which of the following could account for the trades not being properly settled?<\/p>","o":[{"l":"A","h":"The gross funds are not entered into the CLS Bank by 07.00 Central European Time"},{"l":"B","h":"The net funds are in excess of those required by the member firms' daily positions"},{"l":"C","h":"The gross funds instructions within the CLS is not matched"},{"l":"D","h":"The net funds that are due to be settled are not passed to their central bank"}],"a":"D","e":"<p>From 7.00am the settlement members pay in the net funds that are due to settle in each currency to their central banks, and CLS will then begin to attempt to settle deals. If CLS Bank's strict settlement criteria are not met for each side of a trade, then no funds are exchanged. This achieves the PvP system that removes the so-called Herstatt risk. Those trades that can be settled are settled and money is paid out via the central banks.<\/p>"},{"s":10,"n":5,"id":"1001332","q":"<p>The system used in FX markets to prevent cross-border settlement risk due to time differences is:<\/p>","o":[{"l":"A","h":"CREST"},{"l":"B","h":"International Currency Clearing House"},{"l":"C","h":"Herstatt"},{"l":"D","h":"CLS"}],"a":"D","e":"<p>Continuous-linked settlement prevents Herstatt risk in FX trading.<\/p>"},{"s":10,"n":6,"id":"1007613","q":"<p>Between which parties is a sub-custody agreement binding?<\/p>","o":[{"l":"A","h":"Global custodian and client"},{"l":"B","h":"Sub-custodian and client"},{"l":"C","h":"Global custodian and sub-custodian"},{"l":"D","h":"Global custodian, sub-custodian and client"}],"a":"C","e":"<p>A sub-custody agreement is between the global custodian and the sub-custodian.<\/p>"},{"s":10,"n":7,"id":"1023948","q":"<p>What is the special ex-trading period for equities?<\/p>","o":[{"l":"A","h":"It varies for each company"},{"l":"B","h":"Two business days"},{"l":"C","h":"Five business days"},{"l":"D","h":"Ten business days"}],"a":"D","e":"<p>The special ex-trading period on the LSE is ten business days prior to the ex-dividend date.<\/p>"},{"s":10,"n":8,"id":"1007611","q":"<p>Which ONE of the following statements about sub-custody agreements is FALSE?<\/p>","o":[{"l":"A","h":"Agreements cannot contain specific provisions, only general guidance"},{"l":"B","h":"Sub-custody agreements are between the global custodian and the sub-custodian"},{"l":"C","h":"Agreements are customised to the particular sub-custodian"},{"l":"D","h":"Sub-custodians will usually be banks"}],"a":"A","e":"<p>Although 'model' agreements do exist, they are adapted by the parties to fit the needs of the local market.<\/p>"},{"s":10,"n":9,"id":"1002149","q":"<p>The name on a register of shareholders would be:<\/p>","o":[{"l":"A","h":"Legal owner"},{"l":"B","h":"Beneficial owner"},{"l":"C","h":"Crest member"},{"l":"D","h":"Nominee"}],"a":"A","e":"<p>'Legal owner' is the best available answer; although, the shares could be registered in the name of a CREST member or a nominee.<\/p>"},{"s":10,"n":10,"id":"1023959","q":"<p>What is the main purpose of stock borrowing from the lender's point of view?<\/p>","o":[{"l":"A","h":"To reduce risk in the portfolio"},{"l":"B","h":"To increase liquidity in the market"},{"l":"C","h":"To increase the portfolio returns"},{"l":"D","h":"To reduce capital requirements"}],"a":"C","e":"<p>Lending of stock by an institution will generate fees, which is its main purpose.<\/p>"},{"s":10,"n":11,"id":"1046699","q":"<p>What would standard settlement time be for a ten-year Japanese government bond?<\/p>","o":[{"l":"A","h":"Trade + 1"},{"l":"B","h":"Trade + 2"},{"l":"C","h":"Trade + 3"},{"l":"D","h":"Trade + 4"}],"a":"A","e":"<p>Japanese government bond's settle T+1<\/p>"},{"s":10,"n":12,"id":"1024204","q":"<p>Your client is concerned that if they deal in foreign exchange they will be exposed if they settle the transaction but the other side settles in another time-zone. What do you tell them?<\/p>","o":[{"l":"A","h":"Not to worry as there is no counterparty risk in foreign exchange"},{"l":"B","h":"Their risk is reduced because you can use continuous-linked settlement"},{"l":"C","h":"It is a risk of trading in foreign exchange"},{"l":"D","h":"The risk can be offset in other currencies"}],"a":"B","e":"<p>If a continuous-linked settlement system is used, it will remove settlement risk (the risk identified above).<\/p>"},{"s":10,"n":13,"id":"1001880","q":"<p>When will a UK equities transaction, entered into after 5.15pm on the London Stock Exchange, normally be settled?<\/p>","o":[{"l":"A","h":"The next business day"},{"l":"B","h":"Three business days including the day of the trade"},{"l":"C","h":"Three business days after the next trading day"},{"l":"D","h":"Five business days after the day of the trade"}],"a":"B","e":"<p>T+2 is the norm, irrespective of the time of day the transaction was entered into.<\/p>"},{"s":10,"n":14,"id":"1078901","q":"<p>Which of the following statements about a regional custodian is TRUE?<\/p>","o":[{"l":"A","h":"The regional custodian can provide agent bank services across all markets"},{"l":"B","h":"Its credit rating may be higher than that of a single market custodian"},{"l":"C","h":"It can provide economies of scale across global financial markets"},{"l":"D","h":"It can offer the same level of attention as a local custodian in specific markets"}],"a":"B","e":"<p>A regional custodian is not across all markets and they cannot offer the tailor-made services that can be offered by a local custodian.<\/p>"},{"s":10,"n":15,"id":"4027313","q":"<p>Your client, Jenny, has stated that she does not wish to participate in an auto-stock lending programme. To comply with Jenny's wishes her shares would be held within which of the following nominee accounts?:<\/p>","o":[{"l":"A","h":"A pooled nominee account"},{"l":"B","h":"The firm's own account"},{"l":"C","h":"An omnibus nominee account"},{"l":"D","h":"A designated nominee account"}],"a":"D","e":"<p>A designated nominee account would allow Jenny's shares to be clearly seperated from those of other clients, and the firm, and the nominee can ensure they were not part of any stock lending programme.<\/p><p>A pooled or omnibus nominee account holds multiple clients assets, making it hard to seperate individual holdings for stock lending purposes. Omnibus is an alternative name for a pooled account.<\/p>"},{"s":10,"n":16,"id":"1015555","q":"<p>When a market maker uses a stock borrowing and lending intermediary to cover a short position by borrowing stock from a fund manager, which of the following best describes the relationship between the SBLI and their counterpart
