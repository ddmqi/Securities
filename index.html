les through CREST"}],"a":"C","e":"<p>The bond described is a eurobond (issued in a currency (GBP) different from that of the jurisdiction of issuance (China, USA, Eurozone). Eurobonds are bearer securities which pay interest gross once a year. They settle through Euroclear or Clearstream.<\/p>"},{"s":4,"n":1,"id":"1001727","q":"<p>A company has issued convertible loan stock which can convert into 80 ordinary shares per £100 nominal. The convertible is trading at £160 and the ordinary shares at 180p per share. What is the conversion premium?<\/p>","o":[{"l":"A","h":"10%"},{"l":"B","h":"11.1%"},{"l":"C","h":"20%"},{"l":"D","h":"25%"}],"a":"B","e":"<p>Effective price of share via convertible debt (£160 / 80 shares) £2.<br/> Actual share price £1.80.<br/> Conversion premium is 20p, or expressed as a percentage of share price, (£0.20 / £1.80) 11.1%.<\/p>"},{"s":4,"n":2,"id":"1002174","q":"<p>A two-year 5% coupon bond is trading at par. Which of the following is closest to the price of a two-year 3.5% coupon bond, assuming the required rate of return on both bonds is the same?<\/p>","o":[{"l":"A","h":"100"},{"l":"B","h":"98.21"},{"l":"C","h":"97.21"},{"l":"D","h":"96.21"}],"a":"C","e":"<p>The 5% coupon bond is trading at par - therefore its gross redemption yield is equal to the coupon of 5%. This is the rate that is used to discount the cash flows of the 3.5% coupon bond (because the question tells us that the required rate of return on both bonds is the same). The price of the bond is therefore:<br/> Price = 3.5/1.05 + 103.5/1.05^2 = 97.21.<\/p>"},{"s":4,"n":3,"id":"1001901","q":"<p>A registered UK charity has invested in gilts. Which of the measures below is the most relevant to them?<\/p>","o":[{"l":"A","h":"Flat-yield"},{"l":"B","h":"Gross redemption yield"},{"l":"C","h":"Net redemption yield"},{"l":"D","h":"Grossed-up net redemption yield"}],"a":"B","e":"<p>Charities do not pay any tax; the gross redemption yield would therefore be the most relevant measure.<\/p>"},{"s":4,"n":4,"id":"1002128","q":"<p>If the credit rating on a corporate bond is upgraded, which ONE of the following is TRUE?<\/p>","o":[{"l":"A","h":"Coupon will fall and price will rise"},{"l":"B","h":"Coupon will remain the same and price will rise"},{"l":"C","h":"Coupon will rise and price will fall"},{"l":"D","h":"Coupon will remain the same and price will fall"}],"a":"B","e":"<p>The coupon on a bond is fixed and is unaffected by external factors. The bond will become more attractive and therefore the price will rise.<\/p>"},{"s":4,"n":5,"id":"1078441","q":"<p>If a 10% coupon paying bond has a price of £100 and a 15% coupon paying bond has a price of £150, which of the following is false assuming they both have the same maturity?<\/p>","o":[{"l":"A","h":"The flat-yield for both is identical"},{"l":"B","h":"All other timings being equal, the 10% bond is more sensitive to interest rate changes"},{"l":"C","h":"The gross redemption yield for both is identical"},{"l":"D","h":"The 10% bond offers a more attractive return to investors"}],"a":"C","e":"<p>The GRY is less for the 15% than the 10% bond. This is because the 15% bond is trading above par value and, therefore, at redemption will result in a capital LOSS, thus reducing the GRY compared to the 10% bond which is trading at par. Consequently, the 10% bond will be more attractive to investors as it has a greater GRY. Note: in the US, the GRY is referred to as the YTM - yield-to-maturity.<\/p>"},{"s":4,"n":6,"id":"1023972","q":"<p>Which of the following is TRUE with respect to the flat-yield and gross redemption yield on a bond trading BELOW par?<\/p><p><strong>I<\/strong><\/p><p>The GRY will be higher than the flat-yield<\/p><p><strong>II<\/strong><\/p><p>The GRY will be lower than the flat-yield<\/p><p><strong>III<\/strong><\/p><p>There will be a capital gain on the bond<\/p><p><strong>IV<\/strong><\/p><p>There will be a capital loss on the bond<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"I and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"II and IV"}],"a":"A","e":"<p>As the bond is trading below par and the bond is redeemed at par, there will be a capital gain on the bond.<br/> The capital gain will mean that the GRY is higher than the flat-yield.<\/p>"},{"s":4,"n":7,"id":"1039437","q":"<p>An investor buys a bond which is due to settle with 274 days of accrued interest on a 7 1/8% coupon. Calculate the accrued interest on the £100 nominal value bond. Use the actual/actual basis and assume this is not a leap year.<\/p>","o":[{"l":"A","h":"£1.78"},{"l":"B","h":"£5.35"},{"l":"C","h":"£5.41"},{"l":"D","h":"£7.13"}],"a":"B","e":"<p>To calculate the accrued interest, we would do as follows:<br/> Days of accrued interest/365 x coupon =<br/> 274 / 365 x 7.125 =<br/> £5.35<\/p>"},{"s":4,"n":8,"id":"1039436","q":"<p>Why, when interest rates rise, do bond prices fall?<\/p>","o":[{"l":"A","h":"Bonds become more attractive"},{"l":"B","h":"Bond yields stay in line with interest rates"},{"l":"C","h":"Bond yields fall"},{"l":"D","h":"The government is more likely to redeem gilts"}],"a":"B","e":"<p>There is a relationship between the market interest rates and the yield on a bond. Although not the same, they do tend to move in the same direction, i.e. interest rates rise then yields will rise. To create an increase in yields the bond's price will fall.<\/p>"},{"s":4,"n":9,"id":"1015679","q":"<p>For which of these can you calculate a gross redemption yield?<\/p>","o":[{"l":"A","h":"ABC warrants"},{"l":"B","h":"XYZ's preference shares"},{"l":"C","h":"ABC's step-up bond 2031"},{"l":"D","h":"3.5% Undated Treasury Bond"}],"a":"C","e":"<p>To calculate the gross redemption yield (GRY) of a bond we need to know the redemption date. Therefore, the correct answer must be the step-up bond 2031 as this is the only bond with a fixed redemption date. A step-up bond is a bond that pays an initial coupon rate for the first period, and then a higher coupon rate for the following periods.<\/p>"},{"s":4,"n":10,"id":"1002148","q":"<p>£33,800 nominal value of a 3.5% UK Government bond is purchased on the 1 September. Calculate the next interest payment receivable on 1 December.<\/p>","o":[{"l":"A","h":"£295.75"},{"l":"B","h":"£294.94"},{"l":"C","h":"£1,183.00"},{"l":"D","h":"£591.50"}],"a":"D","e":"<p>The GROSS SEMI-ANNUAL payment would be:<br/> £33800 x 0.035 x 0.5 = £591.50<br/> Please note the buyer will receive the next semi-annual coupon in full, i.e. the fact that they purchased the bond on 1 September is not relevant.<\/p>"},{"s":4,"n":11,"id":"1001300","q":"<p>A 10.25% gilt has 18 months until redemption and a flat-yield of 10.5% What will be its price?<\/p>","o":[{"l":"A","h":"£89"},{"l":"B","h":"£98"},{"l":"C","h":"£102"},{"l":"D","h":"£103.50"}],"a":"B","e":"<p>The calculation uses the flat yield formula: FY = coupon / bond price<br/> We input the details we are given in the question: 0.105 (or 10.5%) = £10.25 / bond price<br/> We need to rearrange the equation to get the bond price: Bond price = £10.25 / 0.105 Bond price = £97.62 (closest answer £98)<\/p>"},{"s":4,"n":12,"id":"1001298","q":"<p>What is the approximate gross redemption yield of a 6% gilt redeemable in five years and currently trading at £90?<\/p>","o":[{"l":"A","h":"3.5%"},{"l":"B","h":"6%"},{"l":"C","h":"7%"},{"l":"D","h":"8.9%"}],"a":"D","e":"<p>Current yield = coupon / price x 100 = 6 / 90 x 100 = 6.7%.<br/> Capital gain on redemption = (profit or loss / number of years) / price x 100 = (10 / 5) / 90 x 100 = 2.2%.<br/> Therefore GRY = 6.7% + 2.2% = 8.9%.<\/p>"},{"s":4,"n":13,"id":"1001262","q":"<p>A company has issued convertible loan stock which can convert into 80 ordinary shares per £100 nominal. The convertible is trading at £160 and the ordinary shares at 180p per share. What is the conversion premium?<\/p>","o":[{"l":"A","h":"10%"},{"l":"B","h":"11.1%"},{"l":"C","h":"20%"},{"l":"D","h":"25%"}],"a":"B","e":"<p>Effective price of share via convertible debt (£160 / 80 shares) £2.<br/> Actual share price £1.80.<br/> Conversion premium is 20p, or expressed as a percentage of share price, (£0.20 / £1.80) 11.1%.<\/p>"},{"s":4,"n":14,"id":"1001296","q":"<p>A bond with a 10% coupon which matures in five years' time is priced at £110. Estimate the gross redemption yield.<\/p>","o":[{"l":"A","h":"7.3%"},{"l":"B","h":"9.1%"},{"l":"C","h":"10%"},{"l":"D","h":"10.9%"}],"a":"A","e":"<p>Flat-yield = £10 / £110 x 100 = 9.1%<br/> If the bond is trading above par value (£100) then the GRY will always be less than the FY, so 7.3% is the only possible answer.<\/p>"},{"s":4,"n":15,"id":"1015531","q":"<p>Which ONE of the following best represents ten basis points?<\/p>","o":[{"l":"A","h":"10%"},{"l":"B","h":"0.1%"},{"l":"C","h":"1%"},{"l":"D","h":"0.01%"}],"a":"B","e":"<p>100 basis points represents 1% and, therefore, 10 basis points is 0.1%.<\/p>"},{"s":4,"n":16,"id":"1001921","q":"<p>Which of the following is an incorrect statement when describing modified duration?<\/p>","o":[{"l":"A","h":"All other things being equal, longer maturity bonds have a higher modified duration than shorter maturity bonds"},{"l":"B","h":"All other things being equal, high-coupon bonds have a lower modified duration than low-coupon bonds"},{"l":"C","h":"All other things being equal, low-yielding bonds have a higher modified duration than high-yielding bonds"},{"l":"D","h":"All other things being equal, high-yielding bonds have a higher modified duration than low-yielding bonds"}],"a":"D","e":"<p>Modified duration is a measure of a bond's volatility to interest rate movements. Modified duration is highest for bonds with:<br/> - Low coupons<br/> - Long maturity<br/> - Low yields<\/p>"},{"s":4,"n":17,"id":"1001950","q":"<p>What is represented by the yield curve?<\/p>","o":[{"l":"A","h":"The yield of bonds against their respective maturities"},{"l":"B","h":"The credit rating of a bond series against their respective maturities"},{"l":"C","h":"The flat-yield of a bond series against their redemption yields"},{"l":"D","h":"The yield of a bond series against their respective credit rating"}],"a":"A","e":"<p>For example - the gilt yield curve plots gross redemption yield (y-axis) against maturity (x-axis). The normal shape of the yield curve is upwards sloping, i.e. longer dated gilts have a higher yield than shorter dated gilts.<\/p>"},{"s":4,"n":18,"id":"1015564","q":"<p>If interest rates rise, which ONE of the following is TRUE of the Treasury 6.75% 2028 stock? Its price and yield will:<\/p>","o":[{"l":"A","h":"Rise and rise"},{"l":"B","h":"Fall and rise"},{"l":"C","h":"Fall and fall"},{"l":"D","h":"Rise and fall"}],"a":"B","e":"<p>Interest rates and bond prices have an inverse relationship, so an increase in interest rates will result in a decrease in the price. Yield is calculated as return/price - therefore the yield will increase when prices fall.<\/p>"},{"s":4,"n":19,"id":"1001769","q":"<p>A two-year 5% coupon bond is trading at par. Which of the following is closest to the price of a two-year 3.5% coupon bond assuming the required rate of return on both bonds is the same?<\/p>","o":[{"l":"A","h":"100"},{"l":"B","h":"98.21"},{"l":"C","h":"97.21"},{"l":"D","h":"96.21"}],"a":"C","e":"<p>The 5% coupon bond is trading at par - therefore its gross redemption yield is equal to the coupon of 5%. This is the rate that is used to discount the cash flows of the 3.5% coupon bond (because the question tells us that the required rate of return on both bonds is the same). The price of the bond is therefore:<br/> Price = 3.5/1.05 + 103.5/1.05^2 = 97.21.<\/p>"},{"s":4,"n":20,"id":"1002159","q":"<p>An investor buys £10,000 nominal value of a 10% gilt for settlement on 8th June for a clean price of £102.75. Coupons are paid semi-annually on 1st April and 1st October. Calculate the dirty price to be paid on settlement using an actual/365 day count convention?<\/p>","o":[{"l":"A","h":"£10,461.30"},{"l":"B","h":"£10,442.12"},{"l":"C","h":"£10,185.04"},{"l":"D","h":"£10,186.79"}],"a":"A","e":"<p>The number of days accrued interest is 68 days (29 + 31 + 8). The annual coupon is £1,000 (10% of £10,000)<\/p><p>The accrued interest is therefore 68/365 x £1000 = £186.30<\/p><p>Note: As the day-count fraction has a denominator of 365 - a whole year - we use the full annual coupon. <\/p><p>The clean price is £102.75/£100 x £10,000 = £10,275<\/p><p>The dirty price is £10,275 + £186.30 = £10,461.30<\/p><p>Day-count for gilts can be considered in two ways: Coupon paid date (1st April) to trade date (7th June) inclusive, i.e. 30 + 31 + 7 = 68 Or Day after coupon paid (2nd April) to settlement date (8th June) inclusive, i.e. 29 + 31 + 8 = 68<br/> Note, gilt settle t+1<\/p>"},{"s":4,"n":21,"id":"1002001","q":"<p>What is the price paid by an investor if the cum-div clean price of a bond is £97 and the accrued interest is £3.25?<\/p>","o":[{"l":"A","h":"£97"},{"l":"B","h":"£100.25"},{"l":"C","h":"£103.25"},{"l":"D","h":"£100"}],"a":"B","e":"<p>Price paid = clean price + accrued interest.<\/p>"},{"s":4,"n":22,"id":"1039391","q":"<p>A bond's price, as it reaches maturity, will:<\/p>","o":[{"l":"A","h":"Become more volatile"},{"l":"B","h":"Approach its nominal value"},{"l":"C","h":"Become increasing more expensive"},{"l":"D","h":"Trade at the nominal value less the coupon payment"}],"a":"B","e":"<p>As a bond reaches maturity, the bond's price approaches its nominal value.<\/p>"},{"s":4,"n":23,"id":"1001731","q":"<p>Which of the following is true for a gilt trading above par?<\/p>","o":[{"l":"A","h":"Flat-yield < GRY < NRY"},{"l":"B","h":"Flat-yield > GRY > NRY"},{"l":"C","h":"Flat-yield < GRY > NRY"},{"l":"D","h":"Flat-yield > GRY < NRY"}],"a":"B","e":"<p>Trading above par = loss to redemption, in which case the flat-yield will exceed the GRY which adjusts for this loss. NRY is the gross redemption yield net of relevant tax, therefore will be lower than GRY.<\/p>"},{"s":4,"n":24,"id":"1001944","q":"<p>Consider an 8% annual paying coupon bond with a 20-year maturity and a gross redemption yield of 6% with a face value of £1,000. Calculate the present value, i.e. the discounted value, of the second year's cash flow to the bond?<\/p>","o":[{"l":"A","h":"£80"},{"l":"B","h":"£990"},{"l":"C","h":"£71.20"},{"l":"D","h":"£1,000"}],"a":"C","e":"<p>Present value of second year cash flow = £80 / (1.06)^2 = £71.20.<\/p>"},{"s":4,"n":25,"id":"1078857","q":"<p>Which of the following would determine the shape of a normal yield curve?<\/p>","o":[{"l":"A","h":"Credit rating"},{"l":"B","h":"Liquidity"},{"l":"C","h":"Risk free rate"},{"l":"D","h":"Maturity"}],"a":"B","e":"<p>The shape of a normal yield curve captures the fact that investors have a liquidity preference: they prefer more rather than less liquidity. Because of this, they are willing to accept a lower yield on more liquid, short-dated government bonds, and demand a higher yield on less liquid, longer-dated government bonds.<\/p>"},{"s":4,"n":26,"id":"1002111","q":"<p>What primary feature of a bond price is reflected in the yield curve?<\/p>","o":[{"l":"A","h":"Foreign exchange rates"},{"l":"B","h":"Tax"},{"l":"C","h":"Inflation"},{"l":"D","h":"Demand for equities"}],"a":"C","e":"<p>Yield curves show a range of interest rates, which vary according to expectations of inflation.<\/p>"},{"s":4,"n":27,"id":"1002034","q":"<p>If a company's credit rating changed from AA to AAA, what would you expect to happen to the yield?<\/p>","o":[{"l":"A","h":"Price increases, yield decreases"},{"l":"B","h":"Price decreases, yield increases"},{"l":"C","h":"Price increases, yield increases"},{"l":"D","h":"Price decreases, yield decreases"}],"a":"A","e":"<p>The change in classification represents an upgrade by the credit rating agency as to the safety of the investment returns, hence the price would rise. The yield is expressed as a percentage of this market price and so the yield would decrease.<\/p>"},{"s":4,"n":28,"id":"1001782","q":"<p>What is the price of a 6% two-year bond paying annual coupons if interest rates are 5%?<\/p>","o":[{"l":"A","h":"£98.16"},{"l":"B","h":"£100.66"},{"l":"C","h":"£101.12"},{"l":"D","h":"£101.86"}],"a":"D","e":"<p>We will need to discount the bond's cash flows to value this bond. As this is a two-year annual paying bond, the timeline method of discounting is the simplest method.<br/> Coupon / (1+r) + (Coupon + NV) / (1+r)^2 = Bond's value<br/> 6 / 1.05 + 106 / 1.05^2 = £101.86 <br/> Note: ^2 = \"squared\" or \"to the power of 2\"<\/p>"},{"s":4,"n":29,"id":"1001295","q":"<p>An investor wishes to spend £15,000 on the purchase of Exchequer 8% 2028 priced at £96. What will be the nominal value of the bonds purchased?<\/p>","o":[{"l":"A","h":"£16,350.00"},{"l":"B","h":"£15,625.00"},{"l":"C","h":"£15,000.00"},{"l":"D","h":"£14,400.00"}],"a":"B","e":"<p>To answer this question we need to work out the nominal value from the market price or consideration paid.<br/> To calculate the market price we use the following formula:<br/> Market price = Nominal value x (Price/£100n.v.)<br/> So to get the nominal value, we use the following formula:<br/> Market price or price paid / (Price/£100n.v.)<br/> £15,000 / 96 x 100 = £15,625.<\/p>"},{"s":4,"n":30,"id":"1002037","q":"<p>A 6 5/8% commercial bond pays interest semi-annually on 12 July and 12 January. An investor buys $10,000 nominal value of these bonds for settlement on 28 August. How much is the accrued interest using an actual/365 day count convention?<\/p>","o":[{"l":"A","h":"$56.27"},{"l":"B","h":"$85.31"},{"l":"C","h":"$331.25"},{"l":"D","h":"$662.50"}],"a":"B","e":"<p>A calculation of the dirty price must be made. This is the clean price adjusted for accrued interest.<br/> The interest that has accrued since issue = 47 days. The interest accrues from the from the 13th July (day after the coupon date) to the settlement date on 28th August inclusive. NOTE: some methods use the coupon date (12th July) to the day before settlement (27th August) as the period. Either will give the same answer.<br/> We need to express the coupon with decimals for ease: 6 5/8% is 6.625%<br/> Hence accrued interest = 47/365 x 6.625% x $10,000NV = $85.31<\/p><p>NOTE: As the denominator of the day-count fraction is 365 - a complete year - then we use the full annual coupon in the calculation. <\/p>"},{"s":4,"n":31,"id":"1002030","q":"<p>The present value of the following Treasury with a 4% annual coupon with two years to maturity and a prevailing discount rate of 2.75% is:<\/p>","o":[{"l":"A","h":"$98.51"},{"l":"B","h":"$100"},{"l":"C","h":"$102.40"},{"l":"D","h":"$104.28"}],"a":"C","e":"<p>Year one will have a cash flow of 4 and a discount factor of 1/1.0275. The present value at the end of year one is $3.89.<br/> Year two will have a cash flow of 104 and a discount factor of 1/(1.0275^2). The present value at the end of year two is $98.51.<br/> The price of the bond is the sum of the present values.<\/p>"},{"s":4,"n":32,"id":"1002061","q":"<p>A corporate bond yields 100 basis points over the market referenced interest rate. What is the spread over a ten-year Treasury bond yielding 4.75%, if the reference rate is 4.5%?<\/p>","o":[{"l":"A","h":"0.25%"},{"l":"B","h":"0.75%"},{"l":"C","h":"1.5%"},{"l":"D","h":"1.75%"}],"a":"B","e":"<p>A yield of 100 basis points over the reference rate is 5.5%. The spread over a Treasury bond is therefore 5.5% - 4.75% = 0.75%.<\/p>"},{"s":4,"n":33,"id":"1002028","q":"<p>Estimate the gross redemption yield for a five-year 8% coupon paying bond priced at £92 per £100 nominal.<\/p>","o":[{"l":"A","h":"8.7%"},{"l":"B","h":"1.74%"},{"l":"C","h":"8%"},{"l":"D","h":"10.44%"}],"a":"D","e":"<p>GRY = flat yield + yield on redemption.<br/> GRY = (£8/£92) + [(£100 - £92)/5 years] / £92 = 0.087 + 0.0174 = 0.1044 = 10.44%.<\/p>"},{"s":4,"n":34,"id":"1001299","q":"<p>When the price of a bond changes, the yield also changes. An approximate change in the yield can be predicted using:<\/p>","o":[{"l":"A","h":"Modified duration"},{"l":"B","h":"Flat-yield"},{"l":"C","h":"Leverage ratio"},{"l":"D","h":"Redemption yield"}],"a":"A","e":"<p>Modified duration is used to estimate how the price of a bond changes in response to a 1% movement in interest rates (and vice versa). From this indicator of price sensitivitiy, we can also interpret the possible change in yield.<\/p>"},{"s":4,"n":35,"id":"1001783","q":"<p>What are inter-bank lending rates used to determine?<\/p>","o":[{"l":"A","h":"Base rate"},{"l":"B","h":"Inter-bank offer rate"},{"l":"C","h":"Minimum lending rate"},{"l":"D","h":"NLV"}],"a":"B","e":"<p>If one bank lends a deposit, the other is borrowing. The average rate from a selection of banks will be used to determine the inter-bank offer rate, such as EURIBOR.<\/p>"},{"s":4,"n":36,"id":"1001297","q":"<p>A gilt is priced at £4.00 below its nominal value. If the coupon is 9%, what is the flat-yield?<\/p>","o":[{"l":"A","h":"8.38%"},{"l":"B","h":"9%"},{"l":"C","h":"9.38%"},{"l":"D","h":"10.38%"}],"a":"C","e":"<p>Flat-yield = coupon / market price x 100 = 9 / 96 x 100 = 9.38%.<\/p>"},{"s":4,"n":37,"id":"1023973","q":"<p>What happens to a bond if its credit-rating changes from sub-investment grade to investment grade?<\/p>","o":[{"l":"A","h":"Price increases, coupon increases"},{"l":"B","h":"Price increases, coupon stays the same"},{"l":"C","h":"Price decreases, coupon increases"},{"l":"D","h":"Price decreases, coupon stays the same"}],"a":"B","e":"<p>The price of the bond will increase (because we will be discounting at a lower rate). The coupon will stay the same but the yield (return on the bond) will fall. This is to reflect the lower risk due to the increase in the credit rating.<\/p>"},{"s":4,"n":38,"id":"1002145","q":"<p>Where yield curves are normal, which one of the following is true?<\/p>","o":[{"l":"A","h":"The price of a short-term 5% gilt will be lower than the price of the 5% long-term gilt"},{"l":"B","h":"The yield of a short-term 5% gilt will be higher than the yield of the 5% long-term gilt"},{"l":"C","h":"The price of a long-term 5% gilt will be the same as the price of the 5% short-term gilt regardless of yield"},{"l":"D","h":"The price of a long-term 5% gilt will reflect a risk premium to the price of the 5% short-term gilt"}],"a":"D","e":"<p>A normal yield curve is upward sloping, where longer dated yields are higher than shorter dated yields. This higher yield for longer dated assets reflects an additional risk premium over the short term gilt. It is often referred to as a liquidity premium.<\/p>"},{"s":4,"n":39,"id":"1023974","q":"<p>Which of the following is the best description of the modified duration of a bond?<\/p>","o":[{"l":"A","h":"The change in the price of a bond for a given change in interest rates"},{"l":"B","h":"The risk of the bond weighted to its maturity"},{"l":"C","h":"The classification of a bond's maturity according to the Bond Markets Association"},{"l":"D","h":"The return of a bond based on a sale and repurchase agreement"}],"a":"A","e":"<p>This is the best definition of modified duration.<\/p>"},{"s":4,"n":40,"id":"1052309","q":"<p>A bond is issued with a 7.25% coupon and is trading at £104.32. Its flat-yield would be calculated as (round to the nearest two decimal places):<\/p>","o":[{"l":"A","h":"6.94%"},{"l":"B","h":"6.95%"},{"l":"C","h":"6.96%"},{"l":"D","h":"6.97%"}],"a":"B","e":"<p>7.25 / 104.32 = 0.069497.<br/> 0.069497 x 100, rounded to two decimal places = 6.95.<\/p>"},{"s":4,"n":41,"id":"1001305","q":"<p>Which of the following is true if the UK government bond yield curve is inverted?<\/p>","o":[{"l":"A","h":"Yields on short-dated gilts are greater than yields on medium- and long-dated gilts"},{"l":"B","h":"Yields on long-dated gilts are equal to yields on medium- and long-dated gilts"},{"l":"C","h":"Yields on medium-dated gilts are greater than the yields on short- and long-dated gilts"},{"l":"D","h":"Yields on long-dated gilts are greater than the yields on short- and medium-dated gilts"}],"a":"A","e":"<p>By definition, an inverted yield curve is downward sloping to the right. In this case, short-dated yields will be greater than long-dated yields.<\/p>"},{"s":4,"n":42,"id":"1046727","q":"<p>What is a reverse repo?<\/p>","o":[{"l":"A","h":"Transactions involving cash and bonds being deposited with an independent custodian"},{"l":"B","h":"A transaction where one party sells stock to the other, agreeing at the same time to repurchase the equivalent securities at an agreed price and on an agreed date in the future"},{"l":"C","h":"A transaction where one party sells stock to the other, agreeing at the same time to repurchase the equivalent securities at an agreed price and at no fixed time in the future"},{"l":"D","h":"A transaction where one party purchases stock from the other, agreeing at the same time to resell the equivalent securities at an agreed price and on an agreed date in the future"}],"a":"D","e":"<p>This is the best description.<\/p>"},{"s":4,"n":43,"id":"1015992","q":"<p>Which one of the following is not a usual method of bond quotation?<\/p>","o":[{"l":"A","h":"Price of the bond"},{"l":"B","h":"Yield of the bond"},{"l":"C","h":"Price spread"},{"l":"D","h":"Yield spread"}],"a":"C","e":"<p>Price spread is not a usual method of bond quotation.<\/p>"},{"s":4,"n":44,"id":"1002143","q":"<p>Which of the following would lead to the highest increase in price of a convertible trading at a zero premium to par?<\/p>","o":[{"l":"A","h":"A large increase in the price of the underlying shares"},{"l":"B","h":"A large decrease in the price of the underlying shares"},{"l":"C","h":"A decrease in interest rates"},{"l":"D","h":"An increase in interest rates"}],"a":"A","e":"<p>Although a decrease in interest rates would lead to an increase in the price of a convertible (as with any fixed income instrument), the largest increase in price would be attributable to a large increase in the price of the underlying stock. This is because as the underlying stock rises in price, the convertible becomes more attractive as investors buy the bond in order to convert it into shares. The conversion value of the bond therefore increases and the bond begins to behave in a similar fashion to the underlying shares.<\/p>"},{"s":4,"n":45,"id":"1026891","q":"<p>An investor has £10,000 nominal of a convertible bond. Its conversion terms are 50 shares per £100 nominal at a price of £2 (per share). The share price is currently £4.00 per share. What would happen to the price of the convertible bond if the share price fell?<\/p>","o":[{"l":"A","h":"Fall"},{"l":"B","h":"Rise"},{"l":"C","h":"Initially rise and then fall as the market corrects itself"},{"l":"D","h":"Nothing; the bond's price is totally independent of the share price"}],"a":"A","e":"<p>With this convertible bond the investor has the choice of either receiving £10,000 at maturity or receiving 5,000 shares. As the shares are worth £4 each the investor could receive £20,000. This would be referred to as being deeply in-the-money as the investor is likely to convert the bond.<br/> A deeply in-the-money convertible will almost exactly mirror that of the underlying stock. Therefore, if the share price falls, the value of the bond will also fall.<\/p>"},{"s":4,"n":46,"id":"1001973","q":"<p>A bond is yielding 7% at a spread to the reference rate of 350 basis points. If an index-linked gilt is yielding 2%, what is its spread to the published reference interest rate?<\/p>","o":[{"l":"A","h":"+150 bp"},{"l":"B","h":"-150 bp"},{"l":"C","h":"+200 bp"},{"l":"D","h":"-200 bp"}],"a":"B","e":"<p>The published reference interest rate is at 7% -3.5% = 3.5%. The index-linked gilt is therefore at a negative spread of 150bp to the reference rate.<\/p>"},{"s":5,"n":1,"id":"1001247","q":"<p>Which of the following is not true of warrants?<\/p>","o":[{"l":"A","h":"They are equity call options written by the issuing company"},{"l":"B","h":"They are highly-geared instruments"},{"l":"C","h":"Covered warrants are warrants issued by third parties"},{"l":"D","h":"Bonds and other instruments are frequently issued in conjunction with warrants"}],"a":"A","e":"<p>Warrants are not equity call options, but they function in a similar way. An equity call option gives the right to the holder to buy existing shares in the company at a fixed price on a future date; warrants give the right to the holder to buy newly issued shares in the company at a fixed price on a future date. <\/p><p>Although they function in a similar way to call options, warrants are a type of security, not a type of derivative. <\/p>"},{"s":5,"n":2,"id":"1015565","q":"<p>For how long can ADRs be traded in pre-release form?<\/p>","o":[{"l":"A","h":"One month"},{"l":"B","h":"Three months"},{"l":"C","h":"Four months"},{"l":"D","h":"Six months"}],"a":"B","e":"<p>ADRs can be traded in pre-release form for a period of three months.<\/p>"},{"s":5,"n":3,"id":"1070604","q":"<p>The major source of income for a REIT is?<\/p>","o":[{"l":"A","h":"Dividends"},{"l":"B","h":"Coupons"},{"l":"C","h":"Stock lending"},{"l":"D","h":"Rental income"}],"a":"D","e":"<p>Real Estate Investment Trusts derive their income from property.<\/p>"},{"s":5,"n":4,"id":"4212391","q":"<p>What is cryptomining in the context of cryptocurrencies?<\/p>","o":[{"l":"A","h":"The process of purchasing cryptocurrencies using fiat currencies"},{"l":"B","h":"The act of storing cryptocurrencies in a digital wallet"},{"l":"C","h":"The technique of publishing blog posts to earn cryptocurrency rewards"},{"l":"D","h":"The method of solving mathematical problems to generate new cryptographic keys"}],"a":"D","e":"<p>Cryptomining involves solving complex mathematical problems to validate and record transactions on the blockchain, which in turn generates new cryptographic keys.<\/p>"},{"s":5,"n":5,"id":"1001281","q":"<p>ICMA regulates which of the following?<\/p>","o":[{"l":"A","h":"FX markets"},{"l":"B","h":"Eurobonds"},{"l":"C","h":"ADRs"},{"l":"D","h":"OTC derivatives"}],"a":"B","e":"<p>The International Capital Market Association is the regulator of the eurobond market. Formerly known as ISMA.<\/p>"},{"s":5,"n":6,"id":"1001337","q":"<p>The foreign exchange market is where:<\/p>","o":[{"l":"A","h":"Deals for delayed settlement is not allowed"},{"l":"B","h":"Banks are not permitted to be market participants"},{"l":"C","h":"Spot and forward contracts are traded"},{"l":"D","h":"Acquisition of foreign currency by a UK resident requires authority by the Bank of England and the Bank of International Settlements"}],"a":"C","e":"<p>Deals for delayed settlement is allowed and the main participants are the international banks.<br/> The acquisition of foreign currency by a UK resident does NOT require authority by the Bank of England and the Bank of International Settlements.<\/p>"},{"s":5,"n":7,"id":"1001100","q":"<p>Which of the following statements is true of American depositary receipts?<\/p>","o":[{"l":"A","h":"They are freely-transferable"},{"l":"B","h":"They are freely-transferable if accompanied by a stock transfer form"},{"l":"C","h":"They are freely-transferable if in the name of a good nominee, such as the Depository Trust Corporation"},{"l":"D","h":"They are not freely-transferable"}],"a":"C","e":"<p>American depository receipts are American form documents - not true bearer form.<br/> American form documents - freely transferable if in the name of a good nominee, such as the Depository Trust Corporation.<\/p>"},{"s":5,"n":8,"id":"1001328","q":"<p>Which of the following is true of the currency markets?<\/p>","o":[{"l":"A","h":"Trading in London takes place on exchange"},{"l":"B","h":"The market is not regulated by the FCA"},{"l":"C","h":"London is the largest centre for trading"},{"l":"D","h":"Spot deals settle T+1"}],"a":"C","e":"<p>The FX markets are OTC (over-the-counter). Standard spot settlement is T+2. They are regulated in London by the FCA.<\/p>"},{"s":5,"n":9,"id":"1012994","q":"<p>Which of the following are characteristics of the property market?<\/p><p><strong>I<\/strong><\/p><p>Loose government regulation<\/p><p><strong>II<\/strong><\/p><p>Decentralised market<\/p><p><strong>III<\/strong><\/p><p>Management costs are an important consideration<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"I and III"},{"l":"C","h":"II and III"},{"l":"D","h":"I, II and III"}],"a":"C","e":"<p>The property market is tightly controlled by the government (e.g. stamp duty / tax regimes etc). It is a decentralised market, i.e. property is not all traded in one place and subject to one set of supply and demand forces. Lastly, when buying a property to rent out, the return is going to be severely restricted by management costs.<\/p>"},{"s":5,"n":10,"id":"1015685","q":"<p>An investor sells Malaysian shares and wants to exchange the proceeds into Brazilian currency. If the currencies are not quoted against each other directly, using which type of rate would the investor be able to convert?<\/p>","o":[{"l":"A","h":"Cross rate"},{"l":"B","h":"Indirect rate"},{"l":"C","h":"Implied rate"},{"l":"D","h":"Arbitrage rate"}],"a":"A","e":"<p>Cross rates enable effective rates to be calculated where the currencies concerned are not quoted directly against each other.<\/p>"},{"s":5,"n":11,"id":"1076731","q":"<p>A small investor is most likely to invest in which of the following types of property?<\/p>","o":[{"l":"A","h":"Residential"},{"l":"B","h":"Small commercial"},{"l":"C","h":"Infrastructure"},{"l":"D","h":"Farmland"}],"a":"A","e":"<p>Residential properties as an investment are typically bought by small investors as many  have chosen to become involved in the property market through buying-to-let or simply by purchasing a second home.<\/p>"},{"s":5,"n":12,"id":"1002044","q":"<p>Which one of the following is not true of warrants?<\/p>","o":[{"l":"A","h":"They form part of the ordinary share capital of the company"},{"l":"B","h":"They can be issued with loan stock or separately"},{"l":"C","h":"They can have both intrinsic value and time value"},{"l":"D","h":"Time value will fall to zero as they approach expiry"}],"a":"A","e":"<p>On exercise the investor will receive shares which are then part of ordinary share capital.<\/p>"},{"s":5,"n":13,"id":"1001724","q":"<p>Which of the following are true of eurobonds?<\/p><p><strong>I<\/strong><\/p><p>Interest is usually paid before the deduction of withholding tax<\/p><p><strong>II<\/strong><\/p><p>Notice is always given before coupon payment<\/p><p><strong>III<\/strong><\/p><p>They are usually in bearer form<\/p><p><strong>IV<\/strong><\/p><p>They may only be issued by governments and international institutions<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and III"},{"l":"C","h":"I and III"},{"l":"D","h":"II and IV"}],"a":"C","e":"<p>Eurobonds are issued by corporates as well as by international bodies and governments. The term bearer means that it is an anonymous, freely-transferable security.<\/p>"},{"s":5,"n":14,"id":"1015607","q":"<p>In relation to warrants, which of the following is FALSE?<\/p>","o":[{"l":"A","h":"They can exercise on a daily basis"},{"l":"B","h":"They must be exercised on expiry"},{"l":"C","h":"They are convertible into ordinary shares"},{"l":"D","h":"They do not carry the right to vote at an AGM"}],"a":"B","e":"<p>The exercise dates are stated upfront, and may have the capability of exercising daily. Warrants never carry the right to vote in meetings. A warrant is similar to a call option, where there is a right, but not an obligation to buy new shares, and therefore does not have to be exercised at expiry.<\/p>"},{"s":5,"n":15,"id":"1001795","q":"<p>Which of the following is the minimum denomination for UK Treasury bills?<\/p>","o":[{"l":"A","h":"£5,000"},{"l":"B","h":"£25,000"},{"l":"C","h":"£50,000"},{"l":"D","h":"£100,000"}],"a":"B","e":""},{"s":5,"n":16,"id":"1005156","q":"<p>Which of the following statements is TRUE of supply and demand in the property market?<\/p>","o":[{"l":"A","h":"Demand and supply are relatively inelastic"},{"l":"B","h":"Demand is relatively inelastic"},{"l":"C","h":"Supply is relatively elastic"},{"l":"D","h":"Supply is relatively inelastic"}],"a":"D","e":"<p>The supply of property is relatively inelastic. This means it can't easily change in line with increasing demand. This is because land is finite and there are a lot regulations, including planning controls.<\/p>"},{"s":5,"n":17,"id":"1039440","q":"<p>Which of the following institutional investors is MOST likely to invest in commercial paper?<\/p>","o":[{"l":"A","h":"Pension fund"},{"l":"B","h":"Collective investment scheme"},{"l":"C","h":"Life insurance company"},{"l":"D","h":"Money market fund"}],"a":"D","e":"<p>Commercial paper is a money market instrument.<\/p>"},{"s":5,"n":18,"id":"1078442","q":"<p>Which of the following is FALSE in respect of UK government treasury bills?<\/p>","o":[{"l":"A","h":"They are a form of long-term borrowing"},{"l":"B","h":"The UK Debt Management Office issues"},{"l":"C","h":"They are issued at a discount to par"},{"l":"D","h":"They carry no rate of interest"}],"a":"A","e":"<p>The UK Debt Management Office issues T-bills via a weekly COMPETITIVE tender. As bills do NOT pay a coupon, they are always issued and traded at a discount to par, hence the term 'discounted instruments'. T-bills are usually issued with a three or six month-life. However, the most common is the three-month bill.<\/p>"},{"s":5,"n":19,"id":"1058295","q":"<p>If a UK based REIT pays at least 90% of the rental income to shareholders, then the REIT will not need to pay:<\/p>","o":[{"l":"A","h":"Withholding tax"},{"l":"B","h":"Income tax"},{"l":"C","h":"Corporation tax"},{"l":"D","h":"Stamp Duty Reserve Tax"}],"a":"C","e":"<p>If a UK based REIT pays at least 90% of the rental income to shareholders, then the REIT will not need to pay corporation tax. However, any income received by the shareholders will be treated as income and not taxed as a dividend.<\/p>"},{"s":5,"n":20,"id":"1054173","q":"<p>Which one of the following statements about property as an investment is false?<\/p>","o":[{"l":"A","h":"The different types of property available make diversification easy"},{"l":"B","h":"It is not often feasible to divide a property up and then sell on the individual units"},{"l":"C","h":"Property is subject to high transaction cost of transfer"},{"l":"D","h":"Valuation is subjective as there is not a recognised centralised marketplace"}],"a":"A","e":"<p>Although there are different types of property available (residential / commercial) the fact that property can only be bought in discrete and sizeable units acts as a barrier to diversification.<\/p>"},{"s":5,"n":21,"id":"1001105","q":"<p>What is the correct form for collateral if ADRs are to be traded in pre-release format?<\/p>","o":[{"l":"A","h":"Cash"},{"l":"B","h":"Shares"},{"l":"C","h":"ADRs"},{"l":"D","h":"Government bonds"}],"a":"A","e":"<p>Trading of ADRs prior to the issue of the underlying shares normally requires US dollar collateral.<\/p>"},{"s":5,"n":22,"id":"1001987","q":"<p>Which of the following is the best description of a reverse repo transaction?<\/p>","o":[{"l":"A","h":"The purchase and resale of an asset at a pre-agreed price"},{"l":"B","h":"The sale and repurchase of an asset at a pre-agreed price"},{"l":"C","h":"The sale and repurchase of an asset at a price to be determined"},{"l":"D","h":"The purchase and resale of an asset at a price to be determined"}],"a":"A","e":"<p>Note: option 'the sale and repurchase of an asset at a pre-agreed price' describes a repo transaction.<br/> 'The purchase and resale of an asset at a pre-agreed price' is the correct option.<\/p>"},{"s":5,"n":23,"id":"1042408","q":"<p>The £ vs. $ rate is currently $1.5585 - 1.5595. The sterling equivalent of converting $100,000 is:<\/p>","o":[{"l":"A","h":"£155,850"},{"l":"B","h":"£64,164"},{"l":"C","h":"£64,123"},{"l":"D","h":"£155,950"}],"a":"C","e":"<p>We would buy sterling at $1.5595. Therefore: $100,000/1.5595 = £64,123.<\/p>"},{"s":5,"n":24,"id":"1023975","q":"<p>Which of the following is the best description of a reverse repo transaction?<\/p>","o":[{"l":"A","h":"Stock borrowing and lending"},{"l":"B","h":"The sale and repurchase of a bond on two fixed dates"},{"l":"C","h":"The sale and repurchase of a bond on unknown dates"},{"l":"D","h":"The purchase and then sale of a bond"}],"a":"D","e":"<p>A reverse repo occurs when a firm buys a bond and then sells it back at a later date. It is the equivalent of stock borrowing.<\/p>"},{"s":5,"n":25,"id":"4212393","q":"<p>What is a key characteristic of cryptocurrencies in terms of their creation and transaction recording?<\/p>","o":[{"l":"A","h":"They use blockchain technology for encryption and transaction recording"},{"l":"B","h":"They are backed by government reserves"},{"l":"C","h":"They are primarily exchanged through traditional stock markets"},{"l":"D","h":"They are regulated by a central bank"}],"a":"A","e":"<p>Cryptocurrencies utilize blockchain or distributed ledger technology to control the issuance of currency, record ownership, and manage transactions securely.<\/p>"},{"s":5,"n":26,"id":"1001243","q":"<p>When a warrant is exercised, who are the shares delivered by?<\/p>","o":[{"l":"A","h":"The holder of the warrant"},{"l":"B","h":"The company"},{"l":"C","h":"The LSE"},{"l":"D","h":"The seller of the shares"}],"a":"B","e":"<p>Exercise of a warrant is against the company.<br/> Exercise of an option is against the writer of the option.<\/p>"},{"s":5,"n":27,"id":"1078859","q":"<p>What is the minimum denomination of a UK government T-bill?<\/p>","o":[{"l":"A","h":"£10,000"},{"l":"B","h":"£25,000"},{"l":"C","h":"£50,000"},{"l":"D","h":"£500,000"}],"a":"B","e":"<p>Bids for UK government T-bills must be for a minimum of £500,000 nominal and above this level bids must be made in multiples of £50,000. The minimum denomination however is £25,000.<\/p>"},{"s":5,"n":28,"id":"1043830","q":"<p>Which of the following is not a characteristic of property?<\/p>","o":[{"l":"A","h":"High transaction costs"},{"l":"B","h":"Illiquid"},{"l":"C","h":"Indivisible"},{"l":"D","h":"Homogenous"}],"a":"D","e":"<p>In the property market, no two properties are considered exactly alike. This is referred to as being heterogeneous.<\/p>"},{"s":5,"n":29,"id":"1001313","q":"<p>Which of the following best describes a gilt repo?<\/p>","o":[{"l":"A","h":"A transaction arranged by a stock borrowing lending intermediary"},{"l":"B","h":"Gilts sold and then repurchased at a pre-agreed price"},{"l":"C","h":"Gilts purchased and then resold at a pre-agreed price"},{"l":"D","h":"A hedging transaction involving gilts"}],"a":"B","e":"<p>A gilt repo is a transaction where one party sells gilts to another party, agreeing at the same time to repurchase the equivalent securities at an agreed price and on an agreed date in the future.<\/p>"},{"s":5,"n":30,"id":"1016236","q":"<p>Which of the following is NOT a form of UK government debt finance over a long period of time?<\/p>","o":[{"l":"A","h":"Fixed-dated gilt"},{"l":"B","h":"Convertible gilt"},{"l":"C","h":"Double-dated gilt"},{"l":"D","h":"Treasury bill"}],"a":"D","e":"<p>A T-bill is about short-term finance.<\/p>"},{"s":5,"n":31,"id":"1024206","q":"<p>Commercial paper is which of the following?<\/p>","o":[{"l":"A","h":"Secured, short-term debt repaid at par"},{"l":"B","h":"Unsecured, short-term debt repaid at par"},{"l":"C","h":"Secured, long-term debt repaid at a premium to par"},{"l":"D","h":"Unsecured, short-term debt repaid at a premium to par"}],"a":"B","e":"<p>Commercial paper is unsecured, short-term debt, issued at a discount and therefore repaid at par.<\/p>"},{"s":5,"n":32,"id":"1057382","q":"<p>An investor buys commercial paper direct from an issuing company. Which of the following could be a motivation?<\/p>","o":[{"l":"A","h":"To facilitate the secondary market trading of these investments"},{"l":"B","h":"To reduce the impact of costs through elimination of broker's charges"},{"l":"C","h":"To decrease the credit risk on the paper"},{"l":"D","h":"To dematerialise the paper"}],"a":"B","e":"<p>The question refers to direct paper. This is issued directly to investors to eliminate any intermediaries. They are typically issued to buy and hold investors. Dealer paper uses intermediaries, which facilitate secondary market trading. The two forms do not affect credit risk, nor do they determine whether they are dematerialised or bearer.<\/p>"},{"s":5,"n":33,"id":"1048174","q":"<p>The spot sterling/dollar rate is 1.4400. The three-month forward rate is at a 20/18 adjustment. For someone who wants to change sterling to dollars, what would the three-month forward rate be?<\/p>","o":[{"l":"A","h":"$1.4200"},{"l":"B","h":"$1.4380"},{"l":"C","h":"$1.4382"},{"l":"D","h":"$1.4387"}],"a":"B","e":"<p>The adjustment will always widen the spread between the bid and the offer. To do this we need to subtract the adjustment from the spot rate.<br/> Forward BID = 1.4400 - 20 = 1.4380 Forward OFFER = 1.4400 - 18 = 1.4382<br/> If you want to change sterling into dollars, you are selling the base (GBP) currency, so you need the bid.<\/p>"},{"s":5,"n":34,"id":"1001276","q":"<p>Which of the following is true of eurobonds?<\/p>","o":[{"l":"A","h":"Interest paid gross"},{"l":"B","h":"Notice is always given before payment"},{"l":"C","h":"Can only be issued by governments and international bodies"},{"l":"D","h":"Are registered by Euroclear or Clearstream"}],"a":"A","e":"<p>Eurobonds are international bonds, issued in more than one country by international bodies, governments (however these are more commonly known as soverign bonds) and companies. Interest is paid gross. Eurobonds are settled using Euroclear or Clearstream. However, they are bearer documents so no register is maintained.<\/p>"},{"s":5,"n":35,"id":"1048175","q":"<p>Sterling is quoted at $1.4735-1.4770 spot. The one-month forward is quoted at 15/10 pips. How much in US dollars will it cost to buy £100,000 for settlement in one month?<\/p>","o":[{"l":"A","h":"$147,200"},{"l":"B","h":"$147,700"},{"l":"C","h":"$147,600"},{"l":"D","h":"$148,000"}],"a":"C","e":"<p>The one-month forward rate is $1.4720-$1.4760 . We wish to buy the base currency; the quoting bank will therefore deal at its offer $1.4760. £100,000 will therefore cost $147,600.<\/p><p>When the pips are decreasing (15/10), you deduct the adjustment<br/> When the pips are increasing (10/15), you add the adjustment<\/p>"},{"s":5,"n":36,"id":"1001903","q":"<p>Corporate commercial paper (CP) may be described as:<\/p>","o":[{"l":"A","h":"A secured discount instrument"},{"l":"B","h":"An unsecured discount instrument"},{"l":"C","h":"A secured fixed income instrument"},{"l":"D","h":"An unsecured fixed coupon instrument"}],"a":"B","e":"<p>Commercial paper issued by companies pays no coupon (it is a discount instrument) and the owner has no charge over the company's assets (it is unsecured).<\/p>"},{"s":5,"n":37,"id":"1014137","q":"<p>An example of zero-coupon debt that is issued at a discount to its nominal value is which one of the following?<\/p>","o":[{"l":"A","h":"Municipal bonds"},{"l":"B","h":"Medium-term notes"},{"l":"C","h":"Agency bonds"},{"l":"D","h":"Commercial paper"}],"a":"D","e":"<p>Commercial paper is short-term unsecured corporate debt that pays no coupon. The investor makes a return from purchasing the instrument at a discount.<\/p>"},{"s":5,"n":38,"id":"1001244","q":"<p>All of the following are true of warrants except:<\/p>","o":[{"l":"A","h":"No dividends are paid"},{"l":"B","h":"Traded on LSE"},{"l":"C","h":"Interest paid gross"},{"l":"D","h":"On exercise the company issues new shares"}],"a":"C","e":"<p>Warrants pay neither interest nor dividends. On exercise the company issues new shares at the 'strike price'.<\/p>"},{"s":5,"n":39,"id":"1032946","q":"<p>In foreign exchange markets, which of the following has a standard settlement of two business days?<\/p>","o":[{"l":"A","h":"Cross rate"},{"l":"B","h":"Forward"},{"l":"C","h":"Spot"},{"l":"D","h":"Swap"}],"a":"C","e":"<p>The term spot refers to the standard settlement convention of the trade date (T + 2). A US dollar vs. a Japanese yen deal struck on Monday will result in the deal being settled on Wednesday.<\/p>"},{"s":5,"n":40,"id":"1015681","q":"<p>An investor purchases a call covered warrant. What type of investment have they bought?<\/p>","o":[{"l":"A","h":"Option to buy new shares issued by a company"},{"l":"B","h":"Option to buy existing shares issued by a third party"},{"l":"C","h":"Obligation to buy shares issued by the company"},{"l":"D","h":"Obligation to buy shares issued by a third party"}],"a":"B","e":"<p>Covered warrants are issued by third parties, as opposed to warrants which are issued by the company itself. Both warrants and covered warrants confer rights, but not obligations, on the holder.<\/p>"},{"s":5,"n":41,"id":"1076203","q":"<p>The currencies of the United Arab Emirates and Saudi Arabia are pegged to the US Dollar. What are these examples of?<\/p>","o":[{"l":"A","h":"A floating exchange rate"},{"l":"B","h":"A fixed exchange rate"},{"l":"C","h":"A managed exchange rate"},{"l":"D","h":"A forward exchange rate"}],"a":"B","e":"<p>Where one country fixes its currency against another, this is referred to a fixed exchange rate.<\/p>"},{"s":5,"n":42,"id":"1001955","q":"<p>Which of the following is FALSE of repos?<\/p>","o":[{"l":"A","h":"They can be tripartite or bilateral agreements"},{"l":"B","h":"The other side of a repo transaction is referred to as a reverse repo"},{"l":"C","h":"They represent the selling and buying back of bonds"},{"l":"D","h":"They allow bonds to be borrowed in return for a fee"}],"a":"D","e":"<p>A repo is a sale and repurchase agreement, where one party (the repoer) sells a bond but agrees to repurchase it for a fixed price on a future date. These can be arranged directly between the seller (the repoer) and the buyer (the reverse repoer) in a bilateral transaction, or they can be arranged through a third party in a tripartite transaction. Rather than a fee, an interest rate is implied in the sale and repurchase price.<\/p>"},{"s":5,"n":43,"id":"1078899","q":"<p>A tri-party repo will involve the party that needs cash, the lender who receives collateral and a:<\/p>","o":[{"l":"A","h":"Central counterparty"},{"l":"B","h":"Market maker"},{"l":"C","h":"Custodian bank"},{"l":"D","h":"Local"}],"a":"C","e":"<p>Many large custodian banks have therefore added securities lending to their core custody businesses. This allows them to facilitate the repo when one party is not entirely happy with collateral offered.<\/p>"},{"s":5,"n":44,"id":"1060964","q":"<p>Real estate investment trusts (REITs) must distribute what percentage of their profits as dividends?<\/p>","o":[{"l":"A","h":"70%"},{"l":"B","h":"80%"},{"l":"C","h":"90%"},{"l":"D","h":"100%"}],"a":"C","e":"<p>REITs benefit from tax advantages within the fund. Specifically they do not pay tax on any income or capital growth within the portfolio of assets. As a condition of this tax advantage a REIT must distribute at least 90% of its income to investors.<\/p>"},{"s":5,"n":45,"id":"1007592","q":"<p>Which ONE of the following statements regarding forward foreign exchange transactions is FALSE?<\/p>","o":[{"l":"A","h":"Exchange of money takes place at maturity"},{"l":"B","h":"Exchange rates are fixed at the time the transaction is agreed"},{"l":"C","h":"Non-deliverable forwards are settled at the forward rate"},{"l":"D","h":"There are no standard delivery dates"}],"a":"C","e":"<p>In a non-deliverable forward, the exchange rate is set for some date in the future, but at that date the quoted currency is not exchanged. Instead, the rate is compared against the prevailing spot rate. The profit or loss is calculated as if a reverse transaction had been completed. This is the amount that is settled.<\/p>"},{"s":5,"n":46,"id":"1072132","q":"<p>Who typically issues covered warrants?<\/p>","o":[{"l":"A","h":"Investment banks"},{"l":"B","h":"A writer"},{"l":"C","h":"Individuals"},{"l":"D","h":"Companies"}],"a":"A","e":"<p>Those that sell options are called writers but investment banks typically issue covered warrants. Companies may issue warrants representing their shares but not covered warrants.<\/p>"},{"s":5,"n":47,"id":"1015633","q":"<p>Which of the following is TRUE of warrants?<\/p>","o":[{"l":"A","h":"They form part of the issued share capital"},{"l":"B","h":"The holder is entitled to vote"},{"l":"C","h":"They are a low-risk method of investing in equities"},{"l":"D","h":"If exercised, new shares will be created"}],"a":"D","e":"<p>A warrant is the right to buy newly-created shares in the company.<\/p>"},{"s":5,"n":48,"id":"1001248","q":"<p>A warrant of a listed public company gives the holder:<\/p>","o":[{"l":"A","h":"The right to receive dividends"},{"l":"B","h":"The right to vote and buy shares at a pre-determined price during a pre-determined time"},{"l":"C","h":"The right to vote and receive dividends"},{"l":"D","h":"The right to buy shares at a pre-determined price during a pre-determined time"}],"a":"D","e":"<p>A warrant does not come with voting rights or the right to receive dividends. A warrant only offers the right to buy shares at a pre-determined price during a pre-determined time.<\/p>"},{"s":5,"n":49,"id":"1001346","q":"<p>All of the following are true regarding UK T-bills except:<\/p>","o":[{"l":"A","h":"They carry a fixed coupon"},{"l":"B","h":"The are issued weekly by the government"},{"l":"C","h":"They normally carry a three-month life"},{"l":"D","h":"They are issued by competitive auction"}],"a":"A","e":"<p>Treasury bills are issued at a discount to their nominal value; no coupon (i.e. right to interest) is attached.<\/p>"},{"s":5,"n":50,"id":"1023970","q":"<p>Of the following organisations, which sets-out the processes involved in trading eurobonds?<\/p>","o":[{"l":"A","h":"IOSCO"},{"l":"B","h":"European Central Bank"},{"l":"C","h":"TRAX"},{"l":"D","h":"International Capital Markets Association"}],"a":"D","e":"<p>Eurobonds are regulated by the International Capital Markets Association (ICMA).<\/p>"},{"s":5,"n":51,"id":"1042409","q":"<p>If the sterling/dollar spot rate is 1.7180-1.7270 and the three-month forward rate adjustment is 42-44, how many dollars need to be sold to raise £150,000 in three months' time?<\/p>","o":[{"l":"A","h":"$257,673"},{"l":"B","h":"$257,070"},{"l":"C","h":"$259,710"},{"l":"D","h":"$258,390"}],"a":"C","e":"<p>The investor wishes to sell dollars (so buy pounds). As the investor is buying base, the higher rate is used: 1.7270 USD.<br/> Add forward rate 'disc' (discount) to the spot rate: 1.7270 + 0.0044 = 1.7314.<br/> Finally calculate the number of dollars need to be sold: £150,000 x 1.7314 = $259,710.<\/p><p>Whenever the pips are increasing (42/44), you add the pips, as in this question. Whenever the pips are decreasing (44/42), you deduct the pips.<\/p><p>When picking the correct end of the spread, remember, as a price taker, you always get the worst deal (highest cost or lowest income). <\/p>"},{"s":5,"n":52,"id":"1073037","q":"<p>Which of the following is NOT an advantage of investing in REITs over physical property?<\/p>","o":[{"l":"A","h":"Control of investment"},{"l":"B","h":"Liquidity of market"},{"l":"C","h":"Smaller cash outlay required"},{"l":"D","h":"Less administration on purchase and sale"}],"a":"A","e":"<p>REITs are managed by external managers and hence, investors (unit-holders) have very little control<\/p>"},{"s":5,"n":53,"id":"1051085","q":"<p>Consider the three following property transactions:<\/p><ul> <li><p>Andy purchases a buy-to-let residential property, then leases it out.<\/p><\/li> <li><p>Martin leases a residential property.<\/p><\/li> <li><p>Sarah leases a commercial property.<\/p><\/li> <\/ul><p>Which of the following is true?<\/p>","o":[{"l":"A","h":"Andy and Martin only will be responsible for the upkeep of their property"},{"l":"B","h":"Martin will be more exposed to void periods than Sarah"},{"l":"C","h":"Sarah will typically have a longer lease than Martin"},{"l":"D","h":"Andy and Sarah will not need to pay for maintenance of the property"}],"a":"C","e":"<p>The lessor of residential property (Andy) and the lessee of commercial property (Sarah) are typically responsible for the upkeep (maintenance) of the property. Andy is the only one generating income on the property, so is the only one exposed to void periods. Commercial leases are typically longer than those on residential property.<\/p>"},{"s":5,"n":54,"id":"1002133","q":"<p>The dollar-yen spot rate is Y 110.40 - Y110.45. How many yen do you require to buy $100,000?<\/p>","o":[{"l":"A","h":"11,040,000"},{"l":"B","h":"11,045,000"},{"l":"C","h":"905.80"},{"l":"D","h":"905.39"}],"a":"B","e":"<p>Yen required to buy $100,000 = $100,000 x 110.45 = Yen11,045,000<\/p>"},{"s":5,"n":55,"id":"1001245","q":"<p>Which of the following is NOT true of equity warrants?<\/p>","o":[{"l":"A","h":"They are only issued by companies"},{"l":"B","h":"When exercised they generate new cash for the company"},{"l":"C","h":"They may pay a fixed or variable income"},{"l":"D","h":"They are traded on the LSE"}],"a":"C","e":"<p>Warrants are only issued by companies, and generate cash for the company on exercise. They are all listed on the LSE and can be traded there, though in practice many warrants are traded OTC. Warrants are not shares, and so do not pay any dividend to the holder. <\/p><p>Warrants may be issued attached to loan stock, acting as a sweetener to investors buying the bonds. The warrants may either be detachable from the bond, in which case they may be traded separately from the bond itself, or non-detachable, which means that the investors buy and sell the bond and warrant as a 'package'.<\/p>"},{"s":5,"n":56,"id":"1002135","q":"<p>Dividends paid to holders of an ADR will be in which of the following currencies?<\/p>","o":[{"l":"A","h":"Sterling"},{"l":"B","h":"Dollars"},{"l":"C","h":"Euros"},{"l":"D","h":"Yen"}],"a":"B","e":"<p>Dividends paid to holders of an American depository receipt will be in dollars.<\/p>"},{"s":5,"n":57,"id":"1001102","q":"<p>Which of the following is true of the dividends paid on the underlying shares of an ADR?<\/p>","o":[{"l":"A","h":"They are paid directly from the company to the holder of the ADR"},{"l":"B","h":"They are paid by the company to the depository bank"},{"l":"C","h":"They are paid by the depository bank to the company"},{"l":"D","h":"ADRs do not attract the right to dividends"}],"a":"B","e":"<p>ADR holders receive all privileges of the underlying shares, including voting rights, and dividends are paid in dollars. Dividends are received by the bank which holds the underlying shares (the depository bank), converted into dollars and paid to the holders. Note: ADR holders do not generally receive pre-emptive rights in rights issues.<\/p>"},{"s":5,"n":58,"id":"4212394","q":"<p><\/p><p>Alex is considering investing in cryptocurrencies and has been researching their characteristics. He is particularly interested in understanding the risks associated with this asset class. After setting up a digital wallet, Alex plans to acquire cryptocurrencies through various methods including purchasing with fiat currencies, earning through online platforms, and cryptomining. He is aware that cryptocurrencies are decentralized and often experience significant volatility.<\/p><p>Considering Alex's situation, which of the following statements best captures a risk he should be aware of when investing in cryptocurrencies?<\/p>","o":[{"l":"A","h":"Cryptocurrencies are backed by government reserves, ensuring stability in their value."},{"l":"B","h":"Cryptocurrencies are immune to security breaches due to their decentralized nature"},{"l":"C","h":"Cryptocurrencies can experience significant price fluctuations due to varying market sentiment and regulatory changes"},{"l":"D","h":"Cryptocurrencies provide guaranteed returns if acquired through cryptomining"}],"a":"C","e":"<p>Cryptocurrencies are known for their volatility, driven by factors such as market sentiment, regulatory changes, and security breaches, which Alex should understand as a significant risk when investing in this asset class.<\/p>"},{"s":5,"n":59,"id":"1043768","q":"<p>What is the major disadvantage of property over equity?<\/p>","o":[{"l":"A","h":"Liquidity risk"},{"l":"B","h":"Credit risk"},{"l":"C","h":"Withholding tax"},{"l":"D","h":"Inflation risk"}],"a":"A","e":"<p>Liquidity risk is a major disadvantage of direct property investment. Once bought - which takes time in itself - it can take a long time to sell the asset on. Equity, generally speaking, is much more liquid.<\/p>"},{"s":5,"n":60,"id":"4212395","q":"<p>Which characteristic distinguishes cryptocurrencies from traditional fiat currencies?<\/p>","o":[{"l":"A","h":"Cryptocurrencies must operate within centralized exchanges for security"},{"l":"B","h":"Cryptocurrencies rely on blockchain technology for transaction and ownership recording"},{"l":"C","h":"Cryptocurrencies eliminate any need for digital wallets due to their tangible form"},{"l":"D","h":"Only cryptocurrencies guarantee fixed interest rates on holdings"}],"a":"B","e":"<p>Cryptocurrencies utilize blockchain technology to control the issuance of currency and record transactions, differentiating them from fiat currencies that are typically backed by governments and operate through centralized systems.<\/p>"},{"s":5,"n":61,"id":"1045969","q":"<p>A Japanese exporter is concerned over volatility in USD/JPY and wants to hedge receivables due from sales made in the US. A large US dollar receipt is due to come in around six months' time and the amount is known now. <br/> What would you advise the exporter to do to hedge out this risk?<\/p>","o":[{"l":"A","h":"Buy USD/Sell JPY spot"},{"l":"B","h":"Sell USD/Buy JPY spot"},{"l":"C","h":"Sell USD/Buy JPY six-month forward"},{"l":"D","h":"Buy USD/Sell JPY six-month forward"}],"a":"C","e":"<p>A spot transaction is no good since the exporter does not have the US dollars to sell now.<\/p>"},{"s":5,"n":62,"id":"1001273","q":"<p>Which of the following statements about eurobonds is false?<\/p>","o":[{"l":"A","h":"They are usually issued by an institution"},{"l":"B","h":"They must be listed in London, Luxembourg and Brussels"},{"l":"C","h":"They are issued in a different country than the country of the currency they are issued in"},{"l":"D","h":"They are mostly in bearer form"}],"a":"B","e":"<p>Eurobonds are issued by corporates, governments and international institutions. They can be traded in many countries - not only London, Luxembourg and Brussels.<\/p>"},{"s":5,"n":63,"id":"1001246","q":"<p>Which of the following is true of call options but not true of warrants?<\/p>","o":[{"l":"A","h":"They are right to buy shares"},{"l":"B","h":"Shares are bought at a strike price"},{"l":"C","h":"On exercise they do not dilute the shareholding"},{"l":"D","h":"They are issued by the company whose shares they are"}],"a":"C","e":"<p>The exercise of a warrant leads to new shares being delivered to the holder, whereas the exercise of a call option leads to existing shares being delivered.<\/p>"},{"s":5,"n":64,"id":"1025268","q":"<p>Which of the following is the main benefit to an investor of holding cash in an instant access deposit account?<\/p>","o":[{"l":"A","h":"Capital is protected up to a certain amount"},{"l":"B","h":"Income is tax-free"},{"l":"C","h":"Returns are higher than most other types of investment"},{"l":"D","h":"Capital gains are low"}],"a":"A","e":"<p>Cash in an instant access account receives FSCS protection on balances up to £120,000 if the bank goes into liquidation.<\/p>"},{"s":5,"n":65,"id":"1001334","q":"<p>The forward adjustment is 200 pips for GBP / USD. By how much will that move the spot rate?<\/p>","o":[{"l":"A","h":"2"},{"l":"B","h":"0.2"},{"l":"C","h":"0.02"},{"l":"D","h":"0.002"}],"a":"C","e":"<p>The forward adjustment is measured in pips. A pip is the fifth figure of a quote. Cable is USD/GBP with GBP as the base currency. A movement of 200 pips would move the quote by 0.0200 US dollars.<\/p>"},{"s":5,"n":66,"id":"1023962","q":"<p>Which of the following is NOT true regarding equity warrants?<\/p>","o":[{"l":"A","h":"They can be issued with a bond in a detachable form"},{"l":"B","h":"On exercise warrants raise funds for the company"},{"l":"C","h":"The issuer can exercise the rights on the exercise date"},{"l":"D","h":"The holder of the warrant has no right to vote"}],"a":"C","e":"<p>The holder exercises the warrant, not the issuing company.<\/p>"},{"s":5,"n":67,"id":"1008096","q":"<p>What is the delivery time for a spot FX transaction after the trade date?<\/p>","o":[{"l":"A","h":"Two business days"},{"l":"B","h":"Five business days"},{"l":"C","h":"One business day"},{"l":"D","h":"Ten business days"}],"a":"A","e":"<p>Delivery for a spot FX transaction takes place within two business days.<\/p>"},{"s":5,"n":68,"id":"1001309","q":"<p>When is settlement for eurobond transactions?<\/p>","o":[{"l":"A","h":"One business day"},{"l":"B","h":"Two business days"},{"l":"C","h":"Five calendar days"},{"l":"D","h":"Three business days"}],"a":"B","e":"<p>Remember also that settlement for UK corporate debt is T+2 and for gilts is T+1.<\/p>"},{"s":5,"n":69,"id":"1001325","q":"<p>Which of the following is false of the currency markets?<\/p>","o":[{"l":"A","h":"Both spot transactions and forward transactions are offered"},{"l":"B","h":"All transactions are guaranteed by the International Currency Clearing House"},{"l":"C","h":"There is no fixed market place"},{"l":"D","h":"Brokers operate to link buyers with sellers"}],"a":"B","e":"<p>The currency market is a huge over-the-counter market - there is no fixed market place. Settlement-of-currency transactions are processed directly between the counterparties to the trade. There is no central counterparty operating in the markets protecting against default. The brokers operating in the currency markets are called 'money brokers'.<br/> Spot settlement for currency transactions is T+2.<\/p>"},{"s":5,"n":70,"id":"4212392","q":"<p>Which of the following is a potential risk associated with cryptomining?<\/p>","o":[{"l":"A","h":"Cryptomining ensures high liquidity in cryptocurrency markets"},{"l":"B","h":"Cryptomining is energy-intensive and requires extensive computer resources"},{"l":"C","h":"Cryptomining guarantees stable and predictable cryptocurrency values"},{"l":"D","h":"Cryptomining eliminates the need for digital wallets"}],"a":"B","e":"<p>Cryptomining is a resource-intensive process that requires significant computational power and energy consumption, which is a potential risk associated with the activity.<\/p>"},{"s":5,"n":71,"id":"1016210","q":"<p>On the creation of an ADR, in whose name is the document registered?<\/p>","o":[{"l":"A","h":"The issuing company's"},{"l":"B","h":"The depository's"},{"l":"C","h":"The holder's"},{"l":"D","h":"It is anonymous"}],"a":"B","e":"<p>An ADR, although a bearer document, is registered in the name of the depository who holds the shares.<\/p>"},{"s":5,"n":72,"id":"1078862","q":"<p>Which of the following is the best definition of the repo rate?<\/p>","o":[{"l":"A","h":"It is the difference between the amount of cash paid over at the start of the agreement and the amount paid over at the end expressed as a percentage"},{"l":"B","h":"It is the amount of cash paid over at the end of the agreement expressed as a fee"},{"l":"C","h":"It is the difference between the amount of collateral handed over at the start of the agreement and the amount paid over at the end expressed as a percentage"},{"l":"D","h":"It is an interest rate set by the central bank as a benchmark for all borrowing opportunities"}],"a":"A","e":"<p>The repo involves the movement of an amount of cash paid over by a participant at the start of the repo, which will be less than the amount paid over at the end of the repo period. The difference between the two amounts, expressed as a percentage, is the effective interest rate on the repo transaction. It is usually referred to as the 'repo rate'.<\/p>"},{"s":5,"n":73,"id":"1078443","q":"<p>T-bills, issued by the UK Debt Management Office, have all of the following characteristics except:<\/p>","o":[{"l":"A","h":"Their main purpose is to manage the liquidity needs of the government"},{"l":"B","h":"They have a life of less than a year"},{"l":"C","h":"They are issued at a discount"},{"l":"D","h":"They pay a fixed gross coupon"}],"a":"D","e":"<p>T-bills do not pay a coupon, instead they are issued at a discount and redeemed at face value - the difference between them being the interest received.<\/p>"},{"s":5,"n":74,"id":"1001096","q":"<p>Which of the following is NOT true of ADRs (American depositary receipts)?<\/p>","o":[{"l":"A","h":"They often represent a bundle of shares"},{"l":"B","h":"Ownership is registered with the depositary"},{"l":"C","h":"Dividends are paid in US dollars"},{"l":"D","h":"They can be traded in the UK exchanges"}],"a":"B","e":"<p>ADRs are not registered instruments. American depositary receipts are issued in the US as bearer documents, they pay US dollar dividends and can be traded anywhere.<\/p>"},{"s":5,"n":75,"id":"1002042","q":"<p>All of the following are true with respect to term repos except:<\/p>","o":[{"l":"A","h":"It is the sale and repurchase of a gilt"},{"l":"B","h":"May be used by GEMMs to cover a short-position"},{"l":"C","h":"Any market participant can enter into a gilt repo"},{"l":"D","h":"They are always for an overnight period"}],"a":"D","e":"<p>Term repos can have maturity dates in excess of overnight. The transaction will be subject to a formal legal agreement. The market standards for such agreements are contained in a code of best practice.<\/p>"},{"s":5,"n":76,"id":"1012812","q":"<p>Which of the following is true of the property market?<\/p><p><strong>I<\/strong><\/p><p>Property is generally indivisible<\/p><p><strong>II<\/strong><\/p><p>Availability of land can be restricted by legislation<\/p><p><strong>III<\/strong><\/p><p>Transaction costs tend to be lower than other forms of investment<\/p><p><strong>IV<\/strong><\/p><p>The market is completely unregulated<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"I, II and III"},{"l":"C","h":"II and IV"},{"l":"D","h":"III and IV"}],"a":"A","e":"<p>Buying property is more expensive than buying equities or bonds (e.g. solicitors and estate agents fees). The government heavily regulates the property market.<\/p>"},{"s":5,"n":77,"id":"1001336","q":"<p>A cross rate is defined as:<\/p>","o":[{"l":"A","h":"The difference between the bid and offer price"},{"l":"B","h":"The rate used in a swap agreement calculated as the difference between the current fixed and the variable interest rate"},{"l":"C","h":"The fee payable for participating in an uncrossing auction"},{"l":"D","h":"A non-US dollar foreign exchange rate between two countries"}],"a":"D","e":"<p>The cross rate is a non-US dollar exchange rate between two countries.<\/p>"},{"s":5,"n":78,"id":"1008095","q":"<p>Which of the following currencies is used to calculate cross rates for transactions from one unusual currency to another?<\/p>","o":[{"l":"A","h":"US dollars"},{"l":"B","h":"Euros"},{"l":"C","h":"Sterling"},{"l":"D","h":"Yen"}],"a":"A","e":"<p>The US dollar is the main global currency, allowing movement of funds from any currency to any other currency via the dollar.<\/p>"},{"s":5,"n":79,"id":"1055851","q":"<p>A eurobond has been immobilised. What does this imply?<\/p>","o":[{"l":"A","h":"As a bearer bond, eurobonds are often held with depositories, such as Euroclear and Clearstream. This is for added security."},{"l":"B","h":"This eurobond has been targeted by money launderers, and as such has been immobilised by the authorities awaiting further investigation."},{"l":"C","h":"It is impossible to trade in immobilised eurobonds."},{"l":"D","h":"The eurobond is being used by a pension fund to match the overall duration of its liabilities."}],"a":"A","e":"<p>As bearer documents, it is important that eurobonds are kept safe, and is often achieved by holding the bonds in depositories, particularly those maintained by Euroclear and Clearstream. Immobilisation does not mean that the bonds cannot be transferred in secondary market transactions.<\/p>"},{"s":5,"n":80,"id":"1015566","q":"<p>Which of the following is the best description of commercial paper?<\/p>","o":[{"l":"A","h":"A tradable bank account"},{"l":"B","h":"A credit rating provided by a third party"},{"l":"C","h":"A short-term, zero-coupon, corporate-issued security"},{"l":"D","h":"A document that can be converted into equity at any time, but until that time behaves as debt"}],"a":"C","e":"<p>Commercial paper is short-term unsecured debt.<\/p>"},{"s":5,"n":81,"id":"1001739","q":"<p>The sterling vs. dollar rate is currently $1.6085 - 1.6095. The sterling equivalent of converting $100,000 is:<\/p>","o":[{"l":"A","h":"£61,131"},{"l":"B","h":"£61,170"},{"l":"C","h":"£62,131"},{"l":"D","h":"£62,170"}],"a":"C","e":"<p>Converting $100,000 means that we sell the dollars and buy sterling. We would therefore sell our dollars at 1.6095:<br/> $100,000 / 1.6095 = £62,131<\/p>"},{"s":5,"n":82,"id":"1001109","q":"<p>ADR dividends are paid in what currency to the underlying investors?<\/p>","o":[{"l":"A","h":"US dollars"},{"l":"B","h":"Sterling"},{"l":"C","h":"The company's domestic currency"},{"l":"D","h":"A currency of the investor's choice"}],"a":"A","e":"<p>ADRs are quoted and paid for in US dollars. ADR dividends are also paid in US dollars.<\/p>"},{"s":5,"n":83,"id":"1048176","q":"<p>The current spot quote for cable is $1.7920 - $1.7930 per £1. The forward quote is 30 /28 pips. At what price can a client buy dollars forward?<\/p>","o":[{"l":"A","h":"1.7890"},{"l":"B","h":"1.7902"},{"l":"C","h":"1.7950"},{"l":"D","h":"1.7958"}],"a":"A","e":"<p>The spot rate needs to be adjusted by the forward rate adjustment. We subtract this adjustment from the spot rate. (1.7920-1.7930) - (0.0030-0.0028)<br/> = 1.7890-1.7902. When the pips are decreasing (30/28, as in this question), then we deduct the pips. When the pips are increasing (28/30), then we add the pips<br/> The rate to buy USD will be 1.7890. As a price taker, we must always take the worst end of the spread, ie, £1 buys fewer dollars<\/p>"},{"s":5,"n":84,"id":"1002130","q":"<p>Interest is usually paid on Eurobonds:<\/p>","o":[{"l":"A","h":"Quarterly"},{"l":"B","h":"Semi-annually"},{"l":"C","h":"Annually"},{"l":"D","h":"Never"}],"a":"C","e":"<p>Eurobonds usually pay GROSS interest on an annual basis. The coupon may be either fixed or floating.<\/p>"},{"s":6,"n":1,"id":"1048101","q":"<p>With regard to an open-ended investment company, where would you acquire shares?<\/p>","o":[{"l":"A","h":"Authorised corporate director"},{"l":"B","h":"Trustee"},{"l":"C","h":"Investment manager"},{"l":"D","h":"Depository"}],"a":"A","e":"<p>There is no secondary market with an OEIC, and if you wish to buy shares, you can only deal with the authorised corporate director.<\/p>"},{"s":6,"n":2,"id":"1023961","q":"<p>Synthetic finance uses which of the following?<\/p>","o":[{"l":"A","h":"Equities"},{"l":"B","h":"Commodities"},{"l":"C","h":"Repos"},{"l":"D","h":"Derivatives"}],"a":"D","e":"<p>Synthetic finance uses derivatives, i.e. an equity swap will be used to create a synthetic equity position.<\/p>"},{"s":6,"n":3,"id":"1007949","q":"<p>Which of the following products can be traded real-time, giving an investor the ability to track an index at low cost?<\/p>","o":[{"l":"A","h":"ETF"},{"l":"B","h":"ADR"},{"l":"C","h":"ICVC"},{"l":"D","h":"Unit trust"}],"a":"A","e":"<p>Exchange-traded funds issue shares that can be traded during market hours. Most ETFs track large indices, such as the FTSE 100 or S&amp;P 500. Some track the performance of a sector.<\/p>"},{"s":6,"n":4,"id":"1046698","q":"<p>Why would you participate in a long/short equity hedge fund strategy?<\/p>","o":[{"l":"A","h":"To take advantage of a falling market"},{"l":"B","h":"To take advantage of a rising market"},{"l":"C","h":"As a method of index tracking"},{"l":"D","h":"To profit regardless of market movement"}],"a":"D","e":"<p>Traditional 'absolute return' hedge funds attempt to profit regardless of the general movements of the market by carefully selecting a combination of asset classes, including derivatives, and by holding both long and short positions.<\/p>"},{"s":6,"n":5,"id":"1005165","q":"<p>An open-ended investment means that:<\/p>","o":[{"l":"A","h":"The investment has no fixed life"},{"l":"B","h":"The trust or company can expand if demand is high"},{"l":"C","h":"The investment carries a higher degree of risk"},{"l":"D","h":"Periodic subscriptions must be made"}],"a":"B","e":"<p>Unit trusts and open-ended investment companies will expand and contract in size, depending on investor demand for their units or shares.<\/p>"},{"s":6,"n":6,"id":"1014103","q":"<p>Which one of the following is not a service covered under prime brokerage?<\/p>","o":[{"l":"A","h":"Share buy-back advice"},{"l":"B","h":"Leveraged trade execution"},{"l":"C","h":"Cash management"},{"l":"D","h":"Securities lending and borrowing"}],"a":"A","e":"<p>The buying back of a company's shares is not a service offered under prime brokerage.<\/p>"},{"s":6,"n":7,"id":"1014107","q":"<p>When assets have been rehypothecated, to whom do they then belong?<\/p>","o":[{"l":"A","h":"Prime broker"},{"l":"B","h":"Customer"},{"l":"C","h":"Hedge fund"},{"l":"D","h":"Mortgage company"}],"a":"A","e":"<p>Rehypothecation is where the hedge fund hands over-hypothecated assets to the prime broker so that he can use them as collateral for a further finance. <br/> Effectively the assets have been hypothecated twice - rehypothecated.<\/p>"},{"s":6,"n":8,"id":"1005172","q":"<p>The net asset value of an investment trust is:<\/p>","o":[{"l":"A","h":"The share price"},{"l":"B","h":"The nominal value"},{"l":"C","h":"The share price less the nominal value"},{"l":"D","h":"The funds assets less its liabilities"}],"a":"D","e":"<p>Investment trusts trade in the secondary market - their price is fixed by supply and demand. They often trade at a discount to their net asset value.<\/p>"},{"s":6,"n":9,"id":"1014104","q":"<p>The best definition of prime brokerage is which one of the following?<\/p>","o":[{"l":"A","h":"A collection of core services offered by investment banks regarding acquisitions"},{"l":"B","h":"A collection of services that authorised firms can provide to their wealthy clients"},{"l":"C","h":"A collection of services that can be offered to companies that have been listed for the first time"},{"l":"D","h":"A collection of services provided by investment banks to their hedge fund clients"}],"a":"D","e":"<p>Prime brokerage is the term given to a collection of services provided by investment banks to their hedge fund clients.<\/p>"},{"s":6,"n":10,"id":"1015646","q":"<p>Which of the following are TRUE of hedge funds?<\/p>","o":[{"l":"A","h":"They are generally based offshore"},{"l":"B","h":"They offer lower fees than the index tracking funds"},{"l":"C","h":"They can be held within an ISA"},{"l":"D","h":"They are priced at NAV"}],"a":"A","e":"<p>There are no set rules on how hedge funds are priced, but most are based overseas.<\/p>"},{"s":6,"n":11,"id":"1042450","q":"<p>Which ONE of the following is an exchange-traded, open-ended fund?<\/p>","o":[{"l":"A","h":"ETF"},{"l":"B","h":"SICAV"},{"l":"C","h":"OEIC"},{"l":"D","h":"UCIT"}],"a":"A","e":"<p>An exchange-traded fund (ETF).<\/p>"},{"s":6,"n":12,"id":"1048099","q":"<p>With regard to a unit trust, who is appointed to protect the interests of the unit-holders?<\/p>","o":[{"l":"A","h":"The unit trust manager"},{"l":"B","h":"The beneficiaries"},{"l":"C","h":"The settlor"},{"l":"D","h":"The trustee"}],"a":"D","e":"<p>The trustee looks after the a
