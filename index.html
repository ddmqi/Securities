ssets of the fund and the interests of the beneficiaries.<\/p>"},{"s":6,"n":13,"id":"1020487","q":"<p>From which of the following organisations would an investor normally buy shares in an exchange-traded fund?<\/p>","o":[{"l":"A","h":"Trustee"},{"l":"B","h":"Depository"},{"l":"C","h":"Broker"},{"l":"D","h":"Manager"}],"a":"C","e":"<p>Shares in an ETF would normally be purchased from a broker as they trade on exchange.<\/p>"},{"s":6,"n":14,"id":"1017609","q":"<p>In which of the following ways are commercial property returns typically measured?<\/p>","o":[{"l":"A","h":"Rental yields"},{"l":"B","h":"Net profits"},{"l":"C","h":"Gross profits"},{"l":"D","h":"Return on equity"}],"a":"A","e":"<p>Commercial property valuations are generally based on the net present value of rental yields.<\/p>"},{"s":6,"n":15,"id":"1001837","q":"<p>Which of the following is true regarding hedge funds?<\/p>","o":[{"l":"A","h":"They may only invest in a narrow range of investments"},{"l":"B","h":"They are highly-regulated for protecting investors"},{"l":"C","h":"They usually charge high performance fees"},{"l":"D","h":"They may only invest their client money in sophisticated arbitrage trades"}],"a":"C","e":"<p>Hedge funds are not authorised funds. As such they are not allowed to advertise to investors.<\/p>"},{"s":6,"n":16,"id":"1014102","q":"<p>Prime brokerage relates to the provision of services by investment banks to whom?<\/p>","o":[{"l":"A","h":"Other investment banks"},{"l":"B","h":"Hedge fund clients"},{"l":"C","h":"High net worth individuals"},{"l":"D","h":"Issuers of eurobonds"}],"a":"B","e":"<p>Hedge fund clients will benefit from the services that prime brokerage covers.<\/p>"},{"s":6,"n":17,"id":"1001963","q":"<p>Which of the following is false of a hedge fund?<\/p>","o":[{"l":"A","h":"They are unregulated"},{"l":"B","h":"They are always open-ended"},{"l":"C","h":"They may take short positions"},{"l":"D","h":"They may take long positions"}],"a":"B","e":"<p>Hedge funds may be open- or closed-ended. Generally they are open-ended arrangements.<\/p>"},{"s":6,"n":18,"id":"1014105","q":"<p>Which one of the following is NOT a service of prime brokerage in relation to hedge funds?<\/p>","o":[{"l":"A","h":"Core settlement"},{"l":"B","h":"Securities lending and borrowing"},{"l":"C","h":"Leveraged trade execution"},{"l":"D","h":"Formulating investment strategies"}],"a":"D","e":"<p>The managers of a hedge fund or alternative asset management vehicle are primarily concerned with formulating and executing investment strategies. The administration of the fund's account is usually left to the prime broker, which has the expertise and organisational systems to offer more specialised and supportive services, such as:<br/> Securities lending and borrowing<br/> Leveraged trade execution<br/> Cash management<br/> Core settlement<br/> Custody<\/p>"},{"s":6,"n":19,"id":"1078869","q":"<p>An investor is looking to buy into an unregulated collective investment scheme (UCIS) and speaks to their adviser, which of the following observations would be correct if made by the adviser?<\/p>","o":[{"l":"A","h":"Any income is not guaranteed but capital is guaranteed within the fund"},{"l":"B","h":"Neither capital nor returns are guaranteed within the fund"},{"l":"C","h":"Any capital is not guaranteed but income is guaranteed within the fund"},{"l":"D","h":"Both capital and returns are guaranteed within the fund"}],"a":"B","e":"<p>As with other investments in a UCIS scheme there is no guarantee of capital or income return.<\/p>"},{"s":6,"n":20,"id":"1005174","q":"<p>An authorised corporate director is:<\/p>","o":[{"l":"A","h":"Responsible for the management of an OEIC (ICVC)"},{"l":"B","h":"Responsible for protecting the assets in an OEIC (ICVC)"},{"l":"C","h":"Responsible for the management of a unit trust"},{"l":"D","h":"Responsible for protecting the assets in a unit trust"}],"a":"A","e":"<p>An authorised corporate director is responsible for the management of an OEIC (also known as an ICVC). The depositary is responsible for protecting the assets in an OEIC.<\/p>"},{"s":6,"n":21,"id":"1020484","q":"<p>How are shares in an open-ended investment company MOST LIKELY to be priced?<\/p>","o":[{"l":"A","h":"Single-pricing based on supply and demand for the shares"},{"l":"B","h":"Bid/Offer spread incorporating the fees and administration costs of the fund"},{"l":"C","h":"Single-pricing based on the value of the underlying shares"},{"l":"D","h":"Single-pricing based on the market value of the shares which are then discounted"}],"a":"C","e":"<p>'Single-pricing based on the value of the underlying shares' is the best answer. OEICs are usually based on single-pricing. Same price for buying and selling a share. Unit trusts can be priced either one-way (as OEICs) or two-way with a bid-offer spread quote.<\/p>"},{"s":6,"n":22,"id":"1001951","q":"<p>Which ONE of the following BEST describes a hedge fund?<\/p>","o":[{"l":"A","h":"Options fund"},{"l":"B","h":"Umbrella fund"},{"l":"C","h":"Unregulated fund"},{"l":"D","h":"Passive fund"}],"a":"C","e":"<p>A hedge fund is an unregulated fund. These cannot therefore be freely marketed to private customers.<\/p>"},{"s":6,"n":23,"id":"1052311","q":"<p>Which one of the following is most likely to levy performance-related fees on the investor?<\/p>","o":[{"l":"A","h":"OEIC"},{"l":"B","h":"Exchange-traded funds"},{"l":"C","h":"Unit trusts"},{"l":"D","h":"Hedge funds"}],"a":"D","e":"<p>Hedge funds typically levy performance fees which the investor pays if certain performance levels are reached. Performance fees can be substantial.<\/p>"},{"s":6,"n":24,"id":"1046176","q":"<p>What of the following is NOT a benefit of indirect property investment?<\/p>","o":[{"l":"A","h":"Higher Returns"},{"l":"B","h":"Lower minimum investment requirement"},{"l":"C","h":"No maintenance"},{"l":"D","h":"Higher Liquidity"}],"a":"A","e":"<p>Investment in a property company or fund means you can get in and out a lot quicker than holding physically (direct). Property itself tends to require a lot higher intial capital investment, even if financed with a high LTV mortgage. Returns could be higher or lower, depending upon the investment vehicle chosen.<\/p>"},{"s":6,"n":25,"id":"1020481","q":"<p>Who can an investor buy units in a unit trust from?<\/p>","o":[{"l":"A","h":"Trustee"},{"l":"B","h":"Manager"},{"l":"C","h":"Market maker"},{"l":"D","h":"Exchange"}],"a":"B","e":"<p>Units in a unit trust have to be bought from a unit trust manager or through a fund supermarket.<\/p>"},{"s":6,"n":26,"id":"1005164","q":"<p>Investment trusts are normally:<\/p>","o":[{"l":"A","h":"Trusts"},{"l":"B","h":"Partnerships"},{"l":"C","h":"Unlimited companies"},{"l":"D","h":"Limited companies"}],"a":"D","e":"<p>Investment trusts are companies that are traded on the LSE. As such, they are regulated by the Companies Act and the LSE rules.<\/p>"},{"s":6,"n":27,"id":"1014110","q":"<p>Why might a hedge fund wish to use a prime broker?<\/p>","o":[{"l":"A","h":"All hedge funds have to use a prime broker as part of their business"},{"l":"B","h":"The prime broker provides a securities clearing facility"},{"l":"C","h":"A more tailored and bespoke range of services is offered to them"},{"l":"D","h":"The prime broker offers acquisition advice to hedge funds"}],"a":"C","e":"<p>Prime brokerage is the term given to a collection of services provided by investment banks to their hedge fund clients.<\/p>"},{"s":6,"n":28,"id":"1014106","q":"<p>What does the financial term rehypothecation refer to?<\/p>","o":[{"l":"A","h":"A prime broker might administer any corporate actions on behalf of the asset manager"},{"l":"B","h":"A prime broker might pledge hypothecated client-owned securities as collateral for a brokerage's bank loan"},{"l":"C","h":"A prime broker might arrange for the appropriate shares to be borrowed to cover a hedge fund's short-position"},{"l":"D","h":"A prime broker might arrange for the sale of securities owned by a hedge fund for cash"}],"a":"B","e":"<p>A prime broker may hold collateral relating to a hedge fund's portfolio or a charge over such assets; rehypothecation means that the prime broker might also require a right to re-charge the customer's assets which are subject to the security.<\/p>"},{"s":7,"n":1,"id":"1001122","q":"<p>Which of the following two comments apply to an offer for subscription?<\/p><p><strong>I<\/strong><\/p><p>It is made by an issuing house, offering securities for which it has subscribed<\/p><p><strong>II<\/strong><\/p><p>It is made by the company<\/p><p><strong>III<\/strong><\/p><p>It raises money for the company<\/p><p><strong>IV<\/strong><\/p><p>It reduces the nominal value per share<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"I and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"II and IV"}],"a":"C","e":"<p>An offer for subscription is a method of raising equity capital where the company offers shares DIRECTLY to the investing community. The answer to 'I and III' describes an offer for sale.<\/p>"},{"s":7,"n":2,"id":"1014129","q":"<p>Which one of the following would not issue supranational bonds?<\/p>","o":[{"l":"A","h":"European Investment Bank"},{"l":"B","h":"World Bank"},{"l":"C","h":"Asian Development Bank"},{"l":"D","h":"Federal Reserve Bank"}],"a":"D","e":"<p>The Federal Reserve Bank implements monetary policy, supervises and regulates US financial institutions and helps to maintain various US payment systems.<\/p>"},{"s":7,"n":3,"id":"1023952","q":"<p>A firm involved in a base deal with a greenshoe will be able to do which of the following?<\/p>","o":[{"l":"A","h":"Issue more shares if there is sufficient demand"},{"l":"B","h":"Decrease the number of shares issued to the market"},{"l":"C","h":"Obtain shares at a premium from the issuing company"},{"l":"D","h":"List the shares on more than one exchange"}],"a":"A","e":"<p>A greenshoe deal (or an over-allotment option) allows the lead manager to obtain more shares from the issuing company if there is sufficient demand from the market.<\/p>"},{"s":7,"n":4,"id":"4027995","q":"<p>A bond that has been issued on a monoline basis that also includes potential tax breaks for holders of the bond is most likely to be what type of bond?<\/p>","o":[{"l":"A","h":"Agency Bond"},{"l":"B","h":"Municipal Bond"},{"l":"C","h":"MTN"},{"l":"D","h":"Eurobond"}],"a":"B","e":"<p>Municipalities in the US issue municipal bonds. These municipal bonds are often tax-efficient, particularly for investors who reside in that municipality. Municipal bonds are usually guaranteed by a third party, known in the US market as a monoline insurer, and their credit quality may be enhanced by such a guarantee, which enables the municipality to secure funds on more advantageous terms.<\/p>"},{"s":7,"n":5,"id":"1001809","q":"<p>Equities are being issued by tender. The minimum offer price in the prospectus is 200p. You offer 300p. The maximum price offered is 350p. The common strike price set by the company is 245p. What price will you pay?<\/p>","o":[{"l":"A","h":"200p"},{"l":"B","h":"245p"},{"l":"C","h":"300p"},{"l":"D","h":"350p"}],"a":"B","e":"<p>All shareholders applying for shares pay the common strike price.<\/p>"},{"s":7,"n":6,"id":"1016212","q":"<p>Where a lead manager canvasses investors to assess an appropriate price and volume for an issue, it is referred to as:<\/p>","o":[{"l":"A","h":"Tender offer"},{"l":"B","h":"Bookbuilding"},{"l":"C","h":"Rights issue"},{"l":"D","h":"Bought deal"}],"a":"B","e":"<p>The lead manager (bookrunner) is building a book, looking at prospective investors and will create a demand curve based on the responses received. From this they will deduce a suitable price and volume.<\/p>"},{"s":7,"n":7,"id":"1026890","q":"<p>Stabilisation is used for which of the following purposes?<\/p>","o":[{"l":"A","h":"To create a false impression of the issue's attractiveness"},{"l":"B","h":"To dissuade hedge funds from 'shorting' the issue"},{"l":"C","h":"To prevent short-term trading opportunities"},{"l":"D","h":"To reduce short-term volatility in a share price close to inception that is unrelated to the issuers fundamentals"}],"a":"D","e":"<p>Stabilisation is a process in which a lead manager can enter the market to purchase the shares of a new issue in an attempt to reduce immediate volatility and maintain the share price within a certain range.<\/p>"},{"s":7,"n":8,"id":"1015996","q":"<p>Which one of the following will guarantee the proceeds raised by a company announcing a new issue of securities?<\/p>","o":[{"l":"A","h":"The brokers"},{"l":"B","h":"The company"},{"l":"C","h":"The underwriters"},{"l":"D","h":"The bankers"}],"a":"C","e":"<p>Underwriters may agree to guarantee the proceeds raised by a new issue.<\/p>"},{"s":7,"n":9,"id":"1014119","q":"<p>Which one of following best describes a bookrunner?<\/p>","o":[{"l":"A","h":"The main underwriter in equity and debt issues"},{"l":"B","h":"An investor increasing their shareholding in a company"},{"l":"C","h":"A company issuing a prospectus relating to a share issue"},{"l":"D","h":"A firm of market makers quoting bid and offer prices"}],"a":"A","e":"<p>A bookrunner is the main underwriter in equity and debt issues.<\/p>"},{"s":7,"n":10,"id":"1078877","q":"<p>Claire is asked if she would like to participate in the purchase of shares of a company in a selective marketing process. Who would have most likely made this approach?<\/p>","o":[{"l":"A","h":"A financial intermediary"},{"l":"B","h":"A marketing consultancy firm"},{"l":"C","h":"An agent of a cold calling firm"},{"l":"D","h":"An underwriter"}],"a":"A","e":"<p>In placing its shares, a company simply markets the issue directly to a broker, an issuing house or other financial institution, which in turn places the shares with selected clients. Although the least democratic of the three IPO methods, given that the general public does not initially have access to the issue, a placing is the least expensive, as the prospectus accompanying the issue is less detailed than that required for the other two methods and no underwriting is required. A placing is often referred to as a selective marketing, because the financial intermediary is selecting the clients to whom the offer is directed.<\/p>"},{"s":7,"n":11,"id":"1016216","q":"<p>A company wishes to raise capital through the issuance of shares through an IPO, but does not wish to lose control of the company. Which of the following would be most suitable?<\/p>","o":[{"l":"A","h":"Float 5% of issued share capital on the official list as convertible preference shares"},{"l":"B","h":"Issue 5% of issued share capital OTC as ordinary shares"},{"l":"C","h":"Float 5% of issued share capital on AIM as cumulative preference shares"},{"l":"D","h":"Issue unsecured corporate loan stock on the LSE"}],"a":"C","e":"<p>To be listed on the official list, a company would need to place no less that 10% of the issued share capital in the public hands. This restriction does not apply to AIM. Ordinary shares carry with them a right to vote, which would dilute the control of the directors of the company. Corporate loans are not shares.<\/p>"},{"s":7,"n":12,"id":"1016220","q":"<p>To which of the following does the term over-allotment option refer?<\/p>","o":[{"l":"A","h":"Underwriting"},{"l":"B","h":"Issuing fewer shares"},{"l":"C","h":"Issuing more shares"},{"l":"D","h":"Best efforts"}],"a":"C","e":"<p>Over-allotment option (or Greenshoe option) refers to the ability for a lead manager to call for more shares to issue during an IPO.<\/p>"},{"s":7,"n":13,"id":"1014116","q":"<p>By what maximum percentage can an issuing company allow the underwriters to increase the size of the offering if demand is high?<\/p>","o":[{"l":"A","h":"5%"},{"l":"B","h":"10%"},{"l":"C","h":"15%"},{"l":"D","h":"20%"}],"a":"C","e":"<p>In certain circumstances an issuing company can instruct the underwriters to increase the size of the offering by a maximum of 15% if demand is high enough.<\/p>"},{"s":7,"n":14,"id":"4028000","q":"<p><\/p><p>A company is seeking a dual listing in both the UK and USA for which a syndicate has been formed. The UK firm appointed by the company to handle the UK listing would have which role within the syndicate?<\/p>","o":[{"l":"A","h":"Lead manager"},{"l":"B","h":"Co-lead manager"},{"l":"C","h":"Co-manager"},{"l":"D","h":"Book runner"}],"a":"B","e":"<p>Based on the CISI manual, the best answer is Co-Lead. A large share issue might have more than one lead manager, for example with responsibilities split by geographical areas -  one lead manager for the UK and another for the US. Lead managers (and co-lead managers) are appointed by the issuing company. <\/p>"},{"s":7,"n":15,"id":"1078879","q":"<p>Corporate governance can be described as a set of rules, laws and customs which guide a company. Which roles within a company should ideally be split between different individuals?<\/p>","o":[{"l":"A","h":"The Chairperson and the controlling shareholder"},{"l":"B","h":"The non-executive director and the head of the remuneration committee"},{"l":"C","h":"The chair and the chief executive"},{"l":"D","h":"The chief executive officer and the chief risk officer"}],"a":"C","e":"<p>Corporate governance is often described as the set of laws, rules, customs and both external and internal policies that guide how a company is directed and managed. Examples include, reducing the influence of a single individual by splitting the roles of chairman and chief executive of the company, appointing a reasonable proportion of non-executive directors (NEDs) to the board, and having a suitably qualified finance director.<\/p>"},{"s":7,"n":16,"id":"1014121","q":"<p>By what other term is a follow-on offering also known as?<\/p>","o":[{"l":"A","h":"Primary offer"},{"l":"B","h":"Rights issue"},{"l":"C","h":"Secondary offer"},{"l":"D","h":"Scrip issue"}],"a":"C","e":"<p>A follow-on offer is also known as a secondary offer.<\/p>"},{"s":7,"n":17,"id":"1078875","q":"<p>In an offer for sale to whom does the company sell its shares?<\/p>","o":[{"l":"A","h":"Directly to the issuing house"},{"l":"B","h":"Directly to the general public"},{"l":"C","h":"To the general public through an issuing house which acts as agent taking fees only"},{"l":"D","h":"To qualified investors only through an issuing house which acts as principal"}],"a":"A","e":"<p>The company seeking to sell the shares in an offer for sale will approach an issuing house (usually an investment bank) that specialises in approaching potential shareholders and preparing the necessary documentation. The issuing company sells its shares to the issuing house (usually an investment bank), which then invites applications from the public at a slightly higher price than the issuing house has paid and based on a detailed prospectus, known as the offer document.<\/p>"},{"s":7,"n":18,"id":"1001144","q":"<p>Stabilisation is best described by which of the following?<\/p>","o":[{"l":"A","h":"A suspension of trading of a newly-issued security when the price falls beyond a threshold percentage"},{"l":"B","h":"The opening hours of a newly-issued security are restricted to create greater liquidity"},{"l":"C","h":"An FCA requirement for the issuing company to buy back newly-issued securities if the price declines beyond a threshold percentage"},{"l":"D","h":"The price in the aftermarket is supported by the manager of the new issue buying back securities"}],"a":"D","e":"<p>Stabilisation has strict rules from the FCA. It is a support mechanism by the manager of a new issue for the price of the security.<\/p>"},{"s":7,"n":19,"id":"1015981","q":"<p>Who is responsible primarily for forming a syndicate group when a company wishes to issue a large volume of new shares?<\/p>","o":[{"l":"A","h":"The underwriter"},{"l":"B","h":"The company"},{"l":"C","h":"The issuing house"},{"l":"D","h":"The lead manager"}],"a":"D","e":"<p>The lead manager or broker (often the underwriter too) is the connection between the company and the market that intends to buy the shares. It is this member of the team who would form a syndicate - possibly by taking on the role of a bookrunner.<br/> The underwriter is responsible for guaranteeing a certain amount of capital is raised during the issue.<br/> Although the sponsor and the lead could be from the same investment bank, they would fulfil their roles independently.<\/p>"},{"s":7,"n":20,"id":"1001123","q":"<p>All of the following are true of stabilisation except:<\/p>","o":[{"l":"A","h":"It is a price supporting mechanism for new issues"},{"l":"B","h":"It is permitted under certain circumstances"},{"l":"C","h":"It is performed by the lead manager of the issue"},{"l":"D","h":"It regulates the timing of any announcement regarding IPO details"}],"a":"D","e":"<p>Stabilisation is used to support the price of new issues; it is permitted under strictly controlled circumstances.<\/p>"},{"s":7,"n":21,"id":"1032948","q":"<p>The process of issuing US T-bonds is through a:<\/p>","o":[{"l":"A","h":"Bid"},{"l":"B","h":"Non-competitive auction"},{"l":"C","h":"Bookbuild"},{"l":"D","h":"Single priced auction"}],"a":"D","e":"<p>US T-bonds are issued by way of a single priced auction or 'Dutch Auction' where the investors are required to bid a yield, the yield implies the price the investor is willing to pay.<\/p>"},{"s":7,"n":22,"id":"1078445","q":"<p>Who decides whether a company is appropriate to apply for a quotation on an exchange?<\/p>","o":[{"l":"A","h":"Listing agent"},{"l":"B","h":"Broker"},{"l":"C","h":"The regulator"},{"l":"D","h":"Company secretary"}],"a":"A","e":"<p>The listing agent is responsible, amongst other duties, for warranting to the exchange that a particular company is appropriate.<\/p>"},{"s":7,"n":23,"id":"1001695","q":"<p>Which of the following events will result in an issuer of shares receiving cash?<\/p><p><strong>I<\/strong><\/p><p>Pre-emptive rights issue<\/p><p><strong>II<\/strong><\/p><p>Secondary market sale<\/p><p><strong>III<\/strong><\/p><p>Placing<\/p><p><strong>IV<\/strong><\/p><p>Capitalisation issue<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"II and III"},{"l":"C","h":"I and III"},{"l":"D","h":"III and IV"}],"a":"C","e":"<p>A capitalisation issue is another term for a bonus/scrip issue where the company issues new shares to existing shareholders free of charge. In secondary market sales it is the current owner not the issuer who receives the cash.<\/p>"},{"s":7,"n":24,"id":"1078446","q":"<p>Which of the following is a benefit of marketing your shares on a junior market of the exchange rather than a senior official list?<\/p>","o":[{"l":"A","h":"Lower profile"},{"l":"B","h":"Less liquidity"},{"l":"C","h":"Lower regulatory burden"},{"l":"D","h":"Order book trading"}],"a":"C","e":"<p>The obligations imposed on the junior markets are lower than those imposed on fully-listed companies. <br/> Both markets have access to order-driven systems.<\/p>"},{"s":7,"n":25,"id":"1053873","q":"<p>An underwriter guarantees to purchase any stock of company A that fails to be taken-up in an IPO. At what price is the underwriter likely to make this purchase if called on to do so?<\/p>","o":[{"l":"A","h":"The underwriter will need to pay the issue price to ensure all shareholders are treated equally"},{"l":"B","h":"Any surplus shares will be taken-up at a premium to the issue price to ensure the company raises sufficient capital"},{"l":"C","h":"The shares will be taken-up at a discount to the issue price, and implied in that discount is the underwriter's fee"},{"l":"D","h":"The price of the share on the market after issue will determine the price the underwriter will pay"}],"a":"C","e":"<p>The underwriter has to agree the issuance price and then the underwriters guarantee to buy is generally at a discount to the share price at which the shares are offered to the public.<\/p>"},{"s":7,"n":26,"id":"1079696","q":"<p>Which of the following are obligations of listing on a main market?<\/p>","o":[{"l":"A","h":"Financial reporting and corporate governance"},{"l":"B","h":"Corporate governance and ethics"},{"l":"C","h":"Ethics and reporting of directors' salaries"},{"l":"D","h":"Financial reporting and reporting of directors' salaries"}],"a":"A","e":"<p>An issuer that is planning to have its securities listed will have to accept certain obligations. Like the requirements for advisers, the precise obligations can vary across jurisdictions, but they always include obligations in relation to good corporate governance and regular reporting.<\/p>"},{"s":7,"n":27,"id":"1014127","q":"<p>Who are municipal bonds best suited for?<\/p>","o":[{"l":"A","h":"Canadian investors"},{"l":"B","h":"US investors living in the issuing state"},{"l":"C","h":"Any US investors"},{"l":"D","h":"Any US investor living in the UK"}],"a":"B","e":"<p>Municipal bonds are best suited for US investors living in the municipality or state that issues the bond. This is because people living in the region are often not taxed on the coupon paid by such bonds.<\/p>"},{"s":7,"n":28,"id":"1078455","q":"<p>In order for a company to list equity on a junior market, what is the market capitalisation required?<\/p>","o":[{"l":"A","h":"£900,000"},{"l":"B","h":"£30,000,000"},{"l":"C","h":"£200,000"},{"l":"D","h":"There is no limit"}],"a":"D","e":"<p>There is no minimum market capitalisation for admission to a junior market.<\/p>"},{"s":7,"n":29,"id":"1015549","q":"<p>When an issue in the eurobond market is achieved through a placing, the mandate to issue the bond is awarded to the:<\/p>","o":[{"l":"A","h":"Management group"},{"l":"B","h":"Lead manager"},{"l":"C","h":"Management and the lead manager"},{"l":"D","h":"Issuer jointly with the management group"}],"a":"B","e":"<p>The mandate is awarded to the lead manager.<\/p>"},{"s":7,"n":30,"id":"1001147","q":"<p>With regard to companies issuing share capital, which of the following is true?<\/p>","o":[{"l":"A","h":"At the time of issue, the nominal value must be paid in full"},{"l":"B","h":"At the time of issue, the nominal value may be partly paid. The remainder can be paid at a later date at the investor's option"},{"l":"C","h":"Public limited companies' shares can be, but not must be, partly paid on issue. The company can decide when the remaining nominal value is paid"},{"l":"D","h":"Public limited companies' shares can be issued for free. The company can make a call for the shares to be paid-up at a later date"}],"a":"C","e":"<p>At least 10% of the nominal value of shares is paid upon issuance for a public limited company. If the shares issued are partly-paid, the company will make a call on the remaining nominal value at a later date.<\/p>"},{"s":7,"n":31,"id":"1001152","q":"<p>Which of the following is not normally underwritten?<\/p>","o":[{"l":"A","h":"Offer for sale"},{"l":"B","h":"Bought deal"},{"l":"C","h":"Rights issue"},{"l":"D","h":"Placing"}],"a":"D","e":"<p>Although the least democratic of the three IPO methods, given that the general public does not initially have access to the issue, a placing is the least expensive, as the prospectus accompanying the issue is less detailed than that required for the other two methods and no underwriting is required.<\/p>"},{"s":7,"n":32,"id":"1002150","q":"<p>When a company issues shares direct to the public this is known as?<\/p>","o":[{"l":"A","h":"Offer for sale"},{"l":"B","h":"Offer for subscription"},{"l":"C","h":"Rights issue"},{"l":"D","h":"Placing"}],"a":"B","e":"<p>A rights issue would be to existing shareholders and not to the public.<\/p>"},{"s":7,"n":33,"id":"4027314","q":"<p>A listed company is required to produce audited accounts at least:<\/p>","o":[{"l":"A","h":"Annually"},{"l":"B","h":"Semi-annually"},{"l":"C","h":"Quarterly"},{"l":"D","h":"At a reasonably frequency"}],"a":"A","e":"<p>A listed company is required to produce audited accounts on at least an annual basis.  This is true of all companies as per CA'06.<\/p><p>Listed companies are also required to produce interim reports as a condition of listing.<\/p>"},{"s":7,"n":34,"id":"1001284","q":"<p>When are the rate and intervals of interest payments determined for corporate bonds?<\/p>","o":[{"l":"A","h":"At the issuing company's AGM"},{"l":"B","h":"The London Stock Exchange will determine the rate and interval"},{"l":"C","h":"The issuing company's secretary will determine the rate and interval"},{"l":"D","h":"At the issuance of the bond"}],"a":"D","e":"<p>The interest rate and intervals are established at the issuance. In the case of a floating rate, the interest rate will be determined by a published interest rate at the issuance, for example SONIA.<\/p>"},{"s":7,"n":35,"id":"1001930","q":"<p>What best describes a placing?<\/p>","o":[{"l":"A","h":"Shares are bought by an issuing house that is re-selling them to the investing community"},{"l":"B","h":"Shares are offered through a broker to a limited range of clients"},{"l":"C","h":"Shares are offered directly to the general public"},{"l":"D","h":"Shares are offered to existing shareholders at a discount to the current market price"}],"a":"B","e":"<p>A placing is 'selected marketing', with shares being made available to the selected clients of a broker/issuing house.<br/> \"Shares are bought by an issuing house that is re-selling them to the investing community\", is more a description of a bought deal.<br/> \"Shares are offered directly to the general public\", describes the structure of an offer for subscription.<br/> \"Shares are offered to existing shareholders at a discount to the current market price\", describes a rights issue<\/p>"},{"s":7,"n":36,"id":"1015657","q":"<p>If the market were to assess the free float of a company, it would calculate the number of shares in the hands of:<\/p>","o":[{"l":"A","h":"The company"},{"l":"B","h":"The public"},{"l":"C","h":"Major shareholders"},{"l":"D","h":"Directors"}],"a":"B","e":"<p>The free float of a company describes the shares held by the public.<\/p>"},{"s":7,"n":37,"id":"1007907","q":"<p>Which of the following is not required of a company seeking a listing on the London Stock Exchange?<\/p>","o":[{"l":"A","h":"Must have been trading for at least three years"},{"l":"B","h":"Must release a minimum free float"},{"l":"C","h":"Must agree to comply with continuing obligations"},{"l":"D","h":"Must be a private limited company"}],"a":"D","e":"<p>Companies seeking a listing must be PUBLIC limited companies.<\/p>"},{"s":7,"n":38,"id":"1001145","q":"<p>The difference between offers for subscription and offers for sale is best described as:<\/p>","o":[{"l":"A","h":"Both methods involve an issuing house but an offer for subscription is always at a fixed price"},{"l":"B","h":"An offer for sale involves an issuing house while an offer for subscription does not"},{"l":"C","h":"An offer for subscription involves an issuing house, but an offer for sale does not"},{"l":"D","h":"Both methods involve an issuing house, but an offer for sale is always at a fixed price"}],"a":"B","e":"<p>Both methods can be either a fixed price or priced by tender. The offer for sale involves an issuing house or lead manager. This role is normally performed by an investment bank.<\/p>"},{"s":7,"n":39,"id":"1015567","q":"<p>What is the term used for a eurobond issue where the issuer reaches a firm agreement with the lead manager to purchase the entire issue?<\/p>","o":[{"l":"A","h":"Fixed price re-offer"},{"l":"B","h":"Stabilised offer"},{"l":"C","h":"Bought deal"},{"l":"D","h":"Syndicated deal"}],"a":"C","e":"<p>This is a description of a bought deal.<\/p>"},{"s":7,"n":40,"id":"1002099","q":"<p>Which of the following is a primary market activity?<\/p>","o":[{"l":"A","h":"Offer for subscription"},{"l":"B","h":"Director sale of own shares"},{"l":"C","h":"Director purchase of shares"},{"l":"D","h":"Portfolio trade"}],"a":"A","e":"<p>An offer for subscription is an example of a transaction that releases new shares into the market.<\/p>"},{"s":7,"n":41,"id":"1015548","q":"<p>Commission on an underwritten issue is calculated on the:<\/p>","o":[{"l":"A","h":"Value of shares taken-up by the underwriter"},{"l":"B","h":"Value of shares underwritten by the underwriter"},{"l":"C","h":"Number of shares taken-up by the underwriter"},{"l":"D","h":"Number of shares underwritten by the underwriter"}],"a":"B","e":"<p>The fee is decided up front before the share issue takes place.<\/p>"},{"s":7,"n":42,"id":"1014124","q":"<p>From the issuer's perspective, which one of the following is not a stage associated with a follow-on offer?<\/p>","o":[{"l":"A","h":"The sale of securities"},{"l":"B","h":"The decision"},{"l":"C","h":"The purchase of securities"},{"l":"D","h":"The preparation of the prospectus"}],"a":"C","e":"<p>A follow-on offer relates to the sale of securities by the issuer.<\/p>"},{"s":7,"n":43,"id":"1001151","q":"<p>Which of the following would an underwriter least like to occur?<\/p>","o":[{"l":"A","h":"Share price rising"},{"l":"B","h":"Share price falling"},{"l":"C","h":"Share price unchanged"},{"l":"D","h":"Indifferent pricing"}],"a":"B","e":"<p>Since the underwriter has a potential obligation to buy any new shares that are not taken-up at a fixed price, they would least like to see a fall in the market value of the shares.<\/p>"},{"s":7,"n":44,"id":"1002163","q":"<p>Which of the following methods of equity issuance is also called 'selective marketing'?<\/p>","o":[{"l":"A","h":"Introduction"},{"l":"B","h":"Placing"},{"l":"C","h":"Offer for sale"},{"l":"D","h":"Rights issues"}],"a":"B","e":"<p>Shares issued via a placing are only offered to select investors such as financial institutions and high net worth individuals.<\/p>"},{"s":7,"n":45,"id":"1023950","q":"<p>In a large listing involving a syndicate, which of the following would be responsible for coordinating the overall level of demand across the syndicate?<\/p>","o":[{"l":"A","h":"Sponsor"},{"l":"B","h":"Lead manager"},{"l":"C","h":"Corporate broker"},{"l":"D","h":"Co-manager"}],"a":"B","e":"<p>A syndicate will be involved in a large issue of shares to the market and will contain investment banks and stockbrokers.<br/> The issue is coordinated by the lead manager who coordinates the level of demand across the syndicate. This role is is commonly referred to as the book runner.<\/p>"},{"s":7,"n":46,"id":"1015978","q":"<p>Which one of the following would a syndicate group be least likely to market new shares to?<\/p>","o":[{"l":"A","h":"Retail clients"},{"l":"B","h":"Insurance companies"},{"l":"C","h":"Asset management firms"},{"l":"D","h":"The UK government"}],"a":"D","e":"<p>A syndicate group is not likely to market new shares to the UK government.<\/p>"},{"s":7,"n":47,"id":"1014128","q":"<p>Why are municipal bonds issued in the US?<\/p>","o":[{"l":"A","h":"To help states and local governments raise money"},{"l":"B","h":"To help the central government raise money"},{"l":"C","h":"To help companies raise money"},{"l":"D","h":"To help investors raise money"}],"a":"A","e":"<p>US states or local government agencies may issue municipal bonds to help raise money.<\/p>"},{"s":7,"n":48,"id":"1014114","q":"<p>Which one of the following is not a part of the origination team?<\/p>","o":[{"l":"A","h":"Corporate broker"},{"l":"B","h":"Public relations consultant"},{"l":"C","h":"Market maker"},{"l":"D","h":"Legal adviser"}],"a":"C","e":"<p>Market makers are not involved with providing advice relating to debt financing strategies.<\/p>"},{"s":7,"n":49,"id":"1078459","q":"<p>If a bond is to be listed, it will first need a prospectus to be submitted to:<\/p>","o":[{"l":"A","h":"The exchange"},{"l":"B","h":"The central bank"},{"l":"C","h":"The executive agency of the treasury"},{"l":"D","h":"The listing authority"}],"a":"D","e":"<p>Any new bond issue including further issues of existing stocks must be listed by the listing authority and a prospectus is sent for approval.<\/p>"},{"s":7,"n":50,"id":"1014113","q":"<p>Who is involved with advising their clients on debt financing strategies relating to structuring?<\/p>","o":[{"l":"A","h":"Market makers"},{"l":"B","h":"Origination team"},{"l":"C","h":"International Capital Markets Association"},{"l":"D","h":"Debt Management Office"}],"a":"B","e":"<p>The origination team are involved with advising their clients on debt financing strategies relating to structuring, marketing and pricing.<\/p>"},{"s":7,"n":51,"id":"1078452","q":"<p>A company wishes to issue shares on an exchange. Which of the following takes a central role for the company in advising the directors of their responsibilities?<\/p>","o":[{"l":"A","h":"Legal advisers"},{"l":"B","h":"Corporate broker"},{"l":"C","h":"Reporting accountant"},{"l":"D","h":"Listing agent"}],"a":"D","e":"<p>The listing agent, also called the sponsor, will advise the directors of their responsibilities on matters such as the company's suitability for listing, the best method of bringing the company to market and on the coordination of the prospectus.<\/p>"},{"s":7,"n":52,"id":"1001931","q":"<p>A broker buys bonds at a negotiated fixed price and then resells them to its clients. This is known as a:<\/p>","o":[{"l":"A","h":"Bought deal"},{"l":"B","h":"Fixed price re-offer"},{"l":"C","h":"Book building"},{"l":"D","h":"Placing"}],"a":"A","e":"<p>Bought deal - the lead manager of an issuer buys a whole issue at a predetermined price and then places the bonds with its own clients.<br/> Fixed price re-offer - the lead manager of an issue distributes bonds to the management group who then place the bonds on with their clients. They are not permitted to place the bonds at a price below the fixed price agreed in advance until the syndicate is broken.<br/> Book building - prior to the issue of shares, an issuing house conducts a bookbuilding exercise where it contacts investors and obtains commitments to purchase a number of shares at a specified price. Having established the demand for the shares over a two week period or so, the issuing manager sets the fixed price for the issue in line with the demand levels that have been established.<br/> Placing - an issue where the issuing house places the shares directly with its own client base rather than inviting applications for the shares from outside third parties.<\/p>"},{"s":7,"n":53,"id":"1078450","q":"<p>Which of the following is true of the continuing obligations for a company when quoted on an exchange?<\/p>","o":[{"l":"A","h":"Companies must adhere to the regulator's listing rules"},{"l":"B","h":"Companies should produce accounts"},{"l":"C","h":"All equity holders must be able to vote on resolutions"},{"l":"D","h":"A company must disclose all price sensitive incidents before they have occurred"}],"a":"B","e":"<p>Not all companies must abide by the regulator's listing rules in junior markets it is just the exchange's rules they must follow. There is a need to produce accounts and interim reports where applicable. Holders of ordinary shares which hold voting rights always have the right to vote on resolutions whereas preference shareholders typically not given voting rights.<\/p>"},{"s":7,"n":54,"id":"1014140","q":"<p>A large institutional investor wishes to buy a bond that pays a particular coupon rate, with a particular redemption date and from a particular issuer. Which is the best way of doing this?<\/p>","o":[{"l":"A","h":"Agency bonds"},{"l":"B","h":"Medium-term notes"},{"l":"C","h":"Mezzanine debt"},{"l":"D","h":"Municipal bonds"}],"a":"B","e":"<p>The investor could buy this in the medium-term note markets by using a reverse enquiry.<\/p>"},{"s":7,"n":55,"id":"1015994","q":"<p>An investment bank has guaranteed the proceeds of an issue with a company prior to the issue. This issue is known as which one of the following?<\/p>","o":[{"l":"A","h":"Best efforts"},{"l":"B","h":"Syndication"},{"l":"C","h":"Underwritten"},{"l":"D","h":"Bookrunning"}],"a":"C","e":"<p>The firm of underwriters will usually agree a guaranteed amount of proceeds with a company prior to the issue of new securities.<\/p>"},{"s":7,"n":56,"id":"1014123","q":"<p>In which of the following types of issue might a company retain a greenshoe option?<\/p>","o":[{"l":"A","h":"Rights issue"},{"l":"B","h":"Bonus issue"},{"l":"C","h":"A secondary market activity"},{"l":"D","h":"A secondary offer"}],"a":"D","e":"<p>With a secondary offer of shares, the company may retain a greenshoe option. They would not be used in the issuance of shares through a rights issue or bonus issue. Greenshoe options are used in the primary markets not the secondary markets.<\/p>"},{"s":7,"n":57,"id":"1039424","q":"<p>Which of the following is true of a company wishing to perform an offer for sale?<\/p>","o":[{"l":"A","h":"An issuing house will sell the shares to investors on behalf of the issuing company"},{"l":"B","h":"The issuing company will issue their own shares directly to investors"},{"l":"C","h":"The issue will not be available to small investors"},{"l":"D","h":"The issue is only available to existing investors"}],"a":"A","e":"<p>The issuing company will appoint an issuing house to market their shares in an offer for sale.<\/p>"},{"s":7,"n":58,"id":"1014143","q":"<p>Which one of the following is not a stage associated with the issuing of bonds?<\/p>","o":[{"l":"A","h":"Subscription"},{"l":"B","h":"Credit rating"},{"l":"C","h":"Pitching"},{"l":"D","h":"Mandate announcement"}],"a":"A","e":"<p>Subscription is not a stage associated with the issuing of bonds.<\/p>"},{"s":7,"n":59,"id":"4027310","q":"<p>MTNs are normally issued with a maturity of:<\/p>","o":[{"l":"A","h":"Less than 12 months"},{"l":"B","h":"Up to 2 years"},{"l":"C","h":"Between 2 and 10 years"},{"l":"D","h":"Greater than 10 years"}],"a":"C","e":"<p>MTNs (as stated in the CISI manual) are normally issued with a maturity of 2 to 10 years.<\/p><p>Money market instruments typically have maturities of less than 12 months.<\/p><p>Bonds issued using a shelf-registration normally have a maturity of up to 2 years and a bond with a maturity greater than 10 years is more commonly going to be referred to as long-dated.<\/p>"},{"s":7,"n":60,"id":"1015980","q":"<p>A company wishes to issue a very large volume of new shares; this could be facilitated by using which one of the following?<\/p>","o":[{"l":"A","h":"By forming a stakebuilding group"},{"l":"B","h":"By forming a syndicate group"},{"l":"C","h":"By forming a lead manager group"},{"l":"D","h":"By forming a securities offering group"}],"a":"B","e":"<p>A company would wish to use the services of a syndicate group when issuing such a large volume of new shares.<\/p>"},{"s":7,"n":61,"id":"1047488","q":"<p>An issuer of convertible and exchangeable bonds is considering a greenshoe option.<br/> Which of the following is TRUE?<\/p>","o":[{"l":"A","h":"This would be allowed on both types of bond"},{"l":"B","h":"This would be allowed on the convertible bond only"},{"l":"C","h":"This would be allowed on the exchangeable bond only"},{"l":"D","h":"This would not be allowed. It is for equity only"}],"a":"A","e":"<p>A greenshoe option refers to the ability of the lead manager to ask the issuing company to issue more bonds. It is effectively a type of call option held by the lead manager. <br/> A greenshoe option is permitted on both of these types of bonds if there is sufficient demand.<\/p>"},{"s":7,"n":62,"id":"1055541","q":"<p>An offer for subscription must:<\/p>","o":[{"l":"A","h":"Be made available to the general public"},{"l":"B","h":"Be made available to selected investors"},{"l":"C","h":"Be made available to all existing shareholders"},{"l":"D","h":"Be made available to selected shareholders"}],"a":"A","e":"<p>An offer for subscription is a general marketing technique for issuing new shares (as well as an offer for sale) and must be made available to all investors, meaning the general public.<br/> A placing is a selective technique, where new shares are only offered to selected investors.<\/p>"},{"s":7,"n":63,"id":"1078873","q":"<p>Specifically, in an offer for subscription which of the following parties will prepare the prospectus?<\/p>","o":[{"l":"A","h":"Sponsor, nominated adviser and corporate broker"},{"l":"B","h":"Sponsor, reporting accountants and nominated adviser"},{"l":"C","h":"Sponsor, legal advisers and corporate broker"},{"l":"D","h":"Sponsor, legal advisers and reporting accountants"}],"a":"D","e":"<p>An offer for subscription involves the company sending a prospectus (including the share price) and an application form to potential investors. The company's sponsor, along with reporting accountants and legal advisers, will assist in the preparation of the prospectus. Those potential investors who want to invest in the company apply for shares. The company then issues allotment letters to successful applicants.<\/p>"},{"s":7,"n":64,"id":"1015985","q":"<p>Which of the following relates to when a company wishes to take advantage of favourable market conditions by issuing medium-term notes?<\/p>","o":[{"l":"A","h":"Bookrunning issuance"},{"l":"B","h":"Origination issuance"},{"l":"C","h":"Opportunistic issuance"},{"l":"D","h":"Syndicated issuance"}],"a":"C","e":"<p>Opportunistic issuance refers to when a company issues medium-term notes in order to take advantage of favourable market conditions.<\/p>"},{"s":7,"n":65,"id":"1078444","q":"<p>Which of the following is/are true of a nominated adviser on a junior market such as AIM?<\/p><p><strong>I<\/strong><\/p><p>They are responsible for assisting a company through the application process<\/p><p><strong>II<\/strong><\/p><p>They make a market in a listed company's shares<\/p><p><strong>III<\/strong><\/p><p>They must be approved by the exchange<\/p><p><strong>IV<\/strong><\/p><p>They are always retained to advise directors of their responsibilities on an ongoing basis<\/p>","o":[{"l":"A","h":"I and III only"},{"l":"B","h":"I and II only"},{"l":"C","h":"I and IV only"},{"l":"D","h":"I, III and IV only"}],"a":"D","e":"<p>In order to be eligible, an applicant must appoint a listing adviser and the company must retain the adviser at all times.<\/p>"},{"s":7,"n":66,"id":"1078456","q":"<p>A listed company must adhere to which of the following?<\/p>","o":[{"l":"A","h":"Institute of Chartered Accountants"},{"l":"B","h":"IFRS"},{"l":"C","h":"A code of corporate governance"},{"l":"D","h":"Rulebook for sponsors"}],"a":"B","e":"<p>A listed company adheres to International Financial Reporting Standards. The advisers, not the company, use the rulebook. There is a company rulebook.<br/> A company does not need to adhere to the corporate governance requirements, they maybe required to 'comply or explain'.<\/p>"},{"s":7,"n":67,"id":"1015997","q":"<p>When a firm of underwriters attempts to raise the most amount of money when marketing a new issue, this is known as:<\/p>","o":[{"l":"A","h":"Underwriting"},{"l":"B","h":"Best efforts"},{"l":"C","h":"Placing"},{"l":"D","h":"Book running"}],"a":"B","e":"<p>Best efforts basis refers to when the underwriters try to do their best to sell the securities at a certain price.<\/p>"},{"s":7,"n":68,"id":"1050853","q":"<p>A company has successfully released shares into the market through an initial public offer. The members of the board of directors have personal debts which they wish to pay off. Which of the following BEST describes the method used to help achieve their objective?<\/p>","o":[{"l":"A","h":"A follow-on bonus issue"},{"l":"B","h":"A free-float issue"},{"l":"C","h":"A dilutive secondary issue"},{"l":"D","h":"A non-dilutive secondary issue"}],"a":"D","e":"<p>As it is the directors of the company that have the debt, their best course of action is to release their existing shares to the free float. No new shares are created and the company will not benefit from the sale of these shares.<\/p>"},{"s":7,"n":69,"id":"1015990","q":"<p>Which one of the following is not normally a stage associated with a typical bond issue?<\/p>","o":[{"l":"A","h":"Pitching"},{"l":"B","h":"Roadshow"},{"l":"C","h":"Syndication"},{"l":"D","h":"Pre-emption"}],"a":"D","e":"<p>A typical new issue of bonds could contain the following stages:<\/p><p>Pitching<\/p><p>Indicative bid<\/p><p>Mandate announcement<\/p><p>Credit rating<\/p><p>Roadshow<\/p><p>Listing<\/p><p>Syndication<\/p>"},{"s":7,"n":70,"id":"1014117","q":"<p>When a company instructs the underwriters to increase the size of the offering by a maximum of 15%, this is known as which of the following?<\/p>","o":[{"l":"A","h":"Rehypothecation"},{"l":"B","h":"Greenshoe option"},{"l":"C","h":"Mezzanine capital"},{"l":"D","h":"Prime brokerage"}],"a":"B","e":"<p>The greenshoe or over allotment option is when a company can allow its underwriters to increase the offering by up to 15% in certain circumstances.<\/p>"},{"s":7,"n":71,"id":"1039387","q":"<p>When issuing equity a company will appoint a sponsor, who will provide all of the following services EXCEPT:<\/p>","o":[{"l":"A","h":"Assessing the company's suitability for listing"},{"l":"B","h":"Co-ordinating the production of the prospectus"},{"l":"C","h":"Facilitating the marketing of the share to interested parties"},{"l":"D","h":"Assessing the best method of marketing the shares to investors"}],"a":"C","e":"<p>Facilitating the marketing of shares is the responsibility of the corporate broker. Although these could be part of the same institution, the exam will treat them separately.<\/p>"},{"s":7,"n":72,"id":"1014115","q":"<p>Bookbuilding is a process described in which one of the following?<\/p>","o":[{"l":"A","h":"Finding buyers for the issuing company's shares"},{"l":"B","h":"Issuing additional shares to existing shareholders free of charge"},{"l":"C","h":"An investor increasing their shareholding in a company"},{"l":"D","h":"A company issuing a prospectus relating to a share issue"}],"a":"A","e":"<p>Finding buyers for the issuing company's shares is known as book building and this is usually carried out by a bookrunner.<\/p>"},{"s":7,"n":73,"id":"1015977","q":"<p>A syndicate group will primarily be formed in which of the following situations?<\/p>","o":[{"l":"A","h":"A new issue of gilts"},{"l":"B","h":"A new issue of shares"},{"l":"C","h":"A new issue of warrants"},{"l":"D","h":"A new issue of ADRs"}],"a":"B","e":"<p>A syndicate group may be formed when a company wishes to issue a substantial number of new shares.<\/p>"},{"s":7,"n":74,"id":"1078458","q":"<p>Which of the following best describes a national listing authority's role with regard to primary and secondary markets?<\/p>","o":[{"l":"A","h":"The listing authority writes and enforces the primary market listing rules, as well as the secondary market rules"},{"l":"B","h":"The exchange writes the primary market listing rules; however, the listing authority enforces these rules; the exchange writes and enforces the rules on the secondary market"},{"l":"C","h":"The listing authority writes and enforces the rules on the primary market; the exchange writes and enforces the rules on the secondary market"},{"l":"D","h":"The exchange writes and enforces the primary market listing rules as well as the secondary market rules"}],"a":"C","e":"<p>A listing authority is the competent authority for listing, making the decisions as to which companies' shares and bonds (including government bonds) can be admitted to be traded on the exchange. It is the listing authority that sets the rules relating to becoming listed on the exchange, including the implementation of any relevant legislation.<br/> The exchange is responsible for the operation of the exchange, including the trading of the securities on the secondary market; although, the listing authority can suspend the listing of particular securities and, therefore, remove their secondary market trading activity on the exchange.<\/p>"},{"s":7,"n":75,"id":"1078447","q":"<p>What is the most common issue method used by the UK Debt Management Office when issuing gilts to institutional investors?<\/p>","o":[{"l":"A","h":"Competitive tranche"},{"l":"B","h":"Non-competitive tranche"},{"l":"C","h":"Competitive auction"},{"l":"D","h":"Non-competitive auction"}],"a":"C","e":"<p>Competitive auctions are commonly used by the UK Debt Management Office when issuing gilts.<\/p>"},{"s":7,"n":76,"id":"1015995","q":"<p>When securities are marketed on a best efforts basis, this means which one of the following?<\/p>","o":[{"l":"A","h":"There is no guarantee that all the securities will be issued at a certain price"},{"l":"B","h":"The underwriters agree the proceeds with the company prior to issue"},{"l":"C","h":"The securities will only be issued at a certain price to raise a specified amount of proceeds"},{"l":"D","h":"The company and the underwriters agree the proceeds prior to the issue"}],"a":"A","e":"<p>Best efforts basis refers to when the underwriters try to do their best to sell the securities at a certain price.<\/p>"},{"s":7,"n":77,"id":"1023971","q":"<p>A debt origination team is not involved in which of the following?<\/p>","o":[{"l":"A","h":"Debt repayment"},{"l":"B","h":"Indicative bond pricing"},{"l":"C","h":"Syndication"},{"l":"D","h":"Debt listing"}],"a":"A","e":"<p>The repayment of the debt is the responsibility of the company issuing the debt.<\/p>"},{"s":7,"n":78,"id":"1015988","q":"<p>Who is primarily responsible for organising a roadshow for potential investors in a new issue?<\/p>","o":[{"l":"A","h":"The underwriting firm appointed by the issuer"},{"l":"B","h":"The market operator of the security trading venue"},{"l":"C","h":"The company issuing the new debt instrument"},{"l":"D","h":"The potential investors in the new issue"}],"a":"A","e":"<p>Once the bank running the issue (the underwriting firm) has been appointed, it will arrange and run a series of visits to the potential buyers of the security. This is commonly described as the roadshow, because it involves travelling around a number of major financial centres to see the key investors.<\/p>"},{"s":7,"n":79,"id":"1014126","q":"<p>In which country are local government bonds also known as municipal bonds?<\/p>","o":[{"l":"A","h":"Canada"},{"l":"B","h":"Japan"},{"l":"C","h":"UK"},{"l":"D","h":"US"}],"a":"D","e":"<p>In the US, local government bonds are also known as municipal bonds.<\/p>"},{"s":7,"n":80,"id":"1078457","q":"<p>The Student Loan Marketing Association (Sallie Mae) issues what sort of bonds?<\/p>","o":[{"l":"A","h":"Municipal"},{"l":"B","h":"Government"},{"l":"C","h":"Exchangeable"},{"l":"D","h":"Agency"}],"a":"D","e":"<p>Sallie Mae issue agency bonds. Freddie Mac, Fannie Mae and Ginnie Mae are the other agencies that would be associated with issuing agency bonds<\/p>"},{"s":7,"n":81,"id":"1014141","q":"<p>In which type of investment may a reverse inquiry be used?<\/p>","o":[{"l":"A","h":"Municipal bonds"},{"l":"B","h":"Mezzanine capital"},{"l":"C","h":"Medium term notes"},{"l":"D","h":"Money market instruments"}],"a":"C","e":"<p>A reverse inquiry is used to describe the situation where a request from an investor results in the issuing company creating new securities (typically medium-term notes).<\/p>"},{"s":7,"n":82,"id":"1001291","q":"<p>The mandate in a new issue of Eurobonds will be given to which ONE of the following?<\/p>","o":[{"l":"A","h":"The management group only"},{"l":"B","h":"The lead manager and the management group"},{"l":"C","h":"The lead manager only"},{"l":"D","h":"The underwriting syndicate"}],"a":"C","e":"<p>The issuer will appoint a lead manager and award them the mandate. The lead manager will appoint a management group.<\/p>"},{"s":7,"n":83,"id":"1014139","q":"<p>A medium-term note programme benefits from which of the following?<\/p>","o":[{"l":"A","h":"Shelf-registration"},{"l":"B","h":"Payment in kind"},{"l":"C","h":"Book-building"},{"l":"D","h":"Prime brokerage"}],"a":"A","e":"<p>Shelf-registration allows several issues to be made from a single registration.<\/p>"},{"s":7,"n":84,"id":"1078449","q":"<p>A company is enlisting the help of an investment bank to issue a large number of shares to the public. Primarily which of the following roles is the investment bank performing?<\/p>","o":[{"l":"A","h":"The underwriter"},{"l":"B","h":"The lead manager"},{"l":"C","h":"The company"},{"l":"D","h":"The bookrunner"}],"a":"B","e":"<p>The sponsor will generally act as the lead manager of the syndicate group.<\/p>"},{"s":7,"n":85,"id":"1001111","q":"<p>Which of the following statements is true in respect of stabilisation?<\/p>","o":[{"l":"A","h":"The market price of a new issue may be temporarily higher than it would otherwise be as a result of stabilisation"},{"l":"B","h":"A stabilisation transaction is where the price of new issues is supported during the full period of being listed on the LSE"},{"l":"C","h":"Stabilisation is usually referred to as underwriting"},{"l":"D","h":"Stabilisation is not permitted under the FCA rules"}],"a":"A","e":"<p>The rules permit stabilisation in restricted circumstances on a new issue; the process has the effect of supporting the share price.<\/p>"},{"s":7,"n":86,"id":"1078878","q":"<p>Which of the following would not be considered an issue because no new shares are being brought to the market?<\/p>","o":[{"l":"A","h":"Introduction"},{"l":"B","h":"Rights issue"},{"l":"C","h":"Stock split"},{"l":"D","h":"Bonus issue"}],"a":"A","e":"<p>An introduction is not actually an issue at all. It is used by a company that wishes to become listed to gain access to the secondary market that an exchange will provide. An introduction is unusual because most companies use listing as an opportunity to raise extra funds and some companies are forced to issue more shares to comply with regulations that typically require a minimum percentage of shares to be held by people other than the founders and other significant shareholders.<\/p>"},{"s":7,"n":87,"id":"1002162","q":"<p>Which of the following listing methods is primarily designed to increase the marketability of a company's shares?<\/p>","o":[{"l":"A","h":"Placing"},{"l":"B","h":"Offer for sale"},{"l":"C","h":"Offer for subscription"},{"l":"D","h":"Introduction"}],"a":"D","e":"<p>An introduction's prime purpose is to increase the marketability of company securities. The other methods mentioned in the question are primarily concerned with raising capital.<\/p>"},{"s":7,"n":88,"id":"1023951","q":"<p>In respect of a prospectus who is responsible for co-ordinating the due diligence process?<\/p>","o":[{"l":"A","h":"Listing agent"},{"l":"B","h":"Corporate broker"},{"l":"C","h":"Legal adviser"},{"l":"D","h":"Legal adviser and reporting accountant"}],"a":"A","e":"<p>The due diligence work is the responsibility of the listing agent (also called the sponsor). The work will also be performed by the legal advisers and reporting accountants.<\/p>"},{"s":7,"n":89,"id":"1014112","q":"<p>Which one of the following is not a role of the origination team?<\/p>","o":[{"l":"A","h":"They advise their clients on debt financing strategies"},{"l":"B","h":"They supply indicative bids to their clients for their services"},{"l":"C","h":"They arrange for the stock to be loaned and borrowed"},{"l":"D","h":"They assess a company's suitability for listing"}],"a":"C","e":"<p>The origination team do not arrange for stock to be lent or borrowed.<\/p>"},{"s":7,"n":90,"id":"1002021","q":"<p>Who has the ultimate responsibility for the underwriting of a new issue?<\/p>","o":[{"l":"A","h":"The lead manager"},{"l":"B","h":"The co-lead manager"},{"l":"C","h":"The syndicate of underwriters"},{"l":"D","h":"The company"}],"a":"A","e":"<p>The ultimate responsibility lies with the lead manager.<\/p>"},{"s":7,"n":91,"id":"1078448","q":"<p>Which of the following is not true about gilts?<\/p>","o":[{"l":"A","h":"The UK Debt Management Office will put all unsold gilts on its books at the lowest bid price"},{"l":"B","h":"GEMMs are obliged to bid for and take up all gilts in an auction"},{"l":"C","h":"The UK Debt Management Office has the right to reject any non-competitive bid"},{"l":"D","h":"If there is strong demand for an existing gilt, the UK DMO may issue a further block, known as a tranche"}],"a":"B","e":"<p>Each competitive bid has to be made for a minimum of £1,000,000 nominal value. However, UK Debt Management Office cannot force GEMMs to take up all gilts in an auction. Any unsold gilts are taken up by the DMO at the lowest bid price.<\/p>"},{"s":7,"n":92,"id":"1078453","q":"<p>Who would take on the role of assessing the market conditions for an issue of equity on the exchange?<\/p>","o":[{"l":"A","h":"Corporate broker"},{"l":"B","h":"Sponsor"},{"l":"C","h":"Reporting accountant"},{"l":"D","h":"Market maker"}],"a":"A","e":"<p>The corporate broker advises the company on market conditions - the way existing and potential investors are viewing the company in relation to its peers, and the general direction of the market.<\/p>"},{"s":7,"n":93,"id":"1015670","q":"<p>What is the main purpose of the syndicate in the issuance of eurobonds?<\/p>","o":[{"l":"A","h":"To underwrite the issue"},{"l":"B","h":"To provide advice on listing on an exchange"},{"l":"C","h":"To support trading in the secondary market"},{"l":"D","h":"To ensure regulatory obligations are met"}],"a":"A","e":"<p>A large issue, such as a Eurobond issue, is usually underwritten by a syndicate of investment banks led by one or more major investment banks (known as lead underwriter or lead manager).<\/p>"},{"s":8,"n":1,"id":"1052315","q":"<p>Which of the following would be the best description of the Dow Jones Industrial Average?<\/p>","o":[{"l":"A","h":"A wide view of the stocks in the US"},{"l":"B","h":"A narrow view of companies in the US"},{"l":"C","h":"A wide view of US companies ranked by capitalisation"},{"l":"D","h":"A narrow view of US commodities"}],"a":"B","e":"<p>The Dow Jones industrial average holds 30 companies, making a narrow view of the US market. It is based upon the share price and not the size of the company, making it an unweighted index.<\/p>"},{"s":8,"n":2,"id":"1023964","q":"<p>Which of the following is primarily known for utilising quote driven systems?<\/p>","o":[{"l":"A","h":"NYSE"},{"l":"B","h":"Nasdaq"},{"l":"C","h":"Multi-lateral trading facilities"},{"l":"D","h":"Deutsche Borse"}],"a":"B","e":"<p>The Nasdaq primarily uses market makers for trading.<br/> The NYSE primarily uses specialists who trade open outcry.<br/> The other two exchanges are primarily order book markets.<\/p>"},{"s":8,"n":3,"id":"1057374","q":"<p>Which of the following is true of Gilt trading?<\/p>","o":[{"l":"A","h":"Only GEMMs are bound by the LSE best execution rules"},{"l":"B","h":"Only broker-dealers and GEMMs are permitted to deal in principal"},{"l":"C","h":"Only broker-dealers and Gilt-edged inter-dealer brokers know the identity of the market makers"},{"l":"D","h":"Only GEMMs can perform agency trades"}],"a":"B","e":"<p>This seems like an incomplete question - possibly a trial question. Although not explicit in the question, the answers specifically refer to the roles of a GEMM, Gilt IDB and broker dealer (B-D). Of these three, the Gilt IDB cannot take positions in the market by dealing in principal. Both GEMMs and B-Ds are bound by the LSE rules. Only the Gilt IDB knows the identity of the market makers it deals with. B-D can perform agency trades.<\/p>"},{"s":8,"n":4,"id":"1076208","q":"<p>Which of the following is most likely to be true of a discount broker?<\/p>","o":[{"l":"A","h":"They charge lower fees for the same services as other brokers"},{"l":"B","h":"They charge lower fees for more restricted services as other brokers"},{"l":"C","h":"They offer the same services for a higher cost than other brokers"},{"l":"D","h":"They offer fewer services for the same cost as other brokers"}],"a":"B","e":"<p>Discount brokers tend to offer lower execution fees to customers, by acting in an execution-only capacity, with no advice.<\/p>"},{"s":8,"n":5,"id":"1078470","q":"<p>Which of the following statements is true about exchange member firms?<\/p><p><strong>I<\/strong><\/p><p>A stock borrowing and lending intermediary takes active positions onto its own books<\/p><p><strong>II<\/strong><\/p><p>A stock borrowing and lending intermediary does not take active positions onto its own books<\/p><p><strong>III<\/strong><\/p><p>An inter-dealer broker takes a position as if in principal to ensure both parties' anonymity<\/p><p><strong>IV<\/strong><\/p><p>An inter-dealer broker does not take positions onto its own books to ensure both parties' anonymity<\/p>","o":[{"l":"A","h":"II and III"},{"l":"B","h":"I and IV"},{"l":"C","h":"II and IV"},{"l":"D","h":"I and III"}],"a":"A","e":"<p>An IDB appears to act as central counterparty to trades ensuring both parties remain anonymous. Although IDBs take positions in prinicpal,  they always take both sides to the trade. In this way, IDBs do not take a position in the markets - i.e. they do not hold long only or short only positions. Such a transaction is called a 'riskless principal transaction'.<\/p>"},{"s":8,"n":6,"id":"1014104","q":"<p>The best definition of prime brokerage is which one of the following?<\/p>","o":[{"l":"A","h":"A collection of core services offered by investment banks regarding acquisitions"},{"l":"B","h":"A collection of services that authorised firms can provide to their wealthy clients"},{"l":"C","h":"A collection of services that can be offered to companies that have been listed for the first time"},{"l":"D","h":"A collection of services provided by investment banks to their hedge fund clients"}],"a":"D","e":"<p>Prime brokerage is the term given to a collection of services provided by investment banks to their hedge fund clients.<\/p>"},{"s":8,"n":7,"id":"1053354","q":"<p>Which of the following would be a difference between quote-driven and order-driven systems?<\/p>","o":[{"l":"A","h":"Price transparency; there is no obligation under MiFID for quote-driven systems to show pre-trade information"},{"l":"B","h":"A marketplace that brings together buyers and sellers"},{"l":"C","h":"Quote-driven screens are not required to have a touch strip; the quotes are ordered alphabetically by the market maker"},{"l":"D","h":"Market makers giving bid/offer spread during the MQP"}],"a":"D","e":"<p>Quote-driven trading systems employ market makers to provide continuous two-way, or bid and offer, prices during the trading day, in particular securities, regardless of market conditions. The buying price is the 'bid' and the selling price is the 'offer'. Market makers make a profit, or turn, through this price spread.<\/p><p>MQP = Mandatory Quote Period (the period during which all registered market makers are obliged to display prices)<\/p>"},{"s":8,"n":8,"id":"1014154","q":"<p>Which one of the following is an electronic platform to facilitate dealer-to-customer trading in bonds?<\/p>","o":[{"l":"A","h":"Brokertec"},{"l":"B","h":"LMIL"},{"l":"C","h":"TradeWeb"},{"l":"D","h":"MTS Cash"}],"a":"C","e":"<p>TradeWeb is an electronic platform to facilitate dealer-to-customer trading in bonds.<\/p>"},{"s":8,"n":9,"id":"1052111","q":"<p>A broker might use which one of the following system to trade bonds with an investor?<\/p>","o":[{"l":"A","h":"BrokerVision"},{"l":"B","h":"BondVision"},{"l":"C","h":"GlobalVision"},{"l":"D","h":"Brokertec"}],"a":"B","e":"<p>BondVision is the only B2C system listed.<\/p>"},{"s":8,"n":10,"id":"1014103","q":"<p>Which one of the following is not a service covered under prime brokerage?<\/p>","o":[{"l":"A","h":"Share buy-back advice"},{"l":"B","h":"Leveraged trade execution"},{"l":"C","h":"Cash management"},{"l":"D","h":"Securities lending and borrowing"}],"a":"A","e":"<p>The buying back of a company's shares is not a service offered under prime brokerage.<\/p>"},{"s":8,"n":11,"id":"1001162","q":"<p>Which one of the following would distinguish an electronic quote-driven system from an order-driven system?<\/p>","o":[{"l":"A","h":"They are often designed for the most liquid securities"},{"l":"B","h":"Electronic trading is faster and more secure"},{"l":"C","h":"Orders that are received can be matched automatically or by market makers"},{"l":"D","h":"Market makers have to quote bid and offer prices"}],"a":"D","e":"<p>Only in quote-driven markets do market makers have to quote bid offer prices.<\/p>"},{"s":8,"n":12,"id":"1076209","q":"<p>A broker who offers little or no advice, such as a internet dealing service provider, would be best described as which of the following?<\/p>","o":[{"l":"A","h":"Retail broker"},{"l":"B","h":"Discount broker"},{"l":"C","h":"Remote access broker"},{"l":"D","h":"Full service broker"}],"a":"B","e":"<p>If the broker is offering little or no investment advice, perhaps providing their services over the internet, the firm is described as a discount broker and the fees will be lower.<\/p>"},{"s":8,"n":13,"id":"1053362","q":"<p>The non-displayed or hidden nature of the buy and sell orders that reside in a crossing platform is best observed in which of the following?<\/p>","o":[{"l":"A","h":"MTF"},{"l":"B","h":"Systematic internaliser"},{"l":"C","h":"Retail service provider"},{"l":"D","h":"Dark pool"}],"a":"D","e":"<p>Dark pools refer to the non-displayed or hidden nature of the buy and sell orders that reside in a crossing platform. The term dark liquidity can also be applied to all forms of non-displayed liquidity such as the order blotters of buy-side dealing desks.<br/> A systematic internaliser is, in broad terms, an investment firm making markets outside a regulated market or an MTF. The firm executes orders from its clients against its own book or against orders from other clients.<br/> A multi-lateral trading facility is, in a nutshell, a system that brings together multiple parties (e.g. retail investors or other investment firms) that are interested in buying and selling financial instruments and enables them to do so.<br/> A retail service provider is a type of market maker that provides connectivity services to other LSE member firms that serve the private client; they enable the private client broker to quote firm prices to the investor for ten-day settlement in small trade sizes, and to place orders on an 'invest or raise' basis.<\/p>"},{"s":8,"n":14,"id":"1015688","q":"<p>Which of the following is TRUE of an ICEBERG order?<\/p>","o":[{"l":"A","h":"Only part of it is visible"},{"l":"B","h":"It may be executed at any price"},{"l":"C","h":"It must be executed in full or not at all"},{"l":"D","h":"Any unmatched part of the trade will be immediately eliminated"}],"a":"A","e":"<p>Only the active peak of the ICEBERG order will be visible.<\/p>"},{"s":8,"n":15,"id":"1014108","q":"<p>A prime broker has created exposure to particular securities by using derivatives. This is known as:<\/p>","o":[{"l":"A","h":"Collateralised borrowing"},{"l":"B","h":"Repurchase agreement"},{"l":"C","h":"Synthetic financing"},{"l":"D","h":"Rehypothecation"}],"a":"C","e":"<p>Synthetic financing is where the prime broker creates exposure to a particular security by using derivatives e.g. swaps.<\/p>"},{"s":8,"n":16,"id":"1058371","q":"<p>A UK firm is seeking a dual listing on the New York Stock Exchange. What is the biggest benefit that such a listing would provide?<\/p>","o":[{"l":"A","h":"More protection for foreign firms by virtue of improved accuracy and reliability of disclosure."},{"l":"B","h":"Greater facility to raise capital by access to a bigger market"},{"l":"C","h":"Faster and better information as US markets are linked to major sources and providers"},{"l":"D","h":"More efficient foreign exchange facility and more competitive rates"}],"a":"B","e":"<p>Securing a listing on a major US exchange would provide access to a greater and much wider capital base.<\/p>"},{"s":8,"n":17,"id":"1078884","q":"<p>An example of an exchange trading system is an order book. Which of the following can interact with an exchange's order driven system?<\/p>","o":[{"l":"A","h":"Members of the exchange only"},{"l":"B","h":"Any market participant"},{"l":"C","h":"Market makers for their quoted security only"},{"l":"D","h":"Everyone must be given access"}],"a":"A","e":"<p>Membership of the exchange is required to interact with an order book. It is for broker- and dealer- members of the exchange only.<\/p>"},{"s":8,"n":18,"id":"1078471","q":"<p>Which of the following can be typically traded on a capital market?<\/p>","o":[{"l":"A","h":"Corporate bonds"},{"l":"B","h":"Traded stock options"},{"l":"C","h":"Units of a Unit Trust"},{"l":"D","h":"Premium bonds"}],"a":"A","e":"<p>Corporate debt securities are traded in both order and quote driven systems by member firms.<\/p>"},{"s":8,"n":19,"id":"1046692","q":"<p>A bond's yield is 200bp over a three-month benchmark rate.<br/> What is the spread of the bond over ten-year Treasuries if the three-month benchmark rate is 0.47% and the ten-year Treasury yield is 1.79%?<\/p>","o":[{"l":"A","h":"0.21 %"},{"l":"B","h":"0.68 %"},{"l":"C","h":"1.03 %"},{"l":"D","h":"1.53 %"}],"a":"B","e":"<p>The bond's yield is 200bp = 2% over the benchmark rate at 0.47% giving 2.47%.<br/> 2.47% - Treasury yield at 1.79% equals 0.68%.<\/p>"},{"s":8,"n":20,"id":"1078887","q":"<p>A financial institution acts as broker for two different clients. Client Bee is charged commission at a rate of 0.6% and client Dee is charged a rate of 1.4%. Which of the following would explain the differences between the two cost structures?<\/p>","o":[{"l":"A","h":"Client Bee is investing in leveraged securities whereas client Dee is investing in low risk products"},{"l":"B","h":"Client Dee has been a client of the firm for a much longer period of time than client Bee"},{"l":"C","h":"Client Dee is being provided both recommendations and execution whereas client Bee is receiving execution only"},{"l":"D","h":"Client Bee is much better a negotiating prices relating to commissions than client Dee"}],"a":"C","e":"<p>The precise percentage varies by broker and market, but it is generally at least 0.5% of the value of the securities traded. It will invariably be higher when the broker is providing the client with additional services, with these so-called full-service brokers likely to charge a higher percentage of perhaps 1.5%. If the broker is offering little or no investment advice, perhaps providing their services over the internet, the firm is described as a discount broker and the fees will be lower.<\/p>"},{"s":8,"n":21,"id":"1014096","q":"<p>Which markets does the MSCI World index cover?<\/p>","o":[{"l":"A","h":"Global emerging markets"},{"l":"B","h":"Global technology"},{"l":"C","h":"Global developed"},{"l":"D","h":"Global smaller companies"}],"a":"C","e":"<p>The MSCI World index covers stocks from global developed countries.<\/p>"},{"s":8,"n":22,"id":"4028001","q":"<p>All of the following are key reasons for the growing popularity of algorithmic trading, except:<\/p>","o":[{"l":"A","h":"The removal of emotion from trading"},{"l":"B","h":"Preservation of trading discipline"},{"l":"C","h":"The speed and accuracy of trading"},{"l":"D","h":"Trading activities creating systemic risk"}],"a":"D","e":"<p>Algorithmic trading (inc. high frequency trading) has been criticised for the systemic risks or flash crashes that it can create.<\/p>"},{"s":8,"n":23,"id":"1078467","q":"<p>All broker-dealers do which of the following?<\/p>","o":[{"l":"A","h":"Buy or sell for themselves and/or clients"},{"l":"B","h":"Always keep a two-way price on quote driven platforms"},{"l":"C","h":"Act only for themselves in a proprietary capacity"},{"l":"D","h":"Obtain authorisation to deal for clients from the exchange"}],"a":"A","e":"<p>Broker-dealers can act in either an agency role or as principal. SOME broker-dealers register as market makers with the stock exchange but there is no requirement as such. Authorisation to deal comes from the regulator rather than the exchange.<\/p>"},{"s":8,"n":24,"id":"1014153","q":"<p>BondVision is an example of which of the following?<\/p>","o":[{"l":"A","h":"An electronic platform to facilitate dealer-to-customer trading in bonds"},{"l":"B","h":"A voice trading mechanism used between two parties trading in bonds"},{"l":"C","h":"A proprietary single dealer system developed by some larger banks"},{"l":"D","h":"A direct phone contact mechanism used dealer-to-dealer"}],"a":"A","e":"<p>BondVision is an electronic platform to facilitate dealer-to-customer trading in bonds.<\/p>"},{"s":8,"n":25,"id":"1078885","q":"<p>Which of the following is least likely to be a benefit of using a central counterparty for exchange traded transactions?<\/p>","o":[{"l":"A","h":"Improved prices"},{"l":"B","h":"Lower margin costs"},{"l":"C","h":"Reduced administration"},{"l":"D","h":"Netting"}],"a":"B","e":"<p>The CCP typically charges a flat fee to both parties for fulfilling its role and requires margin payments to reduce its potential loss, should one party default. All the others are considered benefits.<\/p>"},{"s":8,"n":26,"id":"1016227","q":"<p>What is the purpose of the London Stock Exchange's central counterparty service?<\/p>","o":[{"l":"A","h":"To reduce systematic risk through diversification"},{"l":"B","h":"To reduce liabilities by guaranteeing returns"},{"l":"C","h":"To reduce default risk through margin"},{"l":"D","h":"To reduce settlement risk through delivery vs. payment"}],"a":"C","e":"<p>The Central Counterparty service (CCP) provided by the London Stock Exchange reduces default risk by novating the contract and collecting margin.<br/> CREST protects against settlement risk through delivery vs. payment (DvP).<\/p>"},{"s":8,"n":27,"id":"1078479","q":"<p>What is the minimum number of market makers a stock may have on a hybrid system of an exchange?<\/p>","o":[{"l":"A","h":"Zero"},{"l":"B","h":"1"},{"l":"C","h":"2"},{"l":"D","h":"3"}],"a":"A","e":"<p>Certain stocks may actually have no market makers at all on hybrid systems.<\/p>"},{"s":8,"n":28,"id":"1078889","q":"<p>If a trader is using a decentralised dealer market, which of the following are they most likely trading?<\/p>","o":[{"l":"A","h":"Junior market equities"},{"l":"B","h":"Corporate bonds"},{"l":"C","h":"Senior market equities"},{"l":"D","h":"Exchange traded funds"}],"a":"B","e":"<p>Unlike the market for equities, the method of dealing in corporate bonds tends to be away from the major exchanges in what is commonly described as a decentralised dealer market. The dealers provide liquidity by being willing to buy or sell the bonds.<\/p>"},{"s":8,"n":29,"id":"1014162","q":"<p>A request for quote system would usually be used in relation to which one of the following?<\/p>","o":[{"l":"A","h":"Higher liquidity, high volatility bonds"},{"l":"B","h":"Lower liquidity, high volatility bonds"},{"l":"C","h":"Higher liquidity, lower volatility bonds"},{"l":"D","h":"Lower liquidity, lower volatility bonds"}],"a":"B","e":"<p>A request for quote system would usually be used for lower liquidity, high volatility bonds. It is an OTC broker to client (B2C) platform that allows investors to request quotes from a number of dealers simultaneously.<\/p>"},{"s":8,"n":30,"id":"1046712","q":"<p>Which exchange has a mix of open outcry and electronic trading platforms?<\/p>","o":[{"l":"A","h":"Deutsche Borse"},{"l":"B","h":"London Stock Exchange"},{"l":"C","h":"New York Stock Exchange"},{"l":"D","h":"Euronext-NSC"}],"a":"C","e":""},{"s":8,"n":31,"id":"1039427","q":"<p>Which of the following BEST highlights a problem with order-driven markets?<\/p>","o":[{"l":"A","h":"No guarantee of execution"},{"l":"B","h":"Lack of price transparency"},{"l":"C","h":"Need for market maker quotes"},{"l":"D","h":"Only works for large orders"}],"a":"A","e":"<p>The problem with order-driven markets is highlighted when there is not adequate liquidity in the markets. If there is an insufficient number of buyers and sellers the trades may not be matched.<\/p>"},{"s":8,"n":32,"id":"1001252","q":"<p>What type of index is the FTSE 100?<\/p>","o":[{"l":"A","h":"Unweighte
