ies listed on a junior market e.g. the LSE's Alternative Investment Market , which of the following must stay with the company for the duration of the listing?<\/p>","o":[{"l":"A","h":"Nominated advisor"},{"l":"B","h":"Broker"},{"l":"C","h":"Advisor and accountants"},{"l":"D","h":"Broker and advisor"}],"a":"D","e":"<p>AIM rules stipulate that the nominated advisor and the corporate broker continue their relationship with the company for the duration of the listing.<\/p>"},{"s":4,"n":10,"id":"1070784","q":"<p>A company has annouced they are going to pay a dividend. Some of the company's shares are being borrowed from a pension fund in a stock lending agreement. Which of the following BEST describes the payment of the dividend?<\/p>","o":[{"l":"A","h":"The pension fund will accept in all cases under the securities lending agreement that they will lose all benefits"},{"l":"B","h":"The borrower will receive all dividend payments from the company, but in most cases the dividends will also be passed to the pension fund as a manufactured dividend"},{"l":"C","h":"The issuing company's chairman will be informed of the agreement and these shares will no longer be considered outstanding and therefore no dividend payment will be made"},{"l":"D","h":"As the legal owner of the shares the company will pay the dividend directly to the pension fund"}],"a":"B","e":"<p>When a security is loaned, the title of the security transfers to the borrower. This means that the borrower has the advantages of holding the security, just as though they owned it. Specifically, the borrower will receive all coupon and/or dividend payments, and any other rights such as voting rights. <br/> In most cases, these dividends or coupons will also be passed to the lender in the form of what is referred to as a manufactured dividend.<\/p>"},{"s":4,"n":11,"id":"1054659","q":"<p>What is the main reason for investing in equity?<\/p>","o":[{"l":"A","h":"The opportunity for increases in capital"},{"l":"B","h":"To gain the risk free rate"},{"l":"C","h":"The returns will move in line with interest rates"},{"l":"D","h":"They are low risk and relatively secure"}],"a":"A","e":"<p>Equities are deemed to be relatively high risk instruments. They provide the opportunity for capital increase and the possibility of income from dividends.<\/p>"},{"s":4,"n":12,"id":"1078518","q":"<p>Insolvency legislation defines a strict order of repayment of company debts in liquidation. In the order of repayment who/what is paid after subordinated loan stock?<\/p>","o":[{"l":"A","h":"Preference shareholders"},{"l":"B","h":"Unsecured loans"},{"l":"C","h":"Fixed charge holders"},{"l":"D","h":"Floating charge holders"}],"a":"A","e":"<p>Subordinated loan stock is unsecured debt. Although the lowest category of debt, it still ranks above preference and ordinary shares, both of which are categorised as equity.<\/p>"},{"s":4,"n":13,"id":"1072139","q":"<p>Which of the following would most likely be considered when assessing the credit rating of a bond?<\/p>","o":[{"l":"A","h":"The company's competitive position"},{"l":"B","h":"The benchmark bond"},{"l":"C","h":"The structure of the particular issue"},{"l":"D","h":"The issuer's current credit rating"}],"a":"D","e":"<p>The company's comeptive position and the structure of the issue will both influence the rating of a bond but more importantly with be the issuer's current credit rating (which itself will reflect the issuer's specific prospects) and highlight the issuer's default risk.<\/p>"},{"s":4,"n":14,"id":"1047476","q":"<p>Considering the price/earnings ratio and the dividend yield respectively, what would an investor NORMALLY expect if a company continuously shows rapidly increasing profits?<\/p>","o":[{"l":"A","h":"Low / low"},{"l":"B","h":"High / low"},{"l":"C","h":"High / High"},{"l":"D","h":"Low / High"}],"a":"B","e":"<p>Price / earnings ratio is calculated as Share price / Earnings per share Dividend yield is calculated as Dividend / Share price<br/> Share prices are normally based on expectations of future earnings of a company. If the market assumes that profits will continue to increase the share price is likely to reflect this. Therefore with consistent increasing profits we would expect to see a high share price. The high share price compared to earnings or dividends gives a high P/E but low dividend yield.<\/p>"},{"s":4,"n":15,"id":"1065052","q":"<p>A company carries out a 5 for 1 bonus issue when its share price is 860. After the issue has been completed, which of these statements is most likely to be true?<\/p>","o":[{"l":"A","h":"The share price will be about 186"},{"l":"B","h":"The number of shares will have increased by 600%"},{"l":"C","h":"The share price will have risen to 4300"},{"l":"D","h":"The shares will be more marketable"}],"a":"D","e":"<p>The examiner is looking for the BEST answer here rather than something which is absolute or certain. The bonus issue will increase the number of shares and there will now be six times as many in issue (an increase of 500%). The much larger float should mean greater liquidity, which in turn should increase the marketability of the shares.<\/p>"},{"s":4,"n":16,"id":"1078918","q":"<p>Secondary information providers take information from primary information providers and then disseminate this information mostly to:<\/p>","o":[{"l":"A","h":"Listed companies"},{"l":"B","h":"Brokers and research analysts"},{"l":"C","h":"Thomson Reuters"},{"l":"D","h":"Government bodies"}],"a":"B","e":"<p>Primary information providers simply offer a service that receives regulatory information from listed companies, processes that information and disseminates it by circulating it to secondary information providers (SIPs). Examples of SIPs include Bloomberg, Reuters and the Dow Jones. The SIPs disseminate the information to the wider financial community, such as stockbrokers and research analysts.<\/p>"},{"s":4,"n":17,"id":"1046710","q":"<p>What is the profitability ratio?<\/p>","o":[{"l":"A","h":"Total debt / Equity funds"},{"l":"B","h":"Profit before interest and tax / Capital employed"},{"l":"C","h":"Earnings per share / dividend per share"},{"l":"D","h":"Dividend per share / Market price per share"}],"a":"B","e":"<p>This is the description of the 'Return on Capital Employed' ratio, which is also known as the profitability ratio.<\/p>"},{"s":4,"n":18,"id":"1078528","q":"<p>The types of order accepted on order driven systems are:<\/p>","o":[{"l":"A","h":"at best, limit, execute and eliminate and iceberg orders only"},{"l":"B","h":"market orders and orders which will execute against a matching price or better immediately"},{"l":"C","h":"orders to sell and buy are ranked by price then volume priority"},{"l":"D","h":"orders that will either execute or cancel immediately, or will go to the buyers and sellers queue"}],"a":"D","e":"<p>Market orders, execute and eliminate, and fill or kill orders will execute immediately or will be cancelled. Limit orders and iceberg orders not executed immediately will go to the order book and placed in the Bid/Offer queue.<\/p>"},{"s":4,"n":19,"id":"1054662","q":"<p>When wouldn't you get the limit price on your order?<\/p>","o":[{"l":"A","h":"In the opening auction"},{"l":"B","h":"The uncrossing period"},{"l":"C","h":"It matches with a Fill or Kill order"},{"l":"D","h":"It matches with a best offer order"}],"a":"A","e":"<p>During the opening auction no matching takes place.<\/p>"},{"s":4,"n":20,"id":"1047445","q":"<p>As a bond approaches maturity its price will:<\/p>","o":[{"l":"A","h":"Fall"},{"l":"B","h":"Become more volatile"},{"l":"C","h":"Get closer to par"},{"l":"D","h":"Rise"}],"a":"C","e":"<p>This is known as the pull to redemption.<\/p>"},{"s":4,"n":21,"id":"1078517","q":"<p>What are the responsibilities of a market maker outside of the exchange's open hours?<\/p>","o":[{"l":"A","h":"To provide two-way prices to the market and exchange"},{"l":"B","h":"A market maker has no responsibilities during this time"},{"l":"C","h":"To report all trades within three minutes"},{"l":"D","h":"To enter trade reports of trades that took place outside the mandatory quote period (MQP)"}],"a":"B","e":"<p>From 5.15 pm until 7.15 am, no trade reports can be submitted and the market is not open therefore no prices are entered. As a result the market maker has no responsibility during this time.<\/p>"},{"s":4,"n":22,"id":"1054666","q":"<p>The best way to minimise a portfolio's risk is to invest in equities with:-<\/p>","o":[{"l":"A","h":"Systematic risk"},{"l":"B","h":"Unsystematic risk"},{"l":"C","h":"Positive correlation"},{"l":"D","h":"Negative correlation"}],"a":"D","e":"<p>Diversification benefits are maximised by holding investments with uncorrelated returns.<\/p>"},{"s":4,"n":23,"id":"1066430","q":"<p>A 5% coupon bond is trading at £100. Calculate the present value of a 2-year 3.5% bond if both bonds have the same yield to maturity?<\/p>","o":[{"l":"A","h":"£102.79"},{"l":"B","h":"£97.21"},{"l":"C","h":"£96.67"},{"l":"D","h":"£93.87"}],"a":"B","e":"<p>The yield to maturity is the same as the gross redemption yield, which is the same as the internal rate of return. Therefore:<br/> £3.50 ÷ 1.05 (1 + rate) = £3.33<br/> £103.50 ÷1.05^2 (1 + rate^time) = £93.88<br/> £3.33 + £93.88 = £97.21<\/p>"},{"s":4,"n":24,"id":"1055869","q":"<p>Which of the following is the best description of a manufactured dividend?<\/p>","o":[{"l":"A","h":"A dividend issued by a company which has a dividend cover ratio less than one, therefore has had to make use of company reserves to make up the lack of earnings to fund the dividend"},{"l":"B","h":"An enhanced dividend paid to participating preference shareholders when the company has enjoyed high profits in a particular year"},{"l":"C","h":"Payments passed back to the lenders of shares to compensate them for any missed dividends issued by the company"},{"l":"D","h":"A dividend issued in shares rather than in cash"}],"a":"C","e":"<p>When a borrower sells a loaned share, the person buying the share receives all beneficial rights, including voting and dividend rights. In most cases, the person lending the share will then receive 'manufactured dividends' from the borrower, to make up for the cash flow losses, until they finally receive back the share from the borrower.<\/p>"},{"s":4,"n":25,"id":"4049369","q":"<p><\/p><p>When would you see goodwill on a company statement of financial position?<\/p>","o":[{"l":"A","h":"An engineering company recognising research and development"},{"l":"B","h":"Where a subsidiary is bought for more than net asset value"},{"l":"C","h":"Where a parent company spins off a subsidiary"},{"l":"D","h":"Where a director buys shares in their own company"}],"a":"B","e":"<p>If the cost of investment on takeover exceeded the net assets (assets less liabilities) of the subsidiary, the excess is described as goodwill and appears as an asset in the consolidated statement of financial position in the group accounts.<\/p>"},{"s":4,"n":26,"id":"1054652","q":"<p>How are Sterling Treasury Bills issued?<\/p>","o":[{"l":"A","h":"At a fixed price"},{"l":"B","h":"By tender"},{"l":"C","h":"Bought deal"},{"l":"D","h":"Non competitive auction"}],"a":"B","e":"<p>T Bills are issued through a competitive auction. Interested parties tender a price and if successful they pay the price they submitted.<\/p>"},{"s":4,"n":27,"id":"1046705","q":"<p>What services will a prime broker offer to cover a short position in a Long/Short equity Hedge Fund Strategy?<\/p>","o":[{"l":"A","h":"Leveraged trade execution"},{"l":"B","h":"Core settlement"},{"l":"C","h":"Custody"},{"l":"D","h":"Securities lending and borrowing"}],"a":"D","e":"<p>To cover a short position you need to borrow the securities that are not in possession.<\/p>"},{"s":4,"n":28,"id":"4062223","q":"<p>A bond is classified as being a floating-rate note.<\/p><p>The implication of this to an investor is that:<\/p>","o":[{"l":"A","h":"Its coupon will be index linked"},{"l":"B","h":"The redemption value is linked to an underlying rate of interest"},{"l":"C","h":"Its redemption period will be open-ended"},{"l":"D","h":"Its coupon will be based on a published rate of interest"}],"a":"D","e":"<p>Floating rate notes state the coupon by reference to a published interest rate, such as the London Interbank Offered Rate (LIBOR), and reset the coupon paid when the published interest rate changes.<\/p>"},{"s":4,"n":29,"id":"1052087","q":"<p>Which of the following is a capital expenditure?<\/p>","o":[{"l":"A","h":"Admin costs for the purchase of computer hardware"},{"l":"B","h":"Purchase of toner for existing printers"},{"l":"C","h":"Equipment for a new office"},{"l":"D","h":"Office staff wages"}],"a":"C","e":"<p>'Capital expenditure' is money spent to buy non-current assets, such as plant, property and equipment. It is reflected on the balance sheet.<\/p>"},{"s":4,"n":30,"id":"1076722","q":"<p>How does the Government encourage pension planning in relation to pension payments?<\/p>","o":[{"l":"A","h":"Relatively favourable tax treatment"},{"l":"B","h":"Flexible access to funds"},{"l":"C","h":"Risk-free investments"},{"l":"D","h":"The pension is not accessible until a certain age"}],"a":"A","e":"<p>Pension contributions are tax free. So for example a UK higher rate tax payer receives 40% tax relief on their contribution.<\/p>"},{"s":4,"n":31,"id":"1079682","q":"<p>Why is it important that 'request for quote' systems run alongside the dealer-to-customer market?<\/p>","o":[{"l":"A","h":"To cater for large volumes"},{"l":"B","h":"To achieve better prices"},{"l":"C","h":"To avoid volatility"},{"l":"D","h":"To compensate for inflation risk"}],"a":"B","e":"<p>RFQ systems bring dealers into direct competition with each other which should deliver price improvement for investors. They also offer a significant improvement over voice communication in terms of ease and speed of trading.<\/p>"},{"s":4,"n":32,"id":"1065055","q":"<p>An investor is looking to buy shares on a 'special cum-div' basis. What is the latest day on which he/she can do this?<\/p>","o":[{"l":"A","h":"2 days before the ex-date"},{"l":"B","h":"3 days before the record date"},{"l":"C","h":"The day before the payment date"},{"l":"D","h":"3 days before the payment date"}],"a":"C","e":"<p>Shares can be bought on a special cum-div basis up to the day before the dividend payment date.<\/p>"},{"s":4,"n":33,"id":"4062246","q":"<p>How do Electronic Communication Networks (ECNs) benefit clients of trading firms?<\/p>","o":[{"l":"A","h":"Lower transaction costs for trading"},{"l":"B","h":"Price visibility on all major exchanges"},{"l":"C","h":"Centralised physical location for trading"},{"l":"D","h":"Faster access to all major exchanges"}],"a":"A","e":"<p>Electronic Communication Networks are not to be confused with the generic description of an electronic crossing network which is simply an order driven system. Electronic Communication Networks are also known as ‘dark pools’. A function they allow firms to offer lower trading costs for their clients. As the answer to this question cannot be found in the manual we have to assume that this question is being trialled for another examination.<\/p>"},{"s":4,"n":34,"id":"1054649","q":"<p>What is the maximum time that an equity can be bought before the ex-date, where an arrangement is agreed that the seller does receive the dividend?<\/p>","o":[{"l":"A","h":"24 hours"},{"l":"B","h":"96 hours"},{"l":"C","h":"5 days"},{"l":"D","h":"10 days"}],"a":"D","e":"<p>The SPECIAL EX DATE is the first date in the cum-div period from which SPECIAL EX transactions can be agreed. A special ex-bargain is a transaction carried out in the cum-div period, but contracted ex-div. The buyer will not receive the next dividend. The special ex-div date is ten business days before the ex-div date itself.<\/p>"},{"s":4,"n":35,"id":"1065031","q":"<p>In relation to an IPO, which of the below will be involved in completing the due diligence in the production of the company's prospectus?<\/p>","o":[{"l":"A","h":"Legal advisors only"},{"l":"B","h":"Sponsor and reporting accountants"},{"l":"C","h":"Legal advisor and sponsor only"},{"l":"D","h":"Legal advisor and reporting accountants"}],"a":"D","e":"<p>Sponsor is responsible for the co-ordination and production of the prospectus. The reporting accountants will attest to the validity of the financial information provided in the prospectus. The legal advisers will make sure that all relevant matters are covered in the prospectus and the statements made are justified. The combination of the reporting accountants and the legal<br/> advisers is said to be providing due diligence for the prospectus - making sure the document is<br/> accurate and complies with the regulations.<\/p>"},{"s":4,"n":36,"id":"1055537","q":"<p>By hedging a position, which one of the following is the most likely outcome?<\/p>","o":[{"l":"A","h":"You will limit or reduce the potential upside"},{"l":"B","h":"You will guarantee a minimum loss with no potential profit"},{"l":"C","h":"You will ensure the price of the underlying will increase"},{"l":"D","h":"You will remove all risks associated with the position"}],"a":"A","e":"<p>When hedging a position the long or short is prepared to offset their potential upside by protecting their losses. In this question we have to assume we are using futures rather than options. When hedging with futures you could still be exposed to market risk.<\/p>"},{"s":4,"n":37,"id":"1054656","q":"<p>Which of these would normally be used to establish the owner of a UK share?<\/p>","o":[{"l":"A","h":"Physical possession"},{"l":"B","h":"Beneficial ownership"},{"l":"C","h":"Named executor"},{"l":"D","h":"Company register"}],"a":"D","e":"<p>UK shares are in registered form. The registered owner is the legal owner.<\/p>"},{"s":4,"n":38,"id":"1066410","q":"<p>An investor is currently holding 1500 shares in ABC plc. ABC has proposed a 1:3 rights issue to raise more capital at a subscription price of £1.75. The cum-rights price is £2.52, what would be the total nil-paid premium if the investor sold all of their rights?<\/p>","o":[{"l":"A","h":"£288.75"},{"l":"B","h":"£385.00"},{"l":"C","h":"£866.25"},{"l":"D","h":"£875.00"}],"a":"A","e":"<p>Firstly we need to calculate the theoretical ex-rights price.<br/> 3 shares at cum-rights price is £7.56 (3 x £2.52) add the subscription price of the new share £1.75, giving a total of £9.31.<br/> £9.31 ÷ 4 shares = £2.3275 as the theoretical ex-rights price.<br/> The theoretical nil paid price is TERP - subscription cost or £2.3275 - £1.75 = £0.5775<br/> If the investor sold all of the 500 rights (1/3 of 1500) they will be paid £0.5775 x 500 = £288.75<\/p>"},{"s":4,"n":39,"id":"1052039","q":"<p>A company when bringing securities to the primary market are not required to fulfil publishing requirements in which of the following situation?<\/p>","o":[{"l":"A","h":"Offer for sale"},{"l":"B","h":"Offer for subscription"},{"l":"C","h":"Selective marketing"},{"l":"D","h":"Rights issue"}],"a":"C","e":"<p>When doing a financial promotion a prospectus is not required if you are selling to professional clients, this is most commonly known as 'placing' it is a selective marketing technique.<\/p>"},{"s":4,"n":40,"id":"1078868","q":"<p>The current spot price is £1 : $1.4785 - $1.4815. If the forward adjustment is expressed as a premium 0.90 cents - 0.87 cents, in the 3 month forward rate how many dollars will £1 buy?<\/p>","o":[{"l":"A","h":"$1.4695"},{"l":"B","h":"$1.4728"},{"l":"C","h":"$1.4875"},{"l":"D","h":"$1.4902"}],"a":"A","e":"<p>Even though this is not normal market terminology it is used by the author in the manual. The 0.90 is deducted from the quoted spot bid rate to arrive at the forward rate as we are looking to sell GBP and buy USD, therefore £1 will buy fewer dollars in three months' time. We know this is subtracted because the bid adjustment is greater than the ask adjustment and as it is quoted in cents, unlike the spot rate, which is quoted in dollars 0.90 cents are 0.0090 dollars. So, $1.4785 - $0.0090 = $1.4695.<\/p>"},{"s":4,"n":41,"id":"1065024","q":"<p>What is the significance of return on capital employed?<\/p>","o":[{"l":"A","h":"It measures the profits of the company after tax relative to the assets employed"},{"l":"B","h":"It measures the profits of the company before interest and tax relative to the assets employed"},{"l":"C","h":"It measures the profits of the company after interest relative to the assets employed"},{"l":"D","h":"It measures the profits of the company after interest and tax relative to the assets employed"}],"a":"B","e":"<p>ROCE = PBIT / Capital employed<br/> Capital employed = Total assets - current liabilities<\/p>"},{"s":4,"n":42,"id":"1067798","q":"<p>Participants in a dark pool are MOST LIKELY to have chosen this type of execution venue because of:<\/p>","o":[{"l":"A","h":"Lack of pre-trade transparency"},{"l":"B","h":"Ability to execute trades at efficient prices"},{"l":"C","h":"Ability to hide the dealer's identity"},{"l":"D","h":"Lower costs"}],"a":"B","e":"<p>Dark pools offer institutions a facility to deal large blocks of shares anonymously, typically using algorithm driven trading. The size of these orders would make it very difficult to achieve efficient pricing on more traditional venues but the dark pool allows them to do so. Although anonymity is an advantage, this is also available on many other systems, including exchanges.<\/p>"},{"s":4,"n":43,"id":"1065021","q":"<p>On some occassions, companies may provide additional disclosures on financial statements. Which of the below would not be included on these disclosures?<\/p>","o":[{"l":"A","h":"Comparative figures from the previous year's financial statements"},{"l":"B","h":"Explanatory notes to accompany certain individual balance sheet and profit and loss account items"},{"l":"C","h":"Disclosure of the company's accounting policies"},{"l":"D","h":"Disclosure of the company's management policies"}],"a":"D","e":"<p>The workbook specifically mentions all others but company's management policy is not relevant here.<\/p>"},{"s":4,"n":44,"id":"1072127","q":"<p>XYZ is a company established in the UK as a public limited company. Which of the below must ALWAYS be true:<\/p>","o":[{"l":"A","h":"It will be listed on the London Stock Exchange"},{"l":"B","h":"It will be restricted in relation to how much share capital it can issue"},{"l":"C","h":"It will issue shares through an offer for subscription"},{"l":"D","h":"It will issue shares through an offer for sale"}],"a":"B","e":"<p>A listed company must be a plc but not all plc's have to be listed. If a company issues shares to the public, it may do this through an offer for subscription, an offer for sale or through a placing. A plc will have an authorised share capital that restricts how many shares it can issue.<\/p>"},{"s":4,"n":45,"id":"1066443","q":"<p>Which of the following would NOT be an intangible non-current asset?<\/p>","o":[{"l":"A","h":"Trademark"},{"l":"B","h":"Capitalised development costs"},{"l":"C","h":"Trade creditors"},{"l":"D","h":"Goodwill"}],"a":"C","e":"<p>Intangible non-current assets are those assets that, although without physical substance, can be separately identified and are capable of being sold. Ownership of an intangible non-current asset confers rights known as intellectual property. These rights give a company a competitive advantage over its peers and commonly include brand names, patents, trademarks, capitalised development costs and purchased goodwill.<\/p>"},{"s":4,"n":46,"id":"1065022","q":"<p>Which of the below would be classified as revenue expenditure?<\/p>","o":[{"l":"A","h":"Purchase of a company vehicle"},{"l":"B","h":"Purchase of a non - current asset"},{"l":"C","h":"Purchase of a current asset"},{"l":"D","h":"Purchase that immediately impacts the income statement"}],"a":"D","e":"<p>Revenue expenditure would impact the income statement. All other answers would be capital expenditure and would be captured on the balance sheet. Purchase of a current asset would not always be seen on the income statement unless it is sold in the accounting period as expenses are only recognised at the point of sale on the income statement.<\/p>"},{"s":4,"n":47,"id":"1066460","q":"<p>How would an investor determine the issuance price in an offer for subscription?<\/p>","o":[{"l":"A","h":"By auction"},{"l":"B","h":"By tender"},{"l":"C","h":"By the prospectus"},{"l":"D","h":"By book building"}],"a":"C","e":"<p>An offer for subscription involves the company sending a prospectus (including the share price) and an application form to potential investors.<\/p>"},{"s":4,"n":48,"id":"1078519","q":"<p>According to IFRS, what is NOT depreciated?<\/p>","o":[{"l":"A","h":"Delivery vehicles"},{"l":"B","h":"Leasehold land"},{"l":"C","h":"Freehold land"},{"l":"D","h":"Office desks"}],"a":"C","e":"<p>Freehold land does not normally wear out over time therefore it not depreciated, if it falls in value it is impaired.<\/p>"},{"s":4,"n":49,"id":"1078526","q":"<p>Under which of the following would companies that trade on the junior market be required to provide half yearly reports?<\/p>","o":[{"l":"A","h":"The exchange"},{"l":"B","h":"Companies Act"},{"l":"C","h":"Listing Rules"},{"l":"D","h":"IFRS"}],"a":"A","e":"<p>An AIM company must prepare a half-yearly report in respect of the six month period from the end of the financial period for which financial information has been disclosed in its admission document and at least every subsequent six months thereafter (apart from the final period of six months preceding its accounting reference date for its annual audited accounts). All such reports must be notified without delay and in any event not later than three months after the end of the relevant period.<\/p>"},{"s":4,"n":50,"id":"1055544","q":"<p>What would be the present value of a one year zero coupon bond with a nominal value of £100 if the interest rate is 5%?<\/p>","o":[{"l":"A","h":"£90.70"},{"l":"B","h":"£95.24"},{"l":"C","h":"£95.46"},{"l":"D","h":"£100"}],"a":"B","e":"<p>Discounted cash flow calculation:<br/> 100 / (1.05) = 95.24<\/p>"},{"s":4,"n":51,"id":"4062237","q":"<p>A trading venue is operating as a dark pool.<\/p><p>As a consequence, this venue is most likely to be engaged in:<\/p>","o":[{"l":"A","h":"Trades in high volumes"},{"l":"B","h":"Trades of low volumes"},{"l":"C","h":"Commodity trading"},{"l":"D","h":"Opaque trades"}],"a":"D","e":"<p>Dark pool is the term that refers to a trading system where stocks are traded without the order price being displayed until after the trade is complete. The term ‘dark’ is used to describe the fact that order price information cannot be seen.<\/p><p>A dark pool is a way you can capture lots of liquidity and achieve a large proportion of your order being executed without displaying anything to the market<\/p>"},{"s":4,"n":52,"id":"4062219","q":"<p>Which of the following statements regarding participating preference shares is FALSE?<\/p>","o":[{"l":"A","h":"They rank ahead of ordinary shares in respect of dividend entitlement"},{"l":"B","h":"They have additional rights to a company’s profits"},{"l":"C","h":"They give the holder pre-emptive rights in the issue of new shares"},{"l":"D","h":"They rank after debt in the event of the company’s liquidation"}],"a":"C","e":"<p>During a rights issue the preferred shareholders do not get to convert into the new shares at that time or generally at any time later. Should the preference shares be convertible preference shares the number of shares that they can convert into will be changed.<\/p>"},{"s":4,"n":53,"id":"1078804","q":"<p>A company is considering a follow-on offer. Which of the following would most likely dissuade the company?<\/p>","o":[{"l":"A","h":"Regulatory intervention"},{"l":"B","h":"The possible dilution of ownership"},{"l":"C","h":"The possibility of having to fund future dividends"},{"l":"D","h":"The prospect of a bear market"}],"a":"D","e":"<p>Issuing more shares in a follow-on offering will only be considered if the equity markets are sufficiently robust. In a bear market there is unlikely to be sufficient demand for the shares at the price the issuing company wants.<\/p>"},{"s":4,"n":54,"id":"1078523","q":"<p>The regulators suggest that portfolio managers use diversification to reduce which type of risk?<\/p>","o":[{"l":"A","h":"Systematic"},{"l":"B","h":"Market"},{"l":"C","h":"Specific"},{"l":"D","h":"Credit"}],"a":"C","e":"<p>The risk that can be removed is known as the specific or unsystematic risk.<\/p>"},{"s":4,"n":55,"id":"1065044","q":"<p>A 1-year zero coupon bond has a redemption value of 100. If its yield is 6%, what is its price?<\/p>","o":[{"l":"A","h":"94.00"},{"l":"B","h":"94.34"},{"l":"C","h":"99.40"},{"l":"D","h":"106.00"}],"a":"B","e":"<p>As this is a zero coupon bond, the price is the present value of the £100nv, discounted used the yield.<br/> £100 / 1.06 = £94.34<\/p>"},{"s":4,"n":56,"id":"1054647","q":"<p>When stock is lent through a stock borrowing and lending intermediary which is not true of the lender?<\/p>","o":[{"l":"A","h":"Will receive a fee"},{"l":"B","h":"Have the ability to sell the shares before settlement"},{"l":"C","h":"Be able to vote on an important resolution"},{"l":"D","h":"Will receive dividend income"}],"a":"B","e":"<p>This is a tricky question as much of it relies on interpretation. The lender will receive a fee and they will receive dividend income in the form of a manufactured dividend. They are not able to sell the shares. Voting is possible if the shares are recalled in a timely manner.<\/p>"},{"s":4,"n":57,"id":"4049371","q":"<p>Which of the following is the prime role of the primary markets?<\/p>","o":[{"l":"A","h":"To enable buyers of securities to meet sellers of securities on a transparent and liquid market"},{"l":"B","h":"To provide an assessment of a company's viability for listing on a main market"},{"l":"C","h":"To enable surplus funds to be matched against investment opportunities"},{"l":"D","h":"To provide an outlet for finished goods on the company's domestic markets"}],"a":"C","e":"<p>The primary market, or the new issues market, is where securities are issued for the first time. The primary markets exist to enable issuers of securities, particularly companies, to raise capital, and to enable the surplus funds held by potential investors to be matched with investment opportunities the issuers offer.<\/p>"},{"s":4,"n":58,"id":"1078527","q":"<p>What is the role of the regulator with regards to the trading of Official List securities?<\/p>","o":[{"l":"A","h":"To suspend trading or listing"},{"l":"B","h":"Advise companies on listing"},{"l":"C","h":"Promote the official list"},{"l":"D","h":"To provide liquidity"}],"a":"A","e":"<p>The FCA determines which companies are eligible to join the Official List, and writes and enforces the FCA Rules which apply to these companies through their UKLA role.<\/p>"},{"s":4,"n":59,"id":"1055550","q":"<p>Which one of the following is most likely to invest in money market instruments?<\/p>","o":[{"l":"A","h":"Pension Fund"},{"l":"B","h":"Life Insurance"},{"l":"C","h":"Banks"},{"l":"D","h":"Hedge Fund"}],"a":"C","e":"<p>Banks require short term, low risk investments.<\/p>"},{"s":4,"n":60,"id":"1067794","q":"<p>The price of a company's bond increases. This is most likely to have happened because of:<\/p>","o":[{"l":"A","h":"Announcement of excellent earnings by companies in its peer group"},{"l":"B","h":"An upgrade in its credit rating by a ratings agency"},{"l":"C","h":"Rumours of a takeover by a larger company"},{"l":"D","h":"An increase in the company's share price"}],"a":"B","e":"<p>The greatest concern of any bondholder is the possibility of default by the issuing company. The company's credit rating provides the most significant indication of its financial stability and general well-being.<\/p>"},{"s":4,"n":61,"id":"1067795","q":"<p>Which of the following best differentiates medium term notes (MTNs) from other bond issues?<\/p>","o":[{"l":"A","h":"They are cheaper"},{"l":"B","h":"They are more expensive"},{"l":"C","h":"Issuers make payments in kind"},{"l":"D","h":"Issuers use shelf registration"}],"a":"D","e":"<p>MTNs are issued on a scheduled funding basis. Shelf registration allows several issues to be authorised under one registration, allowing the company to roll out the issues over the next two years.<\/p>"},{"s":4,"n":62,"id":"1052035","q":"<p>Which of the following nominee accounts would best facilitate proxy voting at a company's annual general meeting?<\/p>","o":[{"l":"A","h":"Designated"},{"l":"B","h":"Omnibus"},{"l":"C","h":"Legal"},{"l":"D","h":"Pooled"}],"a":"A","e":"<p>Designated is where the nominee name also includes indicators to the beneficial owner. If corporate nominee was present then that would be a better answer, but given the options designated is the best option here.<\/p>"},{"s":4,"n":63,"id":"1052040","q":"<p>A company which has 10 million ordinary share holders and the shares are trading a 100p. End of year profit amount to £500,000 what is the P/E ratio?<\/p>","o":[{"l":"A","h":"10"},{"l":"B","h":"15"},{"l":"C","h":"20"},{"l":"D","h":"25"}],"a":"C","e":"<p>The P/E ratio is calculated by market price divided by earnings per share. Firstly we need to calculate the EPS. This achieved by profit available to shareholders divided by number of share holders; £500,000 divided by 10 million = £0.05 or 5p.<br/> The P/E ratio is 100p divided by 5p = 20x<\/p>"},{"s":4,"n":64,"id":"4062227","q":"<p>A syndicate of investment banks is marketing a new issue of shares for a pending flotation and some allocations have been made. XYZ ltd will target large institutional investors who are allocated 60% of the issue, whereas ABC ltd will target retail clients and some small institutions for the remaining 20%. ABC ltd.'s role in the syndicate would MOST likely be as:<\/p>","o":[{"l":"A","h":"Co-manager"},{"l":"B","h":"Book runner"},{"l":"C","h":"Co-lead manager"},{"l":"D","h":"Sponsor"}],"a":"C","e":"<p>If an financial institution has been given the 'sole' responsibility to issue to a particular geographical area or to a particular group of investors they would be called a co-lead manager. If all other institutions were appointed by the sponsor to issue to all clients at the same time, either in a market or multiple markets they would be known as co-managers<\/p>"},{"s":4,"n":65,"id":"1075607","q":"<p>Performance fees based on high water marks are most likely to be associated with:<\/p>","o":[{"l":"A","h":"Actively managed OEIC"},{"l":"B","h":"SICAV Umbrella Fund"},{"l":"C","h":"Hedge Fund"},{"l":"D","h":"Smart Beta Fund"}],"a":"C","e":"<p>Hedge funds typically levy performance-related fees which the investor pays if certain performance levels are achieved, The levels are referred to as 'High water Marks'. A high water mark is the highest value that an investment fund or account has ever reached. A hurdle rate is the minimum amount of profit or returns a hedge fund must earn before it can charge an incentive fee.<\/p>"},{"s":4,"n":66,"id":"1022036","q":"<p>The yen spot rate is 105.5. What is the three-month forward rate if interest rates in USA are at 2% pa, and 0.5% pa in Japan?<\/p>","o":[{"l":"A","h":"104.90"},{"l":"B","h":"105.90"},{"l":"C","h":"105.11"},{"l":"D","h":"106.11"}],"a":"C","e":"<p>The three-month forward rate would be calculated as follows.<br/> F/S = (1+r(var)) / (1+r(base))<br/> Remember to treat the rate as an annualised rate unless specifically told otherwise, so we would need to de-annualise this rate.<br/> F / 105.5 = (1 + 0.005 x 3/12) / (1 + 0.02 x 3/12)<br/> F = 0.99627 x 105.5<br/> F = 105.11<\/p>"},{"s":4,"n":67,"id":"1072171","q":"<p>Which of the below is NOT a non current asset?<\/p>","o":[{"l":"A","h":"A payment for a company above its net asset value"},{"l":"B","h":"Development costs"},{"l":"C","h":"Inventory"},{"l":"D","h":"Factory in construction"}],"a":"C","e":"<p>Inventory would be a current asset. A payment for a company above its net asset value and spending on development would be capitalised as intangible non-current assets. Non-current assets are those in long-term continuing use by the company.<\/p>"},{"s":4,"n":68,"id":"1065043","q":"<p>A fall in prices on the stock market would most likely be caused by a:<\/p>","o":[{"l":"A","h":"1% rise in commodity prices"},{"l":"B","h":"0.75% increase in the balance of payments"},{"l":"C","h":"0.25% rise in GDP"},{"l":"D","h":"0.5% rise in the Bank of England base rate."}],"a":"D","e":"<p>An increase in the base rate (and therefore in the cost of capital) would be most likely to have an effect on the stock market.<\/p>"},{"s":4,"n":69,"id":"4049367","q":"<p>Which of the following is true of a capital investment in a structured investment?<\/p>","o":[{"l":"A","h":"It is guaranteed under the Financial Services Compensation Scheme"},{"l":"B","h":"It provides tax free returns"},{"l":"C","h":"There are penalties if redeemed early"},{"l":"D","h":"It has low fees compared to similar investments"}],"a":"C","e":"<p>Most structured products run for a fixed term and there are penalties if the product is redeemed early. Although designed to be tax efficient, they are rarely tax free. The bespoke nature of the product often make the fees relatively high. There is no protection under the FSCS for structured investments.<\/p>"},{"s":4,"n":70,"id":"4062236","q":"<p>What is the key benefit of purchasing shares in an investment trust compared to a comparable unit trust?<\/p>","o":[{"l":"A","h":"Lower stamp duty reserve tax costs"},{"l":"B","h":"Improved liquidity"},{"l":"C","h":"Potential to invest at a discount to the net asset value"},{"l":"D","h":"Clarity of a single price to buy and sell"}],"a":"C","e":"<p>Investment trusts’ prices are dependent on supply and demand, the price of the shares can be lower than the NAV per share. This means investors can buy investment trust shares at a discount, while the income produced by the portfolio is based on the market value of the underlying investments. The income yield is, therefore, enhanced.<\/p>"},{"s":4,"n":71,"id":"1075606","q":"<p>Which one of the following is most likely to have a narrow spread between its bid and offer price, an annual management fee of 0.5% or less and investor would incur a stockbrokers commission when buying and selling?<\/p>","o":[{"l":"A","h":"ETF"},{"l":"B","h":"Unit Trust"},{"l":"C","h":"OEIC"},{"l":"D","h":"REIT"}],"a":"A","e":"<p>Shares in ETFs are bought and sold through a stockbroker on a stock exchange and exhibit the following<br/> charges:<br/> There is a spread between the price at which investors buy the shares and the price at which they can sell them. This can often be very narrow.<br/> An annual management charge is deducted from the fund, which is typically 0.5% or less.<br/> The investors pay stockbroker's commission when they buy and sell.<\/p>"},{"s":4,"n":72,"id":"1066458","q":"<p>A private company has produced projections for the coming year and their findings show that growth would only be possible by taking total control of a small public company. After considering a number of possible solutions which of the following would NOT be considered an appropriate financing method?<\/p>","o":[{"l":"A","h":"Issue of zero-coupon bonds"},{"l":"B","h":"An initial public offer"},{"l":"C","h":"Bank financing"},{"l":"D","h":"A follow-on offer"}],"a":"D","e":"<p>It is possible that a private company may raise funds by issuing shares to investors and an IPO could be considered. However, whereas a follow-on issue may be an acceptable mechanism for raising funds for existing public companies; a private company would not be able take advantage of this source of finance until an IPO has taken place.<br/> Borrowing is considered acceptable.<\/p>"},{"s":4,"n":73,"id":"4062255","q":"<p><\/p><p>Organisation X is acting as a dealer on a stock exchange. As a consequence, they are most likely to be operating as:<\/p>","o":[{"l":"A","h":"A hedge fund"},{"l":"B","h":"An investment bank"},{"l":"C","h":"A gilt market maker"},{"l":"D","h":"A custodian"}],"a":"C","e":"<p>The term dealer is used when a financial institution is trading in principal with its clients, typically the institution is also known as a market maker, even though also known as an investment bank the answer given would be the better description.<\/p><p>Acting as a dealer is often described as dealing as principal, because the dealer is taking a principal position by either buying or selling the securities. The dealer on an exchange can be referred to as acting as a market maker.<\/p>"},{"s":4,"n":74,"id":"4002927","q":"<p>Which of the following describes how corporate bonds being traded, along with their prices, can be discovered?<\/p>","o":[{"l":"A","h":"Dealers give prices within separate pools of liquidity"},{"l":"B","h":"Agents seek prices within dark pools of liquidity"},{"l":"C","h":"Agents can observe prices on organised trading facilities"},{"l":"D","h":"Dealers give prices within multi-lateral trading facilities"}],"a":"A","e":"<p>Dealing in corporate bonds tends to be away from the major exchanges in what is commonly described as a decentralised dealer market. The dealers provide liquidity by being willing to buy or sell the bonds. There are numerous systems that dealers use to display their willingness to deal, with each system being described as a separate pool of liquidity.<\/p>"},{"s":4,"n":75,"id":"4002944","q":"<p>According to the continuing obligations for UK listed companies, how frequently does a STANDARD listed UK company need to produce financial reports?<\/p>","o":[{"l":"A","h":"Every 3 months"},{"l":"B","h":"Every 6 months"},{"l":"C","h":"Every 9 months"},{"l":"D","h":"Every 12 months"}],"a":"B","e":"<p>Once listed, companies are expected to fulfil certain continuing obligations: they are obliged to issue a half-yearly report in addition to annual accounts, and they have to notify the market of any new, price sensitive information.<\/p>"},{"s":4,"n":76,"id":"1072134","q":"<p>Which of the following bonds pay an annual coupon?<\/p>","o":[{"l":"A","h":"Gilts"},{"l":"B","h":"Japanese Government Bonds"},{"l":"C","h":"OATs"},{"l":"D","h":"T-Bonds"}],"a":"C","e":"<p>OATs is a french government bond which pays coupons annually.<\/p>"},{"s":4,"n":77,"id":"1055546","q":"<p>An investor buys a gilt for settlement on 2nd January which has 90 days interest accrued. Upon which date will the investor receive the next coupon payment?<\/p>","o":[{"l":"A","h":"2nd January"},{"l":"B","h":"1st March"},{"l":"C","h":"1st April"},{"l":"D","h":"1st October"}],"a":"C","e":"<p>Gilts pay a coupon on a semi-annual basis.<br/> The gilt bought already has 90 days interest accrued, implying that the last coupon date was in early October. The next coupon date will be 6 months later on 1st April, based on the information within the question and the available dates.<\/p>"},{"s":4,"n":78,"id":"1078870","q":"<p>Which of the following would be considered a benefit of an investment trust over an authorised unit trust?<\/p>","o":[{"l":"A","h":"The ability to buy from and sell to the fund manager gives greater liquidity"},{"l":"B","h":"The fund manager can have a longer time horizon in terms of investment"},{"l":"C","h":"The value of the share is set at its net asset value"},{"l":"D","h":"Share price stability"}],"a":"B","e":"<p>Investment Trusts as closed-ended vehicles, the number of shares in issue in an investment trust is not affected by the day-to-day purchases and sales by investors, which allow the managers to take a long-term view of the investments of the trust. With an open-ended scheme, such as an OEIC, if there are more sales of units or shares by investors than purchases, the number of units reduces and the fund must pay out cash. As a result, the managers may need to sell investments, even though it may not be the best time to do so from a strategic and long-term viewpoint.<\/p><p>As secondary market shares, the shares of an investment trust company can suffer from volatility caused by changes in supply and demand.<\/p>"},{"s":4,"n":79,"id":"1065053","q":"<p>In an initial share offering, if the underwriter's contract contains a 'greenshoe' option this means that:<\/p>","o":[{"l":"A","h":"The underwriter has not made a firm commitment to sell all the shares"},{"l":"B","h":"The shares can be marketed exclusively to institutional investors"},{"l":"C","h":"The underwriter can amend the offering price"},{"l":"D","h":"The underwriter can offer an additional 15% of the shares if it chooses"}],"a":"D","e":"<p>If the underwriter feels that the offer is likely to be oversubscribed, it might request a greenshoe option.<\/p>"},{"s":4,"n":80,"id":"1079693","q":"<p>Which of the following would be a result of an increase in the equity risk premium on a share?<\/p>","o":[{"l":"A","h":"The return on the share falls"},{"l":"B","h":"The price of the share falls"},{"l":"C","h":"The risk-free rate rises"},{"l":"D","h":"Stock market indices rise"}],"a":"B","e":"<p>The equity risk premium is the additional return above the risk-free rate that equity holders require for taking the risk of equity. The risk premium increasing - all other things being equal - would result in the share prices falling.<\/p>"},{"s":4,"n":81,"id":"1078524","q":"<p>What is the minimum number of market makers for any share trading on an exchange's order driven system?<\/p>","o":[{"l":"A","h":"0"},{"l":"B","h":"1"},{"l":"C","h":"2"},{"l":"D","h":"3"}],"a":"A","e":"<p>An order driven system is characterised by buyers and sellers entering orders. There is no requirement for market makers, who one would associate with a quote driven system.<\/p>"},{"s":4,"n":82,"id":"4062220","q":"<p>Why would a financial analyst make use of ratio analysis when seeking to interpret the information that is available about a company?<\/p>","o":[{"l":"A","h":"To adhere to the principles of best practice"},{"l":"B","h":"To calculate the performance of the board"},{"l":"C","h":"To put the information into an understandable form"},{"l":"D","h":"To comply with the requirements of the Regulatory News Service"}],"a":"C","e":"<p>The purpose of ratio analysis is to summarise financial information into an easily understandable form.<\/p>"},{"s":4,"n":83,"id":"1078915","q":"<p>Which one of the following is considered a passive strategy?<\/p>","o":[{"l":"A","h":"Inter market switch"},{"l":"B","h":"Duration based immunisation"},{"l":"C","h":"Riding the yield curve"},{"l":"D","h":"Anomaly switching"}],"a":"B","e":"<p>Duration-based immunisation is a passive strategy and involves constructing a bond portfolio with the same initial value as the present value of the liability it is designed to meet and the same duration as this liability. A portfolio that contains bonds that are closely aligned in this way is known as a bullet portfolio.<\/p>"},{"s":4,"n":84,"id":"1072128","q":"<p>In a free float calculation, which of the following will not be considered?<\/p>","o":[{"l":"A","h":"Insider holdings"},{"l":"B","h":"Ownership which is greater than 3%"},{"l":"C","h":"All institutional investors"},{"l":"D","h":"Any shares traded over the counter"}],"a":"A","e":"<p>Free float represents all shares held by investors other than:<br/> Owners holding 5% or more of all shares<br/> Restricted stocks<br/> Insider holdings<\/p>"},{"s":4,"n":85,"id":"1079692","q":"<p>For which of the following reasons might an investment bank submit a stabilisation notice?<\/p>","o":[{"l":"A","h":"Share price has fallen below a certain level"},{"l":"B","h":"To increase supply in a weak market"},{"l":"C","h":"Lead manager is considering using a greenshoe option"},{"l":"D","h":"To utilise the risk-free rate"}],"a":"A","e":"<p>Stabilisation is the process whereby, to prevent a substantial fall in the value of securities when a large number of new securities are issued, the lead manager of the issue agrees to support the price by buying back the newly issued securities in the market if the market price falls below a certain predefined level. Disclosure is required for these trades.<\/p>"},{"s":4,"n":86,"id":"1078525","q":"<p>The behaviour rules for broker/dealer firms trading on an exchange would be overseen by:<\/p>","o":[{"l":"A","h":"The central bank"},{"l":"B","h":"The exchange"},{"l":"C","h":"The regulator"},{"l":"D","h":"The listing authority"}],"a":"B","e":"<p>Listing and disclosure rules are set and overseen by the United Kingdom Listing Authority (UKLA). However, day to day behaviour rules regarding trading etc. are overseen by the exchange.<\/p>"},{"s":4,"n":87,"id":"1066442","q":"<p>Revenue expenditure will have an initial impact on the:<\/p>","o":[{"l":"A","h":"cash flow statement"},{"l":"B","h":"income statement"},{"l":"C","h":"statement of financial position"},{"l":"D","h":"balance sheet"}],"a":"B","e":"<p>Revenue expenditure is money spent that immediately impacts the income statement. Examples of revenue expenditure include wages paid to staff, rent paid on property and professional fees, like audit fees.<\/p>"},{"s":4,"n":88,"id":"1065033","q":"<p>What is the pricing mechanism for shares of Exchange Traded Funds?<\/p>","o":[{"l":"A","h":"Valued once a day at the end of the day"},{"l":"B","h":"Valued once a week at the end of the week"},{"l":"C","h":"Valued at the point of the trade"},{"l":"D","h":"Value can be monitored continuously"}],"a":"D","e":"<p>ETFs are listed funds so one of their advantages is that investors can see real time prices.<\/p>"},{"s":4,"n":89,"id":"1046734","q":"<p>Dividend yield is defined as?<\/p>","o":[{"l":"A","h":"Earnings per share / dividend per share as a multiple"},{"l":"B","h":"Gross dividend / nominal price as a percentage"},{"l":"C","h":"Dividend / market price as a percentage"},{"l":"D","h":"Earnings per share / nominal dividend per share as a multiple"}],"a":"C","e":""},{"s":4,"n":90,"id":"1078520","q":"<p>Who sets the rules for members of an exchange governing their trading practices?<\/p>","o":[{"l":"A","h":"The regulator"},{"l":"B","h":"The exchange"},{"l":"C","h":"The listing authority"},{"l":"D","h":"The central bank"}],"a":"B","e":"<p>The exchange sets the rules for its member firms.<\/p>"},{"s":4,"n":91,"id":"1065048","q":"<p>Which of the following would be considered 'revenue expenditure'?<\/p>","o":[{"l":"A","h":"Payments to a firm providing security services"},{"l":"B","h":"Cost of extending warehouse and storage area"},{"l":"C","h":"Purchase of company-wide security systems"},{"l":"D","h":"Cost of purchasing new machinery"}],"a":"A","e":"<p>This is a day-to-day expense rather than capital expenditure.<\/p>"},{"s":4,"n":92,"id":"1079690","q":"<p>An investment bank has successfully completed a book-build for a company wishing to issue shares. What does this suggest?<\/p>","o":[{"l":"A","h":"They have allocated available shares to willing buyers"},{"l":"B","h":"They have discovered insufficient demand for the shares"},{"l":"C","h":"They have guaranteed the issue"},{"l":"D","h":"They have applied a listing authority for market acceptance"}],"a":"A","e":"<p>During the book-building, the investment bank or syndicate will gather the willingness of investors to purchase the shares. A successful completion of this exercise would suggest that available shares have been allocated to willing buyers.<\/p>"},{"s":4,"n":93,"id":"1047481","q":"<p>A company makes an operating loss of £13m. Their inventory decreased by £2m and their trade receivables and payables increased by £1m each. <br/> Based on this information alone, what is the net cash flow?<\/p>","o":[{"l":"A","h":"Minus £9m"},{"l":"B","h":"Minus £11m"},{"l":"C","h":"Minus £13m"},{"l":"D","h":"Minus £15m"}],"a":"B","e":"<p>The reduction in inventory frees up cash, so this can be added back to the minus £13m giving minus £11m. The trade receivables and payables cancel each other out<br/> Operating loss - £13m + Reduction in inventory +£2m - Increase in trade rec. -£1m + Increase in trade payables +£1m Net cash flow = -£11m<\/p>"},{"s":4,"n":94,"id":"1078917","q":"<p>Which one of the following would offer the greatest yield?<\/p>","o":[{"l":"A","h":"Subordinated debt"},{"l":"B","h":"Asset backed securities"},{"l":"C","h":"Guaranteed bonds"},{"l":"D","h":"Mezzanine debt"}],"a":"D","e":"<p>The mezzanine level of debt will be even more risky than the subordinated debt. It will rank below other forms of debt but above the equity in a liquidation. As the riskiest form of debt, the mezzanine debt will offer a greater rate of interest than the subordinated and senior levels of debt.<\/p>"},{"s":4,"n":95,"id":"4049385","q":"<p><\/p><p>The securities lending market developed to:<\/p>","o":[{"l":"A","h":"Cover settlement failure"},{"l":"B","h":"Provide leveraged execution"},{"l":"C","h":"Enhance returns in low interest environments"},{"l":"D","h":"Provide collateral for a loan"}],"a":"A","e":"<p>The initial driver for the securities lending business was to cover settlement failure. If one party fails to deliver stock to another on time, it can render that party unable to deliver the stock it has already sold onto another (third) party.<\/p>"},{"s":4,"n":96,"id":"4002943","q":"<p>Which of the following has the largest impact upon the price of a corporate bond?<\/p>","o":[{"l":"A","h":"The yield of the benchmark government bond"},{"l":"B","h":"The P/E ratio of the firm"},{"l":"C","h":"The share price of the firm"},{"l":"D","h":"The perceived future profits of the firm"}],"a":"A","e":"<p>The government bond markets are the facilities that enable investors to buy and sell bonds issued by the relevant government. They are important as they provide the benchmark yield against which the return provided by corporate bonds is judged.<\/p>"},{"s":4,"n":97,"id":"4002936","q":"<p>An institutional investor is looking to invest in a 'carry trade'. Which of the following describes such a trade?<\/p>","o":[{"l":"A","h":"They would need to borrow funds in a currency where there is a relatively high borrowing rate, and will invest those funds, after converting to another currency where there is a lower rate of interest available for short-term deposits"},{"l":"B","h":"Where they would try to fill in the gaps between yields for Treasury securities or Treasury coupon strips, since T-bills offered by the government are not available for every time period"},{"l":"C","h":"They would need to borrow funds in a currency where there is a relatively low borrowing rate, and will invest those funds, after converting to another currency where there is a higher rate of interest available for short-term deposits"},{"l":"D","h":"Where they would try to fill in the gaps between the spot rates of two different currencies. Since one currency might be significantly controlled by the government of that country and it is not available it the secondary market"}],"a":"C","e":"<p>A 'carry trade' describes large institutional investors such as hedge funds borrowing funds in a currency where there is a relatively low borrowing rate, e.g. the yen, and then investing those funds, after converting to another currency, e.g. Australian dollars, where there is a higher rate of interest available for short-term deposits. The spread between the borrowing cost and the interest-earning rate motivates the trade, but this will also affect currency cross rates.<\/p>"},{"s":4,"n":98,"id":"1052066","q":"<p>A company wishes to perform a 1 for 3 bonus issue. The cum-scrip price is £7.00. What will be the theoretical ex price?<\/p>","o":[{"l":"A","h":"£7.00"},{"l":"B","h":"£5.25"},{"l":"C","h":"£3.50"},{"l":"D","h":"£1.75"}],"a":"B","e":"<p>As this is a bonus issue the shares are offered free of charge. 3 shares at £7.00 = £21.00 divided by 4 = £5.25<\/p>"},{"s":4,"n":99,"id":"1048172","q":"<p>MR plc has 20m 10p ordinary shares in issue. The dividend is 8.32p per share, and the <br/> dividend yield is 8%. What is the market price per share?<\/p>","o":[{"l":"A","h":"£0.94"},{"l":"B","h":"£1.25"},{"l":"C","h":"£1.04"},{"l":"D","h":"£1.88"}],"a":"C","e":"<p>Dividend yield (8%) = 8.32p / share price<br/> Share price = 8.32 / 0.08 = 104p<\/p>"},{"s":4,"n":100,"id":"1052090","q":"<p>A life insurance company that wishes to gain long term capital growth would invest in which asset class?<\/p>","o":[{"l":"A","h":"Equity"},{"l":"B","h":"Bonds"},{"l":"C","h":"Money market"},{"l":"D","h":"Derivatives"}],"a":"A","e":"<p>Because of the long-term nature of life assurance business, the funds tend to be willing to invest in higher risk investments involving a heavy weighting in equity investments. Unlike pension funds, the income and the gains made within life assurance funds are subject to tax.<\/p>"},{"s":5,"n":1,"id":"1055539","q":"<p>Which one of the following is a description of a corporate nominee system?<\/p>","o":[{"l":"A","h":"An investor's shares are held in a designated nominee account"},{"l":"B","h":"An investor's shares are held in a pooled nominee account"},{"l":"C","h":"It is a hybrid which has characteristics of pooled and designated"},{"l":"D","h":"An investor's shares are held in the investor's own name within a nominee account"}],"a":"C","e":"<p>The corporate nominee is a halfway house between the pooled and the designated nominee structures offered by stockbrokers. It will result in a single entry for all the shareholders together in the company's register (like the pooled nominee) but beneath this the issuing company (or its registrar) will be aware of the individual holdings that make up the nominee. In a similar way to the designated nominee structure, the company will be able to forward separate dividend payments to each of the individual shareholders, as well as voting rights and other potential shareholder perks.<\/p>"},{"s":5,"n":2,"id":"1078883","q":"<p>A prime broker offers to cover a hedge funds short positions when they undertake a long/short strategy. Which of the following services is being used?<\/p>","o":[{"l":"A","h":"Securities lending and borrowing"},{"l":"B","h":"Rehypothecation"},{"l":"C","h":"Leveraged trade execution"},{"l":"D","h":"Core settlement"}],"a":"A","e":"<p>The typical services that are provided by a prime broker can include; securities lending and borrowing – e.g., to cover short positions in a hedge fund's long/short strategy.<\/p>"},{"s":5,"n":3,"id":"1054678","q":"<p>A company wishes to reduce its share price without it going below its nominal value. Which of these is the best course of action?<\/p>","o":[{"l":"A","h":"Rights issue"},{"l":"B","h":"Stock split"},{"l":"C","h":"Bonus issue"},{"l":"D","h":"Offer for subscription"}],"a":"B","e":"<p>Both a bonus issue and a stock split would reduce the stock price more than a rights issue. A stock split will also reduce the NV in similar ratio as the share price.<\/p>"},{"s":5,"n":4,"id":"1047489","q":"<p>On an electronic order book system, a market order to buy will:<\/p>","o":[{"l":"A","h":"Execute against the best priced buy orders immediately and if not completely filled will stay on the order book until the complete volume is filled"},{"l":"B","h":"Execute against the best priced sell orders immediately and if not completely filled will stay on the order book until the complete volume is filled"},{"l":"C","h":"Execute against the best priced buy orders immediately and if not completely filled the remainder will be cancelled"},{"l":"D","h":"Execute against the best priced sell orders immediately and if not completely filled the remainder will be cancelled"}],"a":"D","e":"<p>Market orders are executed immediately, and any unfilled portion is cancelled. They do not use a limit price - therefore if there is sufficient liquidity in the order book they will always be executed.<\/p>"},{"s":5,"n":5,"id":"1039421","q":"<p>An investor wishes to hold their investments in a nominee account that would best facilitate proxy voting at a company's general meetings. Which account would that be?<\/p>","o":[{"l":"A","h":"Designated nominee account"},{"l":"B","h":"Legal nominee account"},{"l":"C","h":"Individual nominee account"},{"l":"D","h":"Pooled nominee account"}],"a":"A","e":"<p>The designated nominee allows the beneficial owner greater power to stipulate holder rights and not to be held in one large pool.<\/p>"},{"s":5,"n":6,"id":"4062232","q":"<p>Issuers of government bonds can attempt to counter currency risk for potential investors by:<\/p>","o":[{"l":"A","h":"Issuing in a foreign currency"},{"l":"B","h":"Index linking coupons"},{"l":"C","h":"Paying interest in dollars"},{"l":"D","h":"Issuing zero coupon bonds"}],"a":"A","e":"<p>Investors wanting to reduce currency risk associated with emerging and frontier government bonds and wish to avoid bonds that are denominated in the local currency can select, for example US dollar-denominated bonds instead.<\/p>"},{"s":5,"n":7,"id":"1072566","q":"<p>Which of the following is the BEST description of revenue expenditure?<\/p>","o":[{"l":"A","h":"Money that can be apportion over a number of years"},{"l":"B","h":"Money paid as wages for external contractors improving a building"},{"l":"C","h":"Money spent that immediately impacts the income statement"},{"l":"D","h":"Money that is reflected on the balance sheet"}],"a":"C","e":"<p>Revenue expenditure is money spent that immediately impacts the income statement. Examples of revenue expenditure include wages paid to staff, rent paid on property and professional fees, like audit fees.<\/p>"},{"s":5,"n":8,"id":"1072571","q":"<p>A convertible bond that gives the holder the right to convert into 100 shares has a conversion price of £1.00. If the current share price is £3.00 and this market price falls, we would expect which of the following?<\/p>","o":[{"l":"A","h":"The conversion ratio to fall"},{"l":"B","h":"The market price of the bond to increase"},{"l":"C","h":"The conversion premium to fall"},{"l":"D","h":"The market price of the bond to fall"}],"a":"D","e":"<p>As the share price rises or falls, the value of the bond will rise or fall accordingly. This is a potential advantage/disadvantage to the holder of a convertible bond<\/p>"},{"s":5,"n":9,"id":"1046719","q":"<p>What is the purpose of an ICEBERG order?<\/p>","o":[{"l":"A","h":"To guarantee the order is filled"},{"l":"B","h":"To allow large orders to be executed at once"},{"l":"C","h":"For anonymity"},{"l":"D","h":"To reduce market impact"}],"a":"D","e":"<p>ICEBERG orders were introduced in September 2003 and are available on SETS and the international order book. Previously, market participants with large orders to execute would have been reluctant to route these through the order book because of the potentially adverse market impact.<br/> An ICEBERG order manages this problem by allowing the order to be partially hidden from the market view.<\/p>"},{"s":5,"n":10,"id":"4062267","q":"<p>The coupon of a bond is BEST described as the bond’s:<\/p>","o":[{"l":"A","h":"Running yield"},{"l":"B","h":"Redemption yield"},{"l":"C","h":"Interest rate"},{"l":"D","h":"Maturity value"}],"a":"C","e":"<p>A bond usually has a specified income stream in the form of coupon payments which will be paid to the holder of the bond, this is also known as interest payments<\/p>"},{"s":5,"n":11,"id":"1054663","q":"<p>Which of these will give a virtually guaranteed yield?<\/p>","o":[{"l":"A","h":"Gilt"},{"l":"B","h":"Floating Rate Note"},{"l":"C","h":"Convertible"},{"l":"D","h":"Linker"}],"a":"A","e":"<p>A Gilt is deemed to be free of default risk. The coupons and redemption value will remain constant and the bond is likely to run until maturity. A linker is not ncessarily a government index linked bond.<\/p>"},{"s":5,"n":12,"id":"1054658","q":"<p>Which of these is the cheapest way of issuing new shares?<\/p>","o":[{"l":"A","h":"Sale"},{"l":"B","h":"Placing"},{"l":"C","h":"Subscription"},{"l":"D","h":"Intermediaries offer"}],"a":"B","e":"<p>A placing is the least expensive method of issue as the prospectus is less detailed or may not be required at all.<\/p>"},{"s":5,"n":13,"id":"1058360","q":"<p>Which of the following best indicates the risk of a share you own performing poorly in relation to shares of other companies?<\/p>","o":[{"l":"A","h":"Market"},{"l":"B","h":"Sector"},{"l":"C","h":"Systemic"},{"l":"D","h":"Unsystematic"}],"a":"D","e":"<p>'Unsystematic risk' or 'specific risk' is the risk associated with a particular instrument. 'Sector risk', as the name suggests, applies to a particular sector (technology, retailers etc) while 'market risk', is the risk inherent in the market as a whole. 'Systemic risk' is the risk of collapse of our entire financial system and is not to be confused with 'systematic risk', which is the same as market risk.<\/p>"},{"s":5,"n":14,"id":"1054668","q":"<p>A company has bought a 51% stake in another organisation and is seeking to consolidate its accounts. How will it show the purchase above the fair value?<\/p>","o":[{"l":"A","h":"Amortisation"},{"l":"B","h":"Turnover"},{"l":"C","h":"Goodwill"},{"l":"D","h":"Revaluation reserves"}],"a":"C","e":"<p>Goodwill is the difference between the fair value of a purchase and the fair value of the identifiable assets.<\/p>"},{"s":5,"n":15,"id":"1052042","q":"<p>What is the role of a note trustee?<\/p>","o":[{"l":"A","h":"To represent the interests of holders of issues of securities, while providing guidance to the issuer"},{"l":"B","h":"To take charge of a security for the benefit of various secured parties"},{"l":"C","h":"To hold the shares in an issuing special purpose vehicle (SPV) in order to ensure off-balance-sheet treatment"},{"l":"D","h":"To provide for banks which need to resign because of conflicts of interest"}],"a":"A","e":"<p>To take charge of a security is a security trustee; to hold the shares in an issuing special purpose vehicle is a share trustee; and to provide for banks which need to resign would be the successor trustee.<\/p>"},{"s":5,"n":16,"id":"1072791","q":"<p>When shares are held together in an omnibus account the name on the company's register will be:<\/p>","o":[{"l":"A","h":"The registrar"},{"l":"B","h":"The parent of the nominee"},{"l":"C","h":"The company"},{"l":"D","h":"The nominee"}],"a":"D","e":"<p>Clients brought together with others in a pooled (omnibus) nominee have no visibility to the company: it is the single nominee name, covering multiple clients, which the company recognises. Importantly, from a voting perspective it is only the single bulk nominee that is entitled to vote; no separate entitlement accrues from the registrar's standpoint to each individual client making up the total holding.<\/p>"},{"s":5,"n":17,"id":"1078534","q":"<p>On exchange, if a trader executes a transaction using an electronic order driven system, how is the trade captured?<\/p>","o":[{"l":"A","h":"Manually reported by the member"},{"l":"B","h":"Automatically captured by the exchange"},{"l":"C","h":"Manually by the exchange"},{"l":"D","h":"There is no need to report this trade"}],"a":"B","e":"<p>If the trade is conducted on an electronic order driven system such as SETS, it will be captured automatically by the exchange. If the trade occurs off the order book, then it need to be manually reported by the member within 3 minutes.<\/p>"},{"s":5,"n":18,"id":"1052036","q":"<p>Which of the following is a dealer-to-dealer electronic market system?<\/p>","o":[{"l":"A","h":"TradeWeb"},{"l":"B","h":"BondVision"},{"l":"C","h":"MTS Cash"},{"l":"D","h":"Millennium"}],"a":"C","e":"<p>Both TradeWeb and BondVision are business to client platforms and Millennium is the electronic trading system for the London Stock Exchange.<\/p>"},{"s":5,"n":19,"id":"1065027","q":"<p>Which of the below bonds issued in the US provide local tax benefits and are often guaranteed by a monoline insurer?<\/p>","o":[{"l":"A","h":"Municipal bonds"},{"l":"B","h":"Agency bonds"},{"l":"C","h":"Supranational bonds"},{"l":"D","h":"government bonds"}],"a":"A","e":"<p>This is a characteristic of a municipal bonds. Agency bonds are issued by various agencies also in the US but have the backing of the US government. Supranational bonds are issued by supranational organisation such as IMF, World bank etc.<\/p>"},{"s":5,"n":20,"id":"1054676","q":"<p>Why might an investor purchase shares in a company?<\/p>","o":[{"l":"A","h":"To exert influence"},{"l":"B","h":"To force a merger"},{"l":"C","h":"To raise capital"},{"l":"D","h":"To issue rights"}],"a":"A","e":"<p>Strategic stakes may be accumulated to prevent a company being taken over by a competitor and exert an influence.<\/p>"},{"s":5,"n":21,"id":"1078865","q":"<p>With respect to the issuing company which of the following would be considered a benefit to issuing warrants rather ordinary shares?<\/p>","o":[{"l":"A","h":"They will be able to issue shares at a higher price"},{"l":"B","h":"It will ensure their employees are more motivated to work harder"},{"l":"C","h":"It will allow the company to recall these warrants at any time in the future preventing possible dilution of ownership"},{"l":"D","h":"They will be able to gain extra income when the warrants are traded in the secondary market"}],"a":"A","e":"<p>If the shares are currently trading at 77p each, the warrant owner has the right, but not the obligation, to buy shares at £1 each, then this will be at a higher than current price. The sale of warrants for cash will raise money for the company, and, if the warrants are exercised, then further capital will be raised by the company.<\/p>"},{"s":5,"n":22,"id":"1054643","q":"<p>Who issues UK Treasury Bills to investors?<\/p>","o":[{"l":"A","h":"The Bank of England"},{"l":"B","h":"Gilt Edged Market Makers"},{"l":"C","h":"The Department of the Treasury"},{"l":"D","h":"The Debt Management Office"}],"a":"D","e":"<p>T Bills are issued by the DMO<\/p>"},{"s":5,"n":23,"id":"1046452","q":"<p>The spot rate is currently 1EUR : 0.8900GBP. If the interest rates in the UK are 4% pa, and in the eurozone are 2% pa, calculate the six-month forward foreign exchange rate using interest rate parity.<\/p>","o":[{"l":"A","h":"0.8988GBP"},{"l":"B","h":"0.8813GBP"},{"l":"C","h":"0.9075GBP"},{"l":"D","h":"0.8729GBP"}],"a":"A","e":"<p>Firstly we would need to de-annualise the interest rates:<br/> UK = 4%/2 = 2% for six months Eur = 2%/2 = 1% for six months<br/> Then use the interest rate parity formula:<br/> F = (1+r.var) / (1+r.base) x spot (In the question the Euro is quoted as the '1' value and is therefore the base currency)<br/> F = 1.02/1.01 x 0.8900<br/> F = 0.8988<\/p>"},{"s":5,"n":24,"id":"1052085","q":"<p>Which of the following would be a suitable investment for a money market fund?<\/p>","o":[{"l":"A","h":"REITS"},{"l":"B","h":"Bonds"},{"l":"C","h":"Equity"},{"l":"D","h":"Bills"}],"a":"D","e":"<p>Money market funds invest in money market instruments, cash or near cash entities. A bill has a life of less than a year.<\/p>"},{"s":5,"n":25,"id":"1065067","q":"<p>An income statement (statement of profit and loss) would be best described as a:<\/p>","o":[{"l":"A","h":"Moving picture showing income and expenses over a given period of time."},{"l":"B","h":"Statement of financial position at a specific time"},{"l":"C","h":"Summary of all profits and losses since incorporation"},{"l":"D","h":"Statement of a company's income in relation to its current financial position."}],"a":"A","e":"<p>The income statement or statement of profit and loss and other comprehensive income covers a specific period, such as a quarter or a year, rather than since incorporation. It is designed to show the company's financial performance over that particular timeframe. Companies typically produce statements to provide regular updates on their revenue, expenses and profit or loss.<\/p>"},{"s":5,"n":26,"id":"1054655","q":"<p>Which of these allows rights to be sold at the 'nil paid price'?<\/p>","o":[{"l":"A","h":"Rights Issue"},{"l":"B","h":"Capitalisation Issue"},{"l":"C","h":"Open Offer"},{"l":"D","h":"Initial Public Offer"}],"a":"A","e":"<p>The Nil Paid Price is the price that a right can be sold at during a rights issue. Rights cannot be sold by the investor in an open offer. Capitalisation issues would lead to new shares that could be sold at market price. Letter of acceptance are provided as part of an IPO.<\/p>"},{"s":5,"n":27,"id":"1046706","q":"<p>Following instructions from your client you sold stock on 14 March. On 21 April, your client tells you that he has been paid a dividend relating to this stock. The ex-div date was 16 March. What do you advise your client?<\/p>","o":[{"l":"A","h":"Report it to company registrar"},{"l":"B","h":"Report to exchange"},{"l":"C","h":"Bank the cheque and await a claim"},{"l":"D","h":"Bank the cheque and keep"}],"a":"C","e":"<p>This is not to be confused with the longest time allowed for settlement, which is T + 25. Once the dividend has been paid then a claim can arise from the buyer or buyer's broker.<\/p>"},{"s":5,"n":28,"id":"1047493","q":"<p>The purpose of stabilisation is:<\/p>","o":[{"l":"A","h":"To prevent volatility across the market to encourage investors to buy and hold the shares"},{"l":"B","h":"To give financial support to new companies to prevent them going into liquidation"},{"l":"C","h":"To distribute the demand on different companies' shares equally to prevent certain sectors falling in price too quickly"},{"l":"D","h":"To reduce volatility in a company's shares in order to prevent the impact of panic selling"}],"a":"D","e":"<p>During a period of stabilisation a lead manager will go into the market to buy up shares to support the share price. Stabilisation occurs after an initial public offer to prevent the share price falling too much and to ensure that panic selling does not occur.<\/p>"},{"s":5,"n":29,"id":"1046733","q":"<p>A yield curve shows:<\/p>","o":[{"l":"A","h":"The yields offered on varying bonds against the maturities of those bonds"},{"l":"B","h":"The yields offered on varying bonds against the coupon of those bonds"},{"l":"C","h":"The price of a bond under different situations"},{"l":"D","h":"The yields offered on the same bonds against the prices of those bonds"}],"a":"A","e":""},{"s":5,"n":30,"id":"4062225","q":"<p>All of the following statements are TRUE of pension funds EXCEPT:<\/p>","o":[{"l":"A","h":"They tend to invest in assets such as equities and property"},{"l":"B","h":"They expect a low financial return"},{"l":"C","h":"They require that some assets are kept in liquid form"},{"l":"D","h":"They can accommodate portfolios with a fairly high degree of risk"}],"a":"B","e":"<p>The relative risk profile of a pension fund would be high which would hopefully achieve greater financial returns<\/p>"},{"s":5,"n":31,"id":"1066454","q":"<p>Gilt inter-dealer brokers are:<\/p>","o":[{"l":"A","h":"matching agents"},{"l":"B","h":"permitted to trade as agents or in principal"},{"l":"C","h":"firms who introduce GEMMs who are willing to trade"},{"l":"D","h":"usually a division of a firm who has dual capacity to trade"}],"a":"A","e":"<p>Gilt IDBs arrange deals between gilt-edged market makers anonymously. They are not allowed to take principal positions, and the identity of the market makers using the service remains anonymous at all times. The IDB will act as agent, but settle the transaction as if it were the principal. The IDB is only allowed to act as a broker between GEMMs, and has to be a separate company and not a division of a broker/dealer.<\/p>"},{"s":5,"n":32,"id":"4004399","q":"<p>Why do non-controlling interests needs to be disclosed in group accounts?<\/p>","o":[{"l":"A","h":"Group accounts only consider the parent's assets, liabilities and revenues, so a separate disclosure is needed"},{"l":"B","h":"Group accounts consider the the whole groups assets, liabilities and revenues, so a separate identification is needed"},{"l":"C","h":"Group accounts are a collection of statements for each subsiary company, where identification of non-controlling interests is clear"},{"l":"D","h":"There is no need to disclose non-controlling interests in group account where the parent does not hold 100% of the subsidiary"}],"a":"B","e":"<p>As the presentation of the group accounts adds together all of the assets and liabilities of the subsidiaries into one statement, it includes some net assets that belong to the minority interests. These are reflected by detailing the extent to which the net assets and net income belong to the non-controlling interests in the consolidated statement of financial position and the group income statement.<\/p>"},{"s":5,"n":33,"id":"1065023","q":"<p>Which ratio below measures income return based on the value of the shares?<\/p>","o":[{"l":"A","h":"Earnings per share"},{"l":"B","h":"Dividend cover"},{"l":"C","h":"Dividend yield"},{"l":"D","h":"Price earnings ratio"}],"a":"C","e":"<p>Dividend yield = dividend per share / market price per share<\/p>"},{"s":5,"n":34,"id":"4062273","q":"<p>Why would an investor prefer to use a net total return index as a yardstick rather than a price return index?<\/p>","o":[{"l":"A","h":"Real rates of return adopted"},{"l":"B","h":"The effects of front-end charging are eliminated"},{"l":"C","h":"It reflects the effects of daily compounding"},{"l":"D","h":"Dividends are taken into account"}],"a":"D","e":"<p>Some indices can have multiple versions, for example: A price return, which measures the price performance and, therefore, disregards income from dividends A total return, which measures the performance of both price return and dividend reinvestment A net total return, which accounts for dividend reinvestment after the deduction of a withholding tax.<\/p>"},{"s":5,"n":35,"id":"1078909","q":"<p>A company which has a high interest cover can mean that:<\/p>","o":[{"l":"A","h":"Lenders will likely refuse to lend the company more money"},{"l":"B","h":"There is a high proportion of debt on their statement of financial position"},{"l":"C","h":"Lenders will be likely to lend the company more money"},{"l":"D","h":"The company is in a much better position to cover its short-term than long term debt"}],"a":"C","e":"<p>The interest coverage ratio is a debt ratio and profitability ratio used to determine how easily a company can pay interest on its outstanding debt. The higher the ratio the easier it is for the company to service its interest expense. The interest coverage ratio may be calculated by dividing a company's earnings before interest and taxes (EBIT) during a given period by the company's interest payments due within the same period.<\/p>"},{"s":5,"n":36,"id":"4062239","q":"<p>A prime broker is undertaking trades on a fund’s behalf that are partly financed by borrowed funds.<\/p><p>Which type of service is the broker providing?<\/p>","o":[{"l":"A","h":"Securities lending and borrowing"},{"l":"B","h":"Leveraged trade execution"},{"l":"C","h":"Core settlement"},{"l":"D","h":"Rehypothecation"}],"a":"B","e":"<p>Undertaking trades on the fund’s behalf that are partly financed by borrowed funds is leveraged trade execution.<\/p>"},{"s":5,"n":37,"id":"1052110","q":"<p>Why might the yield curve be inverted?<\/p>","o":[{"l":"A","h":"Long dated yields are less volatile than short dated yields"},{"l":"B","h":"Long dated yields are high, and not expected to fall"},{"l":"C","h":"Short dated yields are high, but expected to fall"},{"l":"D","h":"Short dated yields are lower than long dated yields"}],"a":"C","e":"<p>The existence of an inverted yield curve does not remove any liquidity preference, but the impact of the anticipated interest rate fall outweighs the effect of the liquidity preference.<\/p>"},{"s":5,"n":38,"id":"4049387","q":"<p>A trader spends £10,000 on an 8% bond. The market price is £200. What is the annual coupon received by the investor?<\/p>","o":[{"l":"A","h":"£200"},{"l":"B","h":"£400"},{"l":"C","h":"£800"},{"l":"D","h":"£1
