<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>FCA Securities Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky score header; question card + navigator grid (sidebar on wide screens, below on narrow) */
:root{
  --bg:#0A0D13; --surface:#11161F; --surface-2:#171E2A; --line:#232C3B; --line-2:#2F3A4D;
  --fg:#E9EDF4; --muted:#8B96AB; --accent:#D6B46C; --accent-ink:#1B1508; --accent-soft:rgba(214,180,108,.12);
  --good:#41C484; --good-bg:rgba(65,196,132,.13); --good-line:rgba(65,196,132,.55);
  --bad:#F06464; --bad-bg:rgba(240,100,100,.13); --bad-line:rgba(240,100,100,.55);
  --shadow:0 18px 50px -24px rgba(0,0,0,.7);
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#EDF0F5; --line:#DCE1EA; --line-2:#C9D0DC;
  --fg:#111722; --muted:#5A6478; --accent:#8F6A1F; --accent-ink:#FFFFFF; --accent-soft:rgba(143,106,31,.10);
  --good:#178A51; --good-bg:rgba(23,138,81,.10); --good-line:rgba(23,138,81,.55);
  --bad:#C93434; --bad-bg:rgba(201,52,52,.09); --bad-line:rgba(201,52,52,.5);
  --shadow:0 14px 40px -22px rgba(20,30,50,.25); color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#EDF0F5; --line:#DCE1EA; --line-2:#C9D0DC;
  --fg:#111722; --muted:#5A6478; --accent:#8F6A1F; --accent-ink:#FFFFFF; --accent-soft:rgba(143,106,31,.10);
  --good:#178A51; --good-bg:rgba(23,138,81,.10); --good-line:rgba(23,138,81,.55);
  --bad:#C93434; --bad-bg:rgba(201,52,52,.09); --bad-line:rgba(201,52,52,.5);
  --shadow:0 14px 40px -22px rgba(20,30,50,.25); color-scheme:light; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.01em;line-height:1}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-left:clamp(0px,2vw,20px)}
.tab{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.sync{font-size:11px;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
.icon-btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:16px;height:16px}

.gauge{flex:1 1 100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding-bottom:12px}
.gauge .pct{font-family:var(--f-display);font-size:38px;line-height:.9;min-width:3.2ch;font-variant-numeric:tabular-nums}
.gauge .pct small{font-size:20px;color:var(--muted)}
.gauge .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.track{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,var(--bad)),var(--accent) 45%,var(--good));background-size:var(--bgw,100%) 100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.track.progress{height:4px;margin-top:6px}
.track.progress .fill{background:var(--muted);opacity:.6}
.gauge .counts{font-size:12px;color:var(--muted);text-align:right;line-height:1.35}
.gauge .counts b{color:var(--fg);font-weight:700}
.gauge .counts .g{color:var(--good)} .gauge .counts .r{color:var(--bad)}

main.page{padding-block:28px 64px}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-line);background:transparent}

/* Home */
.hero{display:grid;gap:6px;margin-bottom:26px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,6vw,64px);line-height:1;margin:0;text-wrap:balance}
.hero h1 em{color:var(--accent)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.home-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.home-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.resume{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:20px 22px;border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:linear-gradient(135deg,var(--accent-soft),transparent 60%),var(--surface);margin-bottom:20px}
.resume .txt{flex:1 1 260px;min-width:0}
.resume h3{margin:4px 0 2px;font-size:18px}
.resume p{margin:0;color:var(--muted);font-size:13px}
.resume .acts{display:flex;gap:8px;flex-wrap:wrap}
.setup{padding:24px}
.setup h2,.hist h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:4px 0 18px;line-height:1.05}
.field{display:grid;gap:10px;margin-bottom:24px}
.field-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.count-big{font-family:var(--f-display);font-size:52px;line-height:.9;font-variant-numeric:tabular-nums}
.count-big small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--surface-2) var(--p,50%));border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--surface-2) var(--p,50%));border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:-10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.presets,.chips,.seg{display:flex;flex-wrap:wrap;gap:8px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.chap{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.chap:hover{color:var(--fg);border-color:var(--line-2)}
.chap .cn{font-size:11px;color:var(--accent)}
.chap .ct{min-width:0;font-weight:600}
.chap .cq{font-size:11px;opacity:.75}
.chap[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chap[aria-pressed="true"] .ct::after{content:" ✓";color:var(--accent)}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.num-in{width:84px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:7px 10px;font:600 14px var(--f-mono);color:var(--fg)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}

.hist{padding:24px}
.hist-empty{color:var(--muted);font-size:14px;border:1px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center}
.hist-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.hist-stats div{background:var(--surface-2);border-radius:12px;padding:12px}
.hist-stats b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1}
.hist-stats span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.table-scroll{overflow-x:auto;max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:10px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td.sc{font-weight:800}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.pill.g{background:var(--good-bg);color:var(--good)} .pill.m{background:var(--accent-soft);color:var(--accent)} .pill.r{background:var(--bad-bg);color:var(--bad)}

/* Quiz */
.quiz{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.quiz{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
  .navp{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,140px) + 16px);max-height:calc(100vh - var(--hh,140px) - 40px);display:flex;flex-direction:column}}
.qcard{padding:clamp(18px,3vw,32px);min-width:0;scroll-margin-top:calc(var(--hh,140px) + 12px)}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px}
.qnum{font-family:var(--f-display);font-size:22px;line-height:1}
.qnum small{color:var(--muted);font-size:16px}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.review-banner{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 10px}
.stem{font-size:clamp(17px,2vw,20px);font-weight:600;line-height:1.5;margin-bottom:20px;max-width:72ch}
.stem p{margin:0 0 .6em}
.stem ul{margin:.2em 0 .7em;padding-left:1.3em}
.stem img{border-radius:10px;border:1px solid var(--line);background:#fff;margin:6px 0}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr) 24px;gap:14px;align-items:center;text-align:left;border:1px solid var(--line-2);background:var(--surface-2);border-radius:14px;padding:12px 14px;transition:border-color .15s,background .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.opt:disabled{cursor:default}
.opt .L{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:700 14px var(--f-mono);background:var(--surface);border:1px solid var(--line-2)}
.opt .T{min-width:0;font-size:15px}
.opt .ico{font-weight:800;font-size:16px;text-align:center}
.opt.ok{border-color:var(--good-line);background:var(--good-bg)}
.opt.ok .L{background:var(--good);color:#fff;border-color:var(--good)}
.opt.ok .ico{color:var(--good)}
.opt.ko{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.ko .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.ko .ico{color:var(--bad)}
.opt.dim{opacity:.55}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opt.ko.anim{animation:shake .3s}
.expl{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.verdict{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;margin-bottom:10px}
.verdict.g{color:var(--good)} .verdict.r{color:var(--bad)}
.ans-line{font-size:14px;margin:0 0 12px}
.ans-line strong{color:var(--good)}
.expl h4{margin:0 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.expl-body{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14.5px;max-width:78ch}
.expl-body p{margin:0 0 .65em} .expl-body p:last-child{margin-bottom:0}
.expl-body .none{color:var(--muted);font-style:italic}
.qfoot{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;align-items:center}
.qfoot .sp{flex:1}
.kbd{font-size:11.5px;color:var(--muted)}
@media(max-width:640px){.kbd{display:none}}

.navp{padding:18px;min-width:0}
.navp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.navp-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line-2)}
.legend .g i{background:var(--good);border-color:var(--good)} .legend .r i{background:var(--bad);border-color:var(--bad)}
.navp .chips{margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;overflow-y:auto;padding:2px;min-height:0}
@media(max-width:999px){.grid{max-height:340px}}
.cell{height:36px;border-radius:9px;border:1px solid var(--line-2);background:transparent;font:600 12px var(--f-mono);color:var(--muted);padding:0}
.cell:hover{border-color:var(--accent);color:var(--fg)}
.cell.g{background:var(--good);border-color:var(--good);color:#fff}
.cell.r{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);color:var(--fg)}
.cell.g.cur,.cell.r.cur{color:#fff}
.navp .finish{margin-top:14px;width:100%}
.empty-filter{font-size:13px;color:var(--muted);padding:10px 0}

/* Mocks */
.mocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.mock{padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.mock.live{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.mock-n{font-family:var(--f-display);font-size:64px;line-height:.8;color:var(--accent)}
.mock-t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mock h3{margin:0;font-size:16px}
.mock .sub{font-size:12px;color:var(--muted)}
.mock dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0}
.mock dl div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.mock dt{font-size:10px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;color:var(--muted)}
.mock dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.mock .btn{width:100%;margin-top:auto}
.mock .lock{font-size:11.5px;color:var(--muted);text-align:center;margin:-6px 0 0}
.status{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.status.live{background:var(--accent-soft);color:var(--accent)}
.status.done{background:var(--good-bg);color:var(--good)}
.status.new{background:var(--surface-2);color:var(--muted)}
.mock .mini{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.mock .mini i{display:block;height:100%;background:var(--accent)}

/* Results */
.results{padding:clamp(22px,4vw,40px);display:grid;gap:22px;max-width:880px;margin:0 auto}
.res-top{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.ring{width:150px;height:150px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:44px}
.res-top h2{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,5vw,46px);margin:4px 0 6px;line-height:1}
.res-top p{margin:0;color:var(--muted)}
.res-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.res-stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.res-stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05}
.res-stats span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.res-acts{display:flex;gap:10px;flex-wrap:wrap}
.saved{font-size:13px;color:var(--good);font-weight:700}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,14,.6);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{max-width:440px;width:100%;padding:24px}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 8px;line-height:1.1}
.modal p{color:var(--muted);margin:0 0 20px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:760px){.tabs{order:3;flex:1 1 100%;margin-left:0}.tab{flex:1}.gauge{order:4}}
@media(max-width:560px){.gauge .pct{font-size:30px}.gauge{gap:10px;padding-bottom:10px}.brand span{display:none}.hist-stats b{font-size:22px}
  .icon-btn span,.sync span{display:none}.icon-btn{padding:0 10px}.top-row{padding-block:10px;gap:10px}.brand b{font-size:22px}
  .gauge .lbl span:first-child{display:none}.gauge .lbl{justify-content:flex-start}}
</style>

<header class="top" id="hdr">
  <div class="wrap top-row">

<script type="application/json" id="qdata">[{"s":1,"n":1,"id":"1057291","q":"<p>Which of the following BEST describes the person who looks after the assets of an investment manager?<\/p>","o":[{"l":"A","h":"Prime banker"},{"l":"B","h":"Depository"},{"l":"C","h":"Trustee"},{"l":"D","h":"Custodian"}],"a":"D","e":"<p>CUSTODIANS: offer safekeeping and administration services in relation to investment portfolios.<\/p><p>Both custodians and depositaries offer safekeeping; however, custodians offer extra administration services, depositaries do not. The question specifically refers to looking after the assets of an investment manager - a core service of a custodian.<\/p><p>Please note that for hedge funds it is a Prime Broker that provides safe keeping / custody services, not a custodian.<\/p>"},{"s":1,"n":2,"id":"1076708","q":"<p>Central Banks have control over which of the following?<\/p>","o":[{"l":"A","h":"Setting short-term interest rates"},{"l":"B","h":"Issuance of commercial paper"},{"l":"C","h":"Regulating credit card providers"},{"l":"D","h":"Issuing debentures to public authorities"}],"a":"A","e":"<p>Central banks typically have responsibility for setting a country's or a region's short-term interest rate, controlling the money supply, acting as banker and lender of last resort to the banking system and managing the national debt.<\/p>"},{"s":1,"n":3,"id":"1066366","q":"<p>A corporation wishing to raise capital will initially enlist the services of:<\/p>","o":[{"l":"A","h":"An investment bank"},{"l":"B","h":"A broker"},{"l":"C","h":"A third party administrator"},{"l":"D","h":"A credit agency"}],"a":"A","e":"<p>The investment bank will initally structure the deal to raise capital for the company<\/p>"},{"s":1,"n":4,"id":"1052312","q":"<p>Which of the following would BEST describe the role of an investment bank?<\/p>","o":[{"l":"A","h":"Custody services"},{"l":"B","h":"Offering mortgages"},{"l":"C","h":"Advising on a merger"},{"l":"D","h":"Providing life assurance"}],"a":"C","e":"<p>The roles of an investment bank are: corporate finance and advisory work, such as mergers; banking for governments, institutions and large companies; investment management and securities trading.<\/p>"},{"s":1,"n":5,"id":"1004983","q":"<p>Advice on takeovers and corporate finance is usually given by:<\/p>","o":[{"l":"A","h":"A wholesale bank"},{"l":"B","h":"An investment bank"},{"l":"C","h":"A central bank"},{"l":"D","h":"A retail bank"}],"a":"B","e":"<p>An investment bank, sometimes called a merchant bank, gives advice on takeovers and corporate finance.<\/p>"},{"s":1,"n":6,"id":"4025851","q":"<p>Which one of the following would NOT come under the heading of \"Fintech\"?<\/p>","o":[{"l":"A","h":"Making a payment using your mobile phone"},{"l":"B","h":"Checking your bank statement using the internet"},{"l":"C","h":"Setting up an investment account with a Robo Advisor service"},{"l":"D","h":"Telephoning your broker to place an order to buy shares"}],"a":"D","e":"<p>Using the telephone to place an order is considered to be a traditional method of dealing. The other three come under the heading of fintech.<\/p>"},{"s":1,"n":7,"id":"1073307","q":"<p>A firm that provides safe keeping and administration to funds is called:<\/p>","o":[{"l":"A","h":"A fund manager"},{"l":"B","h":"A trustee"},{"l":"C","h":"A custodian"},{"l":"D","h":"A depository"}],"a":"C","e":"<p>Custodians are banks that specialise in safe custody services, looking after portfolios of shares and bonds on behalf of others, such as fund managers, pension funds and insurance companies.<\/p>"},{"s":1,"n":8,"id":"1004991","q":"<p>Which of the following statements are TRUE of the wholesale/professional market?<\/p><p><strong>I<\/strong><\/p><p>Involves large trades<\/p><p><strong>II<\/strong><\/p><p>Investors are considered knowledgeable<\/p><p><strong>III<\/strong><\/p><p>Investors are private<\/p><p><strong>IV<\/strong><\/p><p>Includes retail banking<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"I and II"},{"l":"C","h":"II and III"},{"l":"D","h":"I and IV"}],"a":"B","e":"<p>The wholesale market involves institutional clients who are considered knowledgeable and place large orders.<\/p>"},{"s":1,"n":9,"id":"1075566","q":"<p>Which one of the following institutions would most likely manage cash transactions and perform foreign exchange transactions on behalf of clients, whilst also looking after securities which belong to those clients and ensuring they are properly protected.<\/p>","o":[{"l":"A","h":"Investment Bank"},{"l":"B","h":"Custodian Bank"},{"l":"C","h":"Insurance Company"},{"l":"D","h":"Private Bank"}],"a":"B","e":"<p>Custodians are banks that specialise in safe custody services, looking after portfolios of shares and bonds on behalf of others. This would include cash transactions, for example paying for shares bought by clients and FX deals if the stock was in a foreign currency.<\/p>"},{"s":1,"n":10,"id":"1048094","q":"<p>What would be the title of the company that looks after the assets of pension funds and charities?<\/p>","o":[{"l":"A","h":"Custodian"},{"l":"B","h":"Settlor"},{"l":"C","h":"Authorised corporate director"},{"l":"D","h":"Trust investment manager"}],"a":"A","e":"<p>A custodian is a depository and looks after assets.<\/p>"},{"s":1,"n":11,"id":"1074646","q":"<p>What type of service is one where a firm simply processes the orders given directly by the client?<\/p>","o":[{"l":"A","h":"Execution only"},{"l":"B","h":"Discretionary"},{"l":"C","h":"Dealing with Advice"},{"l":"D","h":"Robo advice"}],"a":"A","e":"<p>Where a firm simply processes the orders given by the client and no advice is offered is called execution only.<\/p>"},{"s":2,"n":1,"id":"1001920","q":"<p>A company has net assets of £1,000. The nominal value of its ordinary shares is £1 and there are 500 in issue. The nominal value of its preference shares is also £1 and there are 300 in issue. If wind-up costs are £90 and, just before the company was delisted and liquidation procedures began the preference shares were trading at 120p, how much will be left to pay-off the ordinary shareholders?<\/p>","o":[{"l":"A","h":"£610"},{"l":"B","h":"£550"},{"l":"C","h":"£500"},{"l":"D","h":"£0"}],"a":"A","e":"<p>Preference shareholders receive the nominal value of the share on winding-up, so the ordinary shareholders receive £1,000 - £300 - £90 = £610.<\/p>"},{"s":2,"n":2,"id":"1054646","q":"<p>The authorised share capital sets out:<\/p>","o":[{"l":"A","h":"The maximum dividend that can be paid to shareholders"},{"l":"B","h":"The maximum number of shares that can be issued to shareholders, valued at nominal value"},{"l":"C","h":"How many shares have been allotted to shareholders"},{"l":"D","h":"Who is authorised to hold shares"}],"a":"B","e":"<p>Authorised share capital is the maximum number of shares a company is permitted to issue, multiplied by the nominal value per share. Authorised share capital can only be changed by the approval of shareholders.<\/p>"},{"s":2,"n":3,"id":"1001101","q":"<p>Which two statements are true of cumulative preference shares?<\/p><p><strong>I<\/strong><\/p><p>Dividends can be paid from undistributed profits<\/p><p><strong>II<\/strong><\/p><p>Dividends can be ignored if they are not paid in any one year<\/p><p><strong>III<\/strong><\/p><p>They receive priority over unsecured loan stock on a liquidation<\/p><p><strong>IV<\/strong><\/p><p>Directors may withhold the annual dividend<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"II and IV"},{"l":"C","h":"I and IV"},{"l":"D","h":"II and III"}],"a":"C","e":"<p>If a company cannot afford to pay a dividend on a cumulative preference share, the dividend will be 'accumulated' - the shareholder will be eligible for a 'double dividend' in the next year.<\/p>"},{"s":2,"n":4,"id":"1047480","q":"<p>A company wishes to raise new capital to fund long term expansion. It does not expect to make profit in the early years of this expansion so does not want to be tied down to funding obligations. <br/> Which of the following would be the best to issue?<\/p>","o":[{"l":"A","h":"Ordinary shares"},{"l":"B","h":"Debentures"},{"l":"C","h":"Commercial paper"},{"l":"D","h":"Subordinated loan stock"}],"a":"A","e":"<p>The company is looking for long term finance which eliminates commercial paper. <br/> A funding obligation is a requirement to make regular cash payments, such as a bond coupon. Debt such as debentures and loan stock have funding obligations and therefore do not meet the company's requirements. <br/> The directors of a company are not required to pay an ordinary dividend in any given year. Ordinary shares, therefore, do not have a funding requirement.<\/p>"},{"s":2,"n":5,"id":"1016223","q":"<p>An investor has bought ordinary shares in a company that has now become insolvent. What pay-out will the investor's ordinary shares receive if there are sufficient funds?<\/p>","o":[{"l":"A","h":"The nominal value of the share"},{"l":"B","h":"The fair value of the asset that the share was secured against"},{"l":"C","h":"The market price of the share at the point insolvency was declared"},{"l":"D","h":"Any surplus after all others have been paid"}],"a":"D","e":"<p>Ordinary shareholders only receive a pay-out after all others have been paid. If there are sufficient funds to create a surplus after this, they will receive that surplus.<\/p>"},{"s":2,"n":6,"id":"1001107","q":"<p>Which of the following is NOT true of preference shares?<\/p>","o":[{"l":"A","h":"In case of liquidation, holders of preference shares have priority in terms of the payment of nominal value over ordinary shareholders"},{"l":"B","h":"In case of liquidation, holders of preference shares have priority in terms of the payment of dividend arrears over ordinary shareholders"},{"l":"C","h":"Preference shares usually pay dividends fixed as a percentage of the nominal value"},{"l":"D","h":"If cumulative, dividend arrears must be paid before an ordinary dividend can be paid"}],"a":"B","e":"<p>In liquidation, preference shareholders have priority over ordinary shareholders in the repayment of the nominal value. Unless the articles specify otherwise, preference dividends will not usually be paid in liquidation.<\/p>"},{"s":2,"n":7,"id":"1002003","q":"<p>An investor has an investment of £4,000 in a company consisting of 1,000 £2 nominal value fully-paid up shares. If the company went into liquidation, what is the most that the investor would be liable for?<\/p>","o":[{"l":"A","h":"Nothing further, as the shares are fully paid up"},{"l":"B","h":"£1,000"},{"l":"C","h":"£2,000"},{"l":"D","h":"His loss is unlimited"}],"a":"A","e":"<p>The investor's liability is limited to the nominal value of the shares. If the shares are fully paid up, i.e. the shareholder has paid the nominal value to the company, there would be no further liability.<\/p>"},{"s":2,"n":8,"id":"1001092","q":"<p>What is the best definition of a bearer security?<\/p>","o":[{"l":"A","h":"An anonymous, freely-transferable security"},{"l":"B","h":"They pay quarterly interest"},{"l":"C","h":"They are registered securities"},{"l":"D","h":"American depository receipt"}],"a":"A","e":"<p>A £5 note and a eurobond are examples of a bearer security. Because no register exists for bearer shares, the owner has complete anonymity. For a bearer document, proof of legal title is achieved by having physical possession of the security. This is in contrast to registered securities, where legal title is proved by the security being registered in the owner's name.<\/p>"},{"s":2,"n":9,"id":"1039389","q":"<p>Which of the following differentiates a covered warrant from a standard equity warrant?<\/p>","o":[{"l":"A","h":"They are issued by a third party"},{"l":"B","h":"They raise new capital for the share issuer"},{"l":"C","h":"New shares are created on exercise"},{"l":"D","h":"They are traded on the London Stock Exchange (LSE)"}],"a":"A","e":"<p>Covered warrants are issued by a third party and on exercise the third party will deliver shares that already exist on the markets - hence no new capital is raise by the share issuer. Both investments are traded on the LSE.<\/p>"},{"s":2,"n":10,"id":"1023944","q":"<p>Which ONE of the following is the BEST description of the return on a preference share:<\/p>","o":[{"l":"A","h":"Usually fixed - provided that the dividend is declared by the directors"},{"l":"B","h":"Fixed - as the dividend is a fixed percentage of the nominal value"},{"l":"C","h":"Variable - as the directors decide the amount of dividend to be paid"},{"l":"D","h":"Variable - as the dividend is paid after the ordinary dividend"}],"a":"A","e":"<p>Holders of preference shares generally do not have the right to vote on company affairs, but they are entitled to receive a fixed dividend each year (as long as the company feels they have sufficient profits).<\/p>"},{"s":2,"n":11,"id":"1079680","q":"<p>Who is the legal owner of the shares that underlie an ADR?<\/p>","o":[{"l":"A","h":"The depositary bank"},{"l":"B","h":"The holder of the ADR"},{"l":"C","h":"The issuer of the shares"},{"l":"D","h":"There is no registered owner"}],"a":"A","e":"<p>The shares underlying the DR are registered in the name of the depository bank, with the DRs themselves transferable as bearer securities.<\/p>"},{"s":2,"n":12,"id":"1078864","q":"<p>With regards to depositary receipts, what is the longest time period permitted for grey market trading?<\/p>","o":[{"l":"A","h":"1 month"},{"l":"B","h":"3 months"},{"l":"C","h":"6 months"},{"l":"D","h":"9 months"}],"a":"B","e":"<p>When a depositary receipt is being created, the depository bank receives notification that in the future, the shares will be placed on deposit. If it holds cash collateral, even though the shares are not yet on deposit, the depository bank can create and sell the receipt at this time. Effectively, investors are buying a receipt that entitles them to all the benefits of a share that will, in the future, be held on deposit for them. The depositary receipt can be treated in this way for up to three months before the actual purchase of the underlying shares and this is known as pre-release or grey market trading.<\/p>"},{"s":2,"n":13,"id":"1079372","q":"<p>A company announces an increase in the dividend that it will pay out to shareholders in response to continued profit growth. Assuming all of the following shares are in issue, which of the following is least likely to benefit from this increase?<\/p>","o":[{"l":"A","h":"Participating preference shareholder"},{"l":"B","h":"Ordinary shareholder"},{"l":"C","h":"Convertible preference shareholder"},{"l":"D","h":"Redeemable preference shareholder"}],"a":"D","e":"<p>The redeemable preference shareholder will not benefit from any increase in dividends paid and will continue to receive the fixed amount. The ordinary shareholder will clearly benefit. The participating preference shareholder may benefit if the dividend triggers a further payment of dividend. The convertible preference shareholder may benefit in two ways. Firstly, they may be able to convert the share into ordinary shares and receive the higher dividend. Secondly, as the increase in dividend is likely to increase the price of the ordinary share, it is likely to increase the price of the convertible too, allowing the investor to sell for a higher price.<\/p>"},{"s":2,"n":14,"id":"1052047","q":"<p>All of the following are excluded from the calculation of free float EXCEPT:<\/p>","o":[{"l":"A","h":"Restricted stocks"},{"l":"B","h":"Shares held by owners owning more than 5% of all shares"},{"l":"C","h":"Representative shares held within a sponsored ADR"},{"l":"D","h":"Insider holdings"}],"a":"C","e":"<p>All others are excluded from the free float calculation.<\/p>"},{"s":2,"n":15,"id":"1001956","q":"<p>How much would be recorded by holders of preference shares in 2024 for dividends under the following scenario?<br/> A company has a 6% non-cumulative preference share in issue. In 2021, and two further years no dividends are paid. In 2024 5p is paid for each ordinary share.<\/p>","o":[{"l":"A","h":"Nil"},{"l":"B","h":"24%"},{"l":"C","h":"12p"},{"l":"D","h":"6%"}],"a":"D","e":"<p>These preference shares are not cumulative. Since the company paid ordinary shareholders in 2024, the preference shareholders must have been paid their fixed dividend of 6%.<\/p>"},{"s":2,"n":16,"id":"1001098","q":"<p>Which of the following is true about preference shares?<\/p>","o":[{"l":"A","h":"They always carry the right to vote"},{"l":"B","h":"The dividend can be waived"},{"l":"C","h":"They are paid before debentures in the event of a liquidation"},{"l":"D","h":"They only receive payment if ordinary share dividends have been made"}],"a":"B","e":"<p>Preference shares pay a fixed rate of dividend each year based on the nominal value of the share. The dividend on preference shares can be waived by the board of directors but cannot be varied. However, if preference share dividends are not paid in a particular year, then ordinary shareholders cannot be paid dividends either. There are various types of preference shares.<\/p>"},{"s":2,"n":17,"id":"1001104","q":"<p>Which of the following is true of preference shares?<\/p>","o":[{"l":"A","h":"They have a variable dividend"},{"l":"B","h":"They rank below ordinary shares on liquidation"},{"l":"C","h":"They normally carry voting rights"},{"l":"D","h":"They do not carry pre-emption rights"}],"a":"D","e":"<p>Preference shares do not generally carry pre-emption rights.<\/p>"},{"s":2,"n":18,"id":"1047487","q":"<p>Which of the following would give rise to a capital gain only?<\/p>","o":[{"l":"A","h":"Shares"},{"l":"B","h":"Gilts"},{"l":"C","h":"Commercial paper"},{"l":"D","h":"Convertible bond"}],"a":"C","e":"<p>Commercial paper is short-term unsecured debt financing issued by a company. It is similar to Treasury bills. Generally they do not pay any interest and therefore are issued at a discount (like Treasury bills). <br/> All the rest of the financial instruments listed are likely to pay interest, or be dividends which will be subject to income tax or corporation tax.<\/p>"},{"s":2,"n":19,"id":"1001106","q":"<p>Which of the following best describes preference shares and voting rights?<\/p>","o":[{"l":"A","h":"Preference shares do not carry voting rights"},{"l":"B","h":"Preference shareholders may get voting rights in certain circumstances"},{"l":"C","h":"Preference shares normally carry full voting rights"},{"l":"D","h":"Preference shareholders can always vote on dividend policy"}],"a":"B","e":"<p>Normally, preference shareholders do not receive voting rights. However, they may become entitled to vote if the dividend is not paid for a certain period or as described in the company's memorandum and articles.<\/p>"},{"s":2,"n":20,"id":"1004746","q":"<p>Which of the following is true about preference shares?<\/p>","o":[{"l":"A","h":"They always carry the right to vote"},{"l":"B","h":"They carry the right to vote when the company fails to pay a dividend"},{"l":"C","h":"They are paid before debentures in the event of a liquidation"},{"l":"D","h":"They rank below ordinary shares in the event of a liquidation"}],"a":"B","e":"<p>Preference shares carry voting rights if the company fails to pay the dividend for a specified number of times (stipulated in the articles of association - NOT tested).<br/>  <\/p>"},{"s":2,"n":21,"id":"1039423","q":"<p>An investor buys an American depository receipt (ADR). What BEST describes the investment he holds?<\/p>","o":[{"l":"A","h":"Evidence of ownership of non-US shares"},{"l":"B","h":"Evidence of ownership of US shares"},{"l":"C","h":"A right to buy non-US shares"},{"l":"D","h":"A right to buy US shares"}],"a":"A","e":"<p>An ADR represents a number of non-American shares held by a depository bank on behalf of the investor. The evidence of ownership needed by the bank in order to distribute the beneficial rights, such as dividends, is the ADR.<\/p>"},{"s":2,"n":22,"id":"1001094","q":"<p>A participating preference share:<\/p>","o":[{"l":"A","h":"Entitles the holder to additional dividends"},{"l":"B","h":"Allows the holder to appoint a receiver should the company not pay a dividend"},{"l":"C","h":"Entitles the holder to receive any arrears in dividends should they not be paid at the end of any one year"},{"l":"D","h":"Allows the holder the right to convert into a predetermined number of ordinary shares"}],"a":"A","e":"<p>Shareholders, whether ordinary or preference, never have the right to appoint a receiver. The answer, \"entitles the holder to receive any arrears in dividends should they not be paid at the end of any one year\" describes a cumulative preference share, not a participating one. \"Allows the holder the right to convert into a predetermined number of ordinary shares\" describes convertible preference shares.<br/> \"Entitles the holder to additional dividends\" is the correct answer.<\/p>"},{"s":2,"n":23,"id":"1051002","q":"<p>Why might an investor buy ordinary shares?<\/p>","o":[{"l":"A","h":"Ownership stake in company; zero liability for company activities; return paid whenever company makes a trading profit"},{"l":"B","h":"Interest in company; opportunity for capital growth of investment; variable returns on investment in line with corporate success"},{"l":"C","h":"Ownership stake in company; fixed return paid to investor; high ranking in order of repayment upon liquidation"},{"l":"D","h":"Interest in company; fixed return paid to investor"}],"a":"B","e":"<p>Ordinary shares offer an investor an interest in a company which offers ordinary dividends and the opportunity for capital growth. Ordinary dividends are directly related to the profitability of the company, a financial measure of corporate success. Capital growth is enjoyed by the investor that sells ordinary shares for a higher price than that at which they purchased them.<\/p>"},{"s":2,"n":24,"id":"1023846","q":"<p>Which of the following is the main purpose of authorised share capital?<\/p>","o":[{"l":"A","h":"To place a limit on the amount of dividends that can be declared by the directors"},{"l":"B","h":"To place a limit on the amount of share capital that can be issued to existing and new shareholders"},{"l":"C","h":"To place a limit on the amount of share capital issued through a rights issue"},{"l":"D","h":"To place a limit on the number of shares that can be issued to new shareholders"}],"a":"B","e":"<p>The authorised share capital is the total number of shares that a company can have in issue without further approval from the shareholders. Therefore this places a limit on the number of shares that can be issued to existing and new shareholders. The authorised share capital can be increased by an ordinary resolution of the shareholders.<\/p>"},{"s":3,"n":1,"id":"1023946","q":"<p>Holders of subordinated debt rank above which of the following instruments?<\/p>","o":[{"l":"A","h":"Debt secured with a fixed charge"},{"l":"B","h":"Debt secured with a floating charge"},{"l":"C","h":"Unsecured loan stock"},{"l":"D","h":"Preference shares"}],"a":"D","e":"<p>Subordinated debt ranks above preference shares and ordinary shares.<\/p>"},{"s":3,"n":2,"id":"1001949","q":"<p>What rate is derived from a gilt sale and repurchase?<\/p>","o":[{"l":"A","h":"LIBOR"},{"l":"B","h":"Base rate"},{"l":"C","h":"Repo rate"},{"l":"D","h":"Fed rate"}],"a":"C","e":"<p>The repo rate is derived from a repo transaction.<\/p>"},{"s":3,"n":3,"id":"1001287","q":"<p>Which one of the following is the normal settlement convention for a Japanese government bond?<\/p>","o":[{"l":"A","h":"Two weeks rolling"},{"l":"B","h":"T+3"},{"l":"C","h":"T+2"},{"l":"D","h":"T+1"}],"a":"D","e":"<p>All long-term Japanese government bonds now settle T+1, as do gilts and the US T-bonds.<\/p>"},{"s":3,"n":4,"id":"1001261","q":"<p>The different yields between conventional and index-linked gilts may be viewed as reflecting:<\/p>","o":[{"l":"A","h":"Long-term inflation rates"},{"l":"B","h":"Spot foreign exchange rates"},{"l":"C","h":"Forward foreign exchange rates"},{"l":"D","h":"Long-term GDP"}],"a":"A","e":"<p>Index-linked gilts are linked to the RPI - the measure of inflation in the economy. Note: both the coupon AND the capital value of the gilt are linked to the RPI.<\/p>"},{"s":3,"n":5,"id":"1001265","q":"<p>Which of the following is true regarding index-linked gilts?<\/p>","o":[{"l":"A","h":"Only the coupon is index-linked"},{"l":"B","h":"Only the redemption value is index-linked"},{"l":"C","h":"Both the coupon and the redemption value are index-linked"},{"l":"D","h":"Neither the coupon or the redemption value are index-linked"}],"a":"C","e":"<p>Both the coupon and the redemption value are index-linked to movements in the retail price index.<\/p>"},{"s":3,"n":6,"id":"1039450","q":"<p>Which of the following government bonds have a life, when issued, of less than five years?<\/p>","o":[{"l":"A","h":"Schatz"},{"l":"B","h":"OAT"},{"l":"C","h":"US T-bond"},{"l":"D","h":"Bund"}],"a":"A","e":"<p>The OAT has a life of between two-fifty years when issued.<\/p>"},{"s":3,"n":7,"id":"1001733","q":"<p>Which one of the following is the system for reporting eurobond trades?<\/p>","o":[{"l":"A","h":"Newstrack"},{"l":"B","h":"Thomson report"},{"l":"C","h":"TRAX"},{"l":"D","h":"Crest"}],"a":"C","e":"<p>Eurobond trades must be reported into the TRAX system within 30 minutes for publication and the transaction reported by 10pm on the day of the trade.<\/p>"},{"s":3,"n":8,"id":"1002144","q":"<p>Patrick observes that the effective price per share from a convertible bond is lower than the current market price of the underlying shares. How can he profit from this observation?<\/p>","o":[{"l":"A","h":"Buy the convertible and sell the underlying shares"},{"l":"B","h":"Sell the convertible and sell the underlying shares"},{"l":"C","h":"Buy the convertible and buy the underlying shares"},{"l":"D","h":"Sell the convertible and buy the underlying shares"}],"a":"A","e":"<p>Due to the fact that the effective price per share is less than the current market share price, Patrick would profit by buying the convertible, converting it into shares and then selling the shares at the higher price.<\/p>"},{"s":3,"n":9,"id":"1016237","q":"<p>Which of the following corporate debt securities is secured against a specific asset of a company?<\/p>","o":[{"l":"A","h":"Loan stock"},{"l":"B","h":"Fixed charge"},{"l":"C","h":"Floating charge"},{"l":"D","h":"Asset-backed security"}],"a":"B","e":"<p>Fixed charge debentures are secured against named assets of the company.<\/p>"},{"s":3,"n":10,"id":"1078437","q":"<p>In relation to the international government bond market, which of the following is true?<\/p>","o":[{"l":"A","h":"Japanese superlong bonds typically have a life of ten years"},{"l":"B","h":"Bobls are German bonds paying annual coupons"},{"l":"C","h":"OATs settle one day after the trade date"},{"l":"D","h":"US T-bonds are managed by the UK Debt Management Office"}],"a":"B","e":"<p>Japanese superlongs typically have a life of 20 years. OATs settle T+2. The UK Debt Management Office manages the UK government bond market.<\/p>"},{"s":3,"n":11,"id":"1078438","q":"<p>All of the following are true of index-linked government bonds except:<\/p>","o":[{"l":"A","h":"Pay a low coupon"},{"l":"B","h":"Coupon varies with inflation"},{"l":"C","h":"Fixed benefit at maturity"},{"l":"D","h":"Range of maturities available"}],"a":"C","e":"<p>Both the coupon AND the principal payments are linked to inflation. Therefore, the principal paid at redemption is not fixed but varies, like the coupon, with inflation.<\/p>"},{"s":3,"n":12,"id":"1078436","q":"<p>When a government bond is stripped, which of these statements is TRUE?<\/p>","o":[{"l":"A","h":"The income streams are treated as separate securities"},{"l":"B","h":"Each 'strip' pays a separate regular coupon as well as an amount on redemption"},{"l":"C","h":"Only primary dealers can trade the securities once stripped"},{"l":"D","h":"The total value of the components is less than the original bond"}],"a":"A","e":"<p>The income streams are treated as separate securities' is the best answer as each strip represents a single cash flow. GEMMs can strip a UK government bond, as can the Treasury and the BoE, but they can be traded as normal on the market.<\/p>"},{"s":3,"n":13,"id":"1039449","q":"<p>When referring to index-linked gilts, which of the following is true?<\/p>","o":[{"l":"A","h":"The nominal value and the coupon are linked to SONIA"},{"l":"B","h":"The coupon only is linked to retail prices"},{"l":"C","h":"The redemption value only is linked to retail prices"},{"l":"D","h":"The redemption value and the coupon are linked to retail prices"}],"a":"D","e":"<p>The coupon is adjusted for inflation throughout the life of the bond, but the capital is only adjusted on redemption.<\/p>"},{"s":3,"n":14,"id":"1001286","q":"<p>Which of the following is true in relation to the settlement deadlines for French and US government bonds?<\/p>","o":[{"l":"A","h":"US bonds are settled later than French bonds"},{"l":"B","h":"French bonds are settled later than US bonds"},{"l":"C","h":"French and US bonds have the same settlement times"},{"l":"D","h":"Both settle later than JGBs"}],"a":"B","e":"<p>French government bonds settle T+2, US T-bonds settle T+1, JGBs settle T+1.<\/p>"},{"s":3,"n":15,"id":"1078499","q":"<p>How many STRIPS could be created from a five year UK government bond?<\/p>","o":[{"l":"A","h":"6"},{"l":"B","h":"10"},{"l":"C","h":"5"},{"l":"D","h":"11"}],"a":"D","e":"<p>A STRIP occurs when a GEMM breaks down a Gilt into its constituent cash flows. <br/> There would be 10 semi-annual coupon payments and the final maturity value. Therefore 11 STRIPS could be created from a five year Gilt.<\/p>"},{"s":3,"n":16,"id":"1057371","q":"<p>Which of the following best describes the features of government bonds?<\/p>","o":[{"l":"A","h":"UK Gilts - Have variable redemption dates, paying semi-annual coupons, with an actual over actual day-count convention, settling T+3"},{"l":"B","h":"US T-Bonds - Pay semi-annual coupons for up to 30 years, valued in 32nds of cent and settle on the trade date"},{"l":"C","h":"JGBs - Valued in decimals, paying a semi-annual coupon, with an actual over 365 day-count convention and a typical life of 10 years"},{"l":"D","h":"Bunds - Have a life of 10 years or more, valued in decimals, paying an annual coupon and settling T+3"}],"a":"C","e":"<p>Gilts settle T+1. US T-Bonds settle T+1. German bunds settle T+2.<\/p>"},{"s":3,"n":17,"id":"1014099","q":"<p>Which one of the following is not an issuer of mortgage-backed securities in the US?<\/p>","o":[{"l":"A","h":"Government Home Mortgage Corporation"},{"l":"B","h":"Government National Mortgage Association"},{"l":"C","h":"Federal National Mortgage Association"},{"l":"D","h":"Federal Home Loan Mortgage Corporation"}],"a":"A","e":"<p>The other answers are all US government agencies that issue mortgage-backed securities.<\/p>"},{"s":3,"n":18,"id":"1078440","q":"<p>Which of the following about stripped government bonds are true?<\/p><p><strong>I<\/strong><\/p><p>They are zero coupon<\/p><p><strong>II<\/strong><\/p><p>They are tradable<\/p><p><strong>III<\/strong><\/p><p>They can only be stripped by the central bank<\/p><p><strong>IV<\/strong><\/p><p>They are bearer instruments<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"I and II"},{"l":"C","h":"III and IV"},{"l":"D","h":"I and IV"}],"a":"B","e":"<p>UK government bonds are stripped by GEMMs, the Debt Management Office not just the Bank of England.<br/> <br/> Stripped UK government bonds are registered instruments and can be traded.<\/p>"},{"s":3,"n":19,"id":"1001797","q":"<p>Which of the following would represent the credit rating of a non-investment grade bond?<\/p>","o":[{"l":"A","h":"AAA"},{"l":"B","h":"AA"},{"l":"C","h":"BBB-"},{"l":"D","h":"CCC"}],"a":"D","e":"<p>Also referred to as a high-yield bond.<\/p>"},{"s":3,"n":20,"id":"1014136","q":"<p>What does the term mezzanine capital refer to?<\/p>","o":[{"l":"A","h":"Unsecured high-yield debt that represents a claim on a company's assets"},{"l":"B","h":"Secured high-yield debt that represents a claim on a company's assets"},{"l":"C","h":"A company's current liabilities"},{"l":"D","h":"Unsecured creditors of a company"}],"a":"A","e":"<p>Mezzanine debt (or capital) is a financial term that refers to unsecured high-yield, subordinated debt that represents a claim on a company's assets, that is senior only to a company's shareholders.<\/p>"},{"s":3,"n":21,"id":"1001568","q":"<p>Which of the following asset classes can be broken into tranches offering different levels of risk and return?<\/p><p><strong>I<\/strong><\/p><p>Gilts<\/p><p><strong>II<\/strong><\/p><p>Mortgage-backed securities<\/p><p><strong>III<\/strong><\/p><p>Collateralised debt obligations<\/p><p><strong>IV<\/strong><\/p><p>Fixed charge debentures<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"II and IV"},{"l":"C","h":"II and III"},{"l":"D","h":"I and II"}],"a":"C","e":"<p>Mortgage-backed securities and collateralised debt obligations are both forms of asset backed securities. These are secured against assets that are securitised themselves. Both can be broken-up into tranches offering different risks and return for the investor.<\/p>"},{"s":3,"n":22,"id":"1078433","q":"<p>How many individual strips can a ten-year strippable government bond be stripped into? (Assume semi-annual coupons).<\/p>","o":[{"l":"A","h":"10"},{"l":"B","h":"11"},{"l":"C","h":"20"},{"l":"D","h":"21"}],"a":"D","e":"<p>A ten-year strippable UK government bond can be stripped into 20 individual coupons and one principal payment. Each strip would trade as a zero-coupon bond.<\/p>"},{"s":3,"n":23,"id":"1001798","q":"<p>Which of the following is the correct definition of 'immobilisation'?<\/p>","o":[{"l":"A","h":"The freezing of assets by the courts"},{"l":"B","h":"The placement of bearer securities with a centralised depository"},{"l":"C","h":"The prohibition of a firm from carrying out investment business"},{"l":"D","h":"The holding of assets by a custodian"}],"a":"B","e":"<p>This provides safe and secure storage for the owners of the bearer instruments.<\/p>"},{"s":3,"n":24,"id":"1078495","q":"<p>When trading in the UK government bond market and cash bargains which of the following statements is TRUE?<\/p>","o":[{"l":"A","h":"The cash settlement will take place following the acquisition of the bargain and within the same business day"},{"l":"B","h":"The cash settlement will take place following the acquisition of the bargain and by the end of the next business day"},{"l":"C","h":"The cash settlement will take place following the acquisition of the bargain and by the end of the next two business day"},{"l":"D","h":"The cash settlement will take place following the acquisition of the bargain and by the end of the next three business day"}],"a":"B","e":"<p>This is a long way round of making sure you know Gilts settle T+1.<\/p>"},{"s":3,"n":25,"id":"1001793","q":"<p>Which of the following would enable an investor to benefit from future growth in the share price of a company?<\/p>","o":[{"l":"A","h":"Ordinary debt"},{"l":"B","h":"Subordinated loan stock"},{"l":"C","h":"Convertible loan stock"},{"l":"D","h":"Junior debt"}],"a":"C","e":"<p>The conversion element enables the investor to benefit from a rise in the company share price.<\/p>"},{"s":3,"n":26,"id":"1001293","q":"<p>Who issues Japanese government bonds on behalf of the Japanese Government? <\/p>","o":[{"l":"A","h":"The Debt Audit Office"},{"l":"B","h":"The Bank of Japan"},{"l":"C","h":"The Ministry of Finance"},{"l":"D","h":"Financial Services Agency"}],"a":"C","e":"<p>Japanese Government bonds (JGBs) are issued by the Ministry of Finance (MoF) on behalf of the government, which is responsible for interest and principal payments. Interest is paid every six months, and principal is repaid at maturity.<\/p>"},{"s":3,"n":27,"id":"1078434","q":"<p>A guaranteed bond of a company is generally guaranteed by whom?<\/p>","o":[{"l":"A","h":"The employees"},{"l":"B","h":"A company in the same group"},{"l":"C","h":"The directors"},{"l":"D","h":"The shareholders"}],"a":"B","e":"<p>A guaranteed bond is usually unsecured debt which has been guaranteed by another company within the same group.<\/p>"},{"s":3,"n":28,"id":"1002131","q":"<p>German bunds settle:<\/p>","o":[{"l":"A","h":"T+1"},{"l":"B","h":"T+2"},{"l":"C","h":"T+3"},{"l":"D","h":"T+5"}],"a":"B","e":"<p>Since 6th October 2015 both German Government bonds and German equity settle T+2<\/p>"},{"s":3,"n":29,"id":"1001274","q":"<p>A company issues a 5% bond. Which of the following statements is false?<\/p>","o":[{"l":"A","h":"The coupon is fixed"},{"l":"B","h":"The bond is redeemed at par"},{"l":"C","h":"The market price will be unaffected by interest rates"},{"l":"D","h":"The bond is unsecured"}],"a":"C","e":"<p>In the exam, we often have to go with the best answer. In the absence of specific details, we have to assume a conventional bond - fixed coupon, fixed redemption date and fixed redemption value. It may (or may not) be unsecured. It will definitely be affected by interest rates. This makes the statement that says it will not categorically false.<\/p>"},{"s":3,"n":30,"id":"1055549","q":"<p>You buy US treasury bonds when they are issued. The method of pricing used would be:<\/p>","o":[{"l":"A","h":"Tap issue"},{"l":"B","h":"Tender style"},{"l":"C","h":"Competitive auction"},{"l":"D","h":"Non-competitive auction"}],"a":"B","e":"<p>Whilst the US use a tender style (AKA Dutch Auction) method to price T-Bonds. The 'auction' in Dutch auction is misleading, the price of the issue is assessed tender-style, with investors paying a common strike price.<\/p>"},{"s":3,"n":31,"id":"1078890","q":"<p>Where a bond issuer has set aside a certain amount each year to buy back a certain number of bonds which are deemed callable they would have set up a:<\/p>","o":[{"l":"A","h":"Sinking Fund"},{"l":"B","h":"Medium-term note programme"},{"l":"C","h":"Scheduled commercial paper programme"},{"l":"D","h":"Swimming fund"}],"a":"A","e":"<p>A sinking fund involves the issuer setting aside a certain amount each year. A sinking fund approach may be combined with a bond issue that is callable. A callable bond is one where the issuer has the right, at specified points during the bond's life, to redeem some, or all, of the bonds at a pre-agreed amount, often at par value. Obviously, a call provision will give the issuer the ability to redeem a bond early if it is relatively expensive.<\/p>"},{"s":3,"n":32,"id":"1001306","q":"<p>A bond which has just defaulted on a coupon payment would be rated as by Standard and Poor's as:<\/p>","o":[{"l":"A","h":"BBB"},{"l":"B","h":"BB"},{"l":"C","h":"C"},{"l":"D","h":"D"}],"a":"D","e":"<p>D (for default) is S&amp;P's lowest rating.<\/p>"},{"s":3,"n":33,"id":"1078412","q":"<p>According to the credit ratings agency Moody's what credit rating would be issued to a bond in default?<\/p>","o":[{"l":"A","h":"Ba"},{"l":"B","h":"Baa"},{"l":"C","h":"C"},{"l":"D","h":"D"}],"a":"C","e":"<p>When a bond is in default Moody's awards it a C classification<\/p>"},{"s":3,"n":34,"id":"1001260","q":"<p>What is the order of priority in a winding-up?<\/p><p><strong>I<\/strong><\/p><p>Convertible bond<\/p><p><strong>II<\/strong><\/p><p>Debentures<\/p><p><strong>III<\/strong><\/p><p>Subordinated loan stock<\/p><p><strong>IV<\/strong><\/p><p>Ordinary shares<\/p>","o":[{"l":"A","h":"I, II, III, IV"},{"l":"B","h":"IV, II, III, I"},{"l":"C","h":"II, I, III, IV"},{"l":"D","h":"I, III, II, IV"}],"a":"C","e":"<p>Debenture implies secured debt which is paid before the unsecured creditors, such as a regular convertible bond. Subordinated debt is paid before shareholders.<\/p>"},{"s":3,"n":35,"id":"1014134","q":"<p>What is a method of raising mezzanine debt?<\/p>","o":[{"l":"A","h":"Issuing payment in kind notes"},{"l":"B","h":"Issuing additional shares"},{"l":"C","h":"Issuing medium-term notes"},{"l":"D","h":"Issuing agency bonds"}],"a":"A","e":"<p>Mezzanine debt can be raised by the issue of payment in kind notes (or PIK notes).<\/p>"},{"s":3,"n":36,"id":"1001819","q":"<p>Which of the following is true concerning US T-bonds?<\/p><p><strong>I<\/strong><\/p><p>They are all registered<\/p><p><strong>II<\/strong><\/p><p>They are all bearer<\/p><p><strong>III<\/strong><\/p><p>They are not issued with a zero-coupon<\/p><p><strong>IV<\/strong><\/p><p>They are issued with a zero-coupon<\/p>","o":[{"l":"A","h":"I and II"},{"l":"B","h":"I and III"},{"l":"C","h":"II and III"},{"l":"D","h":"II and IV"}],"a":"B","e":"<p>They are all issued in book entry form (i.e. dematerialised) and are registered. They are not issued as zero-coupon bonds; although they may subsequently be stripped into zero-coupon bonds.<\/p>"},{"s":3,"n":37,"id":"1001734","q":"<p>When creating an asset-backed security, to keep the instrument off-balance sheet, which of the following is used?<\/p>","o":[{"l":"A","h":"CLO"},{"l":"B","h":"CBO"},{"l":"C","h":"SPV"},{"l":"D","h":"CDO"}],"a":"C","e":"<p>A special purpose vehicle (SPV) is used to remove the assets from the balance sheet. The SPV is typically a trust and provides some bankruptcy protection for the investor.<\/p>"},{"s":3,"n":38,"id":"1014125","q":"<p>Which one of the following would issue supranational bonds?<\/p>","o":[{"l":"A","h":"The Asian Development Bank"},{"l":"B","h":"The UK government"},{"l":"C","h":"Large companies"},{"l":"D","h":"US agencies"}],"a":"A","e":"<p>The Asian Development Bank is an example of a supranational body.<\/p>"},{"s":3,"n":39,"id":"1001268","q":"<p>Which of the following is not true of bonds issued by the Treasury of the United States?<\/p>","o":[{"l":"A","h":"They have maturities of more than ten years"},{"l":"B","h":"They always carry a coupon"},{"l":"C","h":"The coupons are paid annually"},{"l":"D","h":"They are the US equivalent of gilts"}],"a":"C","e":"<p>Coupons are paid semi - annually<\/p>"},{"s":3,"n":40,"id":"1065056","q":"<p>Which of the following is/are features of Eurobonds?<\/p><p><strong>I<\/strong><\/p><p>Fixed coupon<\/p><p><strong>II<\/strong><\/p><p>Bearer form<\/p><p><strong>III<\/strong><\/p><p>Interest paid net<\/p><p><strong>IV<\/strong><\/p><p>Usually priced in euros<\/p>","o":[{"l":"A","h":"I only"},{"l":"B","h":"I and II"},{"l":"C","h":"I, II and III"},{"l":"D","h":"I, II and IV"}],"a":"B","e":"<p>Eurobonds are also known as International bonds. The prefix 'euro' means 'outside its own country and so 'eurocurrency' can refer to any currency, not just euros. Eurobonds have fixed coupons and pay interest gross (no tax deducted). Although they trade electronically, they are originally issued in bearer form.<\/p>"},{"s":3,"n":41,"id":"1014132","q":"<p>In terms of the degree of risk, where does mezzanine debt rank in the order of payment should a company be in liquidation?<\/p>","o":[{"l":"A","h":"Between preferential creditors and floating charge holders"},{"l":"B","h":"Between floating charge holders and subordinated debt"},{"l":"C","h":"Between subordinated debt and preference shareholders"},{"l":"D","h":"Between preference shareholders and deferred shareholders"}],"a":"C","e":"<p>Mezzanine debt ranks just below subordinated debt in the order of payment for a company in liquidation.<\/p>"},{"s":3,"n":42,"id":"1001997","q":"<p>What is the effect on the price of a convertible loan stock if share prices fall?<\/p>","o":[{"l":"A","h":"Price of convertible falls"},{"l":"B","h":"Price of convertible rises"},{"l":"C","h":"No effect"},{"l":"D","h":"Cannot calculate"}],"a":"A","e":"<p>You should think of a convertible as being priced as a non-convertible ('straight') bond plus a call option. Therefore, if the price of the share decreases, the call option will be worth less and therefore the convertible falls in value.<\/p>"},{"s":3,"n":43,"id":"1001269","q":"<p>Interest payment rates on index-linked gilts are linked to the:<\/p>","o":[{"l":"A","h":"Harmonised index of consumer prices"},{"l":"B","h":"Retail price index"},{"l":"C","h":"SONIA"},{"l":"D","h":"SOFR rate"}],"a":"B","e":"<p>The interest rates on index-linked gilts (ILG) are linked to movements in the retail price index.<\/p><p>However, there are current plans for index-linked gilts to change from RPI to CPIH (CPI including housing costs) in February 2030.<\/p>"},{"s":3,"n":44,"id":"1014100","q":"<p>Which one of the following best describes a mortgage-backed security?<\/p>","o":[{"l":"A","h":"Bonds issued by companies that provide mortgages"},{"l":"B","h":"Debt notes that usually mature in 5-10 years, paying a floating rate of interest"},{"l":"C","h":"Bonds created when mortgage lenders provide mortgages to investors"},{"l":"D","h":"Bonds created when a group of mortgage loans are pooled together to be sold to investors"}],"a":"D","e":"<p>These are bonds that are created when a group of mortgage loans are packaged for sale to investors.<\/p>"},{"s":3,"n":45,"id":"1002071","q":"<p>Which of the following is not true of overseas government bonds?<\/p>","o":[{"l":"A","h":"Bobls are bonds with a life of 10 years or less"},{"l":"B","h":"Japanese Government bonds are issued by the Ministry of Finance"},{"l":"C","h":"OATs have a life of 2-50 years"},{"l":"D","h":"Treasury bonds have a life of more than 10 years"}],"a":"A","e":"<p>Bobls typically have a life of three-five years.<\/p>"},{"s":3,"n":46,"id":"1014142","q":"<p>A company could issue bonds in order to satisfy the needs of investors that wish to invest in it, with the coupon rate and maturity set according to market demand. This is an example of which of the following?<\/p>","o":[{"l":"A","h":"Municipal bonds"},{"l":"B","h":"Mezzanine debt"},{"l":"C","h":"Money market instruments"},{"l":"D","h":"Medium-term notes"}],"a":"D","e":"<p>Medium-term notes offer these characteristics to investors.<\/p>"},{"s":3,"n":47,"id":"1001270","q":"<p>Which of the following is the most common form of security for debentures?<\/p>","o":[{"l":"A","h":"Fixed charge over property"},{"l":"B","h":"Floating charge over stock"},{"l":"C","h":"Floating charge over receivables"},{"l":"D","h":"Nothing, as debentures are not normally secured"}],"a":"A","e":"<p>Fixed charges over property is the most common type of charge created with debentures.<\/p>"},{"s":3,"n":48,"id":"1015686","q":"<p>What would a bond spread normally be described as?<\/p>","o":[{"l":"A","h":"Difference between flat-yield and gross redemption yield"},{"l":"B","h":"Difference between coupon rate and gross redemption yield"},{"l":"C","h":"Difference between bid and offer prices for the bond"},{"l":"D","h":"Difference between the bond's yield and the yield on a benchmark gilt"}],"a":"D","e":"<p>The spread is the difference between the yield on a given bond and that of the equivalent government bond of the same maturity.<\/p>"},{"s":3,"n":49,"id":"1001303","q":"<p>Which of the following is the lowest Standard and Poor's rating for investment grade debt?<\/p>","o":[{"l":"A","h":"D"},{"l":"B","h":"AA-"},{"l":"C","h":"Baa3"},{"l":"D","h":"BBB-"}],"a":"D","e":"<p>Standard and Poor's use all capital letters with + or - as modifiers, whereas Moody's uses one capital letter and one or two lower case letter 'a's with 1, 2 or 3 as modifiers.<\/p>"},{"s":3,"n":50,"id":"1078863","q":"<p>Which of the following is LEAST likely about Eurobonds?<\/p>","o":[{"l":"A","h":"Trades are matched through the TRAX system"},{"l":"B","h":"There is no one centralised formal market"},{"l":"C","h":"Prices are typically quoted dirty"},{"l":"D","h":"The market regulated by the International Capital Markets Association"}],"a":"C","e":"<p>Most bonds are quoted clean but will settle dirty, all the other statements are true.<\/p>"},{"s":3,"n":51,"id":"1001315","q":"<p>All of the following are true EXCEPT:<\/p>","o":[{"l":"A","h":"Ten-year Treasury notes are usually issued on a quarterly basis"},{"l":"B","h":"The most common life of a JGB is ten years"},{"l":"C","h":"OATs are issued with a maturity of 2-50 years"},{"l":"D","h":"Bobls are issued with a life of ten years"}],"a":"D","e":"<p>Bobls are issued by the German government and have a maturity of five years.<\/p>"},{"s":3,"n":52,"id":"1016235","q":"<p>The UK government is about to undertake a long-term project of spending on the public sector that will cause a budget deficit for some time. What would the government issue to cover this?<\/p>","o":[{"l":"A","h":"Long-dated gilts"},{"l":"B","h":"Public works loans"},{"l":"C","h":"Asset-backed securities"},{"l":"D","h":"Treasury bills"}],"a":"A","e":"<p>A budget deficit is where the government spends more than they receive. This is funded by the issuance of gilts.<\/p>"},{"s":3,"n":53,"id":"1002158","q":"<p>What type of coupon does a vanilla convertible bond usually pay?<\/p>","o":[{"l":"A","h":"Zero"},{"l":"B","h":"Fixed"},{"l":"C","h":"Floating"},{"l":"D","h":"Determined by the value of the underlying share"}],"a":"B","e":"<p>A convertible bond would usually pay a fixed rate coupon. Note that a convertible bond may be considered as a straight (non-convertible) bond plus a call option on the underlying share.<br/> Vanilla is the plainest flavour of ice-cream and therefore this term is used to describe a very straightforward bond, i.e. one paying a fixed coupon.<\/p>"},{"s":3,"n":54,"id":"1001820","q":"<p>A UK company raises capital via a sterling debt issue in continental Europe. What is the most likely way it would do this?<\/p>","o":[{"l":"A","h":"Warrant"},{"l":"B","h":"Share"},{"l":"C","h":"Eurobond"},{"l":"D","h":"Futures"}],"a":"C","e":"<p>A eurobond issue would be a way of raising eurosterling, that is sterling on deposit away from the UK.<\/p>"},{"s":3,"n":55,"id":"1052148","q":"<p>During a period of zero inflation what is the impact on the coupon of an index-linked gilt?<\/p>","o":[{"l":"A","h":"The bond will pay out no coupon"},{"l":"B","h":"The coupon will be unadjusted in that period"},{"l":"C","h":"The coupon will be reduced"},{"l":"D","h":"The coupon will be increased"}],"a":"B","e":"<p>During a period of zero inflation the coupon will remain unadjusted from the previous period.<\/p>"},{"s":3,"n":56,"id":"1014135","q":"<p>With which of the following are payment in kind notes issued?<\/p>","o":[{"l":"A","h":"Senior debt"},{"l":"B","h":"Unsubordinated debt"},{"l":"C","h":"Mezzanine debt"},{"l":"D","h":"Agency bonds"}],"a":"C","e":"<p>Mezzanine debt can be issued using payment in kind notes.<\/p>"},{"s":3,"n":57,"id":"1014101","q":"<p>What is the Federal Home Loan Mortgage Corporation also known as?<\/p>","o":[{"l":"A","h":"Ginnie Mac"},{"l":"B","h":"Fannie Mae"},{"l":"C","h":"Freddie Mac"},{"l":"D","h":"Ginnie Mae"}],"a":"C","e":"<p>The Federal Home Loan Mortgage Corporation in the US is also known as 'Freddie Mac'.<\/p>"},{"s":3,"n":58,"id":"1078435","q":"<p>The life of an OAT is typically:<\/p>","o":[{"l":"A","h":"Less than one year"},{"l":"B","h":"Two to fifty years"},{"l":"C","h":"Greater than 30 years"},{"l":"D","h":"One year to five years"}],"a":"B","e":"<p>OATs typically have maturities of 2-50 years<\/p>"},{"s":3,"n":59,"id":"1053346","q":"<p>In relation to seniority where would mezzanine debt be placed?<\/p>","o":[{"l":"A","h":"Below unsecured loans and above subordinated debt"},{"l":"B","h":"Above preference shares and below subordinated debt"},{"l":"C","h":"Below preference shares and below loan stock"},{"l":"D","h":"Below preference shares and below subordinated debt"}],"a":"B","e":"<p>The mezzanine level of debt, if it exists at all, will be even more risky than the subordinated debt. It will rank below other forms of debt, but above the equity in liquidation.<\/p>"},{"s":3,"n":60,"id":"1052105","q":"<p>For a convertible bond holder who does not wish to convert the bond into shares, what happens at maturity of the bond?<\/p>","o":[{"l":"A","h":"The bond lapses and the holder receives nothing"},{"l":"B","h":"The holder receives the redemption value of the bond"},{"l":"C","h":"The bond is converted into a new bond by the issuer"},{"l":"D","h":"The bond will automatically convert into shares"}],"a":"B","e":"<p>The bond holder has the option to convert, if they choose not to then the bond redeems as per any normal bond.<\/p>"},{"s":3,"n":61,"id":"1002060","q":"<p>Why would a company prefer to issue a convertible bond rather than issue shares to finance a takeover?<\/p>","o":[{"l":"A","h":"To increase the liquidity of the company's shares"},{"l":"B","h":"To benefit from lower initial servicing costs"},{"l":"C","h":"To increase the value of the bid"},{"l":"D","h":"To increase the number of shareholders who participate"}],"a":"B","e":"<p>Convertible debt is often issued with a low coupon (compensated for by the right to convert to shares later) which decreases initial servicing costs relative to shares.<\/p>"},{"s":3,"n":62,"id":"1023969","q":"<p>Which of the following is the best description of an exchangeable bond?<\/p>","o":[{"l":"A","h":"A bond with a fixed coupon and a set redemption date where the holder can exchange the nominal value for shares in the issuer"},{"l":"B","h":"A bond with a fixed coupon and a set redemption date where the issuer can exchange the nominal value for other shares held by the issuer"},{"l":"C","h":"A bond with a fixed coupon and a set redemption date where the holder can exchange the nominal value for other shares held by the issuer"},{"l":"D","h":"A zero-coupon bond with a set redemption date where the issue can exchange the nominal value for shares in the issuer"}],"a":"C","e":"<p>An exchangeable bond is like a convertible bond; however, instead of receiving shares in the issuing company, you receive other shares instead.<\/p>"},{"s":3,"n":63,"id":"1002139","q":"<p>Which of the following is a German government bond with a maturity of between three and five years?<\/p>","o":[{"l":"A","h":"Schatz"},{"l":"B","h":"Bund"},{"l":"C","h":"OAT"},{"l":"D","h":"Bobl"}],"a":"D","e":"<p>An OAT is a long dated French government bond. The Schatz is a short-term German federal bond with a term up to 2 years. A bund is a German government bond with a maturity over ten years.<\/p>"},{"s":3,"n":64,"id":"1001283","q":"<p>German government bonds include which of the following?<\/p><p><strong>I<\/strong><\/p><p>Bund<\/p><p><strong>II<\/strong><\/p><p>OATs<\/p><p><strong>III<\/strong><\/p><p>Bobl<\/p><p><strong>IV<\/strong><\/p><p>Dax<\/p>","o":[{"l":"A","h":"I and IV only"},{"l":"B","h":"I and III only"},{"l":"C","h":"I, III, and IV"},{"l":"D","h":"I, II, III, and IV"}],"a":"B","e":"<p>DAX is not a bond, it is a German stock index. The OAT is a French government bond. Only the bund and bobl are German government bonds.<\/p>"},{"s":3,"n":65,"id":"1046449","q":"<p>Which of the following best defines the conversion ratio on a convertible bond?<\/p>","o":[{"l":"A","h":"Market price of bond per number of shares available"},{"l":"B","h":"The difference between the market price and the effective price on conversion"},{"l":"C","h":"The nominal value of the bond divided by the conversion price of the shares"},{"l":"D","h":"The percentage difference between the price paid for the shares and the market price of the shares"}],"a":"C","e":"<p>The conversion ratio is the number of shares that can be created from one bond. As the issuer will set a conversion price for the shares at the beginning of the bond's life, the conversion ratio can be assessed as:<br/> NV / conversion price = conversion ratio<br/> More commonly an investor would calculate the conversion price:<br/> NV / number of shares created = conversion price<\/p>"},{"s":3,"n":66,"id":"1001267","q":"<p>Which two of the following usually pay interest semi-annually?<\/p><p><strong>I<\/strong><\/p><p>US T-bonds<\/p><p><strong>II<\/strong><\/p><p>German bunds<\/p><p><strong>III<\/strong><\/p><p>JGBs<\/p><p><strong>IV<\/strong><\/p><p>French OATs<\/p>","o":[{"l":"A","h":"I and III"},{"l":"B","h":"II and IV"},{"l":"C","h":"I and II"},{"l":"D","h":"II and III"}],"a":"A","e":"<p>Bunds and OATs both pay interest annually.<\/p>"},{"s":3,"n":67,"id":"1001740","q":"<p>If the credit rating on a corporate bond is upgraded, which ONE of the following is TRUE?<\/p>","o":[{"l":"A","h":"Coupon will fall and price will rise"},{"l":"B","h":"Coupon will remain the same and price will rise"},{"l":"C","h":"Coupon will rise and price will fall"},{"l":"D","h":"Coupon will remain the same and price will fall"}],"a":"B","e":"<p>The coupon on a bond is fixed and is unaffected by external factors. The bond will become more attractive and therefore the price will rise.<\/p>"},{"s":3,"n":68,"id":"1015586","q":"<p>Which of the following entities is not permitted to strip a gilt?<\/p>","o":[{"l":"A","h":"CREST"},{"l":"B","h":"HM Treasury"},{"l":"C","h":"GEMMs"},{"l":"D","h":"Bank of England"}],"a":"A","e":"<p>Generally we would only see GEMMs stripping gilts. It is, however, also possible for HM Treasury and the Bank of England to do so. CREST can never strip gilts.<\/p>"},{"s":3,"n":69,"id":"1014130","q":"<p>Which one of the following statements regarding mezzanine debt is correct?<\/p>","o":[{"l":"A","h":"It carries the same level of risk as subordinated debt"},{"l":"B","h":"It carries a greater degree of risk than subordinated debt"},{"l":"C","h":"It carries a lower level of risk than subordinated debt"},{"l":"D","h":"Its level of risk cannot be compared to subordinated debt"}],"a":"B","e":"<p>Mezzanine debt carries a higher degree of risk than subordinated debt.<\/p>"},{"s":3,"n":70,"id":"1001463","q":"<p>Credit enhancements are:<\/p>","o":[{"l":"A","h":"Improvements to the credit assessments made by banks before lending money"},{"l":"B","h":"Tools used by an issuer to enable bonds to be more highly-rated"},{"l":"C","h":"Improvements to the process of rating credit, used by the rating agencies"},{"l":"D","h":"Issuing long-term debt instruments rather than short-term debt instruments"}],"a":"B","e":"<p>Credit enhancements include guarantees from other group companies.<\/p>"},{"s":3,"n":71,"id":"1001910","q":"<p>All of the following are true of convertibles except:<\/p>","o":[{"l":"A","h":"The issuer has the right to redeem the bond early if it is in its best interests to do so"},{"l":"B","h":"A convertible is effectively similar to purchasing a non-convertible bond and being long an American style stock option"},{"l":"C","h":"The bond may be in a different currency to the converted shares"},{"l":"D","h":"A convertible acts as an option to purchase shares in the issuing company at the discretion of the buyer"}],"a":"A","e":"<p>A convertible bond allows the buyer to convert into a pre-determined number of shares. It is, effectively, a 'straight' or 'vanilla' bond combined with an option to buy shares. Option A describes a CALLABLE bond, i.e. one that may be redeemed early by the issuer.<\/p>"},{"s":3,"n":72,"id":"1001301","q":"<p>The clean price of a gilt means:<\/p>","o":[{"l":"A","h":"Trading at or below par"},{"l":"B","h":"The current yield is 10% of the redemption yield"},{"l":"C","h":"Excluding commissions"},{"l":"D","h":"Excluding accrued interest"}],"a":"D","e":"<p>Quoted gilt prices are 'clean' prices. The 'clean' price does not include accrued interest - the 'dirty' price does include accrued interest and is the actual price paid in the market.<\/p>"},{"s":3,"n":73,"id":"1023968","q":"<p>Which of the following bonds pays an annual coupon?<\/p>","o":[{"l":"A","h":"US T-note"},{"l":"B","h":"Italian BTP"},{"l":"C","h":"JGB"},{"l":"D","h":"French OAT"}],"a":"D","e":"<p>A French OAT pays an annual coupon.<\/p>"},{"s":3,"n":74,"id":"1001266","q":"<p>Which of the following would be true of a sterling bond issued in the US, China and throughout the eurozone?<\/p>","o":[{"l":"A","h":"Interest paid net"},{"l":"B","h":"Interest paid semi-annually"},{"l":"C","h":"Bearer document"},{"l":"D","h":"Sett
